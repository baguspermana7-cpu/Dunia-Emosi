#level-text{font-size:12px;color:#c4b5fd;font-weight:700}

.choice-btn:nth-child(3){background:linear-gradient(160deg,#2DBF7E,#1A9E66);border-color:#50E0A0;box-shadow:0 5px 0 #0A7A48}
.choice-btn:nth-child(4){background:linear-gradient(160deg,#F59E0B,#D97706);border-color:#FCD34D;box-shadow:0 5px 0 #92400E}
.choice-btn:active{transform:scale(.91) translateY(4px);box-shadow:0 1px 0 #4C1D95}
.choice-btn.qc-col,.choice-btn.qc-col:nth-child(n){background:var(--qc);border-color:var(--qc-edge);box-shadow:0 5px 0 var(--qc-edge);color:var(--qc-ink);text-shadow:none}
.q-swatch{display:inline-block;width:1.05em;height:1.05em;border-radius:50%;vertical-align:-0.12em;margin:0 .12em;background:var(--qc);border:2px solid var(--qc-edge);box-shadow:0 0 12px var(--qc)}

function getDifficulty(l){return l<=8?'easy':l<=16?'medium':l<=24?'hard':'expert'}
// ── Colour questions must be answerable WITHOUT reading ─────────────────────
// The player is five and does not read yet. A colour question is the one item
// he CAN answer on sight — but only if the picture and the buttons agree.
// Two things broke that, both verified on this page:
//   1. The choice buttons were painted by POSITION (.choice-btn:nth-child(2..4)
//      = red / green / amber) while the options are shuffled every time, so
//      "HIJAU" landed on the purple button and "MERAH" on the green one.
//      Matching by colour — the only strategy a non-reader has — produced the
//      WRONG answer, which is worse than no colour at all.
//   2. The swatch in the question is an emoji (🔴), and an emoji is not a
//      picture we ship. A device without that glyph draws nothing, so the
//      question becomes "Warna ?". DESIGN.md forbids emoji as UI chroma for
//      exactly this reason.
// So: paint every colour choice the colour it names, and draw the question's
// swatch ourselves.
// NOTE: the question bank this reads from lives in games/data/g23-question-engine.js
// (and mirrored copies in the sibling game pages) — the emoji is still in the
// DATA. This transform is applied at render time so it works whichever bank is
// loaded; the real home for it is that shared file.
const COLOUR_WORDS = {
  MERAH:  {fill:'#e23b2e',edge:'#8f1f16',ink:'#fff'},
  BIRU:   {fill:'#2563eb',edge:'#15357a',ink:'#fff'},
  HIJAU:  {fill:'#22c55e',edge:'#15803d',ink:'#fff'},
  KUNING: {fill:'#f5c518',edge:'#b45309',ink:'#3b2a4a'},
  UNGU:   {fill:'#8B5CF6',edge:'#6d28d9',ink:'#fff'},
  ORANYE: {fill:'#f97316',edge:'#9a3412',ink:'#fff'},
  COKLAT: {fill:'#8b5a2b',edge:'#5b3a1a',ink:'#fff'},
  HITAM:  {fill:'#1f2937',edge:'#0b0f16',ink:'#fff'},
  PUTIH:  {fill:'#f8fafc',edge:'#94a3b8',ink:'#3b2a4a'},
  ABU:    {fill:'#9ca3af',edge:'#4b5563',ink:'#1f2937'},
}
const COLOUR_EMOJI = {'\u{1F534}':'MERAH','\u{1F535}':'BIRU','\u{1F7E1}':'KUNING','\u{1F7E2}':'HIJAU','\u{1F7E0}':'ORANYE','\u{1F7E3}':'UNGU','\u{1F7E4}':'COKLAT','\u26AB':'HITAM','\u26AA':'PUTIH'}
function makeColourSwatch(word){
  const c = COLOUR_WORDS[word] || COLOUR_WORDS.PUTIH
  const s = document.createElement('span')
  s.className = 'q-swatch'
  s.style.setProperty('--qc', c.fill)
  s.style.setProperty('--qc-edge', c.edge)
  return s
}
// Writes `text` into `el`, swapping any colour-circle emoji for a drawn swatch.
// Replaces the old `el.textContent = q.q`.
function renderQuestionText(el, text){
  el.textContent = ''
  let buf = ''
  for(const ch of String(text == null ? '' : text)){
    const word = COLOUR_EMOJI[ch]
    if(word){
      if(buf){ el.appendChild(document.createTextNode(buf)); buf = '' }
      el.appendChild(makeColourSwatch(word))
    } else buf += ch
  }
  if(buf) el.appendChild(document.createTextNode(buf))
}
function paintColourChoice(btn, text){
  const c = COLOUR_WORDS[text]
  if(!c) return
  btn.classList.add('qc-col')
  btn.style.setProperty('--qc', c.fill)
  btn.style.setProperty('--qc-edge', c.edge)
  btn.style.setProperty('--qc-ink', c.ink)
}
function pickQuestions(level){
  const pool=[...QUESTIONS[getDifficulty(level)]]
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  return pool.slice(0,Math.min(6+Math.min(level-1,6),pool.length,16))
}

let audioCtx
function ensureAudio() { if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)() } catch(_){} }
function playTone(freq, dur, type='sine', vol=0.15) {
  if (!audioCtx) return
  const o = audioCtx.createOscillator(), g = audioCtx.createGain()
  o.type = type; o.frequency.value = freq
  g.gain.value = vol; g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + dur/1000)
  o.connect(g); g.connect(audioCtx.destination)
  o.start(); o.stop(audioCtx.currentTime + dur/1000)
}
function sfxFlap() { playTone(400, 80); setTimeout(() => playTone(600, 60), 30) }
function sfxScore() { playTone(600, 80); setTimeout(() => playTone(900, 100), 50) }

function sfxCorrect() { playTone(800, 200); setTimeout(() => playTone(1000, 150), 100) }

//  HONEST FAILURE STATE
// ═══════════════════════════════════════════════════════════
// A five-year-old cannot tell a frozen picture from a working game. Every boot
// failure must SAY so in Indonesian and offer a way out. Never leave a still
// frame running behind a hint that says "Tap untuk Terbang!".
let _bootFailed = false
function showFatal(reason) {
  if (_bootFailed) return
  _bootFailed = true
  try { console.error('[g19] fatal:', reason) } catch (_) {}
  S.running = false; S.started = false; S.gameOver = true
  try { if (app && app.ticker) app.ticker.stop() } catch (_) {}
  try { const bgm = document.getElementById('game-bgm'); bgm.pause() } catch (_) {}
  const ov = document.getElementById('start-overlay')
  if (!ov) return
  ov.classList.remove('hidden')
  const icon = document.getElementById('start-icon'); if (icon) icon.textContent = '😕'
  const lvl = document.getElementById('start-level'); if (lvl) lvl.textContent = ''
  const hint = document.getElementById('start-hint')
  if (hint) {
    hint.textContent = 'Game tidak bisa dimuat di perangkat ini.'
    if (!document.getElementById('fatal-actions')) {
      const box = document.createElement('div')
      box.id = 'fatal-actions'
      box.style.cssText = 'display:flex;gap:12px;margin-top:16px;justify-content:center;flex-wrap:wrap'
      const mk = (label, fn) => {
        const btn = document.createElement('button')
        btn.textContent = label
        btn.style.cssText = 'padding:12px 22px;border-radius:14px;border:none;background:#7C3AED;color:#fff;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit'
        btn.addEventListener('click', fn)
        return btn
      }
      box.appendChild(mk('Muat Ulang 🔄', () => location.reload()))
      box.appendChild(mk('Kembali ◀', () => { try { history.back() } catch (_) { location.href = '../index.html' } }))
      hint.parentNode.appendChild(box)
    }
  }
}

;(async function initPixi() {
  app = new PIXI.Application()
  // A hung WebGL context request neither resolves NOR rejects, so a bare await
  // here can hang forever and .catch() never fires — the overlay then pulses
  // "Memuat game..." for ever and looks alive. Bound it.
  const _initTimeout = new Promise((_, rej) =>
    setTimeout(() => rej(new Error('init-timeout')), 12000))
  await Promise.race([app.init({
    canvas: document.getElementById('pixi-canvas'),
    width: window.innerWidth, height: window.innerHeight,
    backgroundAlpha: 1, backgroundColor: BG.sky,
    antialias: true,
    resolution: Math.min(window.devicePixelRatio, 1.25),
    preference: 'webgl',
    preferWebGLVersion: 1 // WebGL 1 is more widely supported
  }), _initTimeout])
  W = app.screen.width; H = app.screen.height
  GROUND_Y = H * 0.88; BIRD_X = W * 0.22
  S.birdY = H * 0.45
  S.totalPipes = PIPE_COUNT
  S.questions = pickQuestions(cfg.level)

  // Layers
  bgContainer = new PIXI.Container(); app.stage.addChild(bgContainer)
  worldContainer = new PIXI.Container(); app.stage.addChild(worldContainer)
  groundContainer = new PIXI.Container(); app.stage.addChild(groundContainer)

  try { drawBackground() } catch(e) { console.error('drawBackground failed:', e) }
  try { drawGround() } catch(e) { console.error('drawGround failed:', e) }
  // buildPipes is NOT cosmetic: with no pipes the win check below sees an empty
  // array, [].every() returns true, and the child is handed "Level Selesai!" with
  // 3 stars written to disk for a level never played. Fail loudly instead.
  try { buildPipes() } catch(e) { return showFatal(e) }
  if (!S.pipes.length) return showFatal(new Error('no pipes built'))
  try { await createBird() } catch(e) { console.error('createBird failed:', e) }
  updateHUD()

  app.ticker.add(gameLoop)
  // RDE Layer 3: register resize listener so future layout recompute can use RZ.scale()/RZ.bp()
  if (window.RZ) { window.RZ.onResize((r) => { /* reserved for re-layout: r.scale(), r.bp() */ }) }
  document.getElementById('start-hint').textContent='Tap untuk Terbang!'
  // Check if WebGL actually rendered (detect black canvas)
  setTimeout(() => {
    try {
      // Accept WebGL1, WebGL2, or Canvas2D — PIXI may fall back to Canvas2D on
      // low-end / headless renderers; the canvas is still rendering the scene,
      // so it must stay visible (hiding it would drop all parallax + gameplay art).
      const cv = document.getElementById('pixi-canvas')
      const ok = cv.getContext('webgl') || cv.getContext('webgl2') || cv.getContext('2d')
      if (!ok) throw new Error('No renderer')
    } catch(_) {
      console.warn('WebGL may have failed — using CSS fallback background')
      document.getElementById('pixi-canvas').style.opacity = '0'
    }
  }, 500)
})().catch(e=>{
  // The old rescue here painted the scene ONCE and then ran a 60fps rAF loop
  // whose entire renderer was the comment "// Redraw... (simplified)" — a frozen
  // picture with no bird, no pipes and no collisions, that a child cannot
  // distinguish from a working game, and whose loop survived back-navigation.
  // An honest, escapable failure card is strictly better than a fake game.
  showFatal(e)
})

      nc.x = Math.random() * W * 2.2; nc.y = H * 0.05 + Math.random() * H * 0.22
      bgContainer.addChild(nc)
      parallaxNearClouds.push(nc)
    }
  }
}

// ═══════════════════════════════════════════════════════════
//  PARALLAX TICK
// ═══════════════════════════════════════════════════════════
function tickParallax(dt) {
  if (REDUCED_MOTION) return
  // FAR skyline — 0.05× pipe speed, seamless 2-panel wrap
  const farSpd = PIPE_SPEED * 0.05 * dt
  for (const sl of parallaxFarSkyline) sl.x -= farSpd
  if (parallaxFarSkyline.length === 2) {
    const sl0 = parallaxFarSkyline[0], sl1 = parallaxFarSkyline[1]
    if (sl0.x + W < 0) sl0.x = sl1.x + W
    if (sl1.x + W < 0) sl1.x = sl0.x + W
  }
  // FAR clouds — 0.12×
  for (const fc of parallaxFarClouds) {
    fc.x -= PIPE_SPEED * 0.12 * dt
    if (fc.x < -100) fc.x = W + Math.random() * W * 0.6
  }
  // NEAR clouds — 0.65×
  for (const nc of parallaxNearClouds) {
    nc.x -= PIPE_SPEED * 0.65 * dt
    if (nc.x < -200) nc.x = W + Math.random() * W * 0.4
  }
}

// ═══════════════════════════════════════════════════════════
//  GROUND
// ═══════════════════════════════════════════════════════════
let groundTiles = []
function drawGround() {
  // Ground strip
  const g = new PIXI.Graphics()
  g.rect(0, GROUND_Y, W, H - GROUND_Y).fill(BG.ground)
  // Grass line
  g.rect(0, GROUND_Y, W, 4).fill({ color: 0x22c55e, alpha: 0.5 })
  g.rect(0, GROUND_Y, W, 2).fill({ color: 0x4ade80, alpha: 0.3 })
  groundContainer.addChild(g)
  // Grass tufts
  for (let x = 0; x < W * 2; x += 12 + Math.random() * 8) {
    const t = new PIXI.Graphics()
    t.poly([0, 0, 3, -6 - Math.random() * 4, 6, 0]).fill({ color: 0x22c55e, alpha: 0.4 })
    t.x = x; t.y = GROUND_Y
    groundContainer.addChild(t)
    groundTiles.push(t)
  }
}

// ═══════════════════════════════════════════════════════════
//  PIPES
// ═══════════════════════════════════════════════════════════
function buildPipes() {
  const startX = W + 100
  let prevGapY = H * 0.4 // start at center
  const maxShift = H * 0.18 // max vertical shift between pipes (gentle)
  for (let i = 0; i < PIPE_COUNT; i++) {
    const x = startX + i * PIPE_SPACING
    const minGapY = 100 + GAP_SIZE / 2
    const maxGapY = GROUND_Y - 60 - GAP_SIZE / 2
    // Limit vertical shift from previous pipe for smoother gameplay
    let gapY = prevGapY + (Math.random() - 0.5) * maxShift * 2
    gapY = Math.max(minGapY, Math.min(maxGapY, gapY))
    prevGapY = gapY

    const pipe = {
      x, gapY, passed: false, hit: false, quizShown: false,
      topGfx: new PIXI.Graphics(),
      bottomGfx: new PIXI.Graphics(),
      removing: false, alpha: 1
    }

    // Draw top pipe
    drawPipe(pipe.topGfx, 0, gapY - GAP_SIZE / 2, true)
    // Draw bottom pipe
    drawPipe(pipe.bottomGfx, gapY + GAP_SIZE / 2, GROUND_Y, false)

    pipe.topGfx.x = x; pipe.bottomGfx.x = x
    worldContainer.addChild(pipe.topGfx)
    worldContainer.addChild(pipe.bottomGfx)

    // Pokeball collectible in the gap center
    const _bem = i % 3 === 0 ? '⭐' : '🔴'
    const _bsz = window.RZ ? window.RZ.fontScale(22) : 22
    const ball = (window.UISprites && UISprites.pixiSprite(_bem, _bsz, PIXI, {center:true})) || new PIXI.Text({ text: _bem, style: { fontSize: _bsz } })
    ball.anchor.set(0.5)
    ball.x = x + PIPE_WIDTH / 2
    ball.y = gapY
    worldContainer.addChild(ball)
    pipe.ball = ball
    pipe.ballCollected = false

    S.pipes.push(pipe)
  }
}

function drawPipe(g, top, bottom, isTop) {
  const h = bottom - top
  const pC = BG.pipeColor
  // Shadow
  g.roundRect(3, top + 2, PIPE_WIDTH, h, 4).fill({ color: 0x000000, alpha: 0.15 })
  // Main pipe body
  g.roundRect(0, top, PIPE_WIDTH, h, 4).fill(pC)
  // Gradient highlight (left side lighter)
  g.rect(3, top, 8, h).fill({ color: 0xffffff, alpha: 0.1 })
  g.rect(6, top, 3, h).fill({ color: 0xffffff, alpha: 0.05 })
  // Dark edge (right side)
  g.rect(PIPE_WIDTH - 8, top, 8, h).fill({ color: 0x000000, alpha: 0.15 })
  // Horizontal bands (wood/bamboo texture)
  for (let by = top + 20; by < bottom - 10; by += 30) {
    g.rect(0, by, PIPE_WIDTH, 1.5).fill({ color: 0x000000, alpha: 0.08 })
  }
  // Lip (wider section at opening)
  const lipY = isTop ? bottom - 14 : top
  g.roundRect(-8, lipY, PIPE_WIDTH + 16, 16, 5).fill(pC)
  g.roundRect(-8, lipY, PIPE_WIDTH + 16, 16, 5).stroke({ color: 0xffffff, width: 1.2, alpha: 0.25 })
  // Lip highlight
  g.roundRect(-6, lipY + 1, PIPE_WIDTH + 12, 4, 3).fill({ color: 0xffffff, alpha: 0.1 })
  // Vine/leaf decorations
  const leafColor = { color: 0x4ade80, alpha: 0.45 }
  if (isTop) {
    g.circle(PIPE_WIDTH / 2 - 10, bottom - 4, 6).fill(leafColor)
    g.circle(PIPE_WIDTH / 2 + 12, bottom - 6, 5).fill(leafColor)
    g.circle(PIPE_WIDTH / 2, bottom - 2, 4).fill({ color: 0x86efac, alpha: 0.3 })
    // Hanging vine
    g.rect(PIPE_WIDTH / 2 - 1, bottom, 2, 8).fill({ color: 0x22c55e, alpha: 0.3 })
  } else {
    g.circle(PIPE_WIDTH / 2 - 8, top + 4, 6).fill(leafColor)
    g.circle(PIPE_WIDTH / 2 + 10, top + 6, 5).fill(leafColor)
    g.circle(PIPE_WIDTH / 2 + 2, top + 2, 4).fill({ color: 0x86efac, alpha: 0.3 })
    // Growing vine
    g.rect(PIPE_WIDTH / 2 - 1, top - 6, 2, 6).fill({ color: 0x22c55e, alpha: 0.3 })
  }
}

// ═══════════════════════════════════════════════════════════
//  BIRD
// ═══════════════════════════════════════════════════════════
// Load image as PIXI texture (works with GIF/PNG/JPG)
function loadImageTexture(src) {
  return new Promise((resolve, reject) => {
    const img = new Image()
    img.crossOrigin = 'anonymous'
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas')
        canvas.width = img.naturalWidth; canvas.height = img.naturalHeight
        const ctx = canvas.getContext('2d')
        ctx.drawImage(img, 0, 0)
        resolve(PIXI.Texture.from(canvas))
      } catch(e) { reject(e) }
    }
    img.onerror = reject
    img.src = src
  })
}

async function createBird() {
  birdContainer = new PIXI.Container()
  birdContainer.x = BIRD_X; birdContainer.y = S.birdY

  // Use DOM <img> for animated GIF with transparency (PixiJS can't do animated GIF)
  const birdImg = document.createElement('img')
  birdImg.id = 'bird-gif'
  const initPoke = G19_POKEMON[selectedPokemon].evo[0]
  birdImg.src = initPoke.src
  const initSize = Math.round(BIRD_SIZE * initPoke.scale)
  birdImg.style.cssText = 'position:fixed;z-index:40;pointer-events:none;width:min('+initSize+'px,'+Math.round(initPoke.scale*15)+'vw);height:auto;filter:drop-shadow(0 0 10px rgba(196,181,253,0.6));image-rendering:auto;transition:top 0.05s linear;transform:translate(-50%,-50%);'
  if(initPoke.mirror) birdImg.dataset.mirror = '1'
  birdImg.onerror = () => { birdImg.src = 'https://img.pokemondb.net/sprites/home/normal/pidgeot.png'; birdImg.onerror = null }
  document.body.appendChild(birdImg)
  window._birdImg = birdImg

  // PixiJS placeholder (invisible, just for position tracking)
  birdSprite = new PIXI.Graphics()
  birdSprite.circle(0, 0, 2).fill({ color: 0xffffff, alpha: 0 })
  birdContainer.addChild(birdSprite)

  // Pastel outline ring
  const ring = new PIXI.Graphics()
  ring.circle(0, 0, BIRD_SIZE / 2 + 4).stroke({ color: 0xC4B5FD, width: 2, alpha: 0.3 })
  birdContainer.addChildAt(ring, 0)

  worldContainer.addChild(birdContainer)
}

// ═══════════════════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════════════════
function gameLoop(ticker) {
  S.frame++
  tickParallax(ticker.deltaTime) // runs every frame — idle, paused, and running
  if (!S.running || S.paused || S.gameOver) {
    // Idle bob before start
    if (!S.started && birdContainer) {
      const bobY = S.birdY + Math.sin(S.frame * 0.05) * 8
      birdContainer.y = bobY
      if (window._birdImg) {
        window._birdImg.style.left = (BIRD_X - BIRD_SIZE/2) + 'px'
        window._birdImg.style.top = (bobY - BIRD_SIZE/2) + 'px'
        // no mirror — GIFs already face right
      }
    }
    return
  }

  const dt = ticker.deltaTime

  // Bird physics
  S.birdVY += GRAVITY * dt
  S.birdVY = Math.min(S.birdVY, MAX_FALL)
  S.birdY += S.birdVY * dt
  S.birdY = Math.max(S.birdY, 20)

  // Bird position (no rotation — just up/down movement)
  if (birdContainer) {
    birdContainer.y = S.birdY
  }

  // Glow pulse
  if (birdGlow) birdGlow.alpha = 0.25 + Math.sin(S.frame * 0.08) * 0.1

  // Scroll pipes
  for (const p of S.pipes) {
    if (p.removing) {
      p.alpha -= 0.03 * dt
      p.topGfx.alpha = p.alpha; p.bottomGfx.alpha = p.alpha
      if (p.alpha <= 0) { p.topGfx.visible = false; p.bottomGfx.visible = false }
      continue
    }
    p.x -= PIPE_SPEED * dt
    p.topGfx.x = p.x; p.bottomGfx.x = p.x
  }

  // Scroll clouds
  for (const cl of cloudGfx) {
    cl.x -= PIPE_SPEED * 0.3 * dt
    if (cl.x < -80) cl.x = W + 80
  }

  // Scroll ground tufts
  for (const t of groundTiles) {
    t.x -= PIPE_SPEED * dt
    if (t.x < -20) t.x += W * 2
  }

  // Twinkle stars
  if (BG.hasStars) {
    for (const st of starGfx) {
      st.alpha = 0.2 + Math.sin(S.frame * 0.03 + st.x) * 0.4
    }
  }

  // Collision detection
  checkCollisions()

  // Floor bounce (no death — kid-friendly)
  if (S.birdY > GROUND_Y - 10) {
    S.birdY = GROUND_Y - 10
    S.birdVY = FLAP_POWER * 0.6 // gentle bounce back up
    flashScreen('#fbbf24')
  }

  // Evolution at 50% progress
  // Evolution triggers at 33% and 66% for 3-stage, 50% for 2-stage, never for 1-stage
  const poke = G19_POKEMON[selectedPokemon]
  const maxEvo = poke.evo.length - 1
  const currentEvo = S.evoStage || 0
  const progress = S.pipesCleared / S.totalPipes
  const nextEvoAt = maxEvo >= 2 ? (currentEvo === 0 ? 0.33 : 0.66) : 0.5
  if (currentEvo < maxEvo && progress >= nextEvoAt && !S.evolveTriggered && S.totalPipes > 2) {
    S.evolveTriggered = true
    triggerEvolution()
  }

  // Check level completion
  // Win check: all pipes passed/removed/off-screen OR pipesCleared reached total
  // S.pipes.length guard: [].every() returns TRUE, so an empty pipe list (a
  // buildPipes failure) used to win the level instantly with full stars.
  // Pipes are never spliced out of S.pipes during play, so this cannot block a
  // legitimate win. S.totalPipes guard stops a 0/0 level auto-completing.
  const allDone = S.pipes.length > 0 &&
    S.pipes.every(p => p.passed || p.removing || !p.topGfx.visible || p.x < -200)
  if (allDone || (S.totalPipes > 0 && S.pipesCleared >= S.totalPipes)) showWin()

  updateHUD()

  // Ash + Pikachu pinned to ground level (GROUND_Y) — always on grass
  const ashEl = document.getElementById('ash-runner')
  const pikaEl = document.getElementById('pika-runner')
  if (ashEl && ashEl.style.display !== 'none') {
    ashEl.style.top = (GROUND_Y - ashEl.offsetHeight) + 'px'
  }
  if (pikaEl && pikaEl.style.display !== 'none') {
    pikaEl.style.top = (GROUND_Y - pikaEl.offsetHeight) + 'px'
  }

  // Sync DOM bird image position — centered via transform
  if (window._birdImg) {
    const bi = window._birdImg
    bi.style.left = BIRD_X + 'px'
    bi.style.top = S.birdY + 'px'
    bi.style.transform = 'translate(-50%,-50%)' + (bi.dataset.mirror === '1' ? ' scaleX(-1)' : '')
  }
}

// ═══════════════════════════════════════════════════════════
//  COLLISION
// ═══════════════════════════════════════════════════════════
// The collider used to be one FIXED circle, r = BIRD_SIZE/2 - 6 = 46px, for all
// 42 roster sprites — while the drawn sprite is `width: min(BIRD_SIZE*scale px,
// scale*15 vw); height: auto`, so it varies with the Pokemon AND the viewport.
// Measured (1600x900, opaque pixels of each sprite vs the 92x92 collider):
// Zubat 1.64x wider / 3.05x taller than its body, Tranquill 2.52x wider,
// Wingull 10.82x taller, Taillow 2.09x / 2.77x. Those birds were struck by a
// pipe the child could plainly see them clear — "tertabrak tanpa tahu itu apa".
// Derive the box from the element that is actually on screen, per axis, and
// never let it grow past the old radius: this change can only ever forgive.
//
// 2026-08-09 — the element box was still not the body. A sprite sheet frame is
// mostly empty air: Tranquill renders 94px wide and its bird is 37px of that, so
// even 0.42x of the element was still 2.16x the drawn body. Read the OPAQUE
// bounding box out of the bitmap once per sprite and measure from there instead.
// PRODUCT.md: "Klaim visual dibuktikan dengan merender lalu menghitung piksel;
// getBounds() berbohong."
//
// The half-extent is the distance from the element's CENTRE (where the collider
// point sits, the sprite is placed with translate(-50%,-50%)) to the FARTHER
// opaque edge on that axis — not half the body width — so an off-centre bird is
// still fully covered. Mirroring (scaleX(-1)) swaps left and right, and the max
// of the two is symmetric, so it needs no special case.
const _BIRD_BODY = Object.create(null)   // src -> {fx, fy} | null when unreadable
function _birdBodyFrac(img) {
  const key = img.currentSrc || img.src
  if (key in _BIRD_BODY) return _BIRD_BODY[key]
  let out = null
  try {
    const nw = img.naturalWidth, nh = img.naturalHeight
    if (nw && nh) {
      const c = document.createElement('canvas'); c.width = nw; c.height = nh
      const cx = c.getContext('2d', { willReadFrequently: true })
      cx.drawImage(img, 0, 0)
      const d = cx.getImageData(0, 0, nw, nh).data   // throws on a tainted canvas
      let mnX = nw, mxX = -1, mnY = nh, mxY = -1
      for (let y = 0; y < nh; y++) {
        for (let x = 0; x < nw; x++) {
          if (d[(y*nw + x)*4 + 3] > 24) {
            if (x < mnX) mnX = x; if (x > mxX) mxX = x
            if (y < mnY) mnY = y; if (y > mxY) mxY = y
          }
        }
      }
      if (mxX >= 0) {
        // farther edge from the element centre, as a fraction of the element box
        out = {
          fx: Math.max(nw/2 - mnX, mxX + 1 - nw/2) / nw,
          fy: Math.max(nh/2 - mnY, mxY + 1 - nh/2) / nh
        }
      }
    }
  } catch (_) { out = null }   // cross-origin fallback sprite: keep the heuristic
  _BIRD_BODY[key] = out
  return out
}
function _birdHalf() {
  const R = BIRD_SIZE / 2 - 6
  const img = window._birdImg
  if (!img || !img.offsetWidth || !img.offsetHeight) return { hx: R, hy: R }
  const f = img.complete ? _birdBodyFrac(img) : null
  const fx = f ? f.fx : 0.42, fy = f ? f.fy : 0.42
  return {
    hx: Math.max(10, Math.min(img.offsetWidth  * fx, R)),
    hy: Math.max(10, Math.min(img.offsetHeight * fy, R))
  }
}
function checkCollisions() {
  const bx = BIRD_X, by = S.birdY
  const { hx, hy } = _birdHalf()
  const br = hx   // horizontal half-extent (pass/overlap tests along x)

  for (const p of S.pipes) {
    if (p.passed || p.hit || p.removing || !p.topGfx.visible) continue

    // Check if bird passed the pipe cleanly (no collision)
    if (bx - br > p.x + PIPE_WIDTH && !p.passed) {
      p.passed = true
      S.pipesCleared++
      S.score++
      sfxScore()
      spawnFloatingText('+1', p.x + PIPE_WIDTH / 2, p.gapY, 0x4ade80)
      // Collect pokeball
      if (p.ball && !p.ballCollected) {
        p.ballCollected = true
        S.correctAnswers++ // bonus for clean pass
        p.ball.visible = false
        spawnFloatingText('⭐', p.x + PIPE_WIDTH / 2, p.gapY - 20, 0xfbbf24)
      }
      continue
    }

    // Collect ball when bird overlaps it
    if (p.ball && !p.ballCollected && !p.hit) {
      const bdx = Math.abs(bx - p.ball.x), bdy = Math.abs(by - p.ball.y)
      if (bdx < 20 && bdy < 20) {
        p.ballCollected = true
        S.correctAnswers++
        p.ball.visible = false
        sfxScore()
      }
    }

    // Check horizontal overlap
    if (bx + br > p.x && bx - br < p.x + PIPE_WIDTH) {
      // Check vertical collision (outside gap)
      const activeGap = S.evolved ? GAP_SIZE_EVO : GAP_SIZE
      const gapTop = p.gapY - activeGap / 2
      const gapBottom = p.gapY + activeGap / 2
      if (by - hy < gapTop || by + hy > gapBottom) {
        // HIT!
        p.hit = true
        S.paused = true
        sfxHit()
        flashScreen('#ef4444')
        S.currentPipe = p
        showQuiz(p)
        return
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════
//  QUIZ
// ═══════════════════════════════════════════════════════════
function showQuiz(pipe) {
  const q = S.questions[S.qIdx % S.questions.length]
  S.qIdx++

  renderQuestionText(document.getElementById('quiz-question'), q.q)
  const choicesEl = document.getElementById('quiz-choices')
  choicesEl.innerHTML = ''
  const choices = [q.ans, ...q.wrong]
  // Shuffle
  for (let i = choices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [choices[i], choices[j]] = [choices[j], choices[i]]
  }

  let answered = false
  choices.forEach(c => {
    const btn = document.createElement('button')
    btn.className = 'choice-btn'
    btn.textContent = c
    paintColourChoice(btn, c)
    btn.onclick = () => {
      if (answered) return
      answered = true
      if (c === q.ans) {
        btn.classList.add('correct')
        sfxCorrect()
        S.correctAnswers++
        S.score++
        // A-355 — reward sparkle flourish on the correct answer (no attack in this game)
        try { if(window.VFX){ const r=btn.getBoundingClientRect(); VFX.dom(r.left+r.width/2, r.top+r.height/2, {fx:'regen', size:100}) } } catch(_){}
        // Correct — pipe fades away
        pipe.removing = true
        pipe.passed = true
        S.pipesCleared++
        setTimeout(() => {
          document.getElementById('quiz-panel').classList.remove('show')
          S.paused = false
          S.birdY = pipe.gapY
          S.birdVY = 0
          if (birdContainer) { birdContainer.y = S.birdY; birdContainer.rotation = 0 }
          spawnFloatingText('Benar! ⭐', BIRD_X, S.birdY - 30, 0x4ade80)
          updateHUD()
        }, 600)
      } else {
        btn.classList.add('wrong')
        sfxWrong()
        S.wrongAnswers++
        // No life loss — just show correct answer and move on
        // Highlight correct answer
        choicesEl.querySelectorAll('.choice-btn').forEach(b => {
          if (b.textContent === q.ans) b.classList.add('correct')
        })
        setTimeout(() => {
          document.getElementById('quiz-panel').classList.remove('show')
          S.paused = false
          // Reposition bird to gap center, pipe removed anyway
          S.birdY = pipe.gapY
          S.birdVY = 0
          if (birdContainer) { birdContainer.y = S.birdY; birdContainer.rotation = 0 }
          pipe.removing = true
          pipe.passed = true
          S.pipesCleared++
          spawnFloatingText('Coba lagi!', BIRD_X, S.birdY - 30, 0xfbbf24)
          updateHUD()
        }, 1200)
      }
    }
    choicesEl.appendChild(btn)
  })

  document.getElementById('quiz-panel').classList.add('show')
  document.getElementById('status-text').textContent = 'Jawab Soal!'
}

// ═══════════════════════════════════════════════════════════
//  FLOATING TEXT
// ═══════════════════════════════════════════════════════════
function spawnFloatingText(text, x, y, color) {
  const t = new PIXI.Text({ text, style: { fontSize: window.RZ ? window.RZ.fontScale(22) : 22, fontWeight: '900', fontFamily: 'Fredoka One', fill: color } })
  t.anchor.set(0.5); t.x = x; t.y = y
  worldContainer.addChild(t)
  let life = 40
  const tick = () => {
    life--; t.y -= 1.5; t.alpha = life / 40
    if (life <= 0) { worldContainer.removeChild(t); app.ticker.remove(tick) }
  }
  app.ticker.add(tick)
}

// ═══════════════════════════════════════════════════════════
//  WIN / LOSE
// ═══════════════════════════════════════════════════════════
function calcStars() {
  // The level always completes — there is no lose state here. GameScoring.calc()
  // returns 0 stars whenever `correct` is 0, so a child who flew the whole course
  // and got every question wrong was shown "Gagal! Coba Lagi" with zero stars for
  // a level he actually finished. Finishing is worth one star.
  return Math.max(1, GameScoring.calc({
    correct: S.correctAnswers,
    total: Math.max(1, S.correctAnswers + S.wrongAnswers),
    wrong: S.wrongAnswers,
    lives: S.lives,
    maxLives: 3
  }))
}

function showWin() {
  if (S.gameOver) return // prevent double-call
  S.running = false; S.gameOver = true
  // stop all audio
  try { const bgm=document.getElementById('game-bgm'); bgm.pause(); bgm.currentTime=0 } catch(_){}
  const stars = calcStars()
  try { sessionStorage.setItem('g19Result', JSON.stringify({ stars, level: S.level })) } catch(_){}
  // Save progress — Hotfix #115: prefer shared save-engine (avatar-keyed).
  if (typeof window.saveLevelProgress === 'function') {
    window.saveLevelProgress('g19', S.level, stars)
  } else {
    try {
      const key = 'dunia-0-progress'
      const prog = JSON.parse(localStorage.getItem(key) || '{}')
      if (!prog.g19) prog.g19 = { completed: [], stars: {} }
      if (!prog.g19.completed.includes(S.level)) prog.g19.completed.push(S.level)
      if ((prog.g19.stars[S.level] || 0) < stars) prog.g19.stars[S.level] = stars
      localStorage.setItem(key, JSON.stringify(prog))
    } catch(_) {}
  }
  document.getElementById('status-text').textContent = 'Level Selesai!'
  sfxCorrect(); setTimeout(() => sfxCorrect(), 200)

  // Hotfix #102-C (2026-04-27): stop Pixi ticker so 60fps callback doesn't keep
  // firing after game-end. See games/lokomotif-pemberani.html for canonical pattern.
  try { if (app && app.ticker) app.ticker.stop() } catch(_){}

  setTimeout(() => {
    const nextLevel = S.level < 30 ? () => {
      try { sessionStorage.setItem('g19Config', JSON.stringify({ level: S.level + 1 })) } catch(_){}
      location.reload()
    } : null
    // DESIGN.md: never "Gagal!". The course was flown to the end — say so, then
    // say the one thing that earns more stars.
    const info = `${S.pipesCleared} dari ${S.totalPipes} pipa`
    const title = stars >= 5 ? 'Sempurna!' : stars >= 4 ? 'Hebat!' : stars >= 3 ? 'Bagus!' : 'Selesai!'
    const emoji = stars >= 5 ? '🏆' : stars >= 4 ? '🌟' : stars >= 3 ? '⭐' : '💪'
    const msg = stars >= 4 ? `Kamu lewat ${info}.`
      : `Kamu lewat ${info}. Lain kali coba ambil bintang di tengah pipa ya.`
    GameModal.show({
      emoji, title, stars, msg,
      onNext: nextLevel,
      onAgain: () => location.reload(),
      onBack: () => goBack()
    })
  }, 800)
}

// No showLose — game always completes. Kids can't lose, only get fewer stars.

// ═══════════════════════════════════════════════════════════
//  EVOLUTION (at 50% progress)
// ═══════════════════════════════════════════════════════════
async function triggerEvolution() {
  S.paused = true
  S.evolved = true

  // Flash white glow
  flashScreen('#C4B5FD')
  document.getElementById('status-text').textContent = 'Berevolusi...!'
  sfxCorrect(); setTimeout(sfxCorrect, 200); setTimeout(sfxCorrect, 400)

  // Glow animation on bird
  if (birdGlow) {
    birdGlow.alpha = 0.9
    birdGlow.tint = 0xffffff
  }

  // After 1.5s, evolve to next stage using roster
  S.evoStage = (S.evoStage || 0) + 1
  setTimeout(async () => {
    applyPokemon(S.evoStage)

    spawnFloatingText('EVOLUSI!', BIRD_X, S.birdY - 40, 0xfbbf24)
    flashScreen('#fbbf24')

    setTimeout(() => {
      S.paused = false
      S.evolveTriggered = false // allow next evolution for 3-stage Pokemon
      // Post-evolution: slightly slower speed
      PIPE_SPEED = PIPE_SPEED * 0.85
      const eName = G19_POKEMON[selectedPokemon]?.evo[S.evoStage||0]?.name || 'Pokemon'
      document.getElementById('status-text').textContent = eName + ' Berevolusi!'
    }, 800)
  }, 1500)
}

// ═══════════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════════
function flap() {
  if (_bootFailed) return   // never let a tap "start" a game that failed to boot
  if (S.gameOver) return
  ensureAudio()

  if (!S.started) {
    S.started = true
    S.running = true
    document.getElementById('start-overlay').classList.add('hidden')
    document.getElementById('status-text').textContent = 'Terbang!'
    // Start BGM only (wing flap plays on each tap)
    try {
      const bgm=document.getElementById('game-bgm')
      bgm.src = cfg.level % 2 === 1 ? '../assets/Pokemon/sound/bgm-odd.mp3' : '../assets/Pokemon/sound/bgm-even.mp3'
      bgm.volume=window._volBGM||0.5; bgm.play().catch(()=>{})
    } catch(_){}
    // Show Ash + Pikachu runners
    const ash = document.getElementById('ash-runner')
    const pika = document.getElementById('pika-runner')
    if (ash) ash.style.display = 'block'
    if (pika) pika.style.display = 'block'
  }

  if (S.paused) return

  S.birdVY = FLAP_POWER
  // Play wing flap sound on each tap
  try { const wf=document.getElementById('wing-flap-sfx'); wf.currentTime=0; wf.volume=window._volFlap||0.8; wf.play().catch(()=>{}) } catch(_){}

  // Wing flap visual (brief scale pulse)
  if (birdSprite) {
    const origSY = birdSprite.scale.y
    birdSprite.scale.y = origSY * 0.85
    setTimeout(() => { if (birdSprite) birdSprite.scale.y = origSY }, 100)
  }
}

// Touch/click anywhere to flap (mobile-first)
document.addEventListener('pointerdown', e => {
  if (e.target.closest('#quiz-panel') || e.target.closest('#hud-top') || e.target.closest('#btn-back')) return
  flap()
})
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap() }
})

// ═══════════════════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════════════════
// ── BAG SYSTEM ──
function openBag() {
  // Always pause when opening bag (don't toggle)
  if (S.started && !S.paused) {
    S.paused = true; S.running = false
    document.getElementById('btn-pause').textContent = '▶'
  }
  // Task #55 guard: while bag is open the quiz panel would otherwise still
  // render behind it; hide it so the UI is clean. closeBag() will re-surface
  // the quiz when there's a pending collision.
  if (_g19HasPendingQuiz()) {
    document.getElementById('quiz-panel').classList.remove('show')
  }
  const grid = document.getElementById('bag-grid')
  grid.innerHTML = ''
  G19_POKEMON.forEach((p, i) => {
    const card = document.createElement('div')
    card.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:12px;border:2px solid '+(i===selectedPokemon?'#fbbf24':'rgba(255,255,255,0.15)')+';background:'+(i===selectedPokemon?'rgba(251,191,36,0.15)':'rgba(255,255,255,0.05)')+';cursor:pointer'
    const img = document.createElement('img')
    img.src = p.evo[0].src
    img.onerror = () => { img.src = `https://img.pokemondb.net/sprites/home/normal/${p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}.png`; img.onerror = null }
    img.style.cssText = 'width:60px;height:60px;object-fit:contain;'+(p.evo[0].mirror?'transform:scaleX(-1);':'')
    card.appendChild(img)
    const name = document.createElement('div')
    name.style.cssText = 'font-size:10px;color:#e9d5ff;font-weight:700;text-align:center'
    name.textContent = p.name
    card.appendChild(name)
    const evoLabel = document.createElement('div')
    evoLabel.style.cssText = 'font-size:8px;color:#a78bfa'
    evoLabel.textContent = p.evo.length > 2 ? '3x Evolusi' : p.evo.length > 1 ? '2x Evolusi' : 'Tetap'
    card.appendChild(evoLabel)
    card.onclick = () => { selectedPokemon = i; applyPokemon(0); closeBag() }
    grid.appendChild(card)
  })
  document.getElementById('bag-overlay').style.display = 'flex'
}
function closeBag() {
  document.getElementById('bag-overlay').style.display = 'none'
  // Task #55 guard: if a collision quiz is still pending when user closes
  // the bag (e.g. after swapping Pokemon), re-surface the quiz panel instead
  // of silently resuming the bird. Keep S.paused=true until answered.
  if (_g19HasPendingQuiz()) {
    document.getElementById('pause-overlay').style.display = 'none'
    document.getElementById('quiz-panel').classList.add('show')
    document.getElementById('status-text').textContent = 'Jawab Soal!'
    S.paused = true; S.running = false
    document.getElementById('btn-pause').textContent = '▶'
  }
}

function applyPokemon(evoStage) {
  const p = G19_POKEMON[selectedPokemon]
  const stage = Math.min(evoStage, p.evo.length - 1)
  const evo = p.evo[stage]
  if (window._birdImg) {
    window._birdImg.src = evo.src
    window._birdImg.onerror = () => { window._birdImg.src = `https://img.pokemondb.net/sprites/home/normal/${evo.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}.png`; window._birdImg.onerror = null }
    const sz = Math.round(BIRD_SIZE * evo.scale)
    window._birdImg.style.width = 'min(' + sz + 'px,' + Math.round(evo.scale * 15) + 'vw)'
    window._birdImg.style.transform = evo.mirror ? 'scaleX(-1)' : ''
    window._birdImg.style.filter = evoStage > 0 ? 'drop-shadow(0 0 12px rgba(251,191,36,0.7))' : 'drop-shadow(0 0 10px rgba(196,181,253,0.6))'
  }
  document.getElementById('status-text').textContent = evoStage > 0 ? evo.name + ' Berevolusi!' : 'Terbang!'
}

// Task #55 (2026-04-22): detect a pending collision quiz so pause/bag flows
// cannot bypass the quiz and resume the bird mid-air.
function _g19HasPendingQuiz(){
  return !!(S.currentPipe && S.currentPipe.hit && !S.currentPipe.passed)
}

function togglePause() {
  if (!S.started || S.gameOver) return
  // Task #55 guard: if a collision quiz is pending, never unpause.
  // Instead re-surface the quiz panel and keep S.paused=true.
  if (_g19HasPendingQuiz()) {
    document.getElementById('pause-overlay').style.display = 'none'
    document.getElementById('bag-overlay').style.display = 'none'
    document.getElementById('quiz-panel').classList.add('show')
    document.getElementById('btn-pause').textContent = '▶'
    document.getElementById('status-text').textContent = 'Jawab Soal!'
    S.paused = true; S.running = false
    try { const bgm=document.getElementById('game-bgm'); bgm.pause() } catch(_){}
    return
  }
  S.paused = !S.paused
  S.running = !S.paused
  document.getElementById('btn-pause').textContent = S.paused ? '▶' : '⏸'
  document.getElementById('status-text').textContent = S.paused ? 'PAUSE' : 'Terbang!'
  document.getElementById('pause-overlay').style.display = S.paused ? 'flex' : 'none'
  try { const bgm=document.getElementById('game-bgm'); S.paused?bgm.pause():bgm.play().catch(()=>{}) } catch(_){}
}

// Volume controls
window._volFlap = 1.0  // 1.5x from 0.8 ≈ 1.0 (capped)
window._volBGM = 0.25  // 50% from 0.5
function updateVolumes() {
  const master = document.getElementById('vol-master').value / 100
  const flap = document.getElementById('vol-flap').value / 100
  const bgm = document.getElementById('vol-bgm').value / 100
  window._volFlap = flap * master
  window._volBGM = bgm * master
  try { document.getElementById('game-bgm').volume = window._volBGM } catch(_){}
}

function goBack() {
  S.running = false
  // Hotfix #102-C (2026-04-27): stop Pixi ticker so 60fps callback doesn't keep
  // firing after game-end. See games/lokomotif-pemberani.html for canonical pattern.
  try { if (app && app.ticker) app.ticker.stop() } catch(_){}
  // stop all audio
  try { const bgm=document.getElementById('game-bgm'); bgm.pause(); bgm.currentTime=0 } catch(_){}
  // Save progress — Hotfix #115: prefer shared save-engine (avatar-keyed).
  if (S.gameOver && S.pipesCleared > 0) {
    const lv = S.level
    const stars = calcStars()
    if (typeof window.saveLevelProgress === 'function') {
      window.saveLevelProgress('g19', lv, stars)
    } else {
      try {
        const key = 'dunia-0-progress'
        const prog = JSON.parse(localStorage.getItem(key) || '{}')
        if (!prog.g19) prog.g19 = { completed: [], stars: {} }
        if (!prog.g19.completed.includes(lv)) prog.g19.completed.push(lv)
        if ((prog.g19.stars[lv] || 0) < stars) prog.g19.stars[lv] = stars
        localStorage.setItem(key, JSON.stringify(prog))
      } catch(_) {}
    }
  }
  history.back()
}

// Resize
// Resize. The old handler clamped the renderer to 1400x1000 while the stylesheet
// stretched the canvas to 100vw/100svh — so on a 2560-wide tablet the backing
// store was displayed 1.83x too wide (squashed art), and because W/H/GROUND_Y/
// BIRD_X were assigned once at init and never recomputed, every static Graphics
// still ended at the OLD width: a flat sky-coloured DEAD BAND down the right
// edge, with the floor off-screen and the bird <img> (positioned in CSS px) no
// longer where collisions were computed. Resize for real, recompute the world
// constants, and rebuild the baked layers. Debounced — PWA chrome show/hide and
// rotation fire this in bursts.
let _resizeT = null
function _birdsResize() {
  if (!app || _bootFailed) return
  app.renderer.resize(window.innerWidth, window.innerHeight)
  W = app.screen.width; H = app.screen.height
  GROUND_Y = H * 0.88; BIRD_X = W * 0.22
  if (S.birdY > GROUND_Y - 20) S.birdY = GROUND_Y - 20
  try {
    // drawBackground/drawGround PUSH into these module arrays. Rebuilding without
    // emptying them first leaves destroyed nodes in the arrays (gameLoop then
    // reads .x off a destroyed object) and grows them without bound on every
    // resize. Empty them in the same breath as the containers.
    bgContainer.removeChildren().forEach(c => { try { c.destroy({ children: true }) } catch (_) {} })
    cloudGfx.length = 0; starGfx.length = 0
    parallaxFarSkyline.length = 0; parallaxFarClouds.length = 0; parallaxNearClouds.length = 0
    drawBackground()
    groundContainer.removeChildren().forEach(c => { try { c.destroy({ children: true }) } catch (_) {} })
    groundTiles.length = 0
    drawGround()
  } catch (e) { console.warn('[g19] resize redraw failed:', e) }
  // Re-bake pipe geometry against the new height, keeping each pipe's x/gap.
  const minGapY = 100 + GAP_SIZE / 2
  const maxGapY = GROUND_Y - 60 - GAP_SIZE / 2
  for (const p of S.pipes) {
    try {
      if (maxGapY > minGapY) p.gapY = Math.max(minGapY, Math.min(maxGapY, p.gapY))
      p.topGfx.clear(); p.bottomGfx.clear()
      drawPipe(p.topGfx, 0, p.gapY - GAP_SIZE / 2, true)
      drawPipe(p.bottomGfx, p.gapY + GAP_SIZE / 2, GROUND_Y, false)
    } catch (_) {}
  }
}
window.addEventListener('resize', () => {
  clearTimeout(_resizeT)
  _resizeT = setTimeout(_birdsResize, 150)
})
</script>
