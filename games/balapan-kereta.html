// Hazards whose DB sprite shows the WRONG object are always drawn instead: 🛑 STOP
// resolves to the yellow roadworks triangle that 🚧/⚠️/🚸 already use, ⛄ resolves to
// the ice-crystal sprite 🧊 already uses, and ⚓ resolves to a passenger SHIP. The
// second half of the owner's complaint was "tanpa tahu itu apa" — knowing WHAT hit
// you needs each hazard to be its own recognisable object, not a repeat or a decoy.
const OBS_ART_FORCE = { '🛑': 1, '⛄': 1, '⚓': 1 }
// Returns a PIXI.Container drawn to `size` px tall, base ~at the local origin.
function g14ObstacleArt(emoji, size) {
  const holder = new PIXI.Container()
  const g = new PIXI.Graphics()
  const draw = OBS_ART_DRAW[OBS_ART_KIND[emoji] || ''] || OBS_ART_DRAW.rock
  try { draw(g) } catch (_) { try { OBS_ART_DRAW.rock(g) } catch (__) {} }
  holder.addChild(g)
  holder.scale.set((size || 44) / 44)
  return holder
}
// Every emoji the spawner can pick — warmed once so the DB art (when it exists and
// loads) is on screen from the very first obstacle instead of streaming in late.
function g14ObstacleEmojiPool() {
  const set = {}
  for (const e of OBS_EMOJIS) set[e] = 1
  for (const k in OBS_PER_BIOME) for (const e of OBS_PER_BIOME[k]) set[e] = 1
  for (const t of PICKUP_TYPES) set[t.emoji] = 1
  return Object.keys(set)
}

function spawnObstacle() {
  // Spawn uniformly across all 3 lanes (including middle). Player gets reaction
  // buffer from the distance D ahead, not from lane-exclusion. Previous logic
  // excluded the player's lane → middle lane never spawned anything, owner
  // could park there forever ("di lane tengah tidak ada halangan").
  const lane = Math.floor(Math.random() * 3)
  const W = app.screen.width
  // v54.49: pick from biome-specific pool so cacti only show in desert, etc.
  const _pool = OBS_PER_BIOME[TH.name] || OBS_EMOJIS
  // v55.79 — weight each candidate by its per-biome affinity (obstacles.js
  // G14_OBSTACLE_AFFINITY). No affinity ⇒ weight 1 ⇒ uniform pick as before.
  const emoji = g14PickWeightedObstacle(_pool, TH.name)

  const c = new PIXI.Container()
  // v55.95 DIORAMA — soft pastel HAZARD glow on the RAIL surface (calm amber, low opacity) so the
  // lane signals danger without recolouring the obstacle (owner's "Hologram Danger Zone").
  const wg = new PIXI.Graphics()
  wg.ellipse(0, 4, OBS_SIZE * 0.95, OBS_SIZE * 0.34).fill({ color: 0xffcf6b, alpha: 0.30 })
  c.addChild(wg)
  // contact shadow (grounds the obstacle on the ballast) — under the emoji.
  g14ContactShadow(c, OBS_SIZE * 1.15)
  // v59.75 — the hazard is drawn from art that ALWAYS has pixels. The DB sprite is
  // used only when its texture is ALREADY loaded (pixiReady), so an obstacle can
  // never spend a single frame blank waiting on a fetch; anything cold, unmapped,
  // 404 or offline falls straight through to the procedural art above.
  // The old code took the sprite unconditionally and, because pixiSprite handed
  // back a 1x1 EMPTY texture, drew NOTHING while still hitting the player.
  let art = null
  if (!OBS_ART_FORCE[emoji] && window.UISprites && UISprites.pixiReady && UISprites.pixiReady(emoji, PIXI)) {
    art = UISprites.pixiSprite(emoji, OBS_SIZE, PIXI)
    if (art) art.anchor.set(0.5, 0.85)   // sit the sprite base near the rail line
  }
  if (!art) { art = g14ObstacleArt(emoji, OBS_SIZE); art.y = OBS_SIZE * 0.15 }
  c.addChild(art)

  c.x = W + OBS_SIZE
  c.y = laneYs[lane]
  c._lane = lane
  c._alive = true
  c._warned = false
  c._emoji = emoji         // v54.19 B1 — for crashHit's per-obstacle SFX
  c._nearmissFired = false  // v54.17 A3

  L.obstacles.addChild(c)
  S.obstacles.push(c)

  // Lane warning
  // v56.6 C2 B-287 — MIDDLE-lane spawns previously got NO warning at all (only
  // top/bottom flashed a lane button). Now: middle lane flashes BOTH lane buttons
  // (either move escapes), and every spawn in the PLAYER's lane also pops an on-rail
  // "❗" chip ahead of the obstacle so the kid sees danger in the scene, not just the HUD.
  const btnIds = lane === 0 ? ['btn-dn'] : lane === 2 ? ['btn-up'] : ['btn-up', 'btn-dn']
  for (const _id of btnIds) {
    const btn = document.getElementById(_id)
    if (btn) { btn.style.borderColor = '#ef4444'; btn.style.boxShadow = '0 0 12px rgba(239,68,68,0.6)'; setTimeout(() => { btn.style.borderColor = ''; btn.style.boxShadow = '' }, 600) }
  }
  // v59.71 — the on-rail "❗" chip was a CANVAS emoji (DOM emoji-audit can't see it) and
  // it floated ABOVE the topmost rail (bottom-anchored, y = laneY − offset). Owner: zero
  // emoji + it sat off the rail. Removed — the HUD lane-button red-flash above already warns.
}

// v54.31 I17: per-level obstacle approach multiplier. Computed once.
//   L1 → 1.000 ×, L5 → 1.000 ×, L10 → 1.060 ×, L20 → 1.180 ×, L30 → 1.300 ×
// Difficulty mode amplifies (hard) or dampens (easy) the curve. Keeps the
// same train baseSpeed but the lane becomes progressively more demanding,
// matching the locked "improve, continuous refine" mandate.
const _G14_OBS_LEVEL_MULT = (function () {
  const lvl = cfg.level || 5
  const base = 1.0 + Math.max(0, lvl - 5) * 0.012
  if (cfg.difficulty === 'easy') return 1.0 + (base - 1.0) * 0.6
  if (cfg.difficulty === 'hard') return 1.0 + (base - 1.0) * 1.35
  return base
})()
function tickObstacles(delta) {
  const W = app.screen.width
  const playerX = W * PLAYER_X
  const hitZoneX = playerX + 10

  for (let i = S.obstacles.length - 1; i >= 0; i--) {
    const o = S.obstacles[i]
    if (!o._alive) { L.obstacles.removeChild(o); S.obstacles.splice(i, 1); continue }

    o.x -= S.speed * delta * _G14_OBS_LEVEL_MULT
    // v56.7 A-320/J4 — APPROACH PERSPECTIVE (render-only): obstacles arrive from the
    // distance — 0.8× scale + slightly high, easing to full size + EXACT lane Y across
    // the first ~35% of the approach. By the time they can collide (left half of the
    // screen) apr === 1 → contact geometry identical to the verified rail line.
    {
      const _W = app.screen.width
      const apr = Math.max(0, Math.min(1, (_W + 60 - o.x) / (_W * 0.35)))
      const s = 0.8 + 0.2 * apr
      o.scale.set(s)
      o.y = laneYs[o._lane != null ? o._lane : 0] - (1 - apr) * 10
    }
    // Pulse warning
    o.children[1].alpha = 0.1 + Math.sin(S.frame * 0.2) * 0.1

    // v55.7 — Increment dodgeCount when obstacle scrolls off-screen WITHOUT
    // having hit the player. Used by endRace() engagement-index gate (B-203).
    if (o.x < -OBS_SIZE * 2) {
      if (!o._crashed) {
        S.dodgeCount = (S.dodgeCount || 0) + 1
        // v55.79 — clean pass: grow the combo streak + celebrate milestones.
        S.streak = (S.streak || 0) + 1
        g14StreakMilestone()
      }
      o._alive = false
      continue
    }

    // Collision
    if (S.invincible <= 0 && o._lane === S.lane &&
        o.x > hitZoneX - OBS_SIZE && o.x < hitZoneX + OBS_SIZE) {
      o._alive = false
      o._crashed = true  // v55.7 — mark so off-screen tick doesn't count it as a dodge
      crashHit(o._emoji)  // v54.19 B1
      continue
    }
    // v54.17 A3: near-miss bonus. Fire ONCE when an adjacent-lane obstacle
    // crosses the player column within 1 lane. Rewards close-pass bravery.
    if (!o._nearmissFired && Math.abs(o._lane - S.lane) === 1 &&
        o.x > hitZoneX - OBS_SIZE && o.x < hitZoneX + OBS_SIZE) {
      o._nearmissFired = true
      g14SpawnNearMiss(playerX, gameTop + laneH * (S.lane + 0.5))
      S.pressure = Math.min(100, S.pressure + 5)
      try { updatePressure() } catch(_){}
      try { playTone(1100, 0.05, 'triangle') } catch(_){}
    }
  }
}

function g14SpawnNearMiss(x, y){
  const el = document.createElement('div')
  el.className = 'g14-nearmiss'
  el.textContent = '+5 ⚡'
  // Pixi coords already correspond to canvas pixels — direct screen position.
  el.style.left = (x - 30) + 'px'
  el.style.top  = (y - 24) + 'px'
  document.body.appendChild(el)
  setTimeout(() => el.remove(), 1000)
}

// v55.79 — Combo / streak celebration. NO text — escalate the EXISTING particle
// FX + play a short rising arpeggio at milestones 3 / 5 / 10. Reuses TrainVFX
// (reduce-motion gated automatically) + playTone. Bigger streak = bigger burst
// + more / higher notes. Coin multiplier is applied silently in tickPickups.
function g14StreakMilestone() {
  const s = S.streak || 0
  if (s !== 3 && s !== 5 && s !== 10) return
  const count = s === 3 ? 10 : s === 5 ? 16 : 26
  const speed = s === 3 ? 4 : s === 5 ? 5.5 : 7
  const cx = (L.player && L.player.x != null) ? L.player.x : app.screen.width * PLAYER_X
  const cy = (L.player && L.player.y != null) ? L.player.y : (laneYs[S.lane] != null ? laneYs[S.lane] : app.screen.height / 2)
  try {
    if (window.TrainVFX && L.fx) {
      TrainVFX.particles.spawn({ type: 'sparkle', parent: L.fx, x: cx, y: cy, count, speed, ttl: 36, opts: { color: 0xfde047 } })
      TrainVFX.particles.spawn({ type: 'star', parent: L.fx, x: cx, y: cy, count: Math.round(count * 0.5), speed: speed * 0.9, ttl: 50, gravity: 0.04, opts: { color: 0xffffff } })
      if (s === 10) TrainVFX.particles.spawn({ type: 'confetti', parent: L.fx, x: cx, y: cy, count: 24, speed: 5, ttl: 80, gravity: 0.06 })
    }
  } catch (_) {}
  // Rising arpeggio (pleasant, ascending). More notes for bigger streaks.
  try {
    const notes = s === 3 ? [784, 988] : s === 5 ? [784, 988, 1175] : [784, 988, 1175, 1568]
    notes.forEach((f, i) => setTimeout(() => playTone(f, 0.10, 'triangle'), i * 70))
  } catch (_) {}
}

function crashHit(obstacleEmoji) {
  if (S.invincible > 0) return
  S.invincible = 60
  S.streak = 0  // v55.79 — a crash breaks the clean-pass combo
  // v54.17 A9: replace rotation jitter with cinematic scale zoom + chromatic flash.
  S.shakeTimer = 24
  S.zoomTimer  = 24
  S.hp--
  spawnCrashFX(L.player.x, L.player.y)
  // v54.54 VFX: TrainVFX particles (sparks + dust) + freeze-frame + chromatic
  // burst. Wired through the shared module so reduce-motion gate is automatic.
  try {
    if (window.TrainVFX && L.fx) {
      TrainVFX.particles.spawn({ type: 'crack',  parent: L.fx, x: L.player.x, y: L.player.y, count: 10, speed: 5, ttl: 28, gravity: 0.18 })
      TrainVFX.particles.spawn({ type: 'dust',   parent: L.fx, x: L.player.x, y: L.player.y + 8, count: 8, speed: 2, ttl: 40, gravity: 0.04, upBias: 0.2 })
      TrainVFX.particles.spawn({ type: 'sparkle',parent: L.fx, x: L.player.x, y: L.player.y, count: 6, speed: 4, ttl: 24, opts: { color: 0xfde047 } })
      TrainVFX.screen.freezeFrame(90)
      TrainVFX.filters.chromatic(stage, 6)
      setTimeout(() => { try { stage.filters = null } catch(_){} }, 220)
    }
  } catch(_){}
  // v54.19 B1: per-obstacle SFX (cow moos, chicken cluck, rock thud, etc.) replaces
  // the single 200Hz crash tone.
  if (obstacleEmoji) g14ObsSFX(obstacleEmoji); else playTone(200, 0.2, 'square')
  // v54.31 I16: duck BGM on crash so the impact SFX cuts through.
  try { duckBgm(0.6, 420) } catch(_){}
  screenFlash('rgba(255,60,60,0.35)')
  // v54.54 VFX: vignette pulse intensifies if low HP (last life red breath).
  try {
    if (window.TrainVFX) {
      const col = (S.hp <= 1) ? 'rgba(239,68,68,0.8)' : 'rgba(239,68,68,0.5)'
      TrainVFX.screen.vignettePulse(col, 700)
    }
  } catch(_){}
  // v54.19 B9: haptic on crash.
  g14Vibrate([30, 50, 20])
  // v54.17 A4: animated heart loss
  try { g14SpawnHeartPop() } catch(_){}
  updateHUD()
  if (S.hp <= 0) {
    // v54.19 B11: 2.2s crash replay vignette before end-screen.
    try { g14RecordDeath() } catch(_){}
    g14CrashReplay(() => setTimeout(endRace, 100))
  }
}

// v54.17 A7: engine-rev preview SFX. ~400ms envelope per category.
// Steam = chuff-chuff. Diesel = rumble. EMU = electric whine. HSR = high whoosh.
// Maglev = synth ascend. characters = whimsical chime.
function g14PreviewEngine(catKey){
  const k = (catKey || '').toString()
  if (k === 'characters') {
    playTone(660, 0.08, 'triangle'); setTimeout(()=>playTone(880, 0.10, 'triangle'), 80); setTimeout(()=>playTone(1320, 0.14, 'triangle'), 180)
  } else if (k.indexOf('steam') === 0) {
    // chuff-chuff: noisy square pulses descending
    playTone(140, 0.08, 'square'); setTimeout(()=>playTone(120, 0.08, 'square'), 110); setTimeout(()=>playTone(100, 0.10, 'square'), 220)
  } else if (k.indexOf('diesel') === 0) {
    // low rumble: sawtooth slow oscillation
    playTone(90, 0.18, 'sawtooth'); setTimeout(()=>playTone(110, 0.12, 'sawtooth'), 160)
  } else if (k === 'emu') {
    // electric whine: rising triangle
    playTone(440, 0.10, 'triangle'); setTimeout(()=>playTone(660, 0.12, 'triangle'), 100); setTimeout(()=>playTone(880, 0.10, 'triangle'), 220)
  } else if (k === 'hsr') {
    // high whoosh: short sine sweep
    playTone(700, 0.08, 'sine'); setTimeout(()=>playTone(1100, 0.14, 'sine'), 90); setTimeout(()=>playTone(900, 0.10, 'sine'), 220)
  } else if (k === 'maglev') {
    // synth ascend: triangle ramp
    playTone(330, 0.07, 'triangle'); setTimeout(()=>playTone(660, 0.07, 'triangle'), 80); setTimeout(()=>playTone(990, 0.07, 'triangle'), 160); setTimeout(()=>playTone(1320, 0.14, 'triangle'), 240)
  } else {
    playTone(440, 0.10, 'sine')
  }
}

// v54.26 polish: track active requestAnimationFrame handles so we can cancel
// them on game-end / back-button. Without this, a boost fade in flight when
// the player navigates back keeps RAF'ing for 600ms (and S.speed mutates a
// detached state object). Same for boost cooldown's 3s sweep.
const _g14RAFs = new Set()
function _g14TrackRAF(handle){ _g14RAFs.add(handle); return handle }
function _g14CancelAllRAFs(){
  for (const h of _g14RAFs) { try { cancelAnimationFrame(h) } catch(_){} }
  _g14RAFs.clear()
}

function spawnBoostFX() {
  // v54.3 — Boost activation upgrade: 36 particles (was 24) + 2-tone gold/orange mix
  // + radial outward spray pattern + larger size band for visual punch.
  for (let i = 0; i < 36; i++) {
    const g = new PIXI.Graphics()
    const isOrange = i % 3 === 0
    const sz = 3 + Math.random() * 6
    g.circle(0, 0, sz).fill(isOrange ? 0xf97316 : 0xfbbf24)
    g.x = L.player.x + (Math.random() - 0.5) * 40
    g.y = L.player.y + (Math.random() - 0.5) * 20
    L.fx.addChild(g)
    // Radial spray angles for outer ring instead of pure horizontal
    const ang = (Math.PI*2) * (i/36)
    const speed = 3 + Math.random() * 5
    const vx = -speed - Math.cos(ang) * 1.5
    const vy = Math.sin(ang) * 2.5 + (Math.random() - 0.5)
    S.sparks.push({ g, vx, vy, gravity: 0.05, life: 1, decay: 0.025 + Math.random() * 0.02 })
  }
  // v54.3 — Player sprite shake 0.4s on boost activation (golden punch).
  if(L.player){
    const _t0 = performance.now()
    const _baseX = L.player.x
    function _shakeTick(){
      const dt = performance.now() - _t0
      if(dt >= 400){ L.player.x = _baseX; return }
      L.player.x = _baseX + (Math.random() - 0.5) * 4
      requestAnimationFrame(_shakeTick)
    }
    requestAnimationFrame(_shakeTick)
  }
}

function tickFX(delta) {
  for (let i = S.sparks.length - 1; i >= 0; i--) {
    const p = S.sparks[i]
    p.g.x += p.vx * delta; p.g.y += p.vy * delta
    p.vy += p.gravity * delta
    p.life -= p.decay * delta
    p.g.alpha = p.life
    if (p.life <= 0) { L.fx.removeChild(p.g); S.sparks.splice(i, 1) }
  }
}

// v54.17 A17: floating pickup tokens — coin (+10 score), lightning (+5 pressure),
// or heart (+1 HP up to LIVES_MAX). Random lane. Bob up/down. Collected on column overlap.
const PICKUP_TYPES = [
  { kind: 'coin',   emoji: '🪙', weight: 60, color: 0xfbbf24 },
  { kind: 'bolt',   emoji: '⚡', weight: 30, color: 0x60a5fa },
  { kind: 'heart',  emoji: '❤️', weight: 10, color: 0xef4444 },
]
function _pickPickupType(){
  const total = PICKUP_TYPES.reduce((s, t) => s + t.weight, 0)
  let r = Math.random() * total
  for (const t of PICKUP_TYPES) { if ((r -= t.weight) <= 0) return t }
  return PICKUP_TYPES[0]
}
function spawnPickup(){
  if (!L.fx) return
  const W = app.screen.width, H = app.screen.height
  const lane = Math.floor(Math.random() * LANE_COUNT)
  const type = _pickPickupType()
  // v55.61 B-240 — responsive: derive pickup radius from the viewport (was fixed
  // 22px) so it scales with the device like the train + obstacles. f = scale vs
  // the original 22px design.
  const PK = Math.round(Math.max(15, Math.min(Math.min(W, H) * 0.05, 26)))
  const f = PK / 22
  // Halo + emoji text. Halo gives the affordance "this is collectable, not an obstacle."
  const g = new PIXI.Container()
  const halo = new PIXI.Graphics()
  halo.circle(0, 0, PK).fill({ color: type.color, alpha: 0.18 })
  halo.circle(0, 0, PK * 0.72).fill({ color: type.color, alpha: 0.32 })
  halo.circle(0, 0, PK).stroke({ color: type.color, width: 1.5, alpha: 0.65 })
  // v54.51: color-blind safe — add a per-kind shape outline (square=coin,
  // diamond=bolt, heart-tick=heart, ring=other) layered above the halo when
  // localStorage g14-cb-safe === '1'. Shape carries the meaning so color
  // perception is no longer the only signal.
  try {
    if (localStorage.getItem('g14-cb-safe') === '1') {
      const m = new PIXI.Graphics()
      m.lineStyle = undefined
      const s = f   // scale color-blind shapes with the responsive pickup size
      if (type.kind === 'coin')      m.rect(-9*s, -9*s, 18*s, 18*s).stroke({ color: 0xffffff, width: 2 })
      else if (type.kind === 'bolt') m.poly([0,-12*s, 12*s,0, 0,12*s, -12*s,0]).stroke({ color: 0xffffff, width: 2 })
      else if (type.kind === 'heart')m.circle(-5*s, -3*s, 5*s).circle(5*s, -3*s, 5*s).stroke({ color: 0xffffff, width: 2 })
      else                            m.circle(0, 0, 14*s).stroke({ color: 0xffffff, width: 2 })
      g.addChild(m)
    }
  } catch(_){}
  // v59.72 — pickup icon as DB sprite (coin/bolt/heart all mapped), emoji fallback.
  const _psz = Math.round(26 * f)
  const t = ((window.UISprites && UISprites.pixiSprite) ? UISprites.pixiSprite(type.emoji, _psz, PIXI, { center: true }) : null)
    || new PIXI.Text({ text: type.emoji, style: { fontSize: _psz, fontFamily: 'Arial' } })
  t.anchor.set(0.5)
  g.addChild(t)
  g.x = W + 60
  // v56.3 B-288 — hover the WHOLE pickup ABOVE the rail line (laneY = where wheels sit).
  // Center-anchored at laneY, half the icon + the ±6 bob dipped BELOW the rail (owner:
  // "petir icon dan coin itu di bawah rail lane"). Base = laneY − (radius + margin);
  // the bob range in tickPickups stays fully above the rail.
  g._hoverY = laneYs[lane] - (PK + 6)
  g.y = g._hoverY
  g._lane = lane
  g._kind = type.kind
  g._phase = Math.random() * Math.PI * 2
  g._alive = true
  L.fx.addChild(g)
  S.pickups.push(g)
}
function tickPickups(delta){
  if (!S.pickups || !S.pickups.length) return
  const W = app.screen.width
  const playerX = W * PLAYER_X
  for (let i = S.pickups.length - 1; i >= 0; i--) {
    const p = S.pickups[i]
    if (!p._alive) { L.fx.removeChild(p); S.pickups.splice(i, 1); continue }
    p.x -= S.speed * delta * 0.9
    // v56.3 B-288 — dt-scaled bob (was frame-rate dependent) in a range FULLY ABOVE the
    // rail: hoverY-4 .. hoverY (sin mapped 0..1), never crossing the rail line.
    p._phase += 0.08 * delta
    p.y = (p._hoverY != null ? p._hoverY : laneYs[p._lane] - 26) - (Math.sin(p._phase) * 0.5 + 0.5) * 4
    // Spin halo subtly
    p.children[0].rotation += 0.04 * delta
    if (p.x < -60) { p._alive = false; continue }
    // v56.6 E2 A-315 — GENEROUS radius + MAGNET ease-in: kids' aim is imprecise;
    // within 64px on the same lane the pickup visibly STREAMS into the train
    // (research: misses feel broken to 4-7yo; magnet ease > teleport).
    if (window.Motion && p._lane === S.lane && !p._magnet &&
        p.x > playerX - 64 && p.x < playerX + 64) p._magnet = true
    if (p._magnet && L.player) {
      const _ds = (delta || 1) / 60
      p.x = Motion.damp(p.x, playerX, 14, _ds)
      p.y = Motion.damp(p.y, L.player.y - 20, 14, _ds)
      const sc = Math.max(0.55, (p.scale && p.scale.x || 1) - 0.03 * (delta || 1))
      if (p.scale) p.scale.set(sc)
    }
    // Collection — player must be in same lane + overlapping column.
    if (p._lane === S.lane && p.x > playerX - 28 && p.x < playerX + 28) {
      p._alive = false
      // Apply effect.
      if (p._kind === 'coin') {
        // v55.79 — silent combo coin multiplier: streak≥5 ×1.5, ≥10 ×2 (capped
        // at ×2). The HUD coin counter just rises faster; no on-screen label.
        const _mult = (S.streak >= 10) ? 2 : (S.streak >= 5) ? 1.5 : 1
        S.coins = (S.coins || 0) + Math.round(10 * _mult)
        try { if (window.SFXEngine && SFXEngine.coin) SFXEngine.coin(); else { playTone(1200, 0.06, 'sine'); setTimeout(()=>playTone(1600, 0.10, 'sine'), 60) } } catch(_){}
      } else if (p._kind === 'bolt') {
        S.pressure = Math.min(100, S.pressure + 5)
        try { updatePressure() } catch(_){}
        try { playTone(900, 0.06, 'triangle'); setTimeout(()=>playTone(1400, 0.08, 'triangle'), 50) } catch(_){}
      } else if (p._kind === 'heart') {
        if (S.hp < LIVES_MAX) { S.hp++; try { updateHUD() } catch(_){} }
        try { playTone(660, 0.10, 'sine'); setTimeout(()=>playTone(880, 0.12, 'sine'), 90); setTimeout(()=>playTone(1100, 0.14, 'sine'), 200) } catch(_){}
      }
      // Floating toast at the pickup's screen position. v55.78 B-279 declutter —
      // ICON-ONLY (was "+10 🪙" etc.); the HUD coin/heart counters show the numbers.
      const labelMap = { coin: '🪙', bolt: '⚡', heart: '❤️' }
      const lbl = document.createElement('div')
      lbl.className = 'g14-nearmiss'
      lbl.style.color = p._kind === 'coin' ? '#fbbf24' : p._kind === 'bolt' ? '#60a5fa' : '#f87171'
      lbl.style.textShadow = '0 2px 8px rgba(0,0,0,0.6)'
      lbl.textContent = labelMap[p._kind] || '+'
      lbl.style.left = (p.x - 28) + 'px'
      lbl.style.top  = (p.y - 24) + 'px'
      document.body.appendChild(lbl)
      setTimeout(() => lbl.remove(), 900)
    }
  }
}

async function g14HandleShare(){
  try {
    let dataUrl = null
    if (app && app.renderer && app.renderer.extract && app.stage) {
      try { dataUrl = app.renderer.extract.canvas(app.stage).toDataURL('image/png') } catch(_){}
    }
    const payload = {
      title: 'Dunia Emosi — Balapan Kereta',
      text: `Aku raih ${S.position === 1 ? '🥇' : S.position === 2 ? '🥈' : '🥉'} ${Math.floor(S.distance)}m dengan ${(S.trainCfg && S.trainCfg.name) || 'kereta'} di Dunia Emosi! 🚂`
    }
    // v55.48 B-237 — fetch the data-URL ONCE (was twice) behind an AbortController
    // timeout so a slow/huge toDataURL blob conversion can never hang the share flow.
    let _file = null
    if (dataUrl) {
      try {
        const _ctrl = new AbortController()
        const _to = setTimeout(() => _ctrl.abort(), 8000)
        const _blob = await (await fetch(dataUrl, { signal: _ctrl.signal })).blob()
        clearTimeout(_to)
        _file = new File([_blob], 'race.png', { type: 'image/png' })
      } catch(_) { _file = null }
    }
    if (_file && navigator.canShare && navigator.canShare({ files: [_file] })) {
      await navigator.share({ ...payload, files: [_file] })
    } else if (navigator.share) {
      await navigator.share(payload)
    } else if (dataUrl) {
      // Fallback: open in new tab for save-as
      const a = document.createElement('a')
      a.href = dataUrl; a.download = 'dunia-emosi-race.png'
      document.body.appendChild(a); a.click(); a.remove()
    }
  } catch(_){}
}

  ovl.classList.add('show')

function loop(ticker) {
  if (!S.running || S.paused) return
  const delta = Math.min(ticker.deltaTime, 2.5)   // v54.0 (concern 6) dt clamp
  const now = performance.now()

  // v55.63 B-255 — station-arrival slow-down. While a station cinematic plays,
  // briefly ease the WORLD scroll (parallax/obstacles/AI) so the train feels like
  // it slows into the station. Real speed is restored before the distance/accel
  // update so gameplay length is unaffected. Cosine ease 1 → 0.55 → 1.
  let _stationSpeedSave = null
  if (S._stationSlow > 0) {
    S._stationSlow -= delta
    const _p = 1 - Math.max(0, S._stationSlow) / (S._stationSlowDur || 60)
    _stationSpeedSave = S.speed
    S.speed *= (1 - 0.45 * Math.sin(_p * Math.PI))
  }

  // Spawn obstacle
  // v54.27 I1: read OBS_INTERVAL_MS_CURRENT (Mode Belajar live value) instead
  // of the immutable OBS_INTERVAL_MS const. Without this, g14ApplyKidMode's
  // +200ms loosening was a silent no-op — kid mode promised easier spawn cadence
  // but obstacles still flew at the same rate.
  if (now - lastObsTime > (typeof OBS_INTERVAL_MS_CURRENT !== 'undefined' ? OBS_INTERVAL_MS_CURRENT : OBS_INTERVAL_MS)) {
    spawnObstacle()
    lastObsTime = now
  }

  // v54.8 (concern 10): TIME_OF_DAY sky redraw — every 18 frames so the gradient
  // smoothly cycles pagi→siang→sore→petang→malam across the 800m race.
  if (S.frame % 18 === 0) g14ApplyTimeOfDaySky()

  tickClouds(delta)
  tickBirds(delta)
  tickMid(delta)
  // A-311 — volcano smoke plume (own container, so the parallax tick never moves it)
  if (window.IndoScene && L._smoke && L.smoke && L._scenePal) {
    L._smokeT = (L._smokeT || 0) + delta
    IndoScene.tickSmoke(L.smoke, L._smoke, L._craterX, L._craterY, L._scenePal, delta, (L._smokeT % 5) < delta)
  }
  tickSignalPosts(delta)
  tickKMMarkers(delta)  // v54.14
  tickTracks(delta)
  tickSteam(delta)
  tickPlayer(delta)
  tickAI(delta)
  tickObstacles(delta)
  tickPickups(delta)  // v54.17 A17
  tickFX(delta)
  tickSpeedLines(delta)
  tickWeather(delta)        // v54.49: rain/snow/sandstorm/embers per biome
  g14CheckForecast()        // v54.49: 200m / 500m forecast banner
  // v54.17 A17: spawn next floating pickup once distance threshold reached.
  if (S.distance >= (S.nextPickupAt || Infinity)) {
    spawnPickup()
    S.nextPickupAt += 180
  }

  // v55.63 B-255 — restore real speed (station slow-down was visual-only).
  if (_stationSpeedSave != null) S.speed = _stationSpeedSave
  // Advance distance
  const speedFactor = S.boosting ? S.trainCfg.boostMult : 1.0
  S.distance += S.speed * delta * 0.12 * speedFactor
  S.speed = Math.min(S.maxSpeed, S.speed + 0.0003 * delta)
  // v54.17 A13: track peak speed for result-screen callout (kmh from baseSpeed proxy).
  const _curKmh = (S.trainCfg && S.trainCfg.kmh) ? (S.trainCfg.kmh * (S.speed / S.baseSpeed) * speedFactor) : 0
  if (_curKmh > (S.bestSpeed || 0)) S.bestSpeed = _curKmh

  // Pressure recovery
  // 2026-06-21 — pressure recovery doubled (0.05 → 0.10 per frame) so boost
  // is accessible. Was sluggish, contributing to "no chance to catch AI" feel.
  S.pressure = Math.min(100, S.pressure + 0.10 * delta)
  updatePressure()

  updateHUD()

  // v54.17 A6: low-fuel siren — pulse red border + 220Hz pip when pressure < 20.
  const hudTop = document.getElementById('hud-top')
  if (hudTop) {
    const wantLowFuel = S.pressure < 20
    if (wantLowFuel && !hudTop.classList.contains('g14-low-fuel')) {
      hudTop.classList.add('g14-low-fuel')
    } else if (!wantLowFuel && hudTop.classList.contains('g14-low-fuel')) {
      hudTop.classList.remove('g14-low-fuel')
    }
    if (wantLowFuel && S.frame % 60 === 0) {
      try { playTone(220, 0.06, 'sawtooth') } catch(_){}
    }
  }

  // v54.17 A10 + v54.26 polish: milestone banners shifted off conductor stations.
  // Was 100/250/500/750 — collided with conductor's 100/200/300/400 announcements
  // creating double-banners at 100m and 250m near 200m station ping. New set
  // 175/375/575/725 lives in the gaps between conductor pings.
  const _milestones = [175, 375, 575, 725]
  for (const m of _milestones) {
    if (S.distance >= m && (S.lastMilestone || 0) < m) {
      S.lastMilestone = m
      g14ShowMilestone(m + 'm')
      try { playTone(880, 0.08, 'sine'); setTimeout(()=>playTone(1320, 0.10, 'triangle'), 90) } catch(_){}
      break
    }
  }

  // Checkpoints
  const frac = S.distance / S.finishLine
  ;[['cp0',0.25,1],['cp1',0.5,2],['cp2',0.75,3]].forEach(([id,th,sIdx]) => {
    const el = document.getElementById(id)
    if (frac >= th && !el.classList.contains('reached')) {
      el.classList.add('reached')
      // v54.19 B3: mini-station cinematic on each checkpoint pass.
      // v55.69 B-275 — the last waypoint announces THIS level's destination station.
      const name = (sIdx === 3 && typeof g14StationName === 'function')
        ? g14StationName()
        : G14_STATIONS[(sIdx - 1) % G14_STATIONS.length]
      g14StationCinema(name, 'Pos ' + sIdx + ' tercapai')
    }
  })
  if (frac >= 1) {
    document.getElementById('cp3').classList.add('reached')
    endRace()
  }

  // v54.19 B5: conductor pre-announce upcoming station.
  try { g14CheckConductorAnnounce() } catch(_){}
  // v54.19 B8: maybe float mini-quiz chip.
  try { g14MaybeFloatMiniQuiz() } catch(_){}
}

// v54.69 — Bind ObstacleEngine to G14's game-state hooks and start the puzzle scheduler.
// Soft-fail by default (Easy mode); Hard mode keeps current HP/crash semantics.
function g14WireObstacleEngine(){
  if (!window.ObstacleEngine) return
  window.ObstacleEngine.attach({
    pauseTick: () => { S.running = false },
    // v54.80 bug-fix: resumeTick must NOT re-enable race if game is over.
    // Previously, an obstacle finishing mid-end-race could re-flip S.running=true,
    // re-arming the tick loop after endRace() set it false.
    resumeTick: () => { if (!S.gameOver && !S.paused) S.running = true },
    slowDown: (factor, durMs) => { /* visual slow already handled by overlay zoom */ },
    resumeSpeed: () => {},
    cameraZoom: (scale, durMs) => {
      // Optional: animate L.world zoom for puzzle approach. v54.69 = no-op for safety.
    },
    takeHP: (n) => {
      // Only fires in Hard mode (engine gates this)
      if (S.hp > 0) {
        S.hp = Math.max(0, S.hp - n)
        try { updateHUD() } catch(_){}
      }
    },
    awardReward: (reward, obstacleId) => {
      if (!reward) return
      if (reward.coins) {
        S.coins = (S.coins || 0) + reward.coins
        try { updateHUD() } catch(_){}
      }
      // Surface reward via floating "+N coins" if available
      try {
        if (typeof spawnFloatScore === 'function' && reward.coins) {
          // best-effort; ignore failure
        }
      } catch(_){}
    },
  })

  // Schedule a puzzle every ~28-40s during the race. Re-arms on success.
  // v54.75: adaptive picker — filters by age preset + suggested difficulty tier
  // + journey/location context. Falls back gracefully to full registry.
  function _pickObstacleId(){
    const OE = window.ObstacleEngine
    if (!OE) return 'missing_rail_triangle'
    const registry = OE._registry || {}
    const allIds = Object.keys(registry)
    if (allIds.length === 0) return 'missing_rail_triangle'
    // Adaptive filter — age + difficulty tier
    let pool = (typeof OE.pickAdaptiveCandidates === 'function') ? OE.pickAdaptiveCandidates() : allIds
    // Further filter by journey/location context if BG engine has state
    try {
      const ctx = window.TrainBG && window.TrainBG._state
      if (ctx && ctx.journey && ctx.location) {
        const filtered = pool.filter(id => {
          const def = registry[id]
          if (!def) return false
          const phases = def.allowedJourneyPhases || ['*']
          const locs   = def.allowedLocations || ['*']
          const phaseOK = phases.includes('*') || phases.includes(ctx.journey.name)
          const locOK   = locs.includes('*')   || locs.includes(ctx.location.id) || locs.includes((ctx.location.id || '').replace(/^id_/, ''))
          return phaseOK && locOK
        })
        if (filtered.length > 0) pool = filtered
      }
    } catch(_){}
    return pool[Math.floor(Math.random() * pool.length)]
  }

  function _scheduleNext(){
    const delayMs = 28000 + Math.random() * 12000
    setTimeout(() => {
      // v54.80 bug-fix: also gate on S.quizOpen + S.gameOver to avoid overlap
      // with the existing mini-quiz (g14-mini-quiz) or after race ends.
      if (!S.running || S.quizOpen || S.gameOver) return
      // v57.0 A-326 — route the periodic obstacle challenge through the SHARED
      // Pokémon-style QuizEngine question (was ObstacleEngine dialog mini-games).
      try {
        g14ObstacleQuiz().then((outcome) => {
          // v55.7 — engagement counter for star gate (B-203)
          if (outcome === 'success') S.puzzlesSolved = (S.puzzlesSolved || 0) + 1
          _scheduleNext()
        })
      } catch(e) {
        console.warn('[g14] obstacle quiz failed', e)
        _scheduleNext()
      }
    }, delayMs)
  }

  // v54.76 — Scripted route runner. If BG engine has set a known location,
  // try to look up a scripted route and run it step-by-step. Falls back to
  // _scheduleNext() (adaptive random) if no scripted route matches.
  function _tryRunScriptedRoute(){
    if (typeof window.findRouteForLocation !== 'function') return false
    const bg = window.TrainBG && window.TrainBG._state
    const locId = bg && bg.location && bg.location.id
    if (!locId) return false
    const route = window.findRouteForLocation(locId)
    if (!route || !route.sequence || route.sequence.length === 0) return false

    console.log('[g14] running scripted route:', route.id, 'with', route.sequence.length, 'beats')
    let step = 0
    function _runStep(){
      // v54.80 bug-fix: also bail if game over or pre-existing modal is open.
      if (!S.running || S.gameOver || S.quizOpen) return
      if (step >= route.sequence.length) {
        // Route complete — award completion reward, then fall back to random for remainder of race
        if (route.completionReward && window.ObstacleEngine) {
          try {
            const r = route.completionReward
            if (r.coins) { S.coins = (S.coins||0) + r.coins; try{updateHUD()}catch(_){} }
            if (r.sticker)    window.ObstacleEngine._addToStorageList && window.ObstacleEngine._addToStorageList('train-stickers', r.sticker)
            if (r.badge)      window.ObstacleEngine._addToStorageList && window.ObstacleEngine._addToStorageList('train-badges', r.badge)
            if (r.hornUnlock) window.ObstacleEngine._addToStorageList && window.ObstacleEngine._addToStorageList('train-horn-unlocks', r.hornUnlock)
            // Fallback for missing helper
            if (!window.ObstacleEngine._addToStorageList) {
              try {
                const w = (k,v) => { const a = JSON.parse(localStorage.getItem(k)||'[]'); if (!a.includes(v)) { a.push(v); localStorage.setItem(k, JSON.stringify(a)) } }
                if (r.sticker)    w('train-stickers', r.sticker)
                if (r.badge)      w('train-badges',   r.badge)
                if (r.hornUnlock) w('train-horn-unlocks', r.hornUnlock)
              } catch {}
            }
          } catch(e) { console.warn(e) }
        }
        _scheduleNext()
        return
      }
      const beat = route.sequence[step]; step++
      if (beat.type === 'wait') {
        setTimeout(_runStep, beat.durationMs || 6000)
      } else if (beat.type === 'arrival') {
        // Arrival beat — no obstacle, just a short transition pause
        setTimeout(_runStep, 4000)
      } else if (beat.obstacleId) {
        try {
          const overrideReward = beat.overrideReward
          // For now, just spawn the obstacle (overrideReward propagates via the def's reward field).
          // A future tranche could allow per-spawn overrides via opts.
          window.ObstacleEngine.spawn(beat.obstacleId, { overrideReward }).then(() => {
            // Apply override reward extras (sticker/badge) on success
            if (overrideReward) {
              try {
                if (overrideReward.coins) { S.coins = (S.coins||0) + overrideReward.coins; try{updateHUD()}catch(_){} }
                const w = (k,v) => { const a = JSON.parse(localStorage.getItem(k)||'[]'); if (!a.includes(v)) { a.push(v); localStorage.setItem(k, JSON.stringify(a)) } }
                if (overrideReward.sticker)    w('train-stickers', overrideReward.sticker)
                if (overrideReward.badge)      w('train-badges',   overrideReward.badge)
                if (overrideReward.hornUnlock) w('train-horn-unlocks', overrideReward.hornUnlock)
              } catch(e) { console.warn(e) }
            }
            // Inter-beat delay
            setTimeout(_runStep, 4000 + Math.random() * 3000)
          })
        } catch(e) {
          console.warn('[g14] scripted spawn failed', e)
          setTimeout(_runStep, 5000)
        }
      } else {
        setTimeout(_runStep, 1000) // unknown beat — skip
      }
    }
    // Wait 1500ms for BG context to settle then start
    setTimeout(_runStep, 1500)
    return true
  }

  // Try scripted route first; if no match, fall back to adaptive random scheduler.
  if (!_tryRunScriptedRoute()) {
    _scheduleNext()
  }
}

// v54.17 A1: 3-2-1-GO ritual with station bell ding + steam whistle on GO.
// onDone fires once "GO!" finishes its zoom-out so the caller can flip S.running.
function g14RunCountdown(onDone){
  const ov = document.getElementById('g14-countdown')
  const num = document.getElementById('g14-countdown-num')
  if (!ov || !num) { if (onDone) onDone(); return }
  ov.classList.add('show')
  const seq = ['3', '2', '1', 'GO!']
  let i = 0
  function _step(){
    num.classList.remove('go')
    // re-trigger animation
    void num.offsetWidth
    num.textContent = seq[i]
    if (seq[i] === 'GO!') {
      num.classList.add('go')
      // Steam whistle: descending double tone
      try { playTone(880, 0.18, 'sine'); setTimeout(()=>playTone(660, 0.22, 'sine'), 140) } catch(_){}
    } else {
      // Station bell: paired ding-ding
      try { playTone(1200, 0.07, 'square'); setTimeout(()=>playTone(900, 0.07, 'square'), 90) } catch(_){}
    }
    i++
    if (i < seq.length) {
      setTimeout(_step, 700)
    } else {
      setTimeout(() => {
        ov.classList.remove('show')
        if (onDone) onDone()
      }, 550)
    }
  }
  _step()
}

// v54.26 polish: per-pip timeout tracker so rapid lane changes don't cancel
// each other's animation mid-flight. Each pip caches its own pending timeout
// and clears it before re-triggering.
function g14UpdateLanePips(triggerSwitch){
  const pips = document.querySelectorAll('#g14-lane-pips .g14-pip')
  if (!pips || !pips.length) return
  pips.forEach((p, idx) => {
    p.classList.toggle('active', idx === S.targetLane)
    if (triggerSwitch && idx === S.targetLane) {
      if (p._switchTimeout) { clearTimeout(p._switchTimeout); p._switchTimeout = null }
      p.classList.remove('switching')

      p.classList.add('switching')
      p._switchTimeout = setTimeout(() => { p.classList.remove('switching'); p._switchTimeout = null }, 320)
    }
  })

function endRace() {
  if (!S.running) return
  S.running = false
  document.getElementById('quiz-ovl').style.display = 'none'

  // G14 is a pure-action runner — there's no quiz, so GameScoring.calc({correct:0,...})
  // would return 0 stars regardless of HP/position (game-modal.js:169 rule). Use a
  // runner-style formula instead.
  // v54.31 tightened: previously "alive = 3 stars" gave the same reward to a
  // last-place crawler and a clean 2nd-place finish. New tiering uses position
  // AND HP retention so the difference between "survived" and "dominated" is felt.
  //   Base alive               → 2 stars  (you finished, that matters)
  //   HP ≥ 50%                 → +1       (kept your run clean)
  //   HP ≥ 90%                 → +1       (almost untouched)
  //   1st place                → +1       (dominated the lane)
  // Max 5, min 0. Owner: "nyawa/life masih full tapi kalah 0 bintang" — already
  // fixed in v54.x; this pass refines the upper tier so 5 stars feels earned.
  const hpRatio = (S.hp || 0) / LIVES_MAX
  const alive = (S.hp || 0) > 0
  // v55.7 — Scoring engagement gate (closes B-203). Owner verbatim:
  // "Tanpa apapun dibiarkan aja nilai perfect." Idle race used to → 5 stars
  // because alive + full HP + 1st place (AI deterministic) maxed out the formula.
  // Now stars require actual engagement (coins / dodges / puzzles).
  const engagementIndex = (S.coins||0) + (S.dodgeCount||0)*2 + (S.puzzlesSolved||0)*5
  let stars = 0
  if (alive && S.distance > 100) stars = 1
  if (alive && hpRatio >= 0.5 && engagementIndex >= 5) stars = 2
  if (alive && hpRatio >= 0.5 && engagementIndex >= 15) stars = 3
  if (alive && hpRatio >= 0.7 && engagementIndex >= 25 && S.position <= 2) stars = 4
  if (alive && hpRatio >= 0.9 && engagementIndex >= 40 && S.position === 1) stars = 5
  // SAFETY: zero engagement (truly idle race) → max 1 star regardless of position/HP.
  if (engagementIndex === 0) stars = Math.min(stars, 1)
  stars = Math.min(5, Math.max(0, stars))
  const emoji = stars >= 5 ? '🏆' : stars >= 4 ? '🌟' : stars >= 3 ? '⭐' : stars >= 1 ? '💪' : '😞'
  const posLabel = S.position === 1 ? `Juara 1! (${Math.floor(S.distance)}m)` : S.position === 2 ? `Posisi 2 (${Math.floor(S.distance)}m)` : `Posisi 3 (${Math.floor(S.distance)}m)`
  // v54.40: special end-game title + message when player perfects level 30
  // (max level) with full stars + 1st place. Owner mandate "improve, continuous
  // refine" — the final-level victory deserves a unique signal beyond just
  // "Sempurna!", so kids understand they completed the whole akademi journey.
  const isFinalMastery = (cfg.level || 5) >= 30 && stars >= 5 && S.position === 1
  const title = isFinalMastery ? '🎓 LULUS AKADEMI MASINIS!' :
    stars >= 5 ? 'Sempurna!' : stars >= 4 ? 'Hebat!' : stars >= 3 ? 'Bagus!' : stars >= 1 ? 'Coba Lagi' : 'Gagal! Coba Lagi'
  const msg = isFinalMastery ? `Kamu menyelesaikan semua 30 level! Selamat, Masinis Profesional! ${posLabel}` :
    stars >= 5 ? `Wow, kamu hebat! ${posLabel}` :
    stars >= 4 ? `Kerja bagus! ${posLabel}` :
    stars >= 3 ? `Lumayan, terus berlatih! ${posLabel}` :
    stars >= 1 ? `Kamu bisa lebih baik lagi! ${posLabel}` :
    'Jangan menyerah, ayo coba lagi!'

  const nextLevel = (cfg.level||5) < 30 ? () => { sessionStorage.setItem('g14Config', JSON.stringify({...cfg, level:(cfg.level||5)+1})); location.reload(); } : null;

  // v54.40: unlock the masinis-profesional achievement on final mastery.
  if (isFinalMastery) {
    try {
      if (window.TrainShared && TrainShared.achievements) {
        TrainShared.achievements.unlock('masinis_profesional_g14')
      }
    } catch(_){}
  }
  // v54.17 A12: confetti shower + golden ribbon for P1 finishes.
  if (S.position === 1) {
    try { g14SpawnConfetti() } catch(_){}
    try { playTone(523, 0.12); setTimeout(()=>playTone(659, 0.12), 120); setTimeout(()=>playTone(784, 0.12), 240); setTimeout(()=>playTone(1047, 0.20), 360) } catch(_){}
    try { g14ShowCabDriverWave() } catch(_){}
    // v54.26 polish: reset Mode Belajar death counter on P1 finish so kids who
    // mastered a level start fresh next attempt. Was permanent — owner perception
    // "still in kid mode even though I won."
    try { localStorage.setItem('dunia-g14-deaths-l' + (cfg.level || 5), '0') } catch(_){}
    // v54.25 H1: race-1st achievement; H4: perfected sensor; H7: ghost record
    try {
      if (window.TrainShared) {
        TrainShared.achievements.unlock('race_1st_g14')
        TrainShared.sensor.perfected('g14')
        TrainShared.ghost14.record(cfg.level || 5, Math.floor(performance.now() - (S.startTime || performance.now())))
        if (S.trainCfg && S.trainCfg.key === 'caseyjr_character') TrainShared.achievements.unlock('casey_first_race')
      }
    } catch(_){}
  }
  // v54.25 H2: daily challenge progress, H1: passport count badges
  try {
    if (window.TrainShared) {
      TrainShared.dailyChallenge.progress('g14', 1)
      if (S.trainCfg) TrainShared.passport.stamp('g14', S.trainCfg.key || 'unknown', S.distance)
      const total = TrainShared.passport.totalStamps()
      if (total >= 5) TrainShared.achievements.unlock('passport_5')
      if (total >= 15) TrainShared.achievements.unlock('passport_15')
    }
  } catch(_){}
  // v54.25 H1: count crashes as "failed" → adaptive sensor
  if (S.position > 1) { try { if (window.TrainShared) TrainShared.sensor.failed('g14') } catch(_){} }
  // v54.19 B7: photo-share button on result modal.
  try { g14ShowShareButton() } catch(_){}
  // v54.17 A13: best-speed callout line in the result message.
  const bestKmh = Math.round(S.bestSpeed || 0)
  const speedLine = bestKmh > 0 ? `⚡ ${bestKmh} km/h max!` : ''
  const fullMsg = speedLine ? `${msg}\n${speedLine}` : msg
  // Hotfix #102-C (2026-04-27): stop Pixi ticker so 60fps callback doesn't keep
  // firing after game-end (early-returns on !S.running but loop still spins,
  // accumulating CPU → mobile hang). See games/lokomotif-pemberani.html for canonical pattern.
  try { if (app && app.ticker) app.ticker.stop() } catch(_){}
  GameModal.show({
    emoji, title, stars, msg: fullMsg,
    onNext: nextLevel,
    // v54.27 I3: lazy daily-spin trigger AFTER first race. Wraps the original
    // callbacks so the wheel pops once per day on game-over, not on boot.
    onAgain: () => { try { g14CheckDailySpin() } catch(_){}; startRace() },
    onBack:  () => { try { g14CheckDailySpin() } catch(_){}; goBack() },
    onExtra: { label: 'Ganti Kereta 🚂', action: () => { try { g14CheckDailySpin() } catch(_){}; showSelectScreen() } },
    // v54.47: 🏆 Pencapaian — opens TrainShared Achievement Wall in-place.
    onAchievements: () => { try { window.TrainShared && TrainShared.achievements.showWall() } catch(_){} }
  })

  try {
    sessionStorage.setItem('g14Result', JSON.stringify({ stars, distance: Math.floor(S.distance), position: S.position }))
  } catch(_) {}
  saveG14Progress(stars)
}

function saveG14Progress(stars) {

// Recalculate lane positions on orientation change + rebuild track/signal/grass
// (2026-05-04 fix): previously only player was repositioned, tracks stayed at
// OLD laneYs → train + rails misaligned after rotate landscape↔portrait.
let _g14ResizeDebounce = null
window.addEventListener('resize', () => {
  if (!app) return
  _g14CtrlHCache = -1   // A-342 — ctrl-area height may change on resize/rotate; re-read once
  if (_g14ResizeDebounce) clearTimeout(_g14ResizeDebounce)
  // Debounce 120ms so rapid rotations don't rebuild multiple times → no
  // duplicate sprite risk
  _g14ResizeDebounce = setTimeout(() => {
    if (!app) return
    // v59.75 BLACK-BAND FIX. Owner, wide-landscape tablet: "kok sisi kanan ada black
    // screen game kereta". These clamps were the cause. autoDensity writes the
    // renderer size straight onto canvas.style, and an inline style beats the
    // stylesheet's `#pixi-canvas{width:100vw}` — so on any viewport wider than
    // 1400 CSS px the canvas shrank to 1400px, left-aligned inside a fixed
    // inset:0 box, leaving (innerWidth - 1400) px of bare page background down the
    // RIGHT edge. Same for heights over 1000px along the bottom. It only appeared
    // after the first resize/rotate because initPixi() never clamped — which is
    // exactly why the menu looked fine and the running race did not.
    // The viewport is the correct size; devicePixelRatio is already capped at 1.5
    // in initPixi, so this does not grow the backing store beyond the first paint.
    app.renderer.resize(window.innerWidth, window.innerHeight)
    const H = app.screen.height, W = app.screen.width
    // v55.72 A-312 — RASTER backdrop: re-cover-fit the painting + re-derive the
    // lane Ys from its rail band (no procedural scenery to rebuild).
    if (g14HasBackdrop()) {
      const fit = g14BackdropFit()
      // v55.8x A-312 — recompute the SAME play-band layout as initPixi (one source of truth).
      const L0 = g14BackdropLanes()
      laneYs = L0.laneYs; laneH = L0.laneH; railTop = L0.railTop
      { const _pb = g14PlayBand(); const _bh = _pb.bandBot - _pb.bandTop   // v55.92 — size decoupled
        G14_UNIFORM_H = Math.round(Math.max(64, Math.min(_bh * 0.11, 175)))
        OBS_SIZE = Math.round(G14_UNIFORM_H * 0.9) }
      if (L._bdHandle) {
        L._bdHandle.refit()   // v55.77 — shared engine re-cover-fits its bands
      } else if (L._backdrop && !L._backdrop.destroyed) {
        L._backdrop.x = fit.leftX; L._backdrop.y = fit.topY
        L._backdrop.width = fit.scaledW; L._backdrop.height = fit.scaledH
      }
      if (L.player) {
        L.player._wheelOffset = -g14WheelMargin(); L.player.y = laneYs[S.lane] + L.player._wheelOffset
        // v55.8x — re-fit the loco to the new laneH so it stays prominent + on-rail.
        if (L.playerCharImg && !L.playerCharImg.destroyed && L.playerCharImg.texture) {
          L.playerCharImg._baseScale = g14TrainScale(L.playerCharImg.texture)
          g14ApplyDepthScale(L.playerCharImg, S.lane)
        } else if (playerSprite) {
          g14FitProceduralToRail(playerSprite, G14_UNIFORM_H)   // v55.87 — procedural player matches NPC size
        }
        // v55.87 — re-fit every NPC procedural/sprite to the new uniform height + rail margin.
        if (L.ai && L.ai.children) { L.ai.children.forEach(c => { if (c && c._g14RefitRail) c._g14RefitRail() }) }
      }
      // v55.97 B-283 — rebuild foreground foliage so the corner fronds re-scale to the
      // new viewport (were fixed-size → ballooned after a rotate). Cheap (one container).
      try {
        if (L.fore && L.fore.parent) { L.fore.parent.removeChild(L.fore); L.fore.destroy({ children: true }) }
        if (typeof buildForeScenery === 'function') buildForeScenery()
      } catch(_){}
      try { g14BuildHaze() } catch(_){}   // v56.7 J3 — re-fit the aerial haze bands
      return
    }
    // A-311 — recompute the SAME responsive layout as initPixi so lanes/scenery/
    // train/obstacle all stay consistent after a resize/rotate.
    gameTop = Math.round(Math.max(56, Math.min(H * 0.10, 92)))
    const gameBot = H - Math.round(Math.max(96, Math.min(H * 0.17, 134)))
    gameH = gameBot - gameTop
    railTop = Math.round(gameTop + gameH * 0.44)
    laneH = (gameBot - railTop) / LANE_COUNT
    laneYs = Array.from({length: LANE_COUNT}, (_, i) => railTop + laneH * i + laneH / 2)
    G14_UNIFORM_H = Math.round(Math.max(72, Math.min(laneH * 1.02, H * 0.15)))
    OBS_SIZE = Math.round(Math.max(38, Math.min(Math.min(W, H) * 0.075, 52)))
    // Rebuild track infrastructure to match new lane positions
    try {
      if (L.tracks && L.tracks.parent) { L.tracks.parent.removeChild(L.tracks); L.tracks.destroy({children:true}) }
      if (typeof buildTracks === 'function') buildTracks()
    } catch(_){}
    // Reposition player to new lane Y.
    // A-311 — was the STALE wheelOffset = laneH*0.22-19 (the old laneH-based rail
    // formula), which re-floated the train off the rail on every resize/rotate.
    // The build path uses wheelOffset=0 (wheels sit on the rail via the 0.86
    // anchor); match it here so the train stays EXACTLY on the rail at any size.
    if (L.player) {
      L.player._wheelOffset = 0
      L.player.y = laneYs[S.lane] + 0
    }
  }, 120)
})

function g14StartQuizCountdown(){
  const COUNT_MS = 5000
  const _t0 = performance.now()
  // Inject countdown bar HTML if missing.
  let bar = document.getElementById('quiz-countdown')
  if (!bar){
    bar = document.createElement('div')
    bar.id = 'quiz-countdown'
    bar.style.cssText = 'position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,0.12);border-radius:3px;overflow:hidden'
    const inner = document.createElement('div')
    inner.id = 'quiz-countdown-fill'
    inner.style.cssText = 'height:100%;background:#4ade80;width:100%;transition:background .15s'
    bar.appendChild(inner)
    const ovl = document.getElementById('quiz-ovl')
    if (ovl) ovl.appendChild(bar)
  }
  const fill = document.getElementById('quiz-countdown-fill')
  fill.style.width = '100%'
  fill.style.background = '#4ade80'
  function _tick(){
    if (!S.quizOpen){ return }
    const dt = performance.now() - _t0
    const rem = Math.max(0, 1 - dt / COUNT_MS)
    fill.style.width = (rem * 100).toFixed(1) + '%'
    if (rem < 0.4) fill.style.background = '#ef4444'
    else if (rem < 0.7) fill.style.background = '#fbbf24'
    if (rem <= 0){
      // Timeout — close quiz, penalize, no boost.
      S.quizOpen = false
      document.getElementById('quiz-ovl').style.display = 'none'
      S.pressure = Math.max(0, S.pressure - 15)
      try { updatePressure() } catch(_) {}
      try { playTone(180, 0.18, 'square') } catch(_) {}
      screenFlash('rgba(255,60,60,0.18)')
      return
    }
    requestAnimationFrame(_tick)
  }
  requestAnimationFrame(_tick)
}

             S.pressure = Math.max(0, (S.pressure||0) - 8); try{ updatePressure() }catch(_){}; finish(false) }
    })
    document.getElementById('quiz-ovl').style.display = 'block'
    // Reuse the same countdown affordance as the BOOST quiz (auto-fail on timeout).
    var COUNT_MS = 6000, t0 = performance.now()
    var bar = document.getElementById('quiz-countdown')
    if (!bar){
      bar = document.createElement('div'); bar.id = 'quiz-countdown'
      bar.style.cssText = 'position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,0.12);border-radius:3px;overflow:hidden'
      var inner = document.createElement('div'); inner.id = 'quiz-countdown-fill'
      inner.style.cssText = 'height:100%;background:#4ade80;width:100%'
      bar.appendChild(inner); var ovl = document.getElementById('quiz-ovl'); if (ovl) ovl.appendChild(bar)
    }
    var fill = document.getElementById('quiz-countdown-fill'); if (fill){ fill.style.width='100%'; fill.style.background='#4ade80' }
    ;(function tick(){
      if (!S.quizOpen || done) return

  try { duckBgm(0.55, 700) } catch(_){}
  screenFlash('rgba(251,191,36,0.2)')

  setTimeout(() => {
    S.boosting = false
    // v54.17 A15 + v54.26 polish: pause-aware speed fade-down with cubic ease-out
    // (was linear; now feels less abrupt). Skips advancement while paused so
    // the player doesn't silently lose their boost on a pause-resume cycle.
    const _peak = S.speed
    const _BOOST_FADE_MS = 600
    let _accumBoost = 0
    let _lastBoostT = performance.now()
    function _boostFadeTick(){
      if (!S.running || (typeof S.gameOver !== 'undefined' && S.gameOver)) { S.speed = S.baseSpeed; return }
      const now = performance.now()
      const dt = now - _lastBoostT
      _lastBoostT = now
      if (S.paused) { _g14TrackRAF(requestAnimationFrame(_boostFadeTick)); return }
      _accumBoost += dt
      const t = Math.min(1, _accumBoost / _BOOST_FADE_MS)
      // cubic ease-out: 1 - (1 - t)^3 — fast initial decay, gentle settle
      const eased = 1 - Math.pow(1 - t, 3)
      S.speed = _peak + (S.baseSpeed - _peak) * eased
      if (t < 1) _g14TrackRAF(requestAnimationFrame(_boostFadeTick))
      else S.speed = S.baseSpeed
    }
    _g14TrackRAF(requestAnimationFrame(_boostFadeTick))
    // Steam burst — fire 5 cluster puffs in rapid succession.
    try { for (let bi = 0; bi < 5; bi++) setTimeout(spawnSteam, bi * 40) } catch(_){}
    // Descending whir: 1100 → 800 → 500 Hz.
    try { playTone(1100, 0.08, 'triangle'); setTimeout(()=>playTone(800, 0.08, 'triangle'), 100); setTimeout(()=>playTone(500, 0.12, 'triangle'), 220) } catch(_){}
    document.getElementById('btn-boost').classList.remove('boosting')
    document.getElementById('btn-boost').innerHTML = '🔥<br><span style="font-size:12px;font-weight:900">BOOST!</span>'
    // v54.0 (concern 9): animate the cooldown arc from full (360deg) to empty
    // over the 3000ms cooldown window. RAF-driven so the conic-gradient sweep
    // stays smooth on low-end Android.
    const _bb = document.getElementById('btn-boost')
    const _CD_MS = 3000
    _bb.style.setProperty('--boost-pct', '360deg')
    // v54.26 polish: pause-aware cooldown sweep — was burning down silently
    // while paused, leaving the player back with no boost on resume.
    let _accumCd = 0
    let _lastCdT = performance.now()
    function _cdTick(){
      if(!S.boostCooldown){ _bb.style.setProperty('--boost-pct', '0deg'); return }
      const now = performance.now()
      const dt = now - _lastCdT
      _lastCdT = now
      if (S.paused) { _g14TrackRAF(requestAnimationFrame(_cdTick)); return }
      _accumCd += dt
      const remaining = Math.max(0, 1 - _accumCd/_CD_MS)
      _bb.style.setProperty('--boost-pct', (remaining*360).toFixed(1) + 'deg')
      if(_accumCd < _CD_MS) _g14TrackRAF(requestAnimationFrame(_cdTick))
    }
    _g14TrackRAF(requestAnimationFrame(_cdTick))
    setTimeout(() => {
      S.boostCooldown = false
      document.getElementById('btn-boost').classList.remove('cooldown')
      document.getElementById('btn-boost').style.setProperty('--boost-pct', '0deg')
    }, 3000)
  }, (S.trainCfg.boostDur || 2000))
  document.getElementById('btn-boost').classList.add('cooldown')
}

// v54.15 (B2): sync S.lane = S.targetLane immediately on input. Bug: S.lane was
// set once at init and never updated; collision check (line ~2066: o._lane === S.lane)
// kept firing against the OLD lane after a switch, so player visually moved but
// felt phantom hits in the old lane. Standard lane-runner convention is input-snap
// collision (Subway Surfers / Temple Run pattern); visual interpolation follows.
function laneUp() {
  if (S.running && S.targetLane > 0) {
    S.targetLane--
    S.lane = S.targetLane
    playTone(500, 0.05)
    try { g14UpdateLanePips(true) } catch(_){}
    try { g14Vibrate(10) } catch(_){}  // v54.19 B9
  }
}
function laneDn() {
  if (S.running && S.targetLane < LANE_COUNT - 1) {
    S.targetLane++
    S.lane = S.targetLane
    playTone(400, 0.05)
    try { g14UpdateLanePips(true) } catch(_){}
    try { g14Vibrate(10) } catch(_){}  // v54.19 B9
  }
}
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') { laneUp(); e.preventDefault() }
  if (e.key === 'ArrowDown') { laneDn(); e.preventDefault() }
  if (e.key === ' ') { triggerBoost(); e.preventDefault() }
})
// v54.27 I2: swipe handler scoped to #pixi-canvas only. Was on `window` so a
// tap-drag on the BOOST button (slight finger movement) registered as a swipe
// and armed a phantom lane change. By restricting to the canvas, taps on HUD
// elements (BOOST, BACK, train name badge) no longer trigger lane gestures.
let touchY0 = null
const _g14SwipeTarget = document.getElementById('pixi-canvas') || document.documentElement
_g14SwipeTarget.addEventListener('touchstart', e => { touchY0 = e.touches[0].clientY }, {passive:true})
_g14SwipeTarget.addEventListener('touchend', e => {
  if (touchY0 === null) return
  const dy = e.changedTouches[0].clientY - touchY0
  if (Math.abs(dy) > 40) { dy < 0 ? laneUp() : laneDn() }
  touchY0 = null
}, {passive:true})

function updateHUD() {
  // A-342 super-smooth — the loop calls updateHUD every frame, but most HUD values change
  // rarely. Guard EACH DOM write on its last value so we stop rewriting gradient/text/classes
  // + running g14RenderRail's querySelectorAll every frame (was the residual per-frame recalc).
  const H = S._hud || (S._hud = {})
  const fracPct = (Math.min(1, S.distance / S.finishLine) * 100).toFixed(1)
  if (fracPct !== H.frac) { H.frac = fracPct; const progEl = document.getElementById('prog-fill'); if (progEl) progEl.style.width = fracPct + '%' }
  const distStr = `${Math.floor(S.distance)} / ${S.finishLine}m`
  if (distStr !== H.dist) { H.dist = distStr; const distEl = document.getElementById('distance-text'); if (distEl) distEl.textContent = distStr }
  if (S.hp !== H.hp) { H.hp = S.hp; const livesEl = document.getElementById('lives-hud'); if (livesEl) livesEl.textContent = '❤️'.repeat(S.hp) + '🖤'.repeat(LIVES_MAX - S.hp) }
  const coins = (S.coins || 0)
  if (coins !== H.coins) { H.coins = coins; const coinEl = document.getElementById('g14-coins-num'); if (coinEl) coinEl.textContent = coins }
  const lvNow = (cfg.level || 1)
  if (lvNow !== H.lv) {
    H.lv = lvNow
    const partEl = document.getElementById('g14-ticket-part'); if (partEl) partEl.textContent = `Part ${lvNow}/30`
    const stationEl = document.getElementById('g14-ticket-station')
    if (stationEl) { const j = G14_JOURNEY[(lvNow - 1) % G14_JOURNEY.length]; if (j) stationEl.textContent = j.name }
    try { g14RenderRail(lvNow) } catch (_) {}
  }
  const lit = Math.max(0, Math.min(5, Math.ceil((S.pressure || 0) / 20)))
  const segSig = lit * 2 + ((S.pressure || 0) < 20 ? 1 : 0)
  if (segSig !== H.seg) {
    H.seg = segSig; const low = (S.pressure || 0) < 20
    const segs = document.getElementById('g14-energy-segs')
    if (segs) { const cells = segs.children; for (let i = 0; i < cells.length; i++) { cells[i].classList.toggle('lit', i < lit); cells[i].classList.toggle('g14-seg-low', i < lit && low) } }
  }
  if (S.trainCfg) {
    const displayKmh = Math.round(S.trainCfg.kmh * (S.speed / S.baseSpeed) * (S.boosting ? S.trainCfg.boostMult : 1))
    const boost = !!S.boosting
    if (displayKmh !== H.kmh || boost !== H.boost) {
      H.kmh = displayKmh; H.boost = boost
      const numEl = document.getElementById('speed-hud-num')
      if (numEl) numEl.textContent = displayKmh + ' km/h'
      else { const sh = document.getElementById('speed-hud'); if (sh) sh.textContent = displayKmh + ' km/h' }
      const needleEl = document.getElementById('g14-speed-needle')
      if (needleEl) {
        const ratio = Math.max(0, Math.min(1, displayKmh / Math.max(1, S.trainCfg.kmh * S.trainCfg.boostMult)))
        needleEl.style.setProperty('--gns', ratio.toFixed(3))
        needleEl.classList.toggle('boost', boost)
      }
    }
  }
}
function updatePressure() {
  const pct = Math.round(S.pressure)
  // A-342 super-smooth — skip the whole DOM update when the rounded pressure is unchanged
  // (was rewriting a gradient string + meter cells EVERY frame). Boosting always re-renders.
  if (pct === S._presPct && S.boosting === S._presBoost) return
  S._presPct = pct; S._presBoost = S.boosting
  const fillEl = document.getElementById('pressure-fill')
  if (fillEl) {
    fillEl.style.width = pct + '%'
    fillEl.style.background =
      pct < 20 ? 'linear-gradient(90deg,#ef4444,#f97316)' :
      pct < 50 ? 'linear-gradient(90deg,#f97316,#fbbf24)' :
      'linear-gradient(90deg,#22d3ee,#86efac)'
  }
  const pctEl = document.getElementById('pressure-pct'); if (pctEl) pctEl.textContent = pct + '%'
  // v56.6 C3 B-287 — BOOST affordance: gold pulse + "SIAP!" when ready (pressure ≥ 20),
  // dim + lock look when not. Pre-readers see readiness at a glance.
  try {
    const bb = document.getElementById('btn-boost')
    if (bb && !S.boosting && !S.boostCooldown) {
      const ready = pct >= 20
      bb.classList.toggle('g14-boost-ready', ready)
      bb.style.opacity = ready ? '' : '0.55'
      const rl = bb.querySelector('.g14-boost-siap')
      if (ready && !rl) { const s = document.createElement('span'); s.className = 'g14-boost-siap'; s.textContent = '✨SIAP!'; bb.appendChild(s) }
      else if (!ready && rl) rl.remove()
    }
  } catch (_) {}
  // v55.73 — keep the segmented meter in sync on every pressure change.
  const segs = document.getElementById('g14-energy-segs')
  if (segs) {
    const lit = Math.max(0, Math.min(5, Math.ceil(pct / 20)))
    const low = pct < 20
    const cells = segs.children
    for (let i = 0; i < cells.length; i++) {
      cells[i].classList.toggle('lit', i < lit)
      cells[i].classList.toggle('g14-seg-low', i < lit && low)
    }
  }
}
// v55.73 — mute toggle wired to #btn-mute. Flips window.__g14Muted and
// pauses/resumes TrainBGM (or the #game-bgm element fallback).
function toggleMute() {
  window.__g14Muted = !window.__g14Muted
  const muted = window.__g14Muted
  try {
    if (window.TrainBGM && typeof TrainBGM.pause === 'function') {
      if (muted) TrainBGM.pause()
      else if (S.running) TrainBGM.play()
    } else {
      const bgm = document.getElementById('game-bgm')
      if (bgm) { if (muted) bgm.pause(); else if (S.running) bgm.play().catch(() => {}) }
    }
  } catch (_) {}
  const btn = document.getElementById('btn-mute')
  if (btn) { btn.classList.toggle('muted', muted); btn.textContent = muted ? '🔇' : '🔊' }
}

const G14_RAIL_DOTS = 5
function g14RenderRail(lvNow) {
  const total = G14_JOURNEY.length || 1
  const lv = Math.max(1, Math.min(total, lvNow || (cfg.level || 1)))
  const rail = document.getElementById('g14-ticket-rail')
  if (!rail) return
  // progress fraction across the whole journey (0..1)
  const frac = (lv - 0.5) / total
  const fill = document.getElementById('g14-rail-fill')
  if (fill) fill.style.width = Math.max(4, Math.min(100, frac * 100)).toFixed(1) + '%'
  const train = document.getElementById('g14-rail-train')
  if (train) train.style.left = Math.max(0, Math.min(96, frac * 100)).toFixed(1) + '%'
  // station dots: evenly spaced ticks, lit up to current progress (rebuilt once)
  if (rail.getAttribute('data-dots') !== String(G14_RAIL_DOTS)) {
    rail.querySelectorAll('.g14-rail-dot').forEach(function (d) { d.remove() })
    for (let i = 0; i < G14_RAIL_DOTS; i++) {
      const d = document.createElement('span')
      d.className = 'g14-rail-dot'
      d.style.left = (8 + (i + 0.5) * (84 / G14_RAIL_DOTS)) + '%'
      rail.appendChild(d)
    }
    rail.setAttribute('data-dots', String(G14_RAIL_DOTS))
  }
  const dots = rail.querySelectorAll('.g14-rail-dot')
  for (let i = 0; i < dots.length; i++) {
    dots[i].classList.toggle('done', (i + 0.5) / G14_RAIL_DOTS <= frac)
  }
}
function g14RenderMap() {
  const total = G14_JOURNEY.length || 1
  const lv = Math.max(1, Math.min(total, cfg.level || 1))
  const cur = G14_JOURNEY[(lv - 1) % total] || G14_JOURNEY[0]
  const titleSub = document.getElementById('g14-map-sub')
  if (titleSub) titleSub.textContent = 'Part ' + lv + '/' + total + '  ·  ' + (cur ? cur.name : '')
  const list = document.getElementById('g14-map-list')
  if (!list) return
  const frag = document.createDocumentFragment()
  for (let i = 0; i < total; i++) {
    const j = G14_JOURNEY[i]
    const li = document.createElement('li')
    li.className = 'g14-map-leg' + (i + 1 < lv ? ' done' : '') + (i + 1 === lv ? ' current' : '')
    const dot = document.createElement('span'); dot.className = 'g14-leg-dot'
    const nm = document.createElement('span'); nm.className = 'g14-leg-name'; nm.textContent = (j && j.name) || ('Leg ' + (i + 1))
    const num = document.createElement('span'); num.className = 'g14-leg-num'; num.textContent = (i + 1) + '/' + total
    li.appendChild(dot); li.appendChild(nm); li.appendChild(num)
    frag.appendChild(li)
  }
  list.innerHTML = ''
  list.appendChild(frag)
  // scroll current leg into view
  const curEl = list.querySelector('.g14-map-leg.current')
  if (curEl) { try { curEl.scrollIntoView({ block: 'center' }) } catch (_) {} }
}
function g14ToggleMap() {
  const ovl = document.getElementById('g14-map-ovl')
  if (!ovl) return
  if (ovl.classList.contains('open')) { g14CloseMap(); return }
  try { g14RenderMap() } catch (_) {}
  ovl.classList.add('open')
}
function g14CloseMap() {
  const ovl = document.getElementById('g14-map-ovl')
  if (ovl) ovl.classList.remove('open')
}

// v59.x — CATEGORY THUMBNAILS. Owner: "di landing pagenya itu saat pemilihan itu
// jangan pakai emoji, pakai gambar salah satu kereta — misal picker thomas aeg,
// itu pakai gambar thomas". The rows used `cat.emoji` and the shared emoji→sprite
// observer (games/data/ui-sprites.js + emoji-map.js '🚂' → vehicles/051.webp)
// rewrote EVERY 🚂 into the SAME generic 1em picture, so Thomas AEG, Chuggington,
// Uap Klasik, Uap Modern, Kereta Cepat and Komuter all looked identical.
// A real <img> element bypasses the observer cleanly (it only walks TEXT nodes).
//
// The hero is picked from the category's OWN roster (key/name substring), so a
// category added later — e.g. the Titipo pack — gets a correct thumbnail with no
// extra wiring, and a missing sprite file degrades to the procedural canvas below.
const G14_CAT_HERO = {
  characters:'caseyjr', character:'caseyjr', thomas_aeg:'thomas', chuggington:'wilson',
  titipo:'titipo',
  uap_klasik:'rocket', uap_modern:'flying scotsman', diesel:'deltic', listrik:'taurus',
  cepat:'shinkansen 0', komuter:'azuma', indonesia:'cc206'
}
function g14CatHero(cat) {
  const list = (cat && cat.trains) || []
  const want = G14_CAT_HERO[cat && cat.key]
  if (want) {
    for (let i = 0; i < list.length; i++) {
      const t = list[i]
      if (!t || !t.spriteUrl) continue
      if ((((t.key || '') + ' ' + (t.name || '')).toLowerCase()).indexOf(want) >= 0) return t
    }
  }
  for (let i = 0; i < list.length; i++) if (list[i] && list[i].spriteUrl) return list[i]
  return null
}
// Category names bake a train emoji into the LABEL too ("Uap Klasik 🚂"), which the
// observer turns into a SECOND generic train picture right beside the real thumbnail.
// Strip only rail glyphs — ⭐ / ⚡ / 🇮🇩 carry meaning and stay.
const G14_RAIL_EMOJI = /[\u{1F682}-\u{1F68B}\u{1F69D}\u{1F69E}\u{1F6F2}\u{1F6E4}]\u{FE0F}?/gu
function g14CatLabel(cat) { return String((cat && cat.name) || '').replace(G14_RAIL_EMOJI, '').replace(/\s+/g, ' ').trim() }
function g14CatThumb(cat) {
  const wrap = document.createElement('span')
  wrap.className = 'cat-thumb'
  const hero = g14CatHero(cat)
  if (!hero) {                                     // no sprite roster → keep the emoji slot
    const sp = document.createElement('span')
    sp.className = 'cat-emoji'
    sp.textContent = cat.emoji || '🚂'
    return sp
  }
  const img = document.createElement('img')
  img.src = hero.spriteUrl
  img.alt = hero.name || cat.name || ''
  img.loading = 'lazy'
  img.decoding = 'async'
  // B-229 facing: resolve through THIS game's authority. G14_FACES is applied onto
  // the live TRAIN_CATS objects above (and intentionally overrides trains-db.js),
  // world trains carry faces:'left', Chuggington crops are pre-mirrored (faces:'right')
  // and must render native. So `hero.faces` is already the g14-correct flag.
  if (hero.faces === 'left') img.style.transform = 'scaleX(-1)'
  img.onerror = () => {
    // Missing/failed sprite → procedural card art, same fallback the train cards use.
    const fb = document.createElement('canvas')
    fb.width = 96; fb.height = 48
    img.replaceWith(fb)
    try { drawTrainCard2d(fb, hero.bodyColor || '#64748b', hero.accColor || '#cbd5e1', cat.key, 1) } catch (_) {}
  }
  wrap.appendChild(img)
  return wrap
}

function showTrainsForCat(cat) {

    // v54.15 (B3): character trains render the real WebP sprite, not procedural.
    // Owner: "sangat2 belum ada perubahan sama sekali" — the v54.8 entries WERE
    // there, just rendered as generic procedural shapes via bodyColor/accColor.
    // Now Casey/Linus/Dragutin/Malivlak each show their cartoon sprite.
    if (t.isCharacter && t.spriteUrl) {
      const img = document.createElement('img')

      // v55.45 B-229 — owner: "Lihat di menu page picker terlihat sangat jelas

      try { localStorage.setItem('dunia_side_train', t.key) } catch (e) {}  // A-347 durable side-race choice

// ═══════════════════════════════════════════════════════════
//  AUDIO
// ═══════════════════════════════════════════════════════════
let audioCtx
let masterGain               // v54.31 I16: single global SFX bus
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)()
    masterGain = audioCtx.createGain()
    masterGain.gain.value = 0.85
    masterGain.connect(audioCtx.destination)
  }
  if (audioCtx.state === 'suspended') audioCtx.resume()
  return audioCtx
}
function playTone(freq, dur = 0.1, type = 'sine') {
  try {
    const ctx = ensureAudio()
    const osc = ctx.createOscillator(), gain = ctx.createGain()
    // v54.31 I16: route every SFX through masterGain so a single knob
    // controls overall SFX loudness without per-call audits.
    osc.connect(gain); gain.connect(masterGain || ctx.destination)
    osc.frequency.value = freq; osc.type = type
    gain.gain.setValueAtTime(0.1, ctx.currentTime)
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur)
    osc.start(); osc.stop(ctx.currentTime + dur)
  } catch(_) {}
}
// v54.31 I16: BGM duck — briefly lower the BGM <audio> volume so a punctuated
// SFX (boost, crash, victory) cuts through. Auto-restores after the duration.
// Owner mandate "improve, continuous refine": punchier audio mix.
let _bgmDuckTimer = null
function duckBgm(amount = 0.5, dur = 350) {
  try {
    const bgm = document.getElementById('game-bgm')
    if (!bgm) return
    const target = Math.max(0, 0.2 * (1 - amount))
    bgm.volume = target
    clearTimeout(_bgmDuckTimer)
    _bgmDuckTimer = setTimeout(() => { try { bgm.volume = 0.2 } catch(_) {} }, dur)
  } catch(_) {}
}

// ═══════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════
function lerpColor(a, b, t) {
  const ar = (a>>16)&0xff, ag = (a>>8)&0xff, ab = a&0xff
  const br = (b>>16)&0xff, bg = (b>>8)&0xff, bb = b&0xff
  return ((Math.round(ar+(br-ar)*t)<<16)|(Math.round(ag+(bg-ag)*t)<<8)|Math.round(ab+(bb-ab)*t))
}
function shuffle(arr) {
  for (let i = arr.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]] }
  return arr
}
let flashTimer = null
function screenFlash(color) {
  const f = document.getElementById('flash')
  f.style.background = color; f.style.opacity = '1'
  clearTimeout(flashTimer); flashTimer = setTimeout(() => { f.style.opacity = '0' }, 80)
}

// ═══════════════════════════════════════════════════════════
//  RDE Layer 3 — Responsive Display Engine for DOM HUD & Quiz
// ═══════════════════════════════════════════════════════════
// Wires window.RZ runtime into the DOM-based HUD + math quiz overlay so
// their fontSize/min-width track viewport scale. Falls back silently if
// the runtime script failed to load.
function applyRdeScaling() {
  if (!window.RZ) return
  const q = (sel) => document.querySelector(sel)
  const set = (el, prop, val) => { if (el) el.style[prop] = (typeof val === 'number' ? val + 'px' : val) }
  // HUD top — distance, position badge, speed, lives, train name
  set(q('#distance-text'), 'fontSize', window.RZ.fontScale(13))
  set(q('#position-badge'), 'fontSize', window.RZ.fontScale(17))
  set(q('#speed-hud'), 'fontSize', window.RZ.fontScale(12))
  set(q('#lives-hud'), 'fontSize', window.RZ.fontScale(20))
  set(q('#train-name-badge'), 'fontSize', window.RZ.fontScale(13))
  // Math quiz overlay — label, question, buttons
  set(q('#quiz-label'), 'fontSize', window.RZ.fontScale(11))
  set(q('#quiz-q'), 'fontSize', window.RZ.fontScale(26))
  document.querySelectorAll('.quiz-btn').forEach(b => {
    b.style.fontSize = window.RZ.fontScale(20) + 'px'
    b.style.minWidth = window.RZ.btn('sm') + 'px'
  })
}

;(async function boot() {
  document.addEventListener('touchstart', ensureAudio, {once:true})
  document.addEventListener('click', ensureAudio, {once:true})
  await initPixi()
  showCategories()
  if (window.RZ) window.RZ.onResize(applyRdeScaling)
  // v54.27 I3: do NOT show daily spin on boot — it blocks first-touch UX

  // v54.24 G13 + G8: Word-of-the-day banner + greeting hook.
  // v54.25 H9: Garage pre-select. If sessionStorage carries a chosen train, jump to picker pre-selected.
  try {
    if (window.TrainShared) {

      // painterly HUD ticket at the top and clutters the clean look (TTS already off).
      // TrainShared.wordOfDay.showBanner()
      const garageKey = sessionStorage.getItem('garageTrainKey')
      if (garageKey) {
        sessionStorage.removeItem('garageTrainKey')
        // Find and select the train in TRAIN_MAP
        const t = TRAIN_MAP[garageKey]
        if (t) { S.trainCfg = { ...t, category: t.category, variant: 1 }; window.selectedTrainKey = t.key; document.getElementById('train-name-badge').textContent = t.name }
      }
      TrainShared.greeting.onEnterGame('g14', S.trainCfg && S.trainCfg.key)
    }
  } catch(_){}
})()

  var CHAR_POOL = ['aeg_thomas','aeg_percy','aeg_james','aeg_gordon','aeg_emily','aeg_hiro','aeg_edward','aeg_henry'];
  function visFromTrain (t) {
    if (!t) return { name:'Kereta', spriteUrl:null, emoji:'🚂', faces:'right' };
    // carry `faces` so the racing scene can mirror left-facing sprites → face RIGHT
    // (the travel direction), exactly like the Adventure renderer does.
    return { name: t.name || 'Kereta', spriteUrl: t.spriteUrl || null, emoji: t.emoji || '🚂', faces: t.faces || 'right' };
  }
  function visFromKey (key) { try { if (key && typeof TRAIN_MAP !== 'undefined' && TRAIN_MAP[key]) return visFromTrain(TRAIN_MAP[key]); } catch (_) {} return { name:'Kereta', spriteUrl:null, emoji:'🚂' }; }
  function selectedVis () { try { if (typeof S !== 'undefined' && S && S.trainCfg) return visFromTrain(S.trainCfg); } catch (_) {} return visFromKey('aeg_thomas'); }
  function selectedKey () { try { if (typeof S !== 'undefined' && S && S.trainCfg && S.trainCfg.key) return S.trainCfg.key; } catch (_) {} try { if (window.selectedTrainKey) return window.selectedTrainKey; } catch (_) {} return null; }
  function distinctVis (used, n) {
    var out = [], i;
    for (i = 0; i < CHAR_POOL.length && out.length < n; i++) { if (used.indexOf(CHAR_POOL[i]) === -1) { used.push(CHAR_POOL[i]); out.push(visFromKey(CHAR_POOL[i])); } }
    while (out.length < n) out.push(visFromKey('aeg_thomas'));
    return out;
  }
  function trainNode (vis) {
    // wrapper handles positioning + boost/grab/slow animations + player neon; the
    // inner sprite carries the horizontal mirror so facing never drops mid-animation.
    var w = el('div', 'gvs-train');
    var faceL = !!(vis && vis.faces === 'left');
    var inner;
    if (vis && vis.spriteUrl) {
      inner = el('img', 'gvs-tsprite'); inner.src = vis.spriteUrl; inner.alt = vis.name || 'kereta';

        w.classList.add('emoji', 'faceL');   // 🚂 emoji faces left → mirror to face right
        var s = el('span', 'gvs-tsprite'); s.textContent = (vis && vis.emoji) || '🚂';
        if (inner.parentNode) inner.parentNode.replaceChild(s, inner);

    } else {
      w.classList.add('emoji'); faceL = true;   // 🚂 emoji natively faces left
      inner = el('span', 'gvs-tsprite'); inner.textContent = (vis && vis.emoji) || '🚂';

  }

  // ── PvP flow ────────────────────────────────────────────────────────────
  function startPvPFlow () {
    askNames(2, { title: '👥 PvP 1 vs 1', cta: 'Mulai PvP →' }, function (names) {
      var used = []; var k = selectedKey(); if (k) used.push(k);
      var p1v = selectedVis();
      var p2v = distinctVis(used.slice(), 1)[0];

        { name: names[0] || 'P1', vis: p1v },
        { name: names[1] || 'P2', vis: p2v },
        names
      );
    });
  }

    runMatch({ p1: p1, p2: p2, label: 'PvP 1 vs 1' }, function (winner, host) {

        title: winner.name + ' Menang!',
        buttons: [
          { label: '▶ Main Lagi', pal: CLAY.go, cb: function () { host.remove(); runStandaloneMatch(p1, p2, names); } },
          { label: '⟲ Ganti Mode', pal: CLAY.pvp, cb: function () { host.remove(); resumeScene(); showModeModal(); } },

    for (i = 0; i < entrants.length; i += 2) {

    }
    var winners = byes.slice();
    var idx = 0;
    function playNext () {
      if (idx >= queue.length) { runRound(winners, allNames); return; }
      bracketScreen(queue, idx, byes, function () {
        var m = queue[idx];
        runMatch({ p1: m[0], p2: m[1], label: 'Match ' + (idx + 1) }, function (winner, host) {
          winners.push(winner.side === 'p1' ? m[0] : m[1]);

  }

      + '<div class="gvs-bracket">' + rows + '</div>'

    document.body.appendChild(host);

  function championScreen (winner, allNames) {

        { label: '✖ Keluar', pal: CLAY.rose, cb: function () { host.remove(); closeToPicker(); } }
