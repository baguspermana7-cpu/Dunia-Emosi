*{margin:0;padding:0;box-sizing:border-box}

/* ── HUD ── */
/* v54.5 — WCAG AA: floored gradient opacity (0.72→0.85) + min tap-target 44px on #btn-back. */
/* A-311 — soft-pastel HUD (cream rounded cards) for the bright Indonesian scene. */
#hud-top{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:8px;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));background:linear-gradient(180deg,rgba(255,250,240,0.5) 0%,rgba(255,250,240,0.1) 72%,transparent 100%);pointer-events:none}
#btn-back{background:#fffdf6;border:2px solid rgba(245,158,11,0.55);border-radius:16px;color:#5a3a08;padding:10px 14px;font-size:14px;cursor:pointer;font-family:inherit;pointer-events:all;flex-shrink:0;box-shadow:0 4px 10px rgba(0,0,0,0.14);font-weight:900;min-width:96px;min-height:44px;text-align:center}
#btn-back:active{transform:translateY(2px);box-shadow:0 2px 5px rgba(0,0,0,0.14)}
#btn-pause{min-width:44px;min-height:44px;padding:8px 12px!important;font-size:18px!important;background:#fffdf6!important;border:2px solid rgba(167,139,250,0.45)!important;border-radius:14px!important;color:#4a3a5e!important;box-shadow:0 4px 10px rgba(0,0,0,0.12)}
#train-name-badge{background:#fffdf6;border:1.5px solid rgba(167,139,250,0.4);border-radius:14px;padding:6px 12px;color:#4a3a5e;font-size:13px;font-weight:800;flex-shrink:0;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,0.1)}
#race-info{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px}
#distance-text{font-size:13px;color:#3f6342;font-weight:800;background:#fffdf6;border-radius:12px;padding:3px 14px;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
#position-badge{font-size:15px;font-weight:900;color:#5a3a08;background:rgba(255,253,246,0.9);border-radius:10px;padding:1px 10px;box-shadow:0 2px 5px rgba(0,0,0,0.08)}
#lives-hud{font-size:20px;letter-spacing:1px;flex-shrink:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.22))}
#speed-hud{background:#eaf6fb;border:1.5px solid rgba(125,211,252,0.55);border-radius:14px;padding:6px 12px;color:#2b6cb0;font-size:12px;font-weight:800;flex-shrink:0;white-space:nowrap;min-width:56px;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,0.1)}

/* Progress strip */
#prog-strip{position:fixed;top:56px;left:0;right:0;z-index:49;height:4px;background:rgba(255,255,255,0.08)}
#prog-fill{height:100%;background:linear-gradient(90deg,#86efac,#22d3ee);transition:width .2s;width:0%}

/* Checkpoints */
#cp-row{position:fixed;top:60px;left:0;right:0;z-index:48;display:flex;justify-content:space-around;pointer-events:none;padding:0 10%}
.cp-dot{font-size:14px;opacity:0.35;transition:opacity .3s,transform .3s}
.cp-dot.reached{opacity:1;transform:scale(1.4)}

/* Bottom controls */
#ctrl-area{position:fixed;bottom:0;left:0;right:0;z-index:50;padding:10px 14px 14px;background:linear-gradient(0deg,rgba(0,0,0,0.78) 0%,transparent 100%)}
#ctrl-row{display:flex;gap:10px;align-items:stretch}
/* v55.41 B-228 — soft glossy jelly buttons (owner reference). Thick cream ring,
   glossy top→bottom gradient, specular shine dots, soft diffused shadow. */
.ctrl-btn{flex:1;padding:16px 0;border-radius:24px;border:4px solid rgba(255,255,255,0.92);color:#fff;font-size:24px;font-weight:900;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .08s,box-shadow .12s;font-family:inherit;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,0.18),inset 0 2px 5px rgba(255,255,255,0.45),inset 0 -5px 9px rgba(0,0,0,0.12)}
.ctrl-btn::after{content:'';position:absolute;top:9px;right:13px;width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,0.9);box-shadow:15px 5px 0 -4px rgba(255,255,255,0.72);pointer-events:none}
.ctrl-btn:active{transform:translateY(2px) scale(.97);box-shadow:0 4px 10px rgba(0,0,0,0.18),inset 0 2px 5px rgba(255,255,255,0.4)}
/* v55.45 B-234 — pastel soft-calm nav, up ≠ down (was both blue). */
#btn-up{background:linear-gradient(180deg,#e0f7ec,#b7ead0 55%,#95dcbb);color:#1f5b42}
#btn-dn{background:linear-gradient(180deg,#fff0e3,#ffd9bd 55%,#ffc6a0);color:#8a4a26}
#btn-boost{background:linear-gradient(180deg,#ff8a65,#ff7043 55%,#f4511e)}
#btn-boost{background:linear-gradient(135deg,rgba(251,191,36,0.35),rgba(249,115,22,0.35));border-color:rgba(251,191,36,0.6);flex:1.4;font-size:14px;padding:14px 6px;line-height:1.2;color:#fef3c7;box-shadow:0 3px 0 rgba(146,64,14,0.3);position:relative;overflow:hidden;--boost-pct:0deg}
#btn-boost.cooldown{opacity:0.55;pointer-events:none}
/* v56.6 C3 B-287 — BOOST readiness affordance */
#btn-boost.g14-boost-ready{animation:g14BoostReady 1.4s ease-in-out infinite}
@keyframes g14BoostReady{0%,100%{box-shadow:0 3px 0 rgba(146,64,14,0.3)}50%{box-shadow:0 3px 0 rgba(146,64,14,0.3),0 0 18px rgba(251,191,36,0.75)}}
.g14-boost-siap{position:absolute;top:-9px;right:8px;font-size:9px;font-weight:900;color:#7c2d12;background:linear-gradient(180deg,#fde68a,#fbbf24);border-radius:8px;padding:1px 6px;letter-spacing:.4px;box-shadow:0 2px 5px rgba(0,0,0,0.25);pointer-events:none}
@media (prefers-reduced-motion: reduce){#btn-boost.g14-boost-ready{animation:none}}
/* v54.0 (concern 9): cooldown circular arc — conic-gradient sweeping from
   100% → 0% over 3s while boost regenerates. --boost-pct is JS-driven. */
#btn-boost.cooldown::before{content:'';position:absolute;inset:-2px;border-radius:inherit;background:conic-gradient(from -90deg,rgba(251,191,36,0.55) var(--boost-pct),rgba(0,0,0,0) var(--boost-pct));pointer-events:none;z-index:0;mask:radial-gradient(circle,transparent 64%,#000 65%);-webkit-mask:radial-gradient(circle,transparent 64%,#000 65%)}
#btn-boost > *{position:relative;z-index:1}
#btn-boost.boosting{background:linear-gradient(135deg,rgba(239,68,68,0.6),rgba(251,146,60,0.6));animation:boostGlow .25s ease-in-out infinite alternate}
@keyframes boostGlow{to{box-shadow:0 0 18px rgba(251,146,60,0.7)}}

/* ── v54.17 — G14 Race Polish ── */

/* A1: 3-2-1-GO countdown overlay */
#g14-countdown{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(15,23,42,0.55) 0%,rgba(15,23,42,0.85) 70%);backdrop-filter:blur(2px);pointer-events:none}
#g14-countdown.show{display:flex}
#g14-countdown-num{font-family:'Fredoka One',cursive;font-size:clamp(120px,30vmin,220px);font-weight:900;color:#fbbf24;text-shadow:0 0 32px rgba(251,191,36,0.7),0 8px 24px rgba(0,0,0,0.7);animation:g14CountPop 700ms cubic-bezier(.34,1.56,.64,1);line-height:1}
#g14-countdown-num.go{color:#86efac;text-shadow:0 0 36px rgba(134,239,172,0.85),0 8px 24px rgba(0,0,0,0.7);animation:g14CountGo 600ms ease-out}
@keyframes g14CountPop{0%{transform:scale(0.2);opacity:0}40%{transform:scale(1.25);opacity:1}70%{transform:scale(0.95);opacity:1}100%{transform:scale(1);opacity:0.95}}
@keyframes g14CountGo{0%{transform:scale(0.3) rotate(-6deg);opacity:0}30%{transform:scale(1.4);opacity:1}100%{transform:scale(2.4);opacity:0}}

/* A2: Lane indicator pip column */
#g14-lane-pips{position:fixed;left:max(12px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.g14-pip{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.18);border:1.5px solid rgba(255,255,255,0.35);transition:all 200ms ease}
.g14-pip.active{background:#22d3ee;border-color:#a5f3fc;box-shadow:0 0 12px rgba(34,211,238,0.7);transform:scale(1.45)}
.g14-pip.switching{animation:g14PipPulse 300ms ease-out}
@keyframes g14PipPulse{0%{box-shadow:0 0 0 0 rgba(34,211,238,0.6)}100%{box-shadow:0 0 0 14px rgba(34,211,238,0)}}

/* A3: Near-miss floating text */
.g14-nearmiss{position:fixed;z-index:60;font-family:'Fredoka One',cursive;font-size:18px;font-weight:900;color:#f472b6;text-shadow:0 2px 8px rgba(0,0,0,0.6),0 0 12px rgba(244,114,182,0.7);pointer-events:none;animation:g14NearmissRise 900ms cubic-bezier(.34,1.56,.64,1) forwards;white-space:nowrap}
@keyframes g14NearmissRise{0%{transform:translateY(0) scale(0.6);opacity:0}25%{transform:translateY(-12px) scale(1.15);opacity:1}100%{transform:translateY(-60px) scale(0.95);opacity:0}}

/* A4: Heart loss animation */
.g14-heart-pop{position:fixed;font-size:26px;z-index:55;pointer-events:none;animation:g14HeartPop 700ms ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,0.5)}
@keyframes g14HeartPop{0%{transform:scale(1) translateY(0);opacity:1;color:#f87171;filter:none}30%{transform:scale(1.6) translateY(-8px);opacity:1;color:#ef4444;filter:drop-shadow(0 0 12px #ef4444)}100%{transform:scale(0.5) translateY(-40px);opacity:0;color:#ef4444;filter:grayscale(1)}}

/* A5: Gap-to-next position chip */
#g14-position-gap{font-size:11px;font-weight:700;color:rgba(255,255,255,0.75);text-shadow:0 1px 2px rgba(0,0,0,0.6);margin-top:1px;min-height:13px}

/* A6: Low-fuel siren border */
#hud-top.g14-low-fuel{animation:g14LowFuel 1s ease-in-out infinite}
@keyframes g14LowFuel{0%,100%{box-shadow:inset 0 0 0 2px rgba(239,68,68,0)}50%{box-shadow:inset 0 0 24px 2px rgba(239,68,68,0.5)}}

/* A10: Milestone banner */
/* v55.97 B-283 — responsive: clamp font + sit clear below the HUD ticket on short
   landscape (was fixed 32px at top:30% → collided with the "Part N/30" banner). */
.g14-milestone{position:fixed;top:clamp(76px,30%,38%);left:50%;transform:translate(-50%,0);z-index:65;font-family:'Fredoka One',cursive;font-size:clamp(18px,4.6vw,32px);font-weight:900;color:#fde047;text-shadow:0 0 18px rgba(253,224,71,0.7),0 4px 12px rgba(0,0,0,0.6);padding:7px clamp(14px,3vw,22px);background:linear-gradient(135deg,rgba(0,0,0,0.65),rgba(15,23,42,0.55));border:2px solid #fde047;border-radius:20px;pointer-events:none;animation:g14MilestonePop 1400ms cubic-bezier(.34,1.56,.64,1) forwards;white-space:nowrap;max-width:88vw}
@keyframes g14MilestonePop{0%{transform:translate(-50%,20px) scale(0.4) rotate(-3deg);opacity:0}18%{transform:translate(-50%,-6px) scale(1.2) rotate(2deg);opacity:1}30%{transform:translate(-50%,0) scale(1) rotate(0);opacity:1}78%{transform:translate(-50%,0) scale(1);opacity:1}100%{transform:translate(-50%,-30px) scale(0.85);opacity:0}}

/* A12: Confetti for P1 finish */
.g14-confetti{position:fixed;top:-20px;width:8px;height:14px;z-index:80;pointer-events:none;border-radius:2px;animation:g14ConfettiFall 2.4s linear forwards}
@keyframes g14ConfettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:0}10%{opacity:1}100%{transform:translateY(108vh) rotate(720deg);opacity:0.6}}

/* ── v54.19 — G14 Race Depth ── */

/* B3: Mini-station checkpoint cinematic */
.g14-station-cinema{position:fixed;left:50%;top:25%;transform:translateX(-50%);z-index:65;font-family:'Fredoka One',cursive;color:#fff;text-shadow:0 0 12px rgba(251,191,36,0.7),0 4px 14px rgba(0,0,0,0.6);pointer-events:none;animation:g14StationPop 1.4s cubic-bezier(.34,1.56,.64,1) forwards;text-align:center}
.g14-station-cinema .gsc-arch{font-size:42px;margin-bottom:2px;filter:drop-shadow(0 0 14px rgba(253,224,71,0.7))}
.g14-station-cinema .gsc-name{font-size:22px;letter-spacing:1.5px}
.g14-station-cinema .gsc-sub{font-size:12px;opacity:0.85;letter-spacing:1px;margin-top:2px}
@keyframes g14StationPop{0%{opacity:0;transform:translate(-50%,30px) scale(0.6)}25%{opacity:1;transform:translate(-50%,-6px) scale(1.08)}75%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-18px) scale(0.95)}}

/* B7: Photo-mode share button */
.g14-share-fab{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:9999;padding:14px 22px;border-radius:18px;border:0;background:linear-gradient(135deg,#f472b6,#a855f7);color:#fff;font-family:'Fredoka One',cursive;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #6b21a8,0 10px 24px rgba(168,85,247,0.45);text-shadow:0 1px 2px rgba(0,0,0,0.4);display:none}
.g14-share-fab.show{display:block;animation:g14SharePop 600ms cubic-bezier(.34,1.56,.64,1) forwards}
.g14-share-fab:active{transform:translateX(-50%) translateY(3px);box-shadow:0 3px 0 #6b21a8}
@keyframes g14SharePop{0%{opacity:0;transform:translateX(-50%) translateY(20px) scale(0.6)}60%{opacity:1;transform:translateX(-50%) translateY(-4px) scale(1.05)}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}

/* B8 + v54.27 I5: anchored LEFT (was RIGHT, covered BOOST button) */
#g14-mini-quiz{position:fixed;left:max(56px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);z-index:210;width:min(240px,40vw);background:linear-gradient(135deg,rgba(15,23,42,0.96),rgba(45,12,75,0.92));border:2px solid #fbbf24;border-radius:18px;padding:12px;font-family:'Fredoka One',cursive;color:#fff;box-shadow:0 12px 36px rgba(0,0,0,0.6);display:none}
#g14-mini-quiz.show{display:block;animation:g14MiniIn 280ms cubic-bezier(.34,1.56,.64,1)}
@keyframes g14MiniIn{0%{opacity:0;transform:translateY(-50%) translateX(-40px)}100%{opacity:1;transform:translateY(-50%) translateX(0)}}
/* v55.97 M-303 — question + pills owned by shared quiz-engine.js (.qz-*). Mini panel
   only shrinks the shared gold question to fit the 240px chip. */
#g14-mini-quiz .qz-question{font-size:20px;margin-bottom:10px}

/* B10: Dynamic kmh needle gauge */
#g14-speed-needle{display:inline-block;width:44px;height:24px;position:relative;vertical-align:middle;margin-left:4px}
#g14-speed-needle .gsn-arc{position:absolute;inset:0;border-radius:24px 24px 0 0;background:conic-gradient(from 225deg,#22d3ee 0deg,#86efac calc(90deg * var(--gns,0)),rgba(255,255,255,0.08) calc(90deg * var(--gns,0)));mask:radial-gradient(circle at 50% 100%,transparent 0,transparent 11px,#000 12px,#000 22px,transparent 23px);-webkit-mask:radial-gradient(circle at 50% 100%,transparent 0,transparent 11px,#000 12px,#000 22px,transparent 23px)}
#g14-speed-needle .gsn-needle{position:absolute;left:50%;bottom:2px;width:2px;height:18px;background:#fff;border-radius:1px;transform-origin:50% 100%;transform:rotate(calc((var(--gns,0) - 0.5) * 90deg));transition:transform 200ms}
#g14-speed-needle.boost .gsn-arc{box-shadow:0 0 12px rgba(251,191,36,0.7)}

/* B11: Replay-the-crash vignette */
#g14-crash-replay{position:fixed;inset:0;z-index:240;display:none;background:radial-gradient(circle,transparent 30%,rgba(120,0,0,0.85));backdrop-filter:blur(2px);pointer-events:none}
#g14-crash-replay.show{display:block;animation:g14ReplayFade 2200ms ease-out forwards}
#g14-crash-replay-label{position:absolute;top:14%;left:50%;transform:translateX(-50%);font-family:'Fredoka One',cursive;color:#fff;font-size:18px;letter-spacing:2px;text-shadow:0 0 12px rgba(255,60,60,0.8),0 4px 14px rgba(0,0,0,0.6)}
@keyframes g14ReplayFade{0%{opacity:0}10%{opacity:1}90%{opacity:1}100%{opacity:0}}

/* B12: Mode Belajar badge */
#g14-kid-mode-badge{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;padding:5px 14px;border-radius:14px;background:linear-gradient(135deg,#86efac,#22d3ee);color:#0c4a6e;font-family:'Fredoka One',cursive;font-size:12px;letter-spacing:1px;font-weight:900;box-shadow:0 4px 12px rgba(34,211,238,0.45);pointer-events:none;display:none}
#g14-kid-mode-badge.show{display:block;animation:g14KidBadge 600ms ease-out}
@keyframes g14KidBadge{0%{opacity:0;transform:translateX(-50%) translateY(-12px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}

/* v55.61 B-253 — Daily login spin ("Roda Harian") removed per owner request. */

/* Pressure gauge */
#pressure-row{display:flex;align-items:center;gap:8px;margin-top:8px}
#pressure-label{font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:1px;flex-shrink:0}
#pressure-track{flex:1;height:6px;background:rgba(255,255,255,0.1);border-radius:3px}
#pressure-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#22d3ee,#86efac);transition:width .3s}
#pressure-pct{font-size:10px;color:rgba(255,255,255,0.5);flex-shrink:0;min-width:28px;text-align:right}

/* ── Math Quiz overlay ── */
#quiz-ovl{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(5,12,2,0.97);backdrop-filter:blur(10px);border-top:3px solid #ef4444;padding:14px 16px 20px;display:none}
#quiz-label{text-align:center;color:rgba(251,191,36,0.8);font-size:11px;font-weight:700;letter-spacing:2px;margin-bottom:6px}
/* v55.97 B-282/M-303 — quiz styling now owned by the SHARED games/quiz-engine.js
   (.qz-question + .qz-pill). Keep only the choices-row layout slot here. */
#quiz-choices{display:flex;gap:8px;justify-content:center}

/* Overlays handled by game-modal.js */

/* ── Train Select — soft palette ── */
#select-ovl{position:fixed;inset:0;z-index:400;background:linear-gradient(180deg,#1a1028 0%,#2a1848 40%,#1e1230 70%,#140e22 100%);display:flex;flex-direction:column;overflow:hidden}
#select-header{padding:14px 16px 8px;display:flex;align-items:center;gap:10px;flex-shrink:0}
#sel-back{background:rgba(248,240,255,0.9);border:2px solid rgba(180,160,220,0.5);border-radius:12px;color:#3b2066;padding:10px 14px;font-size:14px;cursor:pointer;font-family:inherit;box-shadow:0 3px 0 rgba(100,60,160,0.2);font-weight:900;min-width:100px;min-height:44px;text-align:center}
#sel-back:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(100,60,160,0.2)}
#sel-title{font-size:16px;font-weight:900;color:#c4b5fd;flex:1;text-align:center}
#select-body{flex:1;overflow-y:auto;padding:8px 14px 20px;-webkit-overflow-scrolling:touch}
/* v55.37 B-218 — picker cards harmonized across g14/g15/g16. Dark-mode
   surface, lavender border default, purple accent on selected, same
   active scale + shadow shape. Matches g15 .tcard + g16 .ts-card. */
.cat-btn{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:44px;border-radius:16px;cursor:pointer;margin-bottom:10px;text-align:left;border:2.5px solid rgba(167,139,250,0.25);transition:transform .08s,border-color .15s,background .15s;background:rgba(248,240,255,0.06);color:#e9d5ff;font-family:inherit;font-weight:700}
.cat-btn:active{transform:scale(.97);background:rgba(139,92,246,0.18);border-color:#a78bfa}
.cat-emoji{font-size:32px;flex-shrink:0}
/* v59.x — CATEGORY THUMBNAIL. Owner: "saat pemilihan itu jangan pakai emoji, pakai
   gambar salah satu kereta — misal picker thomas aeg, itu pakai gambar thomas".
   .cat-emoji is a bare text slot with NO width, so the picture needs its own box.
   Sizing follows g15's idiom (max-width/max-height + object-fit:contain) because

<script>
function g14LaunchSideRace() {
  // v55.9 — Read picker selection robustly (closes B-206). The picker click
  // handler sets S.trainCfg.key as primary path; window.selectedTrainKey is
  // exposed as a fallback. Previously this raised "Pilih kereta dulu ya!" even
  // when a train WAS selected because neither global was checked first.
  let key = null
  try {
    if (typeof S !== 'undefined' && S && S.trainCfg && S.trainCfg.key) key = S.trainCfg.key
    else if (window.selectedTrainKey) key = window.selectedTrainKey
  } catch (e) {}
  if (!key) {
    const active = document.querySelector('.train-card.active') || document.querySelector('.train-card.sel') || document.querySelector('.train-card[data-active="true"]')
    if (active && active.dataset && active.dataset.trainKey) key = active.dataset.trainKey
  }
  if (!key) {
    alert('Pilih kereta dulu ya! 🚂')
    return
  }
  sessionStorage.setItem('g14-side-train', key)
  try { localStorage.setItem('dunia_side_train', key) } catch (e) {}  // A-347 durable
  location.href = 'balapan-kereta-side.html'
}
</script>
<script>
// v54.69 — Easy/Hard mode toggle integration with ObstacleEngine.
function g14ToggleMode(){
  if (!window.ObstacleEngine) return
  const cur = window.ObstacleEngine.getMode()
  const next = cur === 'easy' ? 'hard' : 'easy'
  window.ObstacleEngine.setMode(next)
  g14RefreshModeBadge()
}
function g14RefreshModeBadge(){
  if (!window.ObstacleEngine) return
  const m = window.ObstacleEngine.getMode()
  const icon = document.getElementById('g14-mode-icon')
  const label = document.getElementById('g14-mode-label')
  const btn = document.getElementById('g14-mode-toggle')
  if (m === 'easy') {
    if (icon) icon.textContent = '😊'
    if (label) label.textContent = 'Mudah'
    if (btn) {
      btn.style.background = 'rgba(254,240,138,0.92)'
      btn.style.borderColor = 'rgba(202,138,4,0.6)'
      btn.style.color = '#713f12'
      btn.style.boxShadow = '0 3px 0 rgba(202,138,4,0.25)'
    }
  } else {
    if (icon) icon.textContent = '🔥'
    if (label) label.textContent = 'Sulit'
    if (btn) {
      btn.style.background = 'rgba(254,202,202,0.92)'
      btn.style.borderColor = 'rgba(220,38,38,0.6)'
      btn.style.color = '#7f1d1d'
      btn.style.boxShadow = '0 3px 0 rgba(220,38,38,0.25)'
    }
  }
}
// Refresh badge on load once engine is present
(function pollEngine(){
  if (window.ObstacleEngine) { g14RefreshModeBadge(); g14RefreshAgeButtons(); g14RefreshHCBadge(); return }
  setTimeout(pollEngine, 100)
})();

// v54.75 — Age picker (4/5/6/7) and high-contrast accessibility toggle.
function g14SetAge(a){
  if (!window.ObstacleEngine) return
  window.ObstacleEngine.setAgePreset(a)
  g14RefreshAgeButtons()
}
function g14RefreshAgeButtons(){
  if (!window.ObstacleEngine) return
  const cur = window.ObstacleEngine.getAgePreset()
  document.querySelectorAll('.g14-age-btn').forEach(b => {
    if (b.dataset.age === cur) b.classList.add('active')
    else b.classList.remove('active')
  })
}
function g14ToggleHighContrast(){
  if (!window.ObstacleEngine) return
  const cur = window.ObstacleEngine.getHighContrast()
  window.ObstacleEngine.setHighContrast(!cur)
  g14RefreshHCBadge()
}
function g14RefreshHCBadge(){
  if (!window.ObstacleEngine) return
  const on = window.ObstacleEngine.getHighContrast()
  const btn = document.getElementById('g14-hc-toggle')
  const label = document.getElementById('g14-hc-label')
  if (label) label.textContent = on ? 'Kontras' : 'Standar'
  if (btn) {
    btn.style.background = on ? 'rgba(250,204,21,0.92)' : 'rgba(255,255,255,0.12)'
    btn.style.borderColor = on ? '#000' : 'rgba(255,255,255,0.3)'
    btn.style.color = on ? '#000' : '#fff'
  }
}
</script>

// v55.45 B-232 — single uniform rendered height for EVERY character train (player
// + AI). Replaces the per-sprite spriteHeight×1.35 that produced 97-232px variance.
// Aspect ratio is preserved by scaling both axes uniformly (UNIFORM_H / tex.height).
// A-311 — responsive: recomputed from the live viewport in initPixi/resize so the
// train scales to ANY device (phone/tablet/desktop). Default until init runs.
let G14_UNIFORM_H = 120
// v55.67 B-259 — RESPONSIVE TRAIN-SIZING ENGINE. Owner: "dragutin dkk terlalu over,
// pakai method % sehingga dimensi tetap thp luasan layar." The old code scaled by
// HEIGHT ONLY (scale = targetH/tex.height), so width = targetH × aspect → a wide
// articulated train (Dragutin/JZ-711, slip coaches, aspect 4-6×) spanned the whole
// screen. Now every train is fit INSIDE a screen-%-relative bounding box and scaled
// by the LIMITING dimension — wide trains are bounded by width, compact ones by
// height, all proportional to the viewport at any size. ONE source of truth.
function g14TrainScale(tex) {
  const W = app.screen.width, H = app.screen.height
  // v55.8x A-312 — UNIFIED sizing. ONE source of truth: target the single laneH-derived
  // G14_UNIFORM_H so the loco fills its lane and reads as the focus (≈1.45× laneH tall,
  // wheels on the rail via the 0.86 anchor, body grows UPWARD). Bounded by width so wide
  // articulated trains never span the screen. Aspect preserved (uniform scalar on both).
  // v55.85 — HEIGHT-LOCKED uniform sizing (owner: "dimensinya harus sama, presisi,
  // proportional, dynamic"). EVERY train renders at EXACTLY G14_UNIFORM_H tall (laneH-
  // derived → responsive), so player + NPC + every loco are the SAME height regardless of
  // their art aspect. The old min(h,w) let WIDE sprites (annie 4.33, henry 3.89) hit the
  // width cap → shorter than target. Wide trains now extend HORIZONTALLY at full height;
  // a LOOSE width clamp only catches an absurdly long articulated train so it never spans
  // the whole screen. Aspect preserved (uniform scalar on both axes).
  const tgtH = (typeof G14_UNIFORM_H !== 'undefined' && G14_UNIFORM_H) ? G14_UNIFORM_H : H * 0.14
  let s = tgtH / tex.height
  // v55.86 — LOOSE width clamp (0.86×W). On a WIDE tablet (the owner's device) a normal
  // loco never clamps → every train holds EXACTLY G14_UNIFORM_H (uniform). The clamp only
  // bites on a NARROW phone or a freakishly long articulated train so it can't span the
  // whole screen. Was 0.62×W — too tight on portrait phones (train couldn't reach height).
  const maxW = W * 0.86
  if (s * tex.width > maxW) s = maxW / tex.width
  return s
}
// v55.84 — ZERO-TOLERANCE wheel anchor. Each loco sprite's wheels sit at a DIFFERENT
// fraction down its art (measured offline → window.TRAIN_WHEEL_ANCHORS, keyed by file).
// Returning that ratio as anchor.y makes the wheels land EXACTLY on the lane Y for EVERY
// train (player + NPC) — the old fixed 0.86 sank the wheels ~0.19×laneH below the rail.
function g14WheelAnchor(spriteUrl) {
  try {
    const key = String(spriteUrl || '').split('/').pop()
    const m = window.TRAIN_WHEEL_ANCHORS
    if (m && key && typeof m[key] === 'number') return m[key]
  } catch (_) {}
  return 0.99   // fallback: wheels at the sprite bottom (measured mean)
}
// v55.88 — owner: "batas roda bawah/base gambar file itu pas di rail sisi bawah". The train's
// image BASE (wheels) sits EXACTLY on the lane's rail line (laneY) — no lift. (Was a 10%
// margin in v55.87; owner now wants the base dead-on the rail, like the obstacle's footing.)
function g14WheelMargin() {
  return 0
}
// v55.90 — ONE painted RAIL band == laneH. tools/detect-rail-lanes.py now snaps the 3 lanes onto
// 3 ADJACENT painted track beds, so laneH IS the track-bed pitch (the owner's "tinggi rail").
// Train = 1.1× this; obstacle = 1× this. (v55.88 used 0.70×laneH because the lanes were spread
// ~1.5 beds apart; now they sit one bed apart so the factor is 1.0.)
function g14RailUnit() {
  const lh = (typeof laneH !== 'undefined' && laneH) ? laneH : 60
  return Math.round(lh)
}
// v55.95 DIORAMA — CONTACT SHADOW: a soft flattened dark oval at the wheel/base line so a train
// or obstacle visibly "sits on" the ballast (pop-up/cardboard look) instead of floating. Added as
// the LOWEST child (behind the sprite). `_shadow` is kept so the width can be matched to the loaded
// sprite + scaled by lane depth. Owner concept #3 (grounding) — the key fix.
function g14ContactShadow(container, baseW) {
  const w = Math.max(28, baseW || 60)
  const sh = new PIXI.Graphics()
  sh.ellipse(0, 3, w * 0.5, Math.max(5, w * 0.12)).fill({ color: 0x07120a, alpha: 0.30 })
  sh._baseW = w
  container.addChildAt(sh, 0)
  container._shadow = sh
  return sh
}
// v55.87 — scale a PROCEDURAL train (PIXI.Graphics from drawTrainG) so its rendered height ==
// targetH (== G14_UNIFORM_H, the SAME as the player), then offset it so its drawn BOTTOM
// (wheels) sits at the local origin = the rail line. This is the fix for "npc kekecilan":
// NPCs were left at drawTrainG's raw ~58px while the player sprite was 329px. Aspect
// preserved (uniform scalar). faceSign preserved for any mirrored procedural art.
function g14FitProceduralToRail(g, targetH, faceSign) {
  if (!g || g.destroyed) return
  let lb
  try { lb = g.getLocalBounds() } catch (_) { return }
  if (!lb || lb.height <= 1) return
  const k = targetH / lb.height
  g.scale.set(k)
  if (faceSign === -1) g.scale.x = -k
  g.y = -(lb.y + lb.height) * k          // drawing bottom (wheels) → local 0 (the rail)
}
// v55.69 B-278 — PSEUDO-3D DEPTH CUES (OutRun-style). The 3 lanes read as a
// receding road: the TOP lane (index 0) is FAR, the BOTTOM lane (LANE_COUNT-1)
// is NEAR. g14LaneDepth returns a per-lane factor used to TAPER the rendered
// rail/sleeper width (Pole-Position) and SCALE the train sprites (near=bigger,
// far=smaller). Gameplay coords (laneYs, collisions) are NEVER touched — these
// only affect VISUAL width/scale, so on-rail alignment + hit-tests are intact.
function g14LaneDepth(ln) {
  const n = LANE_COUNT > 1 ? LANE_COUNT - 1 : 1
  return 0.78 + (ln / n) * 0.44            // far lane ~0.78 → near lane ~1.22 (rail/sleeper taper)
}
function g14SpriteDepth(ln) {
  // v55.87 — UNIFORM: owner "dimensinya harus SAMA" (player kebesaran, NPC kekecilan was the
  // real bug, but even the faint ±4% lane-depth broke strict equality). Return 1.0 so EVERY
  // train (player + NPC, all lanes) renders at EXACTLY G14_UNIFORM_H. The road-perspective
  // 3-D still comes from g14LaneDepth (rail/sleeper taper) + the parallax depth bands.
  void ln
  return 1.0
}
// Apply a train sprite's base scale × its lane depth, preserving the facing
// mirror (img.scale.x sign). Call on build + whenever the train changes lane.
function g14ApplyDepthScale(img, ln) {
  if (!img || img.destroyed || img._baseScale == null) return
  const d = g14SpriteDepth(typeof ln === 'number' ? ln : 1)
  const s = img._baseScale * d
  img.scale.set(s)
  img.scale.x = s * (img._faceSign || 1)
  // v55.95 DIORAMA — ATMOSPHERIC HAZE: far/top lane (ln 0) is tinted toward the biome haze colour
  // + slightly faded; near/bottom lane stays sharp+full. Reinforces the 3-D parallax (tint only —
  // no size/position change, so the v55.92/93 calibration is untouched).
  const n = LANE_COUNT > 1 ? LANE_COUNT - 1 : 1
  const far = 1 - Math.max(0, Math.min(1, (typeof ln === 'number' ? ln : 1) / n))   // 1=far/top, 0=near
  const amt = far * 0.32
  const haze = (typeof TH !== 'undefined' && TH.haze != null) ? TH.haze : 0xdfeaf2
  const lerp = (a, b, t) => Math.round(a + (b - a) * t)
  const r = lerp(0xff, (haze >> 16) & 0xff, amt), g = lerp(0xff, (haze >> 8) & 0xff, amt), b = lerp(0xff, haze & 0xff, amt)
  img.tint = (r << 16) | (g << 8) | b
  img.alpha = 1 - far * 0.12
}

// Per-level palette = base 'day' merged with this level's biome overrides.
// v55.71 A-312 — REFERENCE-ACCURATE per-level override. When a reference image
// was processed by tools/bg-ref-build.py, data/g14-journey/levelNN.json carries
// (a) a palette sampled from the photo and (b) a vector city-band SVG. The
// manifest is preloaded (g14LoadManifest) BEFORE the scene builds so the
// procedural sky/hills/ground match the reference colours exactly; the city band
// itself loads as one cached sprite (g14AddCityBand). All guarded — with NO
// manifest the level renders exactly as before (procedural biome + g14Landmark).
let G14_MANIFEST = null
async function g14LoadManifest() {
  G14_MANIFEST = null
  try {
    const lv = (cfg.level || 1)
    // index.json lists which levels HAVE a reference manifest → avoids a 404
    // (and the console-error it logs) on every level that has none.
    const idxRes = await fetch('../data/g14-journey/index.json', { cache: 'no-cache' })
    if (!idxRes.ok) return
    const idx = await idxRes.json()
    if (!idx || !Array.isArray(idx.levels) || idx.levels.indexOf(lv) < 0) return
    const url = '../data/g14-journey/level' + String(lv).padStart(2, '0') + '.json'
    const res = await fetch(url, { cache: 'no-cache' })
    if (!res.ok) return
    const j = await res.json()
    if (j && j.palette) {
      const p = {}
      for (const k in j.palette) {
        const v = j.palette[k]
        p[k] = (typeof v === 'string') ? parseInt(v, 16) : v   // "0x85bceb" → int
      }
      j._paletteInt = p
    }
    G14_MANIFEST = j
  } catch (_) { /* no manifest for this level → procedural fallback */ }
}
function g14Palette() {
  const IS = window.IndoScene
  if (!IS) return null
  const base = IS.palette('day')
  const ov = G14_BIOMES[g14Journey().biome] || {}
  // per-level reference palette (highest precedence) so colours track the photo
  const refOv = (G14_MANIFEST && G14_MANIFEST._paletteInt) || {}
  return Object.assign({}, base, ov, refOv)
}
// Grey tint derived from the current sky brightness so the city band darkens at
// night / warms with the sky instead of looking pasted-on.
function g14CityTint() {
  try {
    const sc = (typeof g14CurrentSkyColors === 'function') ? g14CurrentSkyColors() : null
    if (!sc) return 0xffffff
    const c = sc.skyBot, r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255
    const lum = Math.max(0.5, Math.min(1, (0.3 * r + 0.55 * g + 0.15 * b) / 255 + 0.12))
    const v = Math.round(lum * 255)
    return (v << 16) | (v << 8) | v
  } catch (_) { return 0xffffff }
}
// v55.71 A-312 — load the reference city-band SVG as ONE cached sprite (crisp
// vector → texture, single draw call). Static landmark behaviour; masked to the
// scenery band by the far container's mask. Fails safe (no asset → nothing).
async function g14AddCityBand(container, W, horizonY, railY, bandH) {
  try {
    if (!G14_MANIFEST || !G14_MANIFEST.cityband || !window.PIXI || !PIXI.Assets) return
    const url = '../' + G14_MANIFEST.cityband
    const tex = await PIXI.Assets.load(url)
    if (!tex || !container || container.destroyed) return
    const spr = new PIXI.Sprite(tex)
    spr.anchor.set(0.5, 1)                       // bottom-centre sits on the hills line
    const targetW = W * 1.04
    spr.width = targetW
    spr.height = targetW * (tex.height / tex.width)
    spr.x = W * 0.5
    spr.y = Math.min(railY - 2, horizonY + (railY - horizonY) * 0.66)
    spr.tint = g14CityTint()
    spr._speed = 0
    container.addChild(spr)
    L._cityBand = spr
  } catch (_) { /* asset missing/failed → scene already has the procedural base */ }
}

// ═══════════════════════════════════════════════════════════════════════════
//  v55.72 A-312 — PAINTERLY RASTER BACKDROP (A/B winner over vector: 163KB vs
//  6.4MB/14k-paths, and pixel-perfect vs posterised). When a level's manifest is
//  mode:'raster', the whole painted scene is ONE cover-fit Sprite behind
//  everything (1 draw call), the procedural sky/hills/rail VISUALS are skipped,
//  and the functional laneYs are aligned to the painting's rail band so the train
//  rides the painted rails. Guarded — no backdrop ⇒ procedural journey unchanged.
// ═══════════════════════════════════════════════════════════════════════════
function g14HasBackdrop() { return !!(G14_MANIFEST && G14_MANIFEST.mode === 'raster' && G14_MANIFEST.backdrop) }
// v55.86 — the plate SCENE region anchored into the play band. NOT the bare rail bed
// (that zoomed so hard it became a disorienting "wall of rails" with the lanes lost among
// identical tracks). Instead anchor from just ABOVE the horizon (so the skyline + fields
// stay visible as context) DOWN to the foreground → the 3 rail lanes group clearly in the
// lower band riding the painted rails, the train is prominent (~0.2-0.25·H), and the scene
// reads correctly. Uses the manifest's horizon/foreTop markers (per-plate), with fallbacks.
function g14RailFracs() {
  const m = G14_MANIFEST || {}
  const lr = (m.laneRatios && m.laneRatios.lanes) || [0.62, 0.74, 0.86]
  const horizon = (m.laneRatios && typeof m.laneRatios.horizon === 'number') ? m.laneRatios.horizon : (lr[0] - 0.16)
  const foreTop = (m.laneRatios && typeof m.laneRatios.foreTop === 'number') ? m.laneRatios.foreTop : (lr[lr.length - 1] + 0.06)
  // a touch of scene above the horizon (context) → foreground bottom. Clamped so the top
  // lane always stays inside the anchored region and the bottom rail reaches the band base.
  const railTopFrac = Math.max(0.02, Math.min(horizon - 0.12, lr[0] - 0.10))
  const railBotFrac = Math.min(0.99, Math.max(foreTop, lr[lr.length - 1] + 0.05))
  return { railTopFrac, railBotFrac }
}
// Rail-anchor config consumed by TrainBackdrop.fit (single source of truth for the fit
// math). playBand returns the live band so a resize/rotate re-zooms automatically.
function g14RailFit() {
  const fr = g14RailFracs()
  return {
    playBand: () => { const b = g14PlayBand(); return { bandTop: b.bandTop, bandBot: b.bandBot } },
    railTopFrac: fr.railTopFrac, railBotFrac: fr.railBotFrac,
  }
}
// RAIL-ANCHORED cover-fit (v55.86): delegates to the shared engine so the lanes (here) and
// the parallax bands (TrainBackdrop.mount) use IDENTICAL math → zero desync. The plate is
// zoomed so its painted rail bed fills the play band → prominent, proportional, on-rail
// train + lanes on portrait AND landscape. Falls back to plain cover-fit if the engine is
// unavailable. (No image needed — lane geometry is computed synchronously from aspect.)
function g14BackdropFit() {
  const W = app.screen.width, H = app.screen.height
  const asp = (G14_MANIFEST && G14_MANIFEST.backdrop && G14_MANIFEST.backdrop.aspect) || (16 / 9)
  if (window.TrainBackdrop && typeof TrainBackdrop.fit === 'function') {
    return TrainBackdrop.fit(app, asp, g14RailFit())
  }
  const scaledH = Math.max(H, W / asp), scaledW = scaledH * asp
  return { W, H, scaledW, scaledH, leftX: (W - scaledW) / 2, topY: (H - scaledH) / 2, asp }
}
// v55.8x A-312 — PLAY BAND. The owner's "kereta proper, on the rails, never under the
// HUD/controls": the 3 lanes + train live in a vertical band from just below the top HUD
// to just above the REAL control-bar height (read live from #ctrl-area). Everything
// (laneH, train, obstacle) derives from this band so it is fully responsive — no magic
// H% caps. Used IDENTICALLY by initPixi + the resize handler.
let _g14CtrlHCache = -1   // A-342 — cache ctrl-area height (only changes on resize).
function g14PlayBand() {
  const W = app.screen.width, H = app.screen.height
  // A-342 SMOOTHNESS — g14PlayBand runs PER FRAME (TrainBackdrop.fit → playBand()); the
  // old getBoundingClientRect() forced a synchronous layout every frame (~224ms/4s under
  // throttle = the "nyendat" hitching). Read the ctrl height ONCE and cache it until the
  // next resize (invalidated in the resize handler), eliminating the per-frame layout thrash.
  let ch = _g14CtrlHCache
  if (ch < 0) {
    const ctrl = document.getElementById('ctrl-area')
    ch = ctrl ? Math.round(ctrl.getBoundingClientRect().height) : 0
    if (ch > 24) _g14CtrlHCache = ch   // only cache a valid, laid-out height
  }
  const ctrlH = ch > 24 ? ch : Math.round(Math.min(H * 0.20, 150))   // fallback if not laid out yet
  const topHud = Math.round(Math.max(54, Math.min(H * 0.12, 104)))
  // tail = small reserve so the BOTTOM lane's loco (hangs ~0.2×charH below the wheel line)
  // always clears the control bar. Uses a PLAIN cover-fit scaledH — must NOT call
  // g14BackdropFit() here (it is rail-anchored FROM this band → infinite recursion).
  const asp = (G14_MANIFEST && G14_MANIFEST.backdrop && G14_MANIFEST.backdrop.aspect) || (16 / 9)
  const plainScaledH = Math.max(H, W / asp)
  const tail = Math.round(0.035 * plainScaledH + 12)
  return { W, H, ctrlH, bandTop: topHud, bandBot: H - ctrlH - tail }
}
// Place 3 lanes on the plate's painted rail bed (top lane anchored to the painted top
// rail lr[0]), then HARD-CLAMP the bottom lane to the band so it + its train never dip
// under the controls. Spacing fills evenly between the two. Returns laneYs (centres),
// laneH, railTop. When the plate fits (tall screens) the lanes land EXACTLY on the
// painted rails; on wide/short screens they compress upward off the lowest rail.
function g14BackdropLanes() {
  const b = g14PlayBand(), fit = g14BackdropFit()   // rail-anchored fit (v55.86)
  const lr = (G14_MANIFEST && G14_MANIFEST.laneRatios && G14_MANIFEST.laneRatios.lanes) || [0.56, 0.70, 0.84]
  // v55.92 — place EACH lane on its OWN calibrated painted rail (lr[0]=top, lr[1]=mid, lr[2]=
  // bottom) DIRECTLY — no even-interpolation, no perspective nudge.
  // v56.3 B-285 — the old BOTH-SIDED clamp here moved lanes off their painted rails on
  // ~18 deep-bottom levels (the plate wasn't moved with them) = the owner's "masih di
  // atas". The fit is now EXACT-MAP (train-backdrop.js): rails land inside the play band
  // by construction, so lanes are pure plate math. A SAFETY-ONLY bottom clamp remains
  // for the bottomAnchor fallback mode (never engages in exact mode — QA asserts this).
  const ys = lr.map(f => Math.round(Math.min(fit.topY + f * fit.scaledH, b.bandBot - 2)))
  // laneH = smaller adjacent gap (used only for depth/spacing cues now — NOT train size, which
  // is decoupled to a play-band fraction in v55.92).
  const lh = Math.max(38, Math.min(ys[1] - ys[0], ys[2] - ys[1]))
  return { laneYs: ys, laneH: lh, railTop: ys[0] - lh }
}
async function g14AddBackdrop() {
  try {
    const m = G14_MANIFEST
    if (!g14HasBackdrop() || !window.PIXI || !PIXI.Assets) return
    const fit = g14BackdropFit()
    const need = fit.W * Math.min(window.devicePixelRatio || 1, 2)
    const tiers = (m.backdrop.tiers || []).slice().sort((a, b) => a.w - b.w)
    let pick = tiers[tiers.length - 1]
    for (const t of tiers) { if (t.w >= need) { pick = t; break } }   // smallest tier ≥ device px
    if (!pick) return
    const tex = await PIXI.Assets.load('../' + pick.src)
    if (!tex || !stage) return

    // v55.77 — PARALLAX via the SHARED engine (games/train-backdrop.js): a clean plate
    // is sliced into horizontal DEPTH BANDS, each tiled 2× + scrolled at its own speed
    // (near fast, horizon slow) so the scene reads as MOVING. Same engine is reused by
    // lokomotif-pemberani + balapan-kereta-side. tickMid/resize/startRace drive the handle.
    if (m.clean && Array.isArray(m.bands) && m.bands.length && window.TrainBackdrop) {
      const handle = await TrainBackdrop.mount(stage, app, m, { assetBase: '../', insertIndex: 0, railFit: g14RailFit() })
      if (handle) {
        L._bdHandle = handle
        L._pBands = handle.bands   // kept for any legacy reads
        L._backdrop = handle.bg
        return
      }
      // mount failed → fall through to static sprite below
    }

    // static single sprite (non-clean mockup backdrops)
    const spr = new PIXI.Sprite(tex)
    spr.x = fit.leftX; spr.y = fit.topY; spr.width = fit.scaledW; spr.height = fit.scaledH
    spr._speed = 0
    stage.addChildAt(spr, 0)   // behind everything (gameplay sprites on top)
    L._backdrop = spr
  } catch (_) { /* backdrop load failed → blank bg; gameplay still runs */ }
}

// ── Landmark drawers (flat-fill silhouettes; cheap + batchable). Each returns a
//    PIXI.Container. Volcano-type carries _craterX/_craterY for the smoke plume;
//    all others leave them undefined so the volcano smoke stays off. ──
function g14Landmark(key, W, baseY, pal, h) {
  const IS = window.IndoScene
  if (!key || key === 'none') { const e = new PIXI.Container(); return e }
  if (key === 'volcano') return IS.volcano(W, baseY, pal, h)
  const C = new PIXI.Container()
  const g = new PIXI.Graphics()
  const cx = W * 0.52
  const STONE = 0xcdbfa6, STONE_SH = 0xa89a82, STEEL = 0x8c98a4, STEEL_DK = 0x66707b,
        GOLD = 0xe3b24a, REDROOF = 0xb5482e, WHITE = 0xeef0ee, COPPER = 0x6fae9a, BRICK = 0xb06a4a
  if (key === 'monas') {
    const H = h, bw = W * 0.05
    g.rect(cx - bw * 1.4, baseY - H * 0.10, bw * 2.8, H * 0.10).fill({ color: STONE })   // base
    g.moveTo(cx - bw * 0.5, baseY - H * 0.10).lineTo(cx - bw * 0.18, baseY - H * 0.86).lineTo(cx + bw * 0.18, baseY - H * 0.86).lineTo(cx + bw * 0.5, baseY - H * 0.10).closePath().fill({ color: WHITE })  // obelisk
    g.moveTo(cx - bw * 0.18, baseY - H * 0.86).lineTo(cx, baseY - H * 0.96).lineTo(cx + bw * 0.18, baseY - H * 0.86).closePath().fill({ color: STONE_SH })  // cup
    g.ellipse(cx, baseY - H * 0.99, bw * 0.22, H * 0.05).fill({ color: GOLD })   // flame
  } else if (key === 'tugu') {
    const H = h, bw = W * 0.035
    g.rect(cx - bw * 1.2, baseY - H * 0.08, bw * 2.4, H * 0.08).fill({ color: STONE_SH })
    g.rect(cx - bw * 0.45, baseY - H * 0.82, bw * 0.9, H * 0.74).fill({ color: WHITE })   // pillar
    g.ellipse(cx, baseY - H * 0.88, bw * 0.6, H * 0.07).fill({ color: GOLD })             // gold ball
    g.moveTo(cx - bw * 0.18, baseY - H * 0.90).lineTo(cx, baseY - H * 0.99).lineTo(cx + bw * 0.18, baseY - H * 0.90).closePath().fill({ color: GOLD })  // spire
  } else if (key === 'eiffel') {
    const H = h, tw = W * 0.17
    // legs + body silhouette
    g.moveTo(cx - tw / 2, baseY).lineTo(cx - tw * 0.16, baseY - H * 0.42).lineTo(cx - tw * 0.05, baseY - H * 0.86).lineTo(cx - tw * 0.02, baseY - H).lineTo(cx + tw * 0.02, baseY - H).lineTo(cx + tw * 0.05, baseY - H * 0.86).lineTo(cx + tw * 0.16, baseY - H * 0.42).lineTo(cx + tw / 2, baseY).closePath().fill({ color: STEEL })
    g.rect(cx - tw * 0.42, baseY - H * 0.30, tw * 0.84, H * 0.03).fill({ color: STEEL_DK })   // 1st platform
    g.rect(cx - tw * 0.20, baseY - H * 0.62, tw * 0.40, H * 0.025).fill({ color: STEEL_DK })  // 2nd platform
    g.moveTo(cx - tw * 0.30, baseY).lineTo(cx + tw * 0.30, baseY).lineTo(cx + tw * 0.16, baseY - H * 0.24).lineTo(cx - tw * 0.16, baseY - H * 0.24).closePath().fill({ color: STEEL_DK, alpha: 0.5 })  // base arch shade
  } else if (key === 'clocktower') {
    const H = h, tw = W * 0.05
    g.rect(cx - tw, baseY - H * 0.80, tw * 2, H * 0.80).fill({ color: STONE })             // tower
    g.rect(cx - tw, baseY - H * 0.80, tw * 0.5, H * 0.80).fill({ color: STONE_SH })        // shade
    g.circle(cx, baseY - H * 0.66, tw * 0.62).fill({ color: WHITE })                       // clock
    g.circle(cx, baseY - H * 0.66, tw * 0.20).fill({ color: STONE_SH })
    g.moveTo(cx - tw, baseY - H * 0.80).lineTo(cx, baseY - H).lineTo(cx + tw, baseY - H * 0.80).closePath().fill({ color: REDROOF })  // spire
  } else if (key === 'skyline') {
    const H = h
    const cols = [[-0.30,0.62,0.10],[-0.18,0.92,0.09],[-0.05,0.74,0.11],[0.08,1.0,0.10],[0.22,0.80,0.09],[0.34,0.58,0.10]]
    for (const [ox, hh, ww] of cols) {
      const bx = cx + W * ox, bw = W * ww, bh = H * hh
      g.rect(bx - bw / 2, baseY - bh, bw, bh).fill({ color: STEEL })
      g.rect(bx - bw / 2, baseY - bh, bw * 0.35, bh).fill({ color: STEEL_DK })
      for (let wy = 0; wy < 5; wy++) for (let wx = 0; wx < 3; wx++)
        g.rect(bx - bw * 0.30 + wx * bw * 0.28, baseY - bh + 6 + wy * (bh / 6), bw * 0.14, bh * 0.06).fill({ color: 0xffe9a8, alpha: 0.55 })
    }
  } else if (key === 'windmill') {
    const H = h, tw = W * 0.045
    g.moveTo(cx - tw, baseY).lineTo(cx - tw * 0.55, baseY - H * 0.62).lineTo(cx + tw * 0.55, baseY - H * 0.62).lineTo(cx + tw, baseY).closePath().fill({ color: STONE })  // body
    g.moveTo(cx - tw * 0.7, baseY - H * 0.62).lineTo(cx, baseY - H * 0.74).lineTo(cx + tw * 0.7, baseY - H * 0.62).closePath().fill({ color: REDROOF })  // cap
    const hubY = baseY - H * 0.60
    for (const a of [0.6, 2.17, 3.74, 5.31]) {   // 4 sails
      g.moveTo(cx, hubY).lineTo(cx + Math.cos(a) * H * 0.42, hubY + Math.sin(a) * H * 0.42).stroke({ color: STONE_SH, width: 4 })
    }
    g.circle(cx, hubY, tw * 0.25).fill({ color: STONE_SH })
  } else if (key === 'alps') {
    const H = h
    const peaks = [[-0.26, 0.74, 0.30], [0.0, 1.0, 0.36], [0.26, 0.80, 0.30]]
    for (const [ox, hh, ww] of peaks) {
      const px = cx + W * ox, pw = W * ww, ph = H * hh
      g.moveTo(px - pw / 2, baseY).lineTo(px, baseY - ph).lineTo(px + pw / 2, baseY).closePath().fill({ color: STEEL })
      g.moveTo(px - pw * 0.18, baseY - ph * 0.72).lineTo(px, baseY - ph).lineTo(px + pw * 0.18, baseY - ph * 0.72).lineTo(px + pw * 0.06, baseY - ph * 0.64).lineTo(px - pw * 0.05, baseY - ph * 0.70).closePath().fill({ color: WHITE })  // snow cap
    }
  } else if (key === 'domes') {
    const H = h, bw = W * 0.20
    g.rect(cx - bw / 2, baseY - H * 0.34, bw, H * 0.34).fill({ color: STONE })             // wall
    g.rect(cx - bw / 2, baseY - H * 0.34, bw, H * 0.05).fill({ color: STONE_SH })
    const domes = [[-0.30, 0.5], [0.0, 0.72], [0.30, 0.5]]
    for (const [ox, ds] of domes) {
      const dx = cx + bw * ox, dh = H * 0.30 * ds + H * 0.18, dw = bw * 0.26
      const col = ox === 0 ? GOLD : COPPER
      g.ellipse(dx, baseY - H * 0.34, dw, dh * 0.55).fill({ color: col })                  // onion (lower bulge)
      g.moveTo(dx - dw, baseY - H * 0.34).bezierCurveTo(dx - dw, baseY - H * 0.34 - dh, dx + dw, baseY - H * 0.34 - dh, dx + dw, baseY - H * 0.34).closePath().fill({ color: col })
      g.moveTo(dx - dw * 0.3, baseY - H * 0.34 - dh * 0.9).lineTo(dx, baseY - H * 0.34 - dh * 1.25).lineTo(dx + dw * 0.3, baseY - H * 0.34 - dh * 0.9).closePath().fill({ color: GOLD })  // tip
    }
  } else if (key === 'colosseum') {
    const H = h, bw = W * 0.26, bh = H * 0.46
    g.ellipse(cx, baseY - bh * 0.5, bw, bh * 0.5).fill({ color: STONE })
    g.ellipse(cx, baseY - bh * 0.5, bw * 0.78, bh * 0.42).fill({ color: STONE_SH, alpha: 0.5 })
    g.ellipse(cx, baseY - bh * 0.5, bw * 0.66, bh * 0.34).fill({ color: pal.grass || 0x82c06c })  // hollow centre = sky/grass behind
    for (let r = 0; r < 2; r++) for (let a = -5; a <= 5; a++) {   // arch holes around the rim
      const ang = a * 0.16
      g.ellipse(cx + Math.sin(ang) * bw * 0.86, baseY - bh * (0.5 + r * 0.22) + Math.cos(ang) * 2, bw * 0.03, bh * 0.07).fill({ color: STONE_SH })
    }
  } else if (key === 'bridge') {
    const H = h, span = W * 0.42, towerW = W * 0.02
    const tY = baseY - H * 0.10
    for (const sgn of [-1, 1]) {
      const tx = cx + sgn * span * 0.42
      g.rect(tx - towerW / 2, baseY - H * 0.84, towerW, H * 0.74).fill({ color: REDROOF })  // tower (golden-gate red)
      g.rect(tx - towerW * 1.2, baseY - H * 0.62, towerW * 2.4, towerW).fill({ color: REDROOF })  // cross beam
    }
    g.rect(cx - span / 2, tY, span, H * 0.03).fill({ color: STEEL_DK })                      // deck
    // suspension cables (dip between towers + down to deck ends)
    g.moveTo(cx - span * 0.5, tY).bezierCurveTo(cx - span * 0.2, baseY - H * 0.78, cx + span * 0.2, baseY - H * 0.78, cx + span * 0.5, tY).stroke({ color: REDROOF, width: 2.5 })
    for (let i = -8; i <= 8; i++) {   // vertical hangers
      const hx = cx + (span * 0.46) * (i / 8)
      const top = tY - (H * 0.74) * (1 - Math.pow(i / 8, 2)) * 0.5
      g.moveTo(hx, tY).lineTo(hx, top).stroke({ color: REDROOF, width: 1, alpha: 0.7 })
    }
  }
  C.addChild(g)
  return C
}

// v54.8 (concern 10): TIME_OF_DAY dynamic sky system. 6 time phases lerp via
// race progress (S.distance / S.finishLine). Each phase has skyTop/skyBot
// color stops + cloud tint + sun position fraction (0..1, 0=below horizon,
// 1=zenith) + flag for stars-visible. The active TH biome blends with the
// time phase color so a "forest" race can still cycle pagi→siang→sore→malam.
const TIME_PHASES = [
  { name:'subuh',  skyTop:0x1a2850, skyBot:0x4a5f7f, cloudTint:0x6e7faa, sunY:-0.20, sunColor:0xff6644, stars:true  },
  { name:'pagi',   skyTop:0xfdb462, skyBot:0x87ceeb, cloudTint:0xfff7e8, sunY: 0.20, sunColor:0xffdd00, stars:false },
  { name:'siang',  skyTop:0x87ceeb, skyBot:0xe0f6ff, cloudTint:0xffffff, sunY: 0.55, sunColor:0xffff00, stars:false },
  { name:'sore',   skyTop:0xff8c42, skyBot:0xffb366, cloudTint:0xffd0a0, sunY: 0.78, sunColor:0xffaa00, stars:false },
  { name:'petang', skyTop:0x6b3b6b, skyBot:0xff6b35, cloudTint:0xa07050, sunY: 0.90, sunColor:0xff5500, stars:false },
  { name:'malam',  skyTop:0x0a0a2e, skyBot:0x1a1a5e, cloudTint:0x3a3a6e, sunY:-0.40, sunColor:0xeeee88, stars:true  },
]
function g14CurrentTimePhase(){
  // race progress 0..1 mapped to subuh..malam, with smooth blend inside each.
  if (!S || !S.finishLine) return { phase: TIME_PHASES[2], next: TIME_PHASES[3], lerp: 0 }
  const t = Math.max(0, Math.min(1, S.distance / S.finishLine))
  const span = t * TIME_PHASES.length
  const idx = Math.min(TIME_PHASES.length - 1, Math.floor(span))
  const nextIdx = Math.min(TIME_PHASES.length - 1, idx + 1)
  return { phase: TIME_PHASES[idx], next: TIME_PHASES[nextIdx], lerp: span - idx }
}
function _lerpHex(a, b, t){
  const ar=(a>>16)&255, ag=(a>>8)&255, ab=a&255
  const br=(b>>16)&255, bg=(b>>8)&255, bb=b&255
  const r=Math.round(ar + (br-ar)*t), g=Math.round(ag + (bg-ag)*t), bl=Math.round(ab + (bb-ab)*t)
  return (r<<16) | (g<<8) | bl
}
function g14CurrentSkyColors(){
  const { phase, next, lerp } = g14CurrentTimePhase()
  return {
    skyTop:    _lerpHex(phase.skyTop, next.skyTop, lerp),
    skyBot:    _lerpHex(phase.skyBot, next.skyBot, lerp),
    cloudTint: _lerpHex(phase.cloudTint, next.cloudTint, lerp),
    stars:     phase.stars || next.stars,
    name:      phase.name,
  }
}

// ═══════════════════════════════════════════════════════════
//  PIXI
// ═══════════════════════════════════════════════════════════
let app, stage
let L = {}   // named layers
let playerSprite, playerGlow
let laneYs = []  // pixel Y center of each lane (in game area)
let gameTop, gameH, laneH, railTop   // A-311 railTop = top of the rail band (scenery sits above it)
let lastObsTime = 0, lastSteamTime = 0

async function initPixi() {
  const W = window.innerWidth, H = window.innerHeight
  app = new PIXI.Application()
  await app.init({
    canvas: document.getElementById('pixi-canvas'),
    width: W, height: H,
    backgroundColor: 0x050c02,
    antialias: true,
    resolution: Math.min(window.devicePixelRatio || 1, 1.5),
    autoDensity: true,
  })
  stage = app.stage

  // Game area between top HUD (~70px) and controls (~120px)
  // A-311 — responsive layout: top HUD band + lane height + train + obstacle sizes
  // all derive from the LIVE viewport so the game fits any device exactly.
  gameTop = Math.round(Math.max(56, Math.min(H * 0.10, 92)))
  const gameBot = H - Math.round(Math.max(96, Math.min(H * 0.17, 134)))
  gameH = gameBot - gameTop
  // A-311 — Indonesian layout: the SCENERY band (volcano/sawah/houses) fills the
  // upper ~44%, the 3 rail lanes sit in the lower part (matches the reference).
  railTop = Math.round(gameTop + gameH * 0.44)
  laneH = (gameBot - railTop) / LANE_COUNT
  laneYs = Array.from({length: LANE_COUNT}, (_, i) => railTop + laneH * i + laneH / 2)
  // train uniform height scales to the lane (stays the visual star) — clamped.
  // (depth helpers below are pure functions of lane index — see g14LaneDepth.)
  G14_UNIFORM_H = Math.round(Math.max(72, Math.min(laneH * 1.02, H * 0.15)))
  // obstacle emoji size scales with the smaller viewport axis, ≥44px tap target.
  OBS_SIZE = Math.round(Math.max(38, Math.min(Math.min(W, H) * 0.075, 52)))

  await g14LoadManifest()   // v55.71 A-312 — load ref palette/backdrop BEFORE scene build (no-op if none)
  if (g14HasBackdrop()) {
    // v55.72 A-312 — RASTER painterly backdrop: align the 3 functional lanes to the
    // painting's rail band (cover-fit), then place the scene as one full-bleed
    // sprite. Procedural sky/hills/rail VISUALS are skipped (the painting has them).
    const L0 = g14BackdropLanes()
    laneYs = L0.laneYs; laneH = L0.laneH; railTop = L0.railTop
    // v55.92 A-312 — train size DECOUPLED from lane spacing (lanes are now SPREAD top/mid/bottom,
    // so laneH is large). Size to a fixed fraction of the PLAY BAND ≈ the accepted 70% look.
    // Player == every NPC. Obstacle just under the loco.
    { const _pb = g14PlayBand(); const _bh = _pb.bandBot - _pb.bandTop
      G14_UNIFORM_H = Math.round(Math.max(64, Math.min(_bh * 0.11, 175)))
      OBS_SIZE = Math.round(G14_UNIFORM_H * 0.9) }
    await g14AddBackdrop()
  } else {
    buildSky()
    buildClouds()
    buildFarScenery()
    buildBirds()
    buildMidScenery()
    buildSignalPosts()
    buildKMMarkers()  // v54.14 — scrolling distance signs
    buildTracks()
  }

  L.obstacles = new PIXI.Container(); stage.addChild(L.obstacles)
  L.ai = new PIXI.Container(); stage.addChild(L.ai)

  buildPlayer()

  buildForeScenery()   // v55.46 — 2.5D foreground parallax (in front of the train)

  // v56.6 B-286/B3 — revive the LIVING SKY over the painterly plate: IndoScene.ambient
  // (bird V-flocks, kites, drifting clouds — capped ~9 sprites, dt-clamped) was built in
  // v55.61 but only ran on the procedural path, i.e. DEAD on all 48 backdrop levels.
  try {
    if (window.IndoScene && IndoScene.ambient && !g14ReducedMotion()) {
      const _pal = g14Palette() || {}
      L._amb = IndoScene.ambient(app.screen.width, railTop || app.screen.height * 0.5, _pal,
        { seed: (cfg.level || 1) * 7919, density: 0.8 })
      if (L._amb && L._amb.container) stage.addChildAt(L._amb.container, Math.min(1, stage.children.length))
    }
  } catch (_) { L._amb = null }

  // v56.7 A-320/J3 — AERIAL PERSPECTIVE: translucent sky wash over the far scenic bands
  // (recedes the distance) + a warm bottom vignette (pops the near ground). Static fills,
  // rebuilt on resize — zero per-frame cost.
  try { g14BuildHaze() } catch (_) {}

  L.fx = new PIXI.Container(); stage.addChild(L.fx)
  // v55.77 — shared always-on, speed-scaled motion overlay (games/train-speedfx.js).
  // Replaces the old boost-only speed lines so the train always reads as moving fast.
  L._speedfx = (window.TrainSpeedFX) ? TrainSpeedFX.mount(stage, app, { cap: 36 }) : null
  // v54.49: weather overlay — rain (forest/coastal), snow (snow), sandstorm
  // (desert), embers (volcano). Level-gated to >=3 so kids see clean biomes first.
  L.weather = new PIXI.Container(); stage.addChild(L.weather)
  if ((cfg.level || 1) >= 3) g14InitWeather()

  // v59.75 — warm every obstacle + pickup texture in the background. Non-blocking:
  // the race is still several screens away, and anything that has not landed by
  // spawn time simply renders as the procedural art instead of nothing.
  try { if (window.UISprites && UISprites.pixiPreload) UISprites.pixiPreload(g14ObstacleEmojiPool(), PIXI) } catch (_) {}

  app.ticker.add(loop)

  // Wire shared GamePause (game-modal.js)
  try {
    if (typeof GamePause !== 'undefined') {
      GamePause.init({
        bgmEl: document.getElementById('game-bgm'),
        onResume: () => {
          S.paused = false; S.running = true
          document.getElementById('btn-pause').textContent = '⏸'
          const pb = document.getElementById('position-badge'); if (pb) pb.textContent = '🏁 Lanjut!'
        },
        onRetry: () => { location.reload() },
        onHome:  () => { goBack() }   // v55.61 B-256 — go to app home deterministically
      })
    }
  } catch(_){}
}

// v54.8 (concern 10): redraw sky each animation frame with current time-of-day
// phase colors. Re-renders the 10-step gradient by clearing existing children
// and rebuilding with lerped top/bot. Cheap (~10 PIXI.Graphics per call); only
// runs once per 18 frames so it's effectively 3.3 Hz. Stars layer is preserved.
function g14ApplyTimeOfDaySky(){
  if (!L.sky || typeof g14CurrentSkyColors !== 'function') return
  const colors = g14CurrentSkyColors()
  // Remove existing gradient strips but keep stars (which are appended after).
  const W = app.screen.width, H = app.screen.height
  const steps = 10
  // Replace first 10 children (the strips); keep anything beyond (stars).
  for (let i = 0; i < steps && i < L.sky.children.length; i++){
    const t = i / steps
    const g = L.sky.children[i]
    g.clear()
    g.rect(0, 0, W, H / steps + 2).fill(lerpColor(colors.skyTop, colors.skyBot, t))
  }
  L._skyTopC = colors.skyTop
  L._skyBotC = colors.skyBot
  // v54.11 — Cloud tint by time-of-day. Clouds are drawn with a fixed dark color;
  // applying `tint` swaps the visible color without redrawing geometry. Cheap.
  if (L.clouds && colors.cloudTint != null) {
    for (const cl of L.clouds.children) cl.tint = colors.cloudTint
  }
  // v55.71 A-312 — keep the reference city band in sync with the sky brightness.
  if (L._cityBand && !L._cityBand.destroyed) { try { L._cityBand.tint = g14CityTint() } catch (_) {} }
  // v54.11 — Sun / moon body sprite. Position via phase.sunY * gameTop (negative = below
  // horizon; positive = above). Only one body visible at a time. Pre-built once in
  // buildSky and re-positioned + re-tinted here.
  if (L._sunBody) {
    const { phase } = g14CurrentTimePhase()
    const sunY = phase.sunY
    const isMoon = !!phase.stars
    const visible = sunY > -0.10
    L._sunBody.visible = visible
    if (visible) {
      // sunY=0 = horizon (gameTop), sunY=1 = top of sky band
      L._sunBody.y = gameTop - sunY * gameTop * 0.85
      L._sunBody.x = W * (0.30 + sunY * 0.10)
      L._sunBody.tint = phase.sunColor || 0xfff5b0
      L._sunBody.scale.set(isMoon ? 0.85 : 1.0)
    }
  }
  // v54.11 — Star twinkle. Fade stars in/out per phase + animate sin alpha for life.
  if (L.sky && colors.stars != null) {
    for (const node of L.sky.children) {
      if (node._baseAlpha != null) {
        const targetAlpha = colors.stars ? node._baseAlpha : 0
        // Smooth alpha lerp toward target
        node.alpha += (targetAlpha - node.alpha) * 0.18
        // Subtle twinkle only when visible enough
        if (node.alpha > 0.1) {
          node._twinklePhase = (node._twinklePhase || 0) + 0.04
          node.alpha *= 0.85 + 0.3 * Math.sin(node._twinklePhase)
        }
      }
    }
  }
}

// v54.8 (concern 10 — physics juice): dust particle kickup from wheels during
// lane switch. 2-3 small gray particles fall behind the train sprite with
// gravity. Cheap PIXI.Graphics; auto-cull when faded.
function g14SpawnLaneDust(){
  if (!L.fx || !L.player) return
  for (let i = 0; i < 3; i++){
    const d = new PIXI.Graphics()
    d.circle(0, 0, 2 + Math.random() * 2).fill({ color: 0x9a8676, alpha: 0.72 })
    d.x = L.player.x + (Math.random() - 0.5) * 24
    d.y = L.player.y + 18 + Math.random() * 4
    L.fx.addChild(d)
    const vx = -2 - Math.random() * 2
    const vy = -1.5 - Math.random() * 1.5
    let life = 22
    const tick = () => {
      d.x += vx
      d.y += vy + (22 - life) * 0.12   // gravity-affected fall
      d.alpha -= 0.04
      life--
      if (life <= 0 || d.alpha <= 0){ try { L.fx.removeChild(d) } catch(_){} return }
      requestAnimationFrame(tick)
    }
    requestAnimationFrame(tick)
  }
}

// ── Sky ───────────────────────────────────────────────────
function buildSky() {
  const c = new PIXI.Container(); L.sky = c; stage.addChild(c)
  const W = app.screen.width, H = app.screen.height

  // Gradient sky — v54.8: start at the first TIME_PHASE color (subuh) instead
  // of the THEMES preset. g14ApplyTimeOfDaySky() then morphs it through the
  // race progress every 18 frames.
  const phase = (typeof TIME_PHASES !== 'undefined') ? TIME_PHASES[0] : null
  const topC = phase ? phase.skyTop : TH.skyTop
  const botC = phase ? phase.skyBot : TH.skyBot
  L._skyTopC = topC
  L._skyBotC = botC
  const steps = 10
  for (let i = 0; i < steps; i++) {
    const t = i / steps
    const g = new PIXI.Graphics()
    g.rect(0, 0, W, H / steps + 2).fill(lerpColor(topC, botC, t))
    g.y = H * i / steps
    c.addChild(g)
  }

  // v54.11 — Sun / moon body sprite. Built once, tinted + positioned by
  // g14ApplyTimeOfDaySky each phase. Drawn as halo + main disc + inner highlight
  // for a soft "celestial body" feel that works for both sun (yellow) and moon
  // (cool white) via tint.
  const sb = new PIXI.Graphics()
  sb.circle(0, 0, 56).fill({ color: 0xffffff, alpha: 0.18 })   // outer halo
  sb.circle(0, 0, 42).fill({ color: 0xffffff, alpha: 0.32 })   // mid halo
  sb.circle(0, 0, 30).fill({ color: 0xffffff, alpha: 1.0 })    // disc body (tinted)
  sb.circle(-8, -8, 6).fill({ color: 0xffffff, alpha: 0.55 })  // highlight
  sb.tint = 0xfff5b0
  sb.x = W * 0.35; sb.y = gameTop * 0.4
  sb.visible = false  // hidden until first ApplyTimeOfDaySky tick
  c.addChild(sb)
  L._sunBody = sb

  // Stars (always built; visible state controlled by phase.stars + alpha twinkle)
  // v54.11 — Make stars always available so we can fade them in/out per phase
  // (was hardcoded to ONLY night themes via TH.stars early-return).
  for (let i = 0; i < 60; i++) {
    const r = 0.5 + Math.random() * 1.5
    const s = new PIXI.Graphics()
    s.circle(0, 0, r).fill(0xffffff)
    s.x = Math.random() * W
    s.y = Math.random() * gameTop + Math.random() * 10
    s.alpha = 0  // start hidden; fade in during stars phases via ApplyTimeOfDaySky
    s._baseAlpha = 0.3 + Math.random() * 0.5
    s._twinklePhase = Math.random() * Math.PI * 2
    c.addChild(s)
  }
}

// ── Clouds ────────────────────────────────────────────────
let clouds = []
function buildClouds() {
  const c = new PIXI.Container(); L.clouds = c; stage.addChild(c)
  // v54.17 A14: cloud shadows projected onto the track ground. One faint ellipse
  // per cloud, scrolls in sync, rendered BELOW track via separate container.
  const cs = new PIXI.Container(); L.cloudShadows = cs; stage.addChildAt(cs, Math.min(2, stage.children.length))
  const W = app.screen.width
  cloudShadows = []
  for (let i = 0; i < 6; i++) {
    const cloud = makeCloud()
    cloud.x = Math.random() * W
    cloud.y = gameTop + Math.random() * 40
    cloud._speed = 0.2 + Math.random() * 0.3
    c.addChild(cloud)
    clouds.push(cloud)
    // shadow
    const sh = new PIXI.Graphics()
    const cw = (cloud._estW || 110)
    sh.ellipse(0, 0, cw * 0.7, 9).fill({ color: 0x0a0a0a, alpha: 0.25 })
    sh.x = cloud.x
    sh.y = gameTop + Math.max(60, laneH * 0.4)
    cs.addChild(sh)
    cloudShadows.push(sh)
  }
}
let cloudShadows = []
function makeCloud() {
  const g = new PIXI.Graphics()
  const w = 60 + Math.random() * 80, h = 18 + Math.random() * 18
  g.ellipse(0, 0, w, h).fill(0x1a3a1a)
  g.ellipse(-w * 0.25, -h * 0.3, w * 0.55, h * 0.7).fill(0x1a3a1a)
  g.ellipse(w * 0.2, -h * 0.25, w * 0.45, h * 0.65).fill(0x1a3a1a)
  g.alpha = 0.4
  return g
}
function tickClouds(delta) {
  const W = app.screen.width
  for (let i = 0; i < clouds.length; i++) {
    const c = clouds[i]
    c.x -= c._speed * delta
    if (c.x < -150) { c.x = W + 50; c.y = gameTop + Math.random() * 40 }
    // v54.17 A14: shadow tracks the cloud's x, fixed at ground band Y.
    const sh = cloudShadows[i]
    if (sh) { sh.x = c.x; sh.alpha = 0.22 }
  }
}

// v54.49: Weather overlay system. ~60 particles, biome-specific pattern.
// - rain (forest/coastal): blue streaks falling diagonally
// - snow (snow): white circles drifting down slowly
// - sandstorm (desert): tan dots drifting horizontally + speed
// - embers (volcano): red/orange dots rising with shimmer
// Level-gated >=3 in initPixi so early levels stay clean.
const G14_WEATHER_COUNT = 60
function g14InitWeather() {
  if (!L.weather) return
  const W = app.screen.width
  const H = app.screen.height
  const pattern = G14_WEATHER_PATTERN[TH.name]
  if (!pattern) return
  for (let i = 0; i < G14_WEATHER_COUNT; i++) {
    const g = new PIXI.Graphics()
    pattern.draw(g)
    g.x = Math.random() * W
    g.y = Math.random() * H
    g._vy = pattern.vy()
    g._vx = pattern.vx()
    g._type = pattern.type
    L.weather.addChild(g)
  }
}
const G14_WEATHER_PATTERN = {
  forest: {
    type: 'rain',
    draw: g => { g.rect(-1, -6, 2, 8).fill({ color: 0x60a5fa, alpha: 0.55 }) },
    vy: () => 6 + Math.random() * 3,
    vx: () => -1.5
  },
  coastal: {
    type: 'rain',
    draw: g => { g.rect(-1, -6, 2, 8).fill({ color: 0x93c5fd, alpha: 0.6 }) },
    vy: () => 5 + Math.random() * 3,
    vx: () => -1.2
  },
  snow: {
    type: 'snow',
    draw: g => { g.circle(0, 0, 2 + Math.random() * 1.5).fill({ color: 0xffffff, alpha: 0.75 }) },
    vy: () => 1 + Math.random() * 1.4,
    vx: () => -0.3 + Math.random() * 0.6
  },
  desert: {
    type: 'sandstorm',
    draw: g => { g.circle(0, 0, 1.5).fill({ color: 0xd97706, alpha: 0.45 }) },
    vy: () => -0.3 + Math.random() * 0.6,

  },
  volcano: {
    type: 'embers',
    draw: g => { g.circle(0, 0, 1.6 + Math.random()).fill({ color: 0xf97316, alpha: 0.8 }) },
    vy: () => -1.5 - Math.random() * 1.2,
    vx: () => -0.4 + Math.random() * 0.8
  },
  urban: null,
}
function tickWeather(delta) {
  if (!L.weather || !L.weather.children.length) return
  const W = app.screen.width
  const H = app.screen.height
  for (let i = 0; i < L.weather.children.length; i++) {
    const p = L.weather.children[i]
    p.y += p._vy * delta
    p.x += p._vx * delta
    if (p._type === 'embers' && p.y < -10) { p.y = H + 5; p.x = Math.random() * W }
    else if (p.y > H + 10) { p.y = -5; p.x = Math.random() * W }
    else if (p.x < -10) { p.x = W + 5; p.y = Math.random() * H }

}

// ── Birds (flock of 3 flying) ─────────────────────────────

    b.scale.y = 0.7 + Math.sin(t * 4 + b._phase) * 0.3
