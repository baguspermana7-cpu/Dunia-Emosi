}

// Draw a train silhouette on a PIXI.Graphics object (center-anchored, W≈70, H≈26)
function drawTrainG(g, bodyC, accC, catKey, trainKey, variant) {
  g.clear()
  const bC = hexN(bodyC), aC = hexN(accC)
  const W = 70, hW = 35, H = 26, hH = 13

  // ── White glow helper: draw an outline glow ─────────────────────────────
  function glowOutline(x, y, w, h, r) {
    // Outer glow layer (widest, most transparent)
    g.roundRect(x - 3, y - 3, w + 6, h + 6, r + 2).fill({ color: 0xffffff, alpha: 0.08 })
    // Inner glow layer
    g.roundRect(x - 1.5, y - 1.5, w + 3, h + 3, r + 1).fill({ color: 0xffffff, alpha: 0.18 })
    // Hard white stroke
    g.roundRect(x, y, w, h, r).stroke({ color: 0xffffff, width: 1.8, alpha: 0.75 })
  }

  if (catKey === 'maglev') {
    // ── Maglev streamlined capsule ──────────────────────────────────────
    g.roundRect(-hW - 3, -hH - 3, W + 6, H + 6, 12).fill({ color: 0xffffff, alpha: 0.08 })
    g.roundRect(-hW - 1, -hH - 1, W + 2, H + 2, 10).fill({ color: 0xffffff, alpha: 0.18 })
    g.roundRect(-hW, -hH, W, H, 9).fill(bC)
    glowOutline(-hW, -hH, W, H, 9)
    // Upper body highlight
    g.roundRect(-hW + 2, -hH + 1, W - 4, 5, 4).fill({ color: 0xffffff, alpha: 0.08 })
    // Speed stripe (double)
    g.rect(-hW + 2, -3, W - 4, 6).fill(aC)
    g.rect(-hW + 2, -1, W - 4, 2).fill({ color: 0xffffff, alpha: 0.15 })
    // Visor windshield
    g.roundRect(-hW + 5, -hH + 3, W - 10, 9, 3).fill(0x0f172a)
    g.roundRect(-hW + 5, -hH + 3, W - 10, 4, 3).fill({ color: 0x93c5fd, alpha: 0.5 })
    // Window pillars
    for (let wp = 0; wp < 4; wp++) g.rect(-hW + 14 + wp * 12, -hH + 3, 1.5, 9).fill({ color: bC, alpha: 0.6 })
    // Nose cone
    g.poly([hW - 8, -hH, hW + 8, 0, hW - 8, hH]).fill(bC)
    g.poly([hW - 8, -hH, hW + 8, 0, hW - 8, hH]).stroke({ color: 0xffffff, width: 1, alpha: 0.5 })
    g.roundRect(hW - 10, -hH, 4, H, 2).fill(aC)
    // Headlights
    g.circle(hW + 2, -3, 3).fill(0xfef08a); g.circle(hW + 2, -3, 1.5).fill(0xffffff)
    g.circle(hW + 2, 3, 3).fill(0xfef08a); g.circle(hW + 2, 3, 1.5).fill(0xffffff)
    // Panel lines
    for (let pl = 0; pl < 5; pl++) g.rect(-hW + 4 + pl * 12, -hH + 1, 0.8, H - 2).fill({ color: 0x000000, alpha: 0.12 })
    // Door markers
    g.rect(-hW + 16, -hH + 2, 8, H - 4).stroke({ color: 0xffffff, width: 0.6, alpha: 0.2 })
    g.rect(-hW + 40, -hH + 2, 8, H - 4).stroke({ color: 0xffffff, width: 0.6, alpha: 0.2 })
    // Levitation rail + glow
    g.rect(-hW + 6, hH, W - 12, 2).fill(0x1e3a8a)
    g.rect(-hW + 6, hH + 2, W - 12, 4).fill(0x38bdf8)
    g.rect(-hW + 6, hH + 2, W - 12, 2).fill({ color: 0x7dd3fc, alpha: 0.7 })
    // Pulsing LED strip under body
    g.rect(-hW + 4, hH - 1, W - 8, 1.5).fill({ color: aC, alpha: 0.45 })
    g.rect(-hW + 8, hH - 1, 6, 1.5).fill({ color: 0xffffff, alpha: 0.3 })
    // Undercarriage sensors
    for (let si = 0; si < 6; si++) {
      g.circle(-hW + 12 + si * 10, hH + 1, 1.5).fill({ color: 0x38bdf8, alpha: 0.5 })
      g.circle(-hW + 12 + si * 10, hH + 1, 0.8).fill({ color: 0xffffff, alpha: 0.7 })
    }
    // Ventilation grilles (roof)
    for (let vi = 0; vi < 3; vi++) g.roundRect(-hW + 8 + vi * 16, -hH - 2, 10, 2, 1).fill({ color: 0x000000, alpha: 0.15 })
    // Aerodynamic fairing covers
    g.poly([-hW, hH, -hW - 4, hH + 3, -hW, hH + 3]).fill({ color: bC, alpha: 0.5 })
    // Number plate
    g.roundRect(-hW + 2, hH - 5, 14, 4, 1).fill({ color: 0x000000, alpha: 0.3 })
    // Tail light
    g.circle(-hW - 1, 0, 2.5).fill(0xef4444); g.circle(-hW - 1, 0, 1.2).fill(0xfca5a5)
    return
  }

  if (catKey === 'hsr') {
    // ── Bullet-nose high-speed train ────────────────────────────────────
    g.roundRect(-hW - 2, -hH - 2, W - 8, H + 4, 5).fill({ color: 0xffffff, alpha: 0.1 })
    // Main body
    g.roundRect(-hW, -hH, W - 12, H, 4).fill(bC)
    // Nose cone (elongated triangle)
    g.poly([hW - 12, -hH, hW + 8, -2, hW + 8, 2, hW - 12, hH]).fill(bC)
    g.poly([hW - 12, -hH, hW + 8, -2, hW + 8, 2, hW - 12, hH]).stroke({ color: 0xffffff, width: 1, alpha: 0.5 })
    g.roundRect(-hW, -hH, W - 12, H, 4).stroke({ color: 0xffffff, width: 1.5, alpha: 0.7 })
    // Upper highlight
    g.roundRect(-hW + 2, -hH + 1, W - 16, 4, 2).fill({ color: 0xffffff, alpha: 0.08 })
    // Speed stripe (accent band)
    g.rect(-hW, -2, W - 6, 5).fill(aC)
    g.rect(-hW, -1, W - 6, 1.5).fill({ color: 0xffffff, alpha: 0.12 })
    // Windshield visor
    g.roundRect(-hW + 4, -hH + 3, W - 22, 9, 2).fill(0x0f172a)
    g.roundRect(-hW + 4, -hH + 3, W - 22, 4, 2).fill({ color: 0xbfdbfe, alpha: 0.5 })
    // Window pillars
    for (let wp = 0; wp < 3; wp++) g.rect(-hW + 14 + wp * 11, -hH + 3, 1, 9).fill({ color: bC, alpha: 0.5 })
    // Headlights (dual)
    g.circle(hW + 4, -2, 3.5).fill(0xfef08a); g.circle(hW + 4, -2, 2).fill(0xffffff)
    g.circle(hW + 4, 2, 2.5).fill(0xfca5a5); g.circle(hW + 4, 2, 1.5).fill(0xfecdd3)
    // Pantograph (detailed diamond shape)
    const px = -hW + 12
    g.rect(px, -hH - 7, 2, 7).fill({ color: 0xd1d5db, alpha: 0.8 })
    g.rect(px + 16, -hH - 7, 2, 7).fill({ color: 0xd1d5db, alpha: 0.8 })
    g.rect(px - 2, -hH - 8, 22, 1.5).fill({ color: 0xd1d5db, alpha: 0.8 })
    // Cross-arm
    g.moveTo(px + 1, -hH).lineTo(px + 9, -hH - 7).stroke({ color: 0xd1d5db, width: 1, alpha: 0.6 })
    g.moveTo(px + 17, -hH).lineTo(px + 9, -hH - 7).stroke({ color: 0xd1d5db, width: 1, alpha: 0.6 })
    // Contact wire
    g.rect(px - 4, -hH - 10, 28, 1).fill({ color: 0xfbbf24, alpha: 0.4 })
    // Bogies/Wheels with suspension detail
    for (const bx of [-24, 10]) {
      // Bogie frame
      g.roundRect(bx - 4, hH - 1, 18, 4, 1.5).fill({ color: 0x1f2937, alpha: 0.6 })
      // Wheels (paired)
      g.circle(bx, hH + 3, 4.5).fill(0x1f2937).stroke({ color: 0x6b7280, width: 1.2 })
      g.circle(bx, hH + 3, 2).fill(0x9ca3af)
      g.circle(bx + 10, hH + 3, 4.5).fill(0x1f2937).stroke({ color: 0x6b7280, width: 1.2 })
      g.circle(bx + 10, hH + 3, 2).fill(0x9ca3af)
      // Suspension springs
      g.rect(bx + 2, hH - 2, 6, 2).fill({ color: 0x6b7280, alpha: 0.4 })
    }
    // Door markings (double doors)
    g.rect(-hW + 18, -hH + 2, 7, H - 4).stroke({ color: 0xffffff, width: 0.6, alpha: 0.2 })
    g.rect(-hW + 38, -hH + 2, 7, H - 4).stroke({ color: 0xffffff, width: 0.5, alpha: 0.15 })
    // Skirt (lower body panel / aerodynamic fairing)
    g.rect(-hW, hH - 3, W - 12, 3).fill({ color: 0x000000, alpha: 0.2 })
    g.rect(-hW, hH - 5, W - 12, 2).fill({ color: bC, alpha: 0.3 })
    // Brake disc indicators (between bogies)
    for (let bi = 0; bi < 3; bi++) g.circle(-10 + bi * 8, hH + 1, 1).fill({ color: 0xd97706, alpha: 0.3 })
    // Ventilation grilles (roof)
    for (let vi = 0; vi < 2; vi++) g.roundRect(-hW + 6 + vi * 18, -hH - 3, 12, 2.5, 1).fill({ color: 0x000000, alpha: 0.12 })
    // Destination LED board
    g.roundRect(-hW + 3, -hH + 13, 16, 5, 1).fill(0x000000)
    g.roundRect(-hW + 4, -hH + 14, 14, 3, 0.5).fill({ color: 0xfbbf24, alpha: 0.6 })
    // Tail light
    g.circle(-hW - 1, -4, 2).fill(0xef4444); g.circle(-hW - 1, -4, 1).fill(0xfca5a5)
    g.circle(-hW - 1, 4, 2).fill(0xef4444); g.circle(-hW - 1, 4, 1).fill(0xfca5a5)
    // Number plate
    g.roundRect(-hW + 2, -hH + 2, 14, 6, 1).fill({ color: 0x000000, alpha: 0.3 })
    // Coupler cover (nose)
    g.roundRect(hW + 6, -3, 4, 6, 1).fill({ color: bC, alpha: 0.6 })
    return
  }

  // ── General body: steam / diesel / emu ──────────────────────────────────
  const isSteam = catKey && catKey.includes('steam')
  const isEmu = catKey && catKey.includes('emu')
  // Glow shell
  g.roundRect(-hW - 3, -hH - 3, W + 6, H + 6, 7).fill({ color: 0xffffff, alpha: 0.08 })
  g.roundRect(-hW - 1.5, -hH - 1.5, W + 3, H + 3, 6).fill({ color: 0xffffff, alpha: 0.15 })
  // Body
  g.roundRect(-hW, -hH, W, H, 4).fill(bC)
  g.roundRect(-hW, -hH, W, H, 4).stroke({ color: 0xffffff, width: 1.5, alpha: 0.7 })
  // Upper body highlight
  g.roundRect(-hW + 2, -hH + 1, W - 4, 3, 2).fill({ color: 0xffffff, alpha: 0.06 })
  // Accent stripe (double band)
  g.rect(-hW, -hH + 3, W, 4).fill(aC)
  g.rect(-hW, -hH + 4, W, 1.5).fill({ color: 0xffffff, alpha: 0.1 })
  g.rect(-hW, -hH + 7, W, 1).fill({ color: 0x000000, alpha: 0.2 })
  // Windows
  const winCount = isSteam ? 1 : isEmu ? 5 : 3
  const winW = isEmu ? 8 : 11
  const winGap = isEmu ? 11 : 16
  for (let i = 0; i < winCount; i++) {
    const wx = -hW + 6 + i * winGap
    g.roundRect(wx, -hH + 6, winW, 9, 2).fill(0x0f172a)
    g.roundRect(wx, -hH + 6, winW, 3.5, 2).fill({ color: 0xbfdbfe, alpha: 0.4 })
    g.roundRect(wx, -hH + 6, winW, 9, 2).stroke({ color: 0x93c5fd, width: 0.8, alpha: 0.5 })
  }
  if (!isSteam) {
    // ── Diesel/EMU nose (integrated, no protruding block) ──
    // Sloped nose end
    g.poly([hW, -hH, hW + 6, -hH + 4, hW + 6, hH - 4, hW, hH]).fill(aC)
    g.poly([hW, -hH, hW + 6, -hH + 4, hW + 6, hH - 4, hW, hH]).stroke({ color: 0xffffff, width: 0.8, alpha: 0.4 })
    // Nose highlight
    g.poly([hW, -hH, hW + 4, -hH + 3, hW + 4, -hH + 6, hW, -hH + 4]).fill({ color: 0xffffff, alpha: 0.08 })
    // Front windshield (on nose) — split pane
    g.roundRect(hW - 12, -hH + 2, 12, 9, 2).fill(0x0f172a)
    g.roundRect(hW - 12, -hH + 2, 12, 4, 2).fill({ color: 0x87ceeb, alpha: 0.35 })
    g.rect(hW - 6, -hH + 2, 1, 9).fill({ color: bC, alpha: 0.4 }) // center pillar
    // Headlights (dual top + marker bottom)
    g.circle(hW + 3, -hH + 5, 3).fill(0xfef08a); g.circle(hW + 3, -hH + 5, 1.8).fill(0xffffff)
    g.circle(hW + 3, -hH + 10, 2).fill(0xfef08a); g.circle(hW + 3, -hH + 10, 1).fill(0xffffff)
    g.circle(hW + 3, hH - 5, 2.5).fill(0xfca5a5); g.circle(hW + 3, hH - 5, 1.2).fill(0xfecdd3)
    // Ditch lights (low-mounted, widely spaced)
    g.circle(hW + 1, hH - 10, 1.5).fill({ color: 0xfef08a, alpha: 0.6 })
    // Exhaust + radiator (diesel hood)
    if (!isEmu) {
      // Exhaust stack
      g.roundRect(-hW + 2, -hH - 4, 8, 4, 1).fill({ color: 0x1f2937, alpha: 0.5 })
      g.roundRect(-hW + 3, -hH - 5, 6, 2, 1).fill({ color: 0x374151, alpha: 0.4 })
      // Radiator grilles (long hood detail)
      for (let gi = 0; gi < 6; gi++) g.rect(-hW + 3 + gi * 2, -hH - 3, 1, 2.5).fill({ color: 0x6b7280, alpha: 0.3 })
      // Radiator fan (round on top)
      g.circle(-hW + 18, -hH - 2, 4).fill({ color: 0x1f2937, alpha: 0.3 })
      g.circle(-hW + 18, -hH - 2, 4).stroke({ color: 0x6b7280, width: 0.8, alpha: 0.3 })
      g.circle(-hW + 18, -hH - 2, 1.5).fill({ color: 0x9ca3af, alpha: 0.3 })
      // Horn (on roof)
      g.rect(hW - 16, -hH - 5, 3, 5).fill({ color: 0xd1d5db, alpha: 0.5 })
      g.roundRect(hW - 17, -hH - 7, 5, 3, 1).fill({ color: 0xfbbf24, alpha: 0.4 })
      // Bell
      g.circle(hW - 8, -hH - 3, 2.5).fill({ color: 0xd97706, alpha: 0.5 })
      g.rect(hW - 8, -hH - 6, 1, 3).fill({ color: 0xd1d5db, alpha: 0.4 })
      // Handrails (nose)
      g.rect(hW - 2, -hH + 12, 8, 1).fill({ color: 0xfbbf24, alpha: 0.3 })
      g.rect(hW + 5, -hH + 8, 1, 5).fill({ color: 0xfbbf24, alpha: 0.3 })
      // Dynamic brake blister (roof hump)
      g.roundRect(-hW + 28, -hH - 3, 14, 3, 1.5).fill({ color: 0x000000, alpha: 0.15 })
    }
    // Pantograph (EMU — detailed diamond)
    if (isEmu) {
      const px = -hW + 10
      g.rect(px, -hH - 8, 2, 8).fill({ color: 0xd1d5db, alpha: 0.7 })
      g.rect(px + 18, -hH - 8, 2, 8).fill({ color: 0xd1d5db, alpha: 0.7 })
      g.rect(px - 2, -hH - 9, 24, 1.5).fill({ color: 0xd1d5db, alpha: 0.7 })
      // Cross arms
      g.moveTo(px + 1, -hH).lineTo(px + 10, -hH - 8).stroke({ color: 0xd1d5db, width: 1, alpha: 0.5 })
      g.moveTo(px + 19, -hH).lineTo(px + 10, -hH - 8).stroke({ color: 0xd1d5db, width: 1, alpha: 0.5 })
      // Contact wire
      g.rect(px - 4, -hH - 11, 30, 1).fill({ color: 0xfbbf24, alpha: 0.35 })
      // Destination LED board
      g.roundRect(-hW + 4, -hH + 14, 14, 4, 1).fill(0x000000)
      g.roundRect(-hW + 5, -hH + 15, 12, 2, 0.5).fill({ color: 0xfbbf24, alpha: 0.5 })
      // Inter-car connector (rear)
      g.roundRect(-hW - 3, -hH + 3, 3, H - 6, 1).fill({ color: 0x374151, alpha: 0.4 })
      // AC unit (roof)
      g.roundRect(-hW + 32, -hH - 3, 12, 3, 1).fill({ color: 0xd1d5db, alpha: 0.2 })
    }
    // Door markings (double door)
    g.rect(-hW + 22, -hH + 2, 6, H - 4).stroke({ color: 0xffffff, width: 0.5, alpha: 0.18 })
    g.rect(-hW + 40, -hH + 2, 6, H - 4).stroke({ color: 0xffffff, width: 0.4, alpha: 0.12 })
    // Grab irons (side handrails)
    g.rect(-hW + 1, -hH + 8, 1, 10).fill({ color: 0xfbbf24, alpha: 0.25 })
    g.rect(hW - 2, -hH + 8, 1, 10).fill({ color: 0xfbbf24, alpha: 0.25 })
  }
  // Rivet dots
  for (const ry of [-hH + 1, hH - 2]) {
    for (let rx = -hW + 4; rx < hW - 14; rx += 8) {
      g.circle(rx, ry, 0.8).fill({ color: 0xffffff, alpha: 0.2 })
    }
  }
  // Number board
  g.roundRect(-hW + 2, -hH + 1, 14, 6, 1).fill({ color: 0x000000, alpha: 0.3 })
  // Bogies + Wheels
  for (const bx of [-24, isSteam ? -4 : 8]) {
    // Bogie frame
    if (!isSteam) g.roundRect(bx - 3, hH - 1, 16, 3, 1).fill({ color: 0x1f2937, alpha: 0.5 })
    // Wheels
    g.circle(bx, hH + 3, 6).fill(0x1f2937).stroke({ color: 0x6b7280, width: 1.2 })
    g.circle(bx, hH + 3, 3.5).fill(0x374151)
    g.circle(bx, hH + 3, 1.5).fill(0x9ca3af)
    g.circle(bx + 10, hH + 3, 6).fill(0x1f2937).stroke({ color: 0x6b7280, width: 1.2 })
    g.circle(bx + 10, hH + 3, 3.5).fill(0x374151)
    g.circle(bx + 10, hH + 3, 1.5).fill(0x9ca3af)
    // Axle
    g.rect(bx, hH + 2.5, 10, 1).fill({ color: 0x6b7280, alpha: 0.4 })
  }
  // Undercarriage
  g.rect(-hW, hH - 1, W, 2.5).fill({ color: 0x000000, alpha: 0.35 })
  // Coupling hooks
  g.rect(-hW - 4, hH - 2, 4, 3).fill({ color: 0x6b7280, alpha: 0.4 })
  if (!isSteam) g.rect(hW, hH - 2, 4, 3).fill({ color: 0x6b7280, alpha: 0.4 })
  if (catKey && catKey.includes('steam')) {
    const v = variant ? (variant-1) : (trainKey||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0) % 5
    // ── Boiler bands (3 rings around cylindrical boiler) ──
    for (let bi = 0; bi < 3; bi++) {
      const bx = -hW + 12 + bi * 18
      g.rect(bx, -hH, 2, H).fill({ color: 0xffffff, alpha: 0.12 })
    }
    // ── Running board / footplate (long horizontal bar) ──
    g.rect(-hW - 2, hH - 4, W + 8, 2.5).fill(aC)
    g.rect(-hW - 2, hH - 4, W + 8, 1).fill({ color: 0xffffff, alpha: 0.2 })
    // ── Smokestack / Chimney ──
    const chX = hW - 16 - v * 2
    const chW = 5 + v % 2
    g.rect(chX, -hH - 12 - v, chW, 12 + v).fill(bC)
    g.rect(chX, -hH - 12 - v, chW, 12 + v).stroke({ color: 0xffffff, width: 0.8, alpha: 0.4 })
    // Chimney cap (wider flared top)
    g.roundRect(chX - 3, -hH - 14 - v, chW + 6, 4, 2).fill(0x1f2937)
    g.roundRect(chX - 3, -hH - 14 - v, chW + 6, 1.5, 1).fill({ color: 0xffffff, alpha: 0.15 })
    // ── Steam dome (brass, raised) ──
    const dX = hW - 30 - v * 2
    g.ellipse(dX, -hH - 3, 6, 7).fill(aC)
    g.ellipse(dX, -hH - 3, 6, 7).stroke({ color: 0xffffff, width: 0.8, alpha: 0.4 })
    g.ellipse(dX, -hH - 6, 4, 3).fill({ color: 0xffffff, alpha: 0.15 }) // highlight
    // ── Safety valve (small between dome and chimney) ──
    g.rect(dX + 8, -hH - 6, 3, 6).fill(0x9ca3af)
    g.circle(dX + 9.5, -hH - 7, 2).fill(0xb8b8b8)
    // ── Sandbox (second smaller dome) ──
    if (v < 3) {
      g.ellipse(dX - 12, -hH - 1, 4, 5).fill(0x6b7280)
      g.ellipse(dX - 12, -hH - 1, 4, 5).stroke({ color: 0xffffff, width: 0.6, alpha: 0.3 })
    }
    // ── Headlight (on smokebox front) ──
    g.circle(hW - 2, -hH + 4, 4).fill(0xfef08a)
    g.circle(hW - 2, -hH + 4, 2.5).fill(0xffffff)
    g.circle(hW - 2, -hH + 4, 4).stroke({ color: 0x9ca3af, width: 1 })
    // ── Smokebox door (circular front face) ──
    g.circle(hW - 1, 0, hH - 2).fill({ color: 0x000000, alpha: 0.15 })
    g.circle(hW - 1, 0, hH - 4).stroke({ color: 0xffffff, width: 0.6, alpha: 0.2 })
    // ── Cowcatcher / pilot ──
    g.poly([hW + 1, -hH + 5, hW + 8, hH - 3, hW + 1, hH - 3]).fill(0x1f2937)
    for (let ci = 0; ci < 3; ci++) {
      g.rect(hW + 1, hH - 6 + ci * 2.5, 6, 1).fill({ color: 0x9ca3af, alpha: 0.4 })
    }
    // ── Cab (rear, taller with window) ──
    g.roundRect(-hW - 2, -hH - 6, 14, H + 6, 2).fill(aC)
    g.roundRect(-hW - 2, -hH - 6, 14, H + 6, 2).stroke({ color: 0xffffff, width: 0.8, alpha: 0.4 })
    // Cab window
    g.roundRect(-hW + 1, -hH - 3, 8, 8, 1.5).fill(0x0f172a)
    g.roundRect(-hW + 1, -hH - 3, 8, 4, 1.5).fill({ color: 0x87ceeb, alpha: 0.4 })
    // Cab roof
    g.roundRect(-hW - 4, -hH - 8, 18, 3, 1).fill({ color: 0x000000, alpha: 0.3 })
    // ── Tender car (coal wagon behind cab) ──
    g.roundRect(-hW - 24, -hH + 1, 20, H - 2, 3).fill(bC)
    g.roundRect(-hW - 24, -hH + 1, 20, H - 2, 3).stroke({ color: 0xffffff, width: 0.8, alpha: 0.35 })
    // Coal load
    g.poly([-hW-22,-hH+1, -hW-18,-hH-3, -hW-12,-hH-2, -hW-6,-hH+1]).fill({ color: 0x111111 })
    // Tender wheels
    g.circle(-hW - 18, hH + 3, 5).fill(0x1f2937).stroke({ color: 0x6b7280, width: 1 })
    g.circle(-hW - 18, hH + 3, 2).fill(0x9ca3af)
    g.circle(-hW - 8, hH + 3, 5).fill(0x1f2937).stroke({ color: 0x6b7280, width: 1 })
    g.circle(-hW - 8, hH + 3, 2).fill(0x9ca3af)
    // ── Connecting rods (detailed, multiple) ──
    g.rect(-22, hH + 1, 40, 2).fill({ color: 0x9ca3af, alpha: 0.5 })
    g.rect(-18, hH + 0, 34, 1).fill({ color: 0x6b7280, alpha: 0.3 })
    // ── Valve gear (Walschaerts motion) ──
    g.rect(-10, hH - 2, 18, 1.5).fill({ color: 0x9ca3af, alpha: 0.35 })
    g.circle(6, hH - 1, 2).fill({ color: 0x9ca3af, alpha: 0.4 })
    // ── Piston cross-head (front) ──
    g.roundRect(hW - 6, hH - 3, 6, 5, 1).fill({ color: 0x9ca3af, alpha: 0.4 })
    g.rect(hW - 4, hH + 0, 8, 1.5).fill({ color: 0x6b7280, alpha: 0.35 })
    // ── Steam pipes (on side of boiler) ──
    g.rect(dX + 2, -hH + 2, hW - dX - 4, 1.5).fill({ color: 0x9ca3af, alpha: 0.3 })
    // ── Firebox glow (under boiler, orange) ──
    g.rect(-hW + 14, hH - 2, 12, 3).fill({ color: 0xf97316, alpha: 0.2 })
    g.rect(-hW + 16, hH - 1, 8, 2).fill({ color: 0xfbbf24, alpha: 0.15 })
    // ── Whistle (on boiler top) ──
    g.rect(dX - 4, -hH - 5, 2, 5).fill({ color: 0xd97706, alpha: 0.5 })
    g.circle(dX - 3, -hH - 6, 1.5).fill({ color: 0xf59e0b, alpha: 0.6 })
    // ── Bell (front of boiler) ──
    g.circle(hW - 10, -hH - 3, 2.5).fill({ color: 0xd97706, alpha: 0.45 })
    g.rect(hW - 10, -hH - 6, 1, 3).fill({ color: 0xd1d5db, alpha: 0.35 })
    // ── Handrails (running along boiler) ──
    g.rect(-hW + 12, -hH + 2, hW * 2 - 26, 0.8).fill({ color: 0xfbbf24, alpha: 0.2 })
    // ── Water gauge (cab side) ──
    g.rect(-hW + 2, -hH + 8, 2, 8).fill({ color: 0x0891b2, alpha: 0.3 })
    g.rect(-hW + 2, -hH + 12, 2, 4).fill({ color: 0x22d3ee, alpha: 0.4 })
    // ── Splasher / wheel guard ──
    g.poly([-16, hH - 2, -4, hH - 2, -4, hH + 1, -16, hH + 1]).fill({ color: bC, alpha: 0.3 })
    g.arc(-10, hH + 3, 8, Math.PI, 0).stroke({ color: aC, width: 1.5, alpha: 0.3 })
  }
}

// v54.10 — Premium polish overlay. Adds 4 finishing touches (rim highlight, soft
// underbody shadow, vertical chassis weathering streaks, diagonal shine sweep)
// on top of any procedural train. Universal — every category benefits. Character
// trains use a separate sprite render path and are skipped via isCharacter check
// at the call sites.
function g14PolishOverlay(g) {
  const W = 70, hW = 35, H = 26, hH = 13
  // 1) Top-edge rim highlight (light glances off top of body — adds metallic feel)
  g.rect(-hW + 4, -hH, W - 8, 0.8).fill({ color: 0xffffff, alpha: 0.35 })
  g.rect(-hW + 4, -hH + 0.8, W - 8, 0.6).fill({ color: 0xffffff, alpha: 0.18 })
  // 2) Soft underbody shadow (ground contact gradient — anchors train to ground)
  g.rect(-hW + 2, hH + 6, W - 4, 1).fill({ color: 0x000000, alpha: 0.20 })
  g.rect(-hW + 4, hH + 7, W - 8, 1).fill({ color: 0x000000, alpha: 0.10 })
  // 3) Subtle vertical chassis streak (water/rust weathering — realism touch)
  for (let we = 0; we < 3; we++) {
    g.rect(-hW + 16 + we * 18, -hH + 4, 0.4, H - 8).fill({ color: 0x000000, alpha: 0.08 })
  }
  // 4) Body shine sweep (diagonal highlight band — gives 3D feel without gradient cost)
  g.poly([-hW + 8, -hH + 1, -hW + 22, -hH + 1, -hW + 14, -hH + 8, -hW, -hH + 8]).fill({ color: 0xffffff, alpha: 0.06 })
}

function buildPlayer() {
  const c = new PIXI.Container(); L.player = c; stage.addChild(c)
  // Lock scale.x=1 — drawTrainG authors the sprite right-facing (nose at +X).
  // Any stray negative scale would render the train "backward". Defensive.
  c.scale.x = 1
  c.x = app.screen.width * PLAYER_X

  // Glow ellipse
  playerGlow = new PIXI.Graphics()
  playerGlow.ellipse(0, 8, 38, 12).fill(0x86efac)
  playerGlow.alpha = 0.25
  c.addChild(playerGlow)

  // Train graphic (replaces emoji Text for cross-device compatibility)
  playerSprite = new PIXI.Graphics()
  drawTrainG(playerSprite, '#1e3a8a', '#3b82f6', 'diesel_id')  // default until train selected
  c.addChild(playerSprite)

  // v55.45 B-230 — the rail strip is now a FIXED 18px half-strip (RAIL_HALF, not
  // the old laneH*0.28). The stale laneH-based wheelOffset pushed the container
  // ~34px below the rail on tall lanes → train "floats off the rail." Container now
  // sits AT lane center; the character sprite's 0.86 wheel-band anchor + procedural
  // wheels (local +19) both land on the bottom rail (lane center +18).
  const wheelOffset = 0
  c.y = laneYs[S.lane] + wheelOffset
  c._wheelOffset = wheelOffset

  // Steam container
  L.steam = new PIXI.Container(); stage.addChild(L.steam)
}

function updatePlayerEmoji() {
  if (!playerSprite || !S.trainCfg) return

  // v55.2 — Character trains use their WebP sprite via PIXI.Assets.load.
  // Replaces v54.87 PIXI.Sprite.from + addEventListener path which silently
  // failed in production (Agent G root cause: load event unreliable; texture
  // stuck at 1×1 placeholder; RAF poll exhausted 60 frames before update).
  // Mirror of the v54.96 balapan-kereta-side.html fix that DOES work in puppeteer.
  // Closes B-201.
  if (S.trainCfg.isCharacter && S.trainCfg.spriteUrl) {
    const url = S.trainCfg.spriteUrl
    if (!L.playerCharImg || L.playerCharImg._url !== url) {
      // v55.45 B-232 — owner: "ukuran keretanya tidak uniform, pastikan sama
      // ketinggiannya, lock aspect ratio perkereta." Every train renders at one
      // UNIFORM height; aspect is preserved (uniform scalar on both axes), so no
      // distortion — wide trains stay wide, none are stretched.
      const targetH = G14_UNIFORM_H
      PIXI.Assets.load(url).then((tex) => {
        // Tear down any previous character sprite
        if (L.playerCharImg && L.playerCharImg.parent) {
          try { L.playerCharImg.parent.removeChild(L.playerCharImg) } catch(_){}
          try { L.playerCharImg.destroy() } catch(_){}
        }
        const img = new PIXI.Sprite(tex)
        img._url = url
        // v55.45 B-230 — owner: "Karakter tidak pas di rail." Anchor at the wheel
        // band (~0.86 down) so the wheels — not the chimney — sit on the rail line.
        img.anchor.set(0.5, 0.86)
        // v55.38 B-223 — g14 is a HORIZONTAL 3-lane race; forward = RIGHT. Use
        // horizontal MIRROR for left-facing assets; right + forward stay native.
        img.scale.set(targetH / tex.height)
        const _faces = (S.trainCfg && S.trainCfg.faces) || 'right'
        if (_faces === 'left') img.scale.x *= -1
        L.playerCharImg = img
        L.player.addChild(img) // TOP of z-stack — covers cleared procedural Graphics
        try { playerSprite.clear() } catch(_){}
      }).catch((e) => {
        console.warn('[g14] sprite load failed; falling back to procedural', url, e)
        // Procedural fallback (current code path below will draw with bodyColor)
        const cat = S.trainCfg.category || ''
        const drawKey = cat.includes('maglev') ? 'maglev' : cat.includes('hsr') ? 'hsr' : cat.includes('steam') ? 'steam' : cat.includes('emu') ? 'emu' : 'diesel'
        drawTrainG(playerSprite, S.trainCfg.bodyColor, S.trainCfg.accColor, drawKey, S.trainCfg.key, S.trainCfg.variant||1)
      })
    }
    return // skip procedural draw — sprite is loading (or already loaded)
  }

  // Non-character train — procedural path (current behavior, unchanged).
  // If we previously rendered a character sprite, hide it now so it doesn't
  // leak into the next race when a non-character train is selected.
  if (L.playerCharImg && L.playerCharImg.parent) {
    try { L.playerCharImg.parent.removeChild(L.playerCharImg); L.playerCharImg.destroy() } catch(_){}
    L.playerCharImg = null
  }
  const cat = S.trainCfg.category || ''
  const drawKey = cat.includes('maglev') ? 'maglev' : cat.includes('hsr') ? 'hsr' : cat.includes('steam') ? 'steam' : cat.includes('emu') ? 'emu' : 'diesel'
  drawTrainG(playerSprite, S.trainCfg.bodyColor, S.trainCfg.accColor, drawKey, S.trainCfg.key, S.trainCfg.variant||1)
  // v54.10 — Apply universal polish overlay (skip for character trains; they use
  // sprite render via spriteUrl, not procedural). PROTECTED trains untouched.
  if (!S.trainCfg.isCharacter && typeof g14PolishOverlay === 'function') {
    g14PolishOverlay(playerSprite)
  }
}

function tickPlayer(delta) {
  if (!L.player) return
  const targetY = laneYs[S.targetLane] + (L.player._wheelOffset || 0)
  const dy = targetY - L.player.y
  // v54.8 carriage sway, v54.27 polish:
  //   - Position lerp is now MONOTONIC (was `* (1 + sin*0.18)` which could
  //     briefly reverse mid-switch causing the visible "jelly wobble").
  //   - Sway curve is rotation-only (body twist), capped at 0.05 rad.
  //   - Dust kickup only fires in the first 18 frames of the switch (start-of-turn
  //     burst) instead of the entire transition so a slow rebound doesn't keep emitting.
  //   - Cache _switchDySign so camera tilt (below) uses a stable sign even after dy
  //     near-zeroes at the end of the move.
  const dyAbs = Math.abs(dy)
  if (dyAbs > 4) {
    S.switchFrame = (S.switchFrame | 0) + 1
    L.player._switchDySign = Math.sign(dy)
    L.player.y += dy * 0.22 * delta
    L.player.rotation = Math.sin(S.switchFrame * 0.18) * 0.05 * L.player._switchDySign
    if (S.switchFrame <= 18 && S.switchFrame % 6 === 0 && L.fx) g14SpawnLaneDust()
  } else {
    L.player.y += dy * 0.22 * delta
    if (L.player.rotation) L.player.rotation *= 0.85
    S.switchFrame = 0
    L.player._switchDySign = 0
  }

  // Bob
  L.player.y += Math.sin(S.frame * 0.12) * 0.4

  // Glow pulse
  if (playerGlow) playerGlow.alpha = 0.18 + Math.sin(S.frame * 0.08) * 0.1

  // Invincibility flash
  if (S.invincible > 0) {
    S.invincible -= delta
    L.player.alpha = Math.sin(S.invincible * 0.7) > 0 ? 1 : 0.3
    if (S.invincible <= 0) L.player.alpha = 1
  }

  // Screen shake on crash. v54.17 A9: replaced rotational jitter (nauseating
  // for some kids) with cinematic scale ZOOM 1→1.08→1 over ~24 frames. Owner:
  // hit-stop weight via scale instead of rotation.
  // v54.51: short-circuit when reduce-motion is on — just decay the timer
  // without applying any visual transform so anak sensori sensitif tetap aman.
  if (S.shakeTimer > 0 && g14ReducedMotion()) {
    S.shakeTimer = 0
  }
  if (S.shakeTimer > 0) {
    S.shakeTimer -= delta
    const t = S.shakeTimer / 22
    stage.x = Math.sin(S.shakeTimer * 1.5) * 7 * t
    stage.y = Math.cos(S.shakeTimer * 1.2) * 4 * t
    stage.rotation = 0
    // Scale zoom: bell curve peaking mid-shake at +0.08
    const zoomScale = 1 + 0.08 * Math.sin(t * Math.PI)
    stage.scale.set(zoomScale)
  } else if (stage.scale && Math.abs(stage.scale.x - 1) > 0.001) {
    // Smooth back to 1.0
    const ns = stage.scale.x + (1 - stage.scale.x) * 0.18
    stage.scale.set(ns)
    stage.x *= 0.8
    stage.y *= 0.8
  } else {
    stage.x *= 0.8
    stage.y *= 0.8
    stage.rotation *= 0.7
  }
  // v54.17 A11 + v54.27 polish: banked-turn camera tilt during lane switch.
  // Was computing `_tiltDy` AFTER tickPlayer's position update, so dy could
  // be near-zero or sign-flipped at the end of the move → 1-frame counter-tilt.
  // Now uses L.player._switchDySign cached at the START of the move (only set
  // while |dy| > 4) so the tilt is monotonic.
  const sign = L.player._switchDySign || 0
  if (sign) {
    const targetTilt = sign * 0.03
    stage.rotation += (targetTilt - stage.rotation) * 0.12
  } else if (Math.abs(stage.rotation) > 0.001) {
    stage.rotation *= 0.85
  }
}

// ── Steam ─────────────────────────────────────────────────
function tickSteam(delta) {
  S.frame++
  // Only spawn smoke for steam trains
  const cat = S.trainCfg?.category || ''
  const isSteamTrain = cat.includes('steam')
  if (S.frame % 3 === 0 && isSteamTrain) spawnSteam()
  // Diesel gets small exhaust puffs (less visible)
  if (S.frame % 8 === 0 && !isSteamTrain && cat.includes('diesel')) spawnSteam()
  for (let i = S.steam.length - 1; i >= 0; i--) {
    const p = S.steam[i]
    p.g.x -= (S.speed * 0.6 + p.vx) * delta
    p.g.y += p.vy * delta
    p.life -= p.decay * delta
    p.g.alpha = p.life * 0.5
    p.g.scale.set(1 + (1 - p.life) * 1.5)
    if (p.life <= 0) { L.steam.removeChild(p.g); S.steam.splice(i, 1) }
  }
}
function spawnSteam() {
  if (!L.player) return
  const px = L.player.x - 24  // top of boiler
  const py = L.player.y - 22
  // v54.17 A16: 3-blob cluster (was single circle) tinted by current TIME_OF_DAY
  // phase's cloudTint when available. BlurFilter strength 2 gives soft cloudlike
  // diffusion. Color falls back to phase-aware white otherwise.
  const g = new PIXI.Graphics()
  const r = 4 + Math.random() * 5
  let tint = S.boosting ? 0xff6622 : 0xdcdcdc
  try {
    const colors = (typeof g14CurrentSkyColors === 'function') ? g14CurrentSkyColors() : null
    if (colors && colors.cloudTint != null && !S.boosting) tint = colors.cloudTint
  } catch(_){}
  // 3-blob cluster
  g.circle(0, 0, r).fill(tint)
  g.circle(-r * 0.7, r * 0.2, r * 0.7).fill(tint)
  g.circle(r * 0.6, -r * 0.3, r * 0.6).fill(tint)
  try {
    if (PIXI.BlurFilter) g.filters = [new PIXI.BlurFilter({ strength: 2 })]
  } catch(_){}
  g.x = px + (Math.random() - 0.5) * 8
  g.y = py
  g.alpha = 0.55
  L.steam.addChild(g)
  S.steam.push({ g, vx: 0.3 + Math.random() * 0.5, vy: -(0.8 + Math.random() * 1.2), life: 1, decay: 0.038 + Math.random() * 0.025 })
}

// ── AI Trains ─────────────────────────────────────────────
function buildAI() {
  L.ai.removeChildren()
  S.aiTrains = []
  // v55.32 B-221 — use NPC_TRAINS (excludes PROTECTED + AEG Thomas pack).
  const pool = shuffle([...NPC_TRAINS]).slice(0, AI_COUNT)
  pool.forEach((cfg, i) => {
    const c = new PIXI.Container()
    const spr = new PIXI.Graphics()
    // v54.87 — Character AI also uses WebP sprite. Procedural drawn behind as
    // safety placeholder (in case sprite fails to load); sprite covers it.
    drawTrainG(spr, cfg.bodyColor || '#374151', cfg.accColor || '#9ca3af', cfg.category)
    if (!cfg.isCharacter && typeof g14PolishOverlay === 'function') g14PolishOverlay(spr)
    c.addChild(spr)

    // v55.2 — AI character sprite via PIXI.Assets.load (mirrors player path).
    // Replaces v54.87 PIXI.Sprite.from which silently failed. Closes B-201 AI side.
    if (cfg.isCharacter && cfg.spriteUrl) {
      // v55.45 B-232 — uniform height (AI slightly smaller than player). B-230 —
      // wheel-band anchor so AI wheels sit on the rail line too.
      const targetH = G14_UNIFORM_H * 0.85
      PIXI.Assets.load(cfg.spriteUrl).then((tex) => {
        const img = new PIXI.Sprite(tex)
        img.anchor.set(0.5, 0.86)
        // v55.38 B-223 — horizontal mirror, no rotation (see player above).
        img.scale.set(targetH / tex.height)
        const _faces = (cfg.faces) || 'right'
        if (_faces === 'left') img.scale.x *= -1
        c.addChild(img)
        try { spr.clear() } catch(_){}
      }).catch((e) => {
        console.warn('[g14] AI sprite load fail; keeping procedural', cfg.key, e)
      })
    }

    // Glow
    const glow = new PIXI.Graphics()
    glow.ellipse(0, 8, 28, 9).fill(0x86efac)
    glow.alpha = 0.18
    c.addChild(glow)

    const aiLane = [0, 1, 2].filter(l => l !== S.lane)[i % 2]
    c.y = laneYs[aiLane]
    // 2026-06-21 fairness pass — owner: "AI rubber-band + head start makes it
    // un-winnable". Equal starting grid (was: 0.55-0.70 head start at width).
    // Deterministic per-AI speed tier (was: 0.96 + Math.random() * 0.08).
    c.x = app.screen.width * 0.15
    L.ai.addChild(c)
    // AI tier: train 0 = slower (0.92×), train 1 = faster (1.04×). Both
    // deterministic — no per-frame randomness. Tunes match difficulty without
    // making the race feel rigged.
    const AI_TIERS = [0.92, 1.04]
    // v54.12 — AI thought bubble. Small Pixi Text floating above each AI showing
    // its current "intent" — gives the rival visible personality so the race feels
    // alive instead of empty. State updated by tickAI via _intentText.
    // v54.17 A8: wider bubble (74 vs 64) so we can fit a tiny train silhouette
    // marker to the LEFT of the intent text — kids see WHO is taunting them.
    const bubble = new PIXI.Graphics()
    bubble.roundRect(-37, -36, 74, 18, 6).fill({ color: 0xffffff, alpha: 0.92 })
    bubble.roundRect(-37, -36, 74, 18, 6).stroke({ color: 0x1f2937, width: 1 })
    // tail
    bubble.poly([-3, -18, 0, -10, 3, -18]).fill({ color: 0xffffff, alpha: 0.92 })
    bubble.alpha = 0
    c.addChild(bubble)
    // v54.17 A8: tiny tinted train silhouette (12×6 box + dot wheels) using cfg's bodyColor.
    const sil = new PIXI.Graphics()
    const silColor = (cfg.bodyColor && /^#[0-9a-f]{6}$/i.test(cfg.bodyColor))
      ? parseInt(cfg.bodyColor.slice(1), 16) : 0x4b5563
    sil.rect(-26, -32, 12, 6).fill({ color: silColor })
    sil.rect(-20, -34, 5, 2).fill({ color: silColor })  // cab
    sil.circle(-22, -25, 1.4).fill({ color: 0x1f2937 })
    sil.circle(-16, -25, 1.4).fill({ color: 0x1f2937 })
    sil.alpha = 0
    c.addChild(sil)
    const txt = new PIXI.Text({ text: '...', style: { fontFamily: 'Fredoka One, sans-serif', fontSize: 11, fill: 0x1f2937, align: 'center' } })
    txt.anchor.set(0.5)
    txt.x = 5; txt.y = -27  // shifted +5 to make room for silhouette on the left
    txt.alpha = 0
    c.addChild(txt)
    // v54.52: assign one of 3 personality archetypes per AI train. Persona drives
    // boost frequency, lane-swap behaviour, and intent vocabulary in tickAI.
    //   - reckless: boosts 2× more often, doesn't swap lanes
    //   - cautious: swaps lane when obstacle ahead < 220px in own lane
    //   - copycat:  mirrors player's lane 800ms after a change
    const PERSONAS = ['reckless','cautious','copycat']
    const _persona = PERSONAS[(i + Math.floor(Math.random() * 3)) % PERSONAS.length]
    S.aiTrains.push({
      cfg, container: c,
      lane: aiLane,
      speed: S.baseSpeed * (AI_TIERS[i] || 1.0),
      distance: 0,
      hp: 3,  // AI also takes damage — fairness symmetry
      // v54.12 — intent system; v54.17 A8 adds silhouette `sil`.
      bubble, txt, sil,
      intent: 'lurus', intentTimer: 60,
      // v54.42: AI mini-boost matching thought bubble.
      boostTimer: 0,
      // v54.52: persona archetype.
      persona: _persona,
      copycatDelay: 0,
      lastPlayerLane: -1,
      // v54.50: track distance-relative-to-player from last frame so a
      // SIGN CHANGE = overtake event. Throttled by lastWhistleAt to avoid
      // doppler spam on close pacing.
      lastRelDist: 0,
      lastWhistleAt: 0,
    })
  })
}

// v54.12 — Rotate AI intent message (small dictionary). Gives visible personality.
const G14_AI_INTENTS = ['Maju!', 'Hati2!', 'Ngebut...', 'Pindah!', 'Hampir!', 'Wuss!', 'Hindari!']
function g14PickIntent(){ return G14_AI_INTENTS[Math.floor(Math.random()*G14_AI_INTENTS.length)] }

function tickAI(delta) {
  const W = app.screen.width
  const playerX = W * PLAYER_X

  S.aiTrains.forEach(ai => {
    // v54.42: catch-up boost. AI behind the player gets a small chance per
    // frame to fire a "Ngebut..." boost. Effect is bell-curved over ~1.5s
    // and capped at +15%. Keeps the race feeling alive without unfair
    // teleportation. AI ahead of player never gets the boost — only the
    // straggler closes gaps, never the leader runs away.
    const behind = ai.distance < S.distance - 40
    if (ai.boostTimer > 0) ai.boostTimer -= delta
    // v54.52: persona-modulated boost probability + behaviour.
    const _personaBoostMult = ai.persona === 'reckless' ? 2.2 : ai.persona === 'cautious' ? 0.6 : 1.0
    if (behind && ai.boostTimer <= 0 && Math.random() < 0.0018 * _personaBoostMult) {
      ai.boostTimer = 90
      if (ai.txt) {
        const intent = ai.persona === 'reckless' ? 'Ngebut!' : ai.persona === 'cautious' ? 'Hati2!' : 'Ngebut...'
        ai.intent = intent; ai.txt.text = intent; ai.intentTimer = 150
      }
    }
    // v54.52: cautious AI swaps lane when obstacle ahead < 220px in own lane.
    if (ai.persona === 'cautious' && S.frame % 30 === 0) {
      for (let oi = 0; oi < S.obstacles.length; oi++) {
        const o = S.obstacles[oi]
        if (o._lane === ai.lane && o.x > 0 && o.x < 220) {
          ai.lane = (ai.lane + (Math.random() < 0.5 ? -1 : 1) + 3) % 3
          if (ai.txt) { ai.intent = 'Pindah!'; ai.txt.text = 'Pindah!'; ai.intentTimer = 90 }
          break
        }
      }
    }
    // v54.52: copycat AI mirrors player's lane after 800ms (48 frames at 60fps).
    if (ai.persona === 'copycat') {
      if (S.lane !== ai.lastPlayerLane) {
        ai.copycatDelay = 48
        ai.lastPlayerLane = S.lane
      }
      if (ai.copycatDelay > 0) {
        ai.copycatDelay -= delta
        if (ai.copycatDelay <= 0 && ai.lane !== S.lane) {
          ai.lane = S.lane
          if (ai.txt) { ai.intent = 'Ikut!'; ai.txt.text = 'Ikut!'; ai.intentTimer = 80 }
        }
      }
    }
    const boostMult = ai.boostTimer > 0
      ? 1 + 0.15 * Math.sin(((90 - ai.boostTimer) / 90) * Math.PI)
      : 1
    // v54.50: detect overtake — sign change of (ai.distance - S.distance).
    // Throttle 1.5s to avoid doppler chirp on close pacing.
    const _curRel = ai.distance - S.distance
    const _now = S.frame
    if (ai.lastRelDist !== undefined &&
        Math.sign(_curRel) !== Math.sign(ai.lastRelDist) &&
        Math.abs(_curRel) < 80 && Math.abs(ai.lastRelDist) < 80 &&
        (_now - ai.lastWhistleAt) > 90) {
      ai.lastWhistleAt = _now
      // Descending whistle 880Hz → 440Hz (doppler pass).
      try { playTone(880, 0.10, 'sine'); setTimeout(() => playTone(660, 0.10, 'sine'), 100); setTimeout(() => playTone(440, 0.14, 'sine'), 200) } catch(_){}
    }
    ai.lastRelDist = _curRel
    ai.distance += ai.speed * boostMult * delta * 0.12
    // Screen position based on relative distance
    const relDist = ai.distance - S.distance
    const screenX = playerX + relDist * 1.8
    ai.container.x = screenX
    ai.container.visible = screenX > -80 && screenX < W + 80
    // Bob
    ai.container.y = laneYs[ai.lane] + Math.sin(S.frame * 0.1 + ai.lane) * 0.5
    // v54.12 — Update thought bubble: rotate intent every ~2.5s (60 frames *
    // 2.5 = 150 frames), fade in for 30 frames, fade out after 120 frames.
    if (ai.txt && ai.bubble){
      ai.intentTimer -= delta
      if (ai.intentTimer <= 0){
        ai.intent = g14PickIntent()
        ai.intentTimer = 150
        ai.txt.text = ai.intent
      }
      // Bubble visibility window: appears at start of intent, fades out at the end.
      const t = (150 - ai.intentTimer) / 150
      const a = t < 0.18 ? t / 0.18 : t > 0.85 ? (1 - t) / 0.15 : 1
      const tgt = ai.container.visible ? a : 0
      ai.txt.alpha += (tgt - ai.txt.alpha) * 0.15
      ai.bubble.alpha = ai.txt.alpha
      if (ai.sil) ai.sil.alpha = ai.txt.alpha  // v54.17 A8
    }
  })

  // Update race position
  const aiAhead = S.aiTrains.filter(a => a.distance > S.distance).length
  S.position = aiAhead + 1
  const posText = S.position === 1 ? '🥇 Posisi 1!' : S.position === 2 ? '🥈 Posisi 2' : '🥉 Posisi 3'
  document.getElementById('position-badge').textContent = posText
  // v54.17 A5: gap-to-next chip. Show metric gap to the rival above OR behind you.
  const gapEl = document.getElementById('g14-position-gap')
  if (gapEl) {
    let gapText = ''
    if (S.position === 1) {
      // Closest chaser
      const chasers = S.aiTrains.filter(a => a.distance < S.distance)
      if (chasers.length) {
        const top = chasers.reduce((m, a) => a.distance > m ? a.distance : m, -Infinity)
        const gap = Math.max(0, Math.floor(S.distance - top))
        gapText = `+${gap}m unggul`
      }
    } else {
      // Closest leader above
      const leaders = S.aiTrains.filter(a => a.distance > S.distance)
      if (leaders.length) {
        const closest = leaders.reduce((m, a) => a.distance < m ? a.distance : m, Infinity)
        const gap = Math.max(0, Math.floor(closest - S.distance))
        const tgt = S.position === 2 ? '1' : (S.position - 1).toString()
        gapText = `-${gap}m ke #${tgt}`
      }
    }
    gapEl.textContent = gapText
  }
}

// v54.51: reduce-motion gate — honors prefers-reduced-motion media query AND
// an explicit localStorage opt-in. Shake/confetti/dust/zoom short-circuit when on.
function g14ReducedMotion() {
  try {
    if (localStorage.getItem('g14-reduced-motion') === '1') return true
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return true
  } catch(_){}
  return false
}

// ── Obstacles ─────────────────────────────────────────────
const OBS_EMOJIS = ['🪨','🐄','🐔','🌵','⚠️','🛑','🪵','🧱']
// v54.49: per-biome obstacle palette. Cacti only in desert, logs only in forest,
// snowmen only in snow, etc. Empty fallback → use generic OBS_EMOJIS pool.
const OBS_PER_BIOME = {
  forest:  ['🪨','🐄','🐔','🪵','🌲','🦌','🍄'],
  desert:  ['🪨','🌵','🐍','🦂','⚠️','🛑'],
  snow:    ['🪨','⛄','🦌','🧊','⚠️','🛑'],
  coastal: ['🪨','🦀','🐚','⚓','🛑','🌴'],
  urban:   ['🚧','🛑','⚠️','🚖','🧱','🚸'],
  volcano: ['🪨','🔥','💥','⚠️','🛑','🪨']
}
let OBS_SIZE = 44   // A-311 — responsive: recomputed from viewport in initPixi

function spawnObstacle() {
  // Spawn uniformly across all 3 lanes (including middle). Player gets reaction
  // buffer from the distance D ahead, not from lane-exclusion. Previous logic
  // excluded the player's lane → middle lane never spawned anything, owner
  // could park there forever ("di lane tengah tidak ada halangan").
  const lane = Math.floor(Math.random() * 3)
  const W = app.screen.width
  // v54.49: pick from biome-specific pool so cacti only show in desert, etc.
  const _pool = OBS_PER_BIOME[TH.name] || OBS_EMOJIS
  const emoji = _pool[Math.floor(Math.random() * _pool.length)]

  const c = new PIXI.Container()
  const txt = new PIXI.Text({ text: emoji, style: { fontSize: OBS_SIZE, fontFamily: 'Arial' } })
  txt.anchor.set(0.5)
  c.addChild(txt)

  // Warning glow
  const wg = new PIXI.Graphics()
  wg.circle(0, 0, OBS_SIZE * 0.65).fill(0xef4444)
  wg.alpha = 0.15
  c.addChild(wg)

  c.x = W + OBS_SIZE
  c.y = laneYs[lane]
  c._lane = lane
  c._alive = true
  c._warned = false
  c._emoji = emoji         // v54.19 B1 — for crashHit's per-obstacle SFX
  c._nearmissFired = false  // v54.17 A3

  L.obstacles.addChild(c)
  S.obstacles.push(c)

  // Lane warning
  const warnBtns = ['btn-up','btn-boost','btn-dn']
  // Flash the lane change button
  const btnId = lane === 0 ? 'btn-dn' : lane === 2 ? 'btn-up' : null
  if (btnId) {
    const btn = document.getElementById(btnId)
    if (btn) { btn.style.borderColor = '#ef4444'; btn.style.boxShadow = '0 0 12px rgba(239,68,68,0.6)'; setTimeout(() => { btn.style.borderColor = ''; btn.style.boxShadow = '' }, 600) }
  }
}

// v54.31 I17: per-level obstacle approach multiplier. Computed once.
//   L1 → 1.000 ×, L5 → 1.000 ×, L10 → 1.060 ×, L20 → 1.180 ×, L30 → 1.300 ×
// Difficulty mode amplifies (hard) or dampens (easy) the curve. Keeps the
// same train baseSpeed but the lane becomes progressively more demanding,
// matching the locked "improve, continuous refine" mandate.
const _G14_OBS_LEVEL_MULT = (function () {
  const lvl = cfg.level || 5
  const base = 1.0 + Math.max(0, lvl - 5) * 0.012
  if (cfg.difficulty === 'easy') return 1.0 + (base - 1.0) * 0.6
  if (cfg.difficulty === 'hard') return 1.0 + (base - 1.0) * 1.35
  return base
})()
function tickObstacles(delta) {
  const W = app.screen.width
  const playerX = W * PLAYER_X
  const hitZoneX = playerX + 10

  for (let i = S.obstacles.length - 1; i >= 0; i--) {
    const o = S.obstacles[i]
    if (!o._alive) { L.obstacles.removeChild(o); S.obstacles.splice(i, 1); continue }

    o.x -= S.speed * delta * _G14_OBS_LEVEL_MULT
    // Pulse warning
    o.children[1].alpha = 0.1 + Math.sin(S.frame * 0.2) * 0.1

    // v55.7 — Increment dodgeCount when obstacle scrolls off-screen WITHOUT
    // having hit the player. Used by endRace() engagement-index gate (B-203).
    if (o.x < -OBS_SIZE * 2) {
      if (!o._crashed) S.dodgeCount = (S.dodgeCount || 0) + 1
      o._alive = false
      continue
    }

    // Collision
    if (S.invincible <= 0 && o._lane === S.lane &&
        o.x > hitZoneX - OBS_SIZE && o.x < hitZoneX + OBS_SIZE) {
      o._alive = false
      o._crashed = true  // v55.7 — mark so off-screen tick doesn't count it as a dodge
      crashHit(o._emoji)  // v54.19 B1
      continue
    }
    // v54.17 A3: near-miss bonus. Fire ONCE when an adjacent-lane obstacle
    // crosses the player column within 1 lane. Rewards close-pass bravery.
    if (!o._nearmissFired && Math.abs(o._lane - S.lane) === 1 &&
        o.x > hitZoneX - OBS_SIZE && o.x < hitZoneX + OBS_SIZE) {
      o._nearmissFired = true
      g14SpawnNearMiss(playerX, gameTop + laneH * (S.lane + 0.5))
      S.pressure = Math.min(100, S.pressure + 5)
      try { updatePressure() } catch(_){}
      try { playTone(1100, 0.05, 'triangle') } catch(_){}
    }
  }
}

function g14SpawnNearMiss(x, y){
  const el = document.createElement('div')
  el.className = 'g14-nearmiss'
  el.textContent = '+5 ⚡'
  // Pixi coords already correspond to canvas pixels — direct screen position.
  el.style.left = (x - 30) + 'px'
  el.style.top  = (y - 24) + 'px'
  document.body.appendChild(el)
  setTimeout(() => el.remove(), 1000)
}

function crashHit(obstacleEmoji) {
  if (S.invincible > 0) return
  S.invincible = 60
  // v54.17 A9: replace rotation jitter with cinematic scale zoom + chromatic flash.
  S.shakeTimer = 24
  S.zoomTimer  = 24
  S.hp--
  spawnCrashFX(L.player.x, L.player.y)
  // v54.54 VFX: TrainVFX particles (sparks + dust) + freeze-frame + chromatic
  // burst. Wired through the shared module so reduce-motion gate is automatic.
  try {
    if (window.TrainVFX && L.fx) {
      TrainVFX.particles.spawn({ type: 'crack',  parent: L.fx, x: L.player.x, y: L.player.y, count: 10, speed: 5, ttl: 28, gravity: 0.18 })
      TrainVFX.particles.spawn({ type: 'dust',   parent: L.fx, x: L.player.x, y: L.player.y + 8, count: 8, speed: 2, ttl: 40, gravity: 0.04, upBias: 0.2 })

      TrainVFX.screen.freezeFrame(90)
      TrainVFX.filters.chromatic(stage, 6)
      setTimeout(() => { try { stage.filters = null } catch(_){} }, 220)
    }
  } catch(_){}
  // v54.19 B1: per-obstacle SFX (cow moos, chicken cluck, rock thud, etc.) replaces
  // the single 200Hz crash tone.
  if (obstacleEmoji) g14ObsSFX(obstacleEmoji); else playTone(200, 0.2, 'square')
  // v54.31 I16: duck BGM on crash so the impact SFX cuts through.
  try { duckBgm(0.6, 420) } catch(_){}
  screenFlash('rgba(255,60,60,0.35)')
  // v54.54 VFX: vignette pulse intensifies if low HP (last life red breath).
  try {
    if (window.TrainVFX) {
      const col = (S.hp <= 1) ? 'rgba(239,68,68,0.8)' : 'rgba(239,68,68,0.5)'
      TrainVFX.screen.vignettePulse(col, 700)

  // v54.19 B9: haptic on crash.
  g14Vibrate([30, 50, 20])
  // v54.17 A4: animated heart loss
  try { g14SpawnHeartPop() } catch(_){}
  updateHUD()
  if (S.hp <= 0) {
    // v54.19 B11: 2.2s crash replay vignette before end-screen.
    try { g14RecordDeath() } catch(_){}
    g14CrashReplay(() => setTimeout(endRace, 100))
  }
}

// v54.17 A7: engine-rev preview SFX. ~400ms envelope per category.
// Steam = chuff-chuff. Diesel = rumble. EMU = electric whine. HSR = high whoosh.
// Maglev = synth ascend. characters = whimsical chime.
function g14PreviewEngine(catKey){
  const k = (catKey || '').toString()
  if (k === 'characters') {
    playTone(660, 0.08, 'triangle'); setTimeout(()=>playTone(880, 0.10, 'triangle'), 80); setTimeout(()=>playTone(1320, 0.14, 'triangle'), 180)
  } else if (k.indexOf('steam') === 0) {
    // chuff-chuff: noisy square pulses descending
    playTone(140, 0.08, 'square'); setTimeout(()=>playTone(120, 0.08, 'square'), 110); setTimeout(()=>playTone(100, 0.10, 'square'), 220)
  } else if (k.indexOf('diesel') === 0) {
    // low rumble: sawtooth slow oscillation
    playTone(90, 0.18, 'sawtooth'); setTimeout(()=>playTone(110, 0.12, 'sawtooth'), 160)
  } else if (k === 'emu') {
    // electric whine: rising triangle
    playTone(440, 0.10, 'triangle'); setTimeout(()=>playTone(660, 0.12, 'triangle'), 100); setTimeout(()=>playTone(880, 0.10, 'triangle'), 220)
  } else if (k === 'hsr') {
    // high whoosh: short sine sweep
    playTone(700, 0.08, 'sine'); setTimeout(()=>playTone(1100, 0.14, 'sine'), 90); setTimeout(()=>playTone(900, 0.10, 'sine'), 220)
  } else if (k === 'maglev') {

    playTone(330, 0.07, 'triangle'); setTimeout(()=>playTone(660, 0.07, 'triangle'), 80); setTimeout(()=>playTone(990, 0.07, 'triangle'), 160); setTimeout(()=>playTone(1320, 0.14, 'triangle'), 240)
  } else {
    playTone(440, 0.10, 'sine')
  }
}

function spawnCrashFX(x, y) {
  for (let i = 0; i < 18; i++) {
    const g = new PIXI.Graphics()
    const r = 2 + Math.random() * 5
    g.circle(0, 0, r).fill(i % 2 === 0 ? 0xff4444 : 0xffaa44)
    g.x = x; g.y = y
    L.fx.addChild(g)
    S.sparks.push({ g, vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 7 - 1, gravity: 0.3, life: 1, decay: 0.022 + Math.random() * 0.02 })
  }
}

function spawnBoostFX() {
  // v54.3 — Boost activation upgrade: 36 particles (was 24) + 2-tone gold/orange mix
  // + radial outward spray pattern + larger size band for visual punch.
  for (let i = 0; i < 36; i++) {
    const g = new PIXI.Graphics()
    const isOrange = i % 3 === 0
    const sz = 3 + Math.random() * 6
    g.circle(0, 0, sz).fill(isOrange ? 0xf97316 : 0xfbbf24)
    g.x = L.player.x + (Math.random() - 0.5) * 40
    g.y = L.player.y + (Math.random() - 0.5) * 20
    L.fx.addChild(g)
    // Radial spray angles for outer ring instead of pure horizontal
    const ang = (Math.PI*2) * (i/36)
    const speed = 3 + Math.random() * 5
    const vx = -speed - Math.cos(ang) * 1.5
    const vy = Math.sin(ang) * 2.5 + (Math.random() - 0.5)
    S.sparks.push({ g, vx, vy, gravity: 0.05, life: 1, decay: 0.025 + Math.random() * 0.02 })
  }
  // v54.3 — Player sprite shake 0.4s on boost activation (golden punch).
  if(L.player){
    const _t0 = performance.now()
    const _baseX = L.player.x
    function _shakeTick(){
      const dt = performance.now() - _t0
      if(dt >= 400){ L.player.x = _baseX; return }
      L.player.x = _baseX + (Math.random() - 0.5) * 4
      requestAnimationFrame(_shakeTick)
    }
    requestAnimationFrame(_shakeTick)
  }
}

function tickFX(delta) {
  for (let i = S.sparks.length - 1; i >= 0; i--) {
    const p = S.sparks[i]
    p.g.x += p.vx * delta; p.g.y += p.vy * delta
    p.vy += p.gravity * delta
    p.life -= p.decay * delta
    p.g.alpha = p.life
    if (p.life <= 0) { L.fx.removeChild(p.g); S.sparks.splice(i, 1) }
  }
}

// v54.17 A17: floating pickup tokens — coin (+10 score), lightning (+5 pressure),
// or heart (+1 HP up to LIVES_MAX). Random lane. Bob up/down. Collected on column overlap.
const PICKUP_TYPES = [
  { kind: 'coin',   emoji: '🪙', weight: 60, color: 0xfbbf24 },
  { kind: 'bolt',   emoji: '⚡', weight: 30, color: 0x60a5fa },
  { kind: 'heart',  emoji: '❤️', weight: 10, color: 0xef4444 },
]
function _pickPickupType(){
  const total = PICKUP_TYPES.reduce((s, t) => s + t.weight, 0)
  let r = Math.random() * total
  for (const t of PICKUP_TYPES) { if ((r -= t.weight) <= 0) return t }
  return PICKUP_TYPES[0]
}
function spawnPickup(){
  if (!L.fx) return
  const W = app.screen.width, H = app.screen.height
  const lane = Math.floor(Math.random() * LANE_COUNT)
  const type = _pickPickupType()
  // v55.61 B-240 — responsive: derive pickup radius from the viewport (was fixed
  // 22px) so it scales with the device like the train + obstacles. f = scale vs
  // the original 22px design.
  const PK = Math.round(Math.max(15, Math.min(Math.min(W, H) * 0.05, 26)))
  const f = PK / 22
  // Halo + emoji text. Halo gives the affordance "this is collectable, not an obstacle."
  const g = new PIXI.Container()
  const halo = new PIXI.Graphics()
  halo.circle(0, 0, PK).fill({ color: type.color, alpha: 0.18 })
  halo.circle(0, 0, PK * 0.72).fill({ color: type.color, alpha: 0.32 })
  halo.circle(0, 0, PK).stroke({ color: type.color, width: 1.5, alpha: 0.65 })
  // v54.51: color-blind safe — add a per-kind shape outline (square=coin,
  // diamond=bolt, heart-tick=heart, ring=other) layered above the halo when
  // localStorage g14-cb-safe === '1'. Shape carries the meaning so color
  // perception is no longer the only signal.
  try {
    if (localStorage.getItem('g14-cb-safe') === '1') {
      const m = new PIXI.Graphics()
      m.lineStyle = undefined
      const s = f   // scale color-blind shapes with the responsive pickup size
      if (type.kind === 'coin')      m.rect(-9*s, -9*s, 18*s, 18*s).stroke({ color: 0xffffff, width: 2 })
      else if (type.kind === 'bolt') m.poly([0,-12*s, 12*s,0, 0,12*s, -12*s,0]).stroke({ color: 0xffffff, width: 2 })
      else if (type.kind === 'heart')m.circle(-5*s, -3*s, 5*s).circle(5*s, -3*s, 5*s).stroke({ color: 0xffffff, width: 2 })
      else                            m.circle(0, 0, 14*s).stroke({ color: 0xffffff, width: 2 })
      g.addChild(m)
    }
  } catch(_){}
  const t = new PIXI.Text({ text: type.emoji, style: { fontSize: Math.round(26 * f), fontFamily: 'Arial' } })
  t.anchor.set(0.5)
  g.addChild(t)
  g.x = W + 60
  g.y = laneYs[lane]
  g._lane = lane
  g._kind = type.kind
  g._phase = Math.random() * Math.PI * 2
  g._alive = true
  L.fx.addChild(g)
  S.pickups.push(g)
}
function tickPickups(delta){
  if (!S.pickups || !S.pickups.length) return
  const W = app.screen.width
  const playerX = W * PLAYER_X
  for (let i = S.pickups.length - 1; i >= 0; i--) {
    const p = S.pickups[i]
    if (!p._alive) { L.fx.removeChild(p); S.pickups.splice(i, 1); continue }
    p.x -= S.speed * delta * 0.9
    p._phase += 0.10
    p.y = laneYs[p._lane] + Math.sin(p._phase) * 6
    // Spin halo subtly
    p.children[0].rotation += 0.04 * delta
    if (p.x < -60) { p._alive = false; continue }
    // Collection — player must be in same lane + overlapping column.
    if (p._lane === S.lane && p.x > playerX - 28 && p.x < playerX + 28) {
      p._alive = false
      // Apply effect.
      if (p._kind === 'coin') {
        S.coins = (S.coins || 0) + 10
        try { playTone(1200, 0.06, 'sine'); setTimeout(()=>playTone(1600, 0.10, 'sine'), 60) } catch(_){}
      } else if (p._kind === 'bolt') {
        S.pressure = Math.min(100, S.pressure + 5)
        try { updatePressure() } catch(_){}
        try { playTone(900, 0.06, 'triangle'); setTimeout(()=>playTone(1400, 0.08, 'triangle'), 50) } catch(_){}
      } else if (p._kind === 'heart') {
        if (S.hp < LIVES_MAX) { S.hp++; try { updateHUD() } catch(_){} }
        try { playTone(660, 0.10, 'sine'); setTimeout(()=>playTone(880, 0.12, 'sine'), 90); setTimeout(()=>playTone(1100, 0.14, 'sine'), 200) } catch(_){}
      }
      // Floating "+N" toast at the pickup's screen position.
      const labelMap = { coin: '+10 🪙', bolt: '+5 ⚡', heart: '+❤️' }
      const lbl = document.createElement('div')
      lbl.className = 'g14-nearmiss'
      lbl.style.color = p._kind === 'coin' ? '#fbbf24' : p._kind === 'bolt' ? '#60a5fa' : '#f87171'
      lbl.style.textShadow = '0 2px 8px rgba(0,0,0,0.6)'
      lbl.textContent = labelMap[p._kind] || '+'
      lbl.style.left = (p.x - 28) + 'px'
      lbl.style.top  = (p.y - 24) + 'px'
      document.body.appendChild(lbl)
      setTimeout(() => lbl.remove(), 900)
    }
  }
}

async function g14HandleShare(){
  try {
    let dataUrl = null
    if (app && app.renderer && app.renderer.extract && app.stage) {
      try { dataUrl = app.renderer.extract.canvas(app.stage).toDataURL('image/png') } catch(_){}
    }
    const payload = {
      title: 'Dunia Emosi — Balapan Kereta',
      text: `Aku raih ${S.position === 1 ? '🥇' : S.position === 2 ? '🥈' : '🥉'} ${Math.floor(S.distance)}m dengan ${(S.trainCfg && S.trainCfg.name) || 'kereta'} di Dunia Emosi! 🚂`
    }
    // v55.48 B-237 — fetch the data-URL ONCE (was twice) behind an AbortController
    // timeout so a slow/huge toDataURL blob conversion can never hang the share flow.
    let _file = null
    if (dataUrl) {
      try {
        const _ctrl = new AbortController()
        const _to = setTimeout(() => _ctrl.abort(), 8000)
        const _blob = await (await fetch(dataUrl, { signal: _ctrl.signal })).blob()
        clearTimeout(_to)
        _file = new File([_blob], 'race.png', { type: 'image/png' })
      } catch(_) { _file = null }
    }
    if (_file && navigator.canShare && navigator.canShare({ files: [_file] })) {
      await navigator.share({ ...payload, files: [_file] })
    } else if (navigator.share) {
      await navigator.share(payload)
    } else if (dataUrl) {

      document.body.appendChild(a); a.click(); a.remove()
    }
  } catch(_){}
}

// B8: Floating-chip mini-quiz. Triggered randomly during race; lanes stay active.
let _miniQuizArmed = false
function g14MaybeFloatMiniQuiz(){
  if (_miniQuizArmed || S.quizOpen || !S.running || S.gameOver) return
  // Fire approximately every ~25s of race AFTER 150m to give the player some warmup.
  if (S.distance < 150) return
  if (S.frame % (60 * 25) !== 0) return
  _miniQuizArmed = true
  const a = Math.floor(Math.random() * 9) + 1
  const b = Math.floor(Math.random() * 9) + 1
  const ans = a + b
  const qEl = document.getElementById('gmq-q')
  const grid = document.getElementById('gmq-grid')
  const ovl = document.getElementById('g14-mini-quiz')
  if (!qEl || !grid || !ovl) { _miniQuizArmed = false; return }
  qEl.textContent = `${a} + ${b} = ?`
  const wrongs = new Set()
  while (wrongs.size < 3) {
    const w = ans + (Math.random() < 0.5 ? -1 : 1) * (Math.floor(Math.random() * 5) + 1)
    if (w !== ans && w > 0) wrongs.add(w)
  }
  const choices = [ans, ...wrongs].sort(() => Math.random() - 0.5)
  grid.innerHTML = ''
  choices.forEach(c => {
    const btn = document.createElement('button')
    btn.className = 'gmq-btn'
    btn.textContent = c
    btn.onclick = () => g14CloseMiniQuiz(c === ans)
    grid.appendChild(btn)
  })
  ovl.classList.add('show')
  // v54.27 I5: while the chip is open, drop speed to 0.4× baseSpeed and freeze
  // obstacle spawns for 6s so the kid can read math without dodging at full
  // speed. The chip is anchored RIGHT which previously occluded the BOOST
  // button; until we re-anchor, slow-mo is a kid-friendly mitigation.
  S._preMiniQuizSpeed = S.speed
  S._preMiniQuizSpawnGate = lastObsTime
  S.speed = Math.max(S.baseSpeed * 0.4, 0.4)
  lastObsTime = performance.now() + 6000  // suppress spawns 6s
  // Auto-dismiss after 7s (no penalty)
  setTimeout(() => { if (_miniQuizArmed) g14CloseMiniQuiz(false) }, 7000)
}
function g14CloseMiniQuiz(correct){
  const ovl = document.getElementById('g14-mini-quiz')
  if (ovl) ovl.classList.remove('show')
  _miniQuizArmed = false
  // v54.27 I5: restore speed; spawn gate ramps back to normal naturally.
  if (S._preMiniQuizSpeed != null) { S.speed = S._preMiniQuizSpeed; S._preMiniQuizSpeed = null }

    S.pressure = Math.min(100, S.pressure + 10)

  }
}

// ── Speed Lines ───────────────────────────────────────────
let spdLines = []
function tickSpeedLines(delta) {
  if (!S.boosting) { L.speedlines.alpha *= 0.9; return }
  L.speedlines.alpha = Math.min(1, L.speedlines.alpha + 0.1 * delta)

  if (S.frame % 4 === 0) {
    const W = app.screen.width
    const g = new PIXI.Graphics()
    const y = gameTop + Math.random() * gameH
    const len = 60 + Math.random() * 120
    g.rect(0, 0, len, 1.5).fill(0xffffff)
    g.x = W; g.y = y; g.alpha = 0.4 + Math.random() * 0.4
    g._vx = -(25 + Math.random() * 15)
    L.speedlines.addChild(g)
    spdLines.push(g)
  }
  for (let i = spdLines.length - 1; i >= 0; i--) {
    const l = spdLines[i]
    l.x += l._vx * delta
    l.alpha -= 0.04 * delta
    if (l.alpha <= 0 || l.x < -200) { L.speedlines.removeChild(l); spdLines.splice(i, 1) }
  }
}

// ═══════════════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════════════
function loop(ticker) {
  if (!S.running || S.paused) return
  const delta = Math.min(ticker.deltaTime, 2.5)   // v54.0 (concern 6) dt clamp
  const now = performance.now()

  // v55.63 B-255 — station-arrival slow-down. While a station cinematic plays,
  // briefly ease the WORLD scroll (parallax/obstacles/AI) so the train feels like
  // it slows into the station. Real speed is restored before the distance/accel
  // update so gameplay length is unaffected. Cosine ease 1 → 0.55 → 1.
  let _stationSpeedSave = null
  if (S._stationSlow > 0) {
    S._stationSlow -= delta
    const _p = 1 - Math.max(0, S._stationSlow) / (S._stationSlowDur || 60)
    _stationSpeedSave = S.speed
    S.speed *= (1 - 0.45 * Math.sin(_p * Math.PI))
  }

  // Spawn obstacle
  // v54.27 I1: read OBS_INTERVAL_MS_CURRENT (Mode Belajar live value) instead
  // of the immutable OBS_INTERVAL_MS const. Without this, g14ApplyKidMode's
  // +200ms loosening was a silent no-op — kid mode promised easier spawn cadence
  // but obstacles still flew at the same rate.
  if (now - lastObsTime > (typeof OBS_INTERVAL_MS_CURRENT !== 'undefined' ? OBS_INTERVAL_MS_CURRENT : OBS_INTERVAL_MS)) {
    spawnObstacle()
    lastObsTime = now
  }

  // v54.8 (concern 10): TIME_OF_DAY sky redraw — every 18 frames so the gradient
  // smoothly cycles pagi→siang→sore→petang→malam across the 800m race.
  if (S.frame % 18 === 0) g14ApplyTimeOfDaySky()

  tickClouds(delta)
  tickBirds(delta)
  tickMid(delta)
  // A-311 — volcano smoke plume (own container, so the parallax tick never moves it)
  if (window.IndoScene && L._smoke && L.smoke && L._scenePal) {
    L._smokeT = (L._smokeT || 0) + delta
    IndoScene.tickSmoke(L.smoke, L._smoke, L._craterX, L._craterY, L._scenePal, delta, (L._smokeT % 5) < delta)
  }
  tickSignalPosts(delta)
  tickKMMarkers(delta)  // v54.14
  tickTracks(delta)
  tickSteam(delta)
  tickPlayer(delta)
  tickAI(delta)
  tickObstacles(delta)
  tickPickups(delta)  // v54.17 A17
  tickFX(delta)
  tickSpeedLines(delta)
  tickWeather(delta)        // v54.49: rain/snow/sandstorm/embers per biome
  g14CheckForecast()        // v54.49: 200m / 500m forecast banner
  // v54.17 A17: spawn next floating pickup once distance threshold reached.
  if (S.distance >= (S.nextPickupAt || Infinity)) {
    spawnPickup()
    S.nextPickupAt += 180
  }

  // v55.63 B-255 — restore real speed (station slow-down was visual-only).
  if (_stationSpeedSave != null) S.speed = _stationSpeedSave
  // Advance distance
  const speedFactor = S.boosting ? S.trainCfg.boostMult : 1.0
  S.distance += S.speed * delta * 0.12 * speedFactor
  S.speed = Math.min(S.maxSpeed, S.speed + 0.0003 * delta)
  // v54.17 A13: track peak speed for result-screen callout (kmh from baseSpeed proxy).
  const _curKmh = (S.trainCfg && S.trainCfg.kmh) ? (S.trainCfg.kmh * (S.speed / S.baseSpeed) * speedFactor) : 0
  if (_curKmh > (S.bestSpeed || 0)) S.bestSpeed = _curKmh

  // Pressure recovery
  // 2026-06-21 — pressure recovery doubled (0.05 → 0.10 per frame) so boost
  // is accessible. Was sluggish, contributing to "no chance to catch AI" feel.
  S.pressure = Math.min(100, S.pressure + 0.10 * delta)
  updatePressure()

  updateHUD()

  // v54.17 A6: low-fuel siren — pulse red border + 220Hz pip when pressure < 20.
  const hudTop = document.getElementById('hud-top')
  if (hudTop) {
    const wantLowFuel = S.pressure < 20
    if (wantLowFuel && !hudTop.classList.contains('g14-low-fuel')) {
      hudTop.classList.add('g14-low-fuel')
    } else if (!wantLowFuel && hudTop.classList.contains('g14-low-fuel')) {
      hudTop.classList.remove('g14-low-fuel')
    }
    if (wantLowFuel && S.frame % 60 === 0) {
      try { playTone(220, 0.06, 'sawtooth') } catch(_){}
    }
  }

  // v54.17 A10 + v54.26 polish: milestone banners shifted off conductor stations.
  // Was 100/250/500/750 — collided with conductor's 100/200/300/400 announcements
  // creating double-banners at 100m and 250m near 200m station ping. New set
  // 175/375/575/725 lives in the gaps between conductor pings.
  const _milestones = [175, 375, 575, 725]
  for (const m of _milestones) {
    if (S.distance >= m && (S.lastMilestone || 0) < m) {
      S.lastMilestone = m
      g14ShowMilestone(m + 'm')
      try { playTone(880, 0.08, 'sine'); setTimeout(()=>playTone(1320, 0.10, 'triangle'), 90) } catch(_){}
      break
    }
  }

  // Checkpoints
  const frac = S.distance / S.finishLine
  ;[['cp0',0.25,1],['cp1',0.5,2],['cp2',0.75,3]].forEach(([id,th,sIdx]) => {
    const el = document.getElementById(id)
    if (frac >= th && !el.classList.contains('reached')) {
      el.classList.add('reached')
      // v54.19 B3: mini-station cinematic on each checkpoint pass.
      const name = G14_STATIONS[(sIdx - 1) % G14_STATIONS.length]
      g14StationCinema(name, 'Pos ' + sIdx + ' tercapai')
    }
  })
  if (frac >= 1) {
    document.getElementById('cp3').classList.add('reached')
    endRace()
  }

  // v54.19 B5: conductor pre-announce upcoming station.
  try { g14CheckConductorAnnounce() } catch(_){}
  // v54.19 B8: maybe float mini-quiz chip.
  try { g14MaybeFloatMiniQuiz() } catch(_){}
}

function startRace() {
  if (!S.trainCfg) return

  document.getElementById('go-btn').style.display = 'none'

  try { window.TrainVFX && TrainVFX.screen.lighting(TH.name) } catch(_){}

  // v54.26 polish: tidy stale DOM particles before a new run so confetti / heart

  try { document.querySelectorAll('.g14-confetti, .g14-milestone, .g14-nearmiss, .g14-heart-pop, .g14-station-cinema').forEach(e => e.remove()) } catch(_){}
  // v54.26 polish: expire 2× score multiplier if it's not today's spin.
  try {
    const today = new Date().toDateString()
    const stamp = localStorage.getItem('dunia-g14-score-mult-day')
    if (stamp !== today) { localStorage.removeItem('dunia-g14-score-mult'); localStorage.removeItem('dunia-g14-score-mult-day') }
  } catch(_){}
  // v54.26 polish: cancel any leftover RAFs from the previous race so they don't
  // bleed into this one (boost fade, cooldown, shake).
  try { _g14CancelAllRAFs() } catch(_){}
  // v55.32 B-220 — resume the Pixi ticker that endRace() stopped at line 3951 to
  // save CPU on the result screen. Without this, S.running=true sets state but
  // the render loop never fires → game appears frozen after "Main Lagi".
  try { if (app && app.ticker && !app.ticker.started) app.ticker.start() } catch(_){}
  S.distance = 0; S.hp = LIVES_MAX; S.pressure = 70
  // v54.19 B12: if kid mode active, +1 HP buffer (applied AFTER reset above).
  if (S.kidMode) S.hp = Math.min(LIVES_MAX + 1, S.hp + 1)
  S.obstacles = []; S.steam = []; S.sparks = []; spdLines = []; S.frame = 0
  S.pickups = []  // v54.17 A17
  S.nextPickupAt = 180  // first floating pickup at 180m
  _lastConductorAnnounce = 0  // v54.19 B5 reset on race-start
  _miniQuizArmed = false       // v54.19 B8 reset
  S.boosting = false; S.boostCooldown = false; S.invincible = 0
  S.lane = 1; S.targetLane = 1
  // v54.56: consume queued daily-spin bonus (set via g14SpinWheel post-race).
  // Single-use: read + remove the key so the bonus only applies to this run.
  try {
    const bonus = localStorage.getItem('dunia-g14-spin-bonus')
    if (bonus) {
      localStorage.removeItem('dunia-g14-spin-bonus')
      if (bonus === 'pressure') S.pressure = 100
      else if (bonus === 'hp')   S.hp = Math.min(LIVES_MAX + 1, S.hp + 1)
      else if (bonus === 'boost') S.pressure = 100  // delivered as full pressure; boost button armed
      else if (bonus === 'ghost') S.invincible = 300  // 5s ghost (60fps × 5)
      else if (bonus === 'mystery') { S.pressure = 100; S.hp = Math.min(LIVES_MAX, S.hp + 1) }
    }
  } catch(_){}
  S.speed = S.baseSpeed = S.trainCfg.baseSpeed
  S.maxSpeed = S.trainCfg.baseSpeed * 2.5
  // v54.17 A13: best speed tracking for the result chip
  S.bestSpeed = 0
  // v54.17 A10: milestone tracker (avoid re-firing 100m banner)
  S.lastMilestone = 0
  // v54.17 A14: cloud shadows are created in buildClouds via L.cloudShadows
  L.obstacles.removeChildren(); L.ai.removeChildren()

  updatePlayerEmoji()
  buildAI()
  updateHUD()
  // v54.17 A2: refresh lane pips to lane 1 (default) on race start.
  try { g14UpdateLanePips(false) } catch(_){}
  lastObsTime = performance.now() + 2500
  // v54.17 A1: 3-2-1-GO countdown gate. Defers S.running=true until the

  g14RunCountdown(() => {
    S.running = true
    try{if(window.TrainBGM){TrainBGM.setTrack(S.trainCfg&&S.trainCfg.key,0.2);TrainBGM.play()}else{const bgm=document.getElementById('game-bgm');bgm.volume=0.2;bgm.play().catch(()=>{})}}catch(_){}
    try{const sfx=document.getElementById('train-sfx');if(sfx){sfx.currentTime=0;sfx.volume=0.7;sfx.play().catch(()=>{})}}catch(_){}
    // v54.19 B4: cab-window driver wave on race start for character trains only.

    // v54.69 — ObstacleEngine wiring: attach game API + schedule first puzzle.

// v54.69 — Bind ObstacleEngine to G14's game-state hooks and start the puzzle scheduler.
// Soft-fail by default (Easy mode); Hard mode keeps current HP/crash semantics.
function g14WireObstacleEngine(){
  if (!window.ObstacleEngine) return
  window.ObstacleEngine.attach({
    pauseTick: () => { S.running = false },
    // v54.80 bug-fix: resumeTick must NOT re-enable race if game is over.
    // Previously, an obstacle finishing mid-end-race could re-flip S.running=true,
    // re-arming the tick loop after endRace() set it false.
    resumeTick: () => { if (!S.gameOver && !S.paused) S.running = true },
    slowDown: (factor, durMs) => { /* visual slow already handled by overlay zoom */ },
    resumeSpeed: () => {},
    cameraZoom: (scale, durMs) => {
      // Optional: animate L.world zoom for puzzle approach. v54.69 = no-op for safety.
    },
    takeHP: (n) => {
      // Only fires in Hard mode (engine gates this)
      if (S.hp > 0) {
        S.hp = Math.max(0, S.hp - n)
        try { updateHUD() } catch(_){}
      }
    },
    awardReward: (reward, obstacleId) => {
      if (!reward) return
      if (reward.coins) {
        S.coins = (S.coins || 0) + reward.coins
        try { updateHUD() } catch(_){}
      }
      // Surface reward via floating "+N coins" if available
      try {
        if (typeof spawnFloatScore === 'function' && reward.coins) {
          // best-effort; ignore failure
        }
      } catch(_){}
    },
  })

  // Schedule a puzzle every ~28-40s during the race. Re-arms on success.
  // v54.75: adaptive picker — filters by age preset + suggested difficulty tier
  // + journey/location context. Falls back gracefully to full registry.
  function _pickObstacleId(){
    const OE = window.ObstacleEngine
    if (!OE) return 'missing_rail_triangle'
    const registry = OE._registry || {}
    const allIds = Object.keys(registry)
    if (allIds.length === 0) return 'missing_rail_triangle'
    // Adaptive filter — age + difficulty tier
    let pool = (typeof OE.pickAdaptiveCandidates === 'function') ? OE.pickAdaptiveCandidates() : allIds
    // Further filter by journey/location context if BG engine has state
    try {
      const ctx = window.TrainBG && window.TrainBG._state
      if (ctx && ctx.journey && ctx.location) {
        const filtered = pool.filter(id => {
          const def = registry[id]
          if (!def) return false
          const phases = def.allowedJourneyPhases || ['*']
          const locs   = def.allowedLocations || ['*']
          const phaseOK = phases.includes('*') || phases.includes(ctx.journey.name)
          const locOK   = locs.includes('*')   || locs.includes(ctx.location.id) || locs.includes((ctx.location.id || '').replace(/^id_/, ''))
          return phaseOK && locOK
        })
        if (filtered.length > 0) pool = filtered
      }
    } catch(_){}
    return pool[Math.floor(Math.random() * pool.length)]
  }

  function _scheduleNext(){
    const delayMs = 28000 + Math.random() * 12000
    setTimeout(() => {
      // v54.80 bug-fix: also gate on S.quizOpen + S.gameOver to avoid overlap
      // with the existing mini-quiz (g14-mini-quiz) or after race ends.
      if (!S.running || S.quizOpen || S.gameOver) return
      const id = _pickObstacleId()
      try {
        window.ObstacleEngine.spawn(id).then((outcome) => {
          // v55.7 — engagement counter for star gate (B-203)
          if (outcome === 'success') S.puzzlesSolved = (S.puzzlesSolved || 0) + 1
          _scheduleNext()
        })
      } catch(e) {
        console.warn('[g14] OE.spawn failed', e)
        _scheduleNext()
      }
    }, delayMs)
  }

  // v54.76 — Scripted route runner. If BG engine has set a known location,
  // try to look up a scripted route and run it step-by-step. Falls back to
  // _scheduleNext() (adaptive random) if no scripted route matches.
  function _tryRunScriptedRoute(){
    if (typeof window.findRouteForLocation !== 'function') return false
    const bg = window.TrainBG && window.TrainBG._state
    const locId = bg && bg.location && bg.location.id
    if (!locId) return false
    const route = window.findRouteForLocation(locId)
    if (!route || !route.sequence || route.sequence.length === 0) return false

    console.log('[g14] running scripted route:', route.id, 'with', route.sequence.length, 'beats')
    let step = 0
    function _runStep(){
      // v54.80 bug-fix: also bail if game over or pre-existing modal is open.
      if (!S.running || S.gameOver || S.quizOpen) return
      if (step >= route.sequence.length) {
        // Route complete — award completion reward, then fall back to random for remainder of race
        if (route.completionReward && window.ObstacleEngine) {
          try {
            const r = route.completionReward
            if (r.coins) { S.coins = (S.coins||0) + r.coins; try{updateHUD()}catch(_){} }
            if (r.sticker)    window.ObstacleEngine._addToStorageList && window.ObstacleEngine._addToStorageList('train-stickers', r.sticker)
            if (r.badge)      window.ObstacleEngine._addToStorageList && window.ObstacleEngine._addToStorageList('train-badges', r.badge)
            if (r.hornUnlock) window.ObstacleEngine._addToStorageList && window.ObstacleEngine._addToStorageList('train-horn-unlocks', r.hornUnlock)
            // Fallback for missing helper
            if (!window.ObstacleEngine._addToStorageList) {
              try {
                const w = (k,v) => { const a = JSON.parse(localStorage.getItem(k)||'[]'); if (!a.includes(v)) { a.push(v); localStorage.setItem(k, JSON.stringify(a)) } }
                if (r.sticker)    w('train-stickers', r.sticker)
                if (r.badge)      w('train-badges',   r.badge)
                if (r.hornUnlock) w('train-horn-unlocks', r.hornUnlock)
              } catch {}
            }
          } catch(e) { console.warn(e) }
        }
        _scheduleNext()
        return
      }
      const beat = route.sequence[step]; step++
      if (beat.type === 'wait') {
        setTimeout(_runStep, beat.durationMs || 6000)
      } else if (beat.type === 'arrival') {
        // Arrival beat — no obstacle, just a short transition pause
        setTimeout(_runStep, 4000)
      } else if (beat.obstacleId) {
        try {
          const overrideReward = beat.overrideReward
          // For now, just spawn the obstacle (overrideReward propagates via the def's reward field).
          // A future tranche could allow per-spawn overrides via opts.
          window.ObstacleEngine.spawn(beat.obstacleId, { overrideReward }).then(() => {
            // Apply override reward extras (sticker/badge) on success
            if (overrideReward) {
              try {
                if (overrideReward.coins) { S.coins = (S.coins||0) + overrideReward.coins; try{updateHUD()}catch(_){} }
                const w = (k,v) => { const a = JSON.parse(localStorage.getItem(k)||'[]'); if (!a.includes(v)) { a.push(v); localStorage.setItem(k, JSON.stringify(a)) } }
                if (overrideReward.sticker)    w('train-stickers', overrideReward.sticker)
                if (overrideReward.badge)      w('train-badges',   overrideReward.badge)
                if (overrideReward.hornUnlock) w('train-horn-unlocks', overrideReward.hornUnlock)
              } catch(e) { console.warn(e) }
            }
            // Inter-beat delay
            setTimeout(_runStep, 4000 + Math.random() * 3000)
          })
        } catch(e) {
          console.warn('[g14] scripted spawn failed', e)
          setTimeout(_runStep, 5000)
        }
      } else {
        setTimeout(_runStep, 1000) // unknown beat — skip
      }
    }
    // Wait 1500ms for BG context to settle then start
    setTimeout(_runStep, 1500)
    return true
  }

  // Try scripted route first; if no match, fall back to adaptive random scheduler.
  if (!_tryRunScriptedRoute()) {
    _scheduleNext()
  }
}

// v54.17 A1: 3-2-1-GO ritual with station bell ding + steam whistle on GO.
// onDone fires once "GO!" finishes its zoom-out so the caller can flip S.running.
function g14RunCountdown(onDone){
  const ov = document.getElementById('g14-countdown')
  const num = document.getElementById('g14-countdown-num')
  if (!ov || !num) { if (onDone) onDone(); return }
  ov.classList.add('show')
  const seq = ['3', '2', '1', 'GO!']
  let i = 0
  function _step(){
    num.classList.remove('go')
    // re-trigger animation
    void num.offsetWidth
    num.textContent = seq[i]
    if (seq[i] === 'GO!') {
      num.classList.add('go')
      // Steam whistle: descending double tone
      try { playTone(880, 0.18, 'sine'); setTimeout(()=>playTone(660, 0.22, 'sine'), 140) } catch(_){}
    } else {
      // Station bell: paired ding-ding
      try { playTone(1200, 0.07, 'square'); setTimeout(()=>playTone(900, 0.07, 'square'), 90) } catch(_){}
    }
    i++
    if (i < seq.length) {
      setTimeout(_step, 700)
    } else {
      setTimeout(() => {
        ov.classList.remove('show')
        if (onDone) onDone()
      }, 550)
    }
  }
  _step()
}
