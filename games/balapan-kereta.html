  // ── the actual shared-scene race (v57.3 — ONE landscape arena, no quiz) ───
  //   Both trains float over the selected level's real backdrop plate on
  //   parallel rails. NAIK/TURUN shifts a train between lanes to GRAB tinted
  //   tokens (+energy) and DODGE hazards (brief slow). energy≥threshold →
  //   BOOST ready → spend energy → ~1.5s ×1.9 surge. Both auto-creep; race
  //   standing shows on the HUD progress bars. First dist≥100 wins.
  //   Frame-rate independent. Same onFinish contract (Tournament unaffected).
  var AUTO = 2.2;          // %/sec baseline creep
  var BOOST_MULT = 1.9;    // speed ×multiplier while boosting
  var BOOST_MS = 1500;     // boost duration (ms)
  var SLOW_MULT = 0.35;    // speed ×multiplier while slowed by a hazard
  var SLOW_MS = 800;       // hazard slow duration (ms)
  var ITEM_SPEED = 23;     // %/sec token+hazard travel (right → left) — v58.5: slower, matches original feel
  var WORLD_PX = 230;      // px/sec backdrop scroll at normal pace (×mult on boost/slow)
  var ENERGY_MAX = 100;    // energy bar cap
  var BOOST_COST = 100;    // energy needed to trigger BOOST
  var TOKEN_ENERGY = 25;   // energy gained per token grabbed
  var SPEED_K = 38;        // km/h display factor (rate × K)
  var TRAIN_X = { p2: 18, p1: 33 };   // v58.5 — start LEFT (long obstacle runway = slower feel), clear of edge controls
  var LANE_FALLBACK = [0.55, 0.72, 0.86];
  var NEAR_RAIL_NUDGE = 0.006;        // v58.5 — lanes now map 1:1 (bg 100% 100%) → tiny nudge onto the near rail
  var TRAIN_H_MIN = 38, TRAIN_H_MAX = 96, TRAIN_H_GAP_K = 1.5;  // responsive train height = gap×K

  function zeroPad2 (n) { n = String(n); return n.length < 2 ? '0' + n : n; }
  function platePath () { return '../assets/train/backdrop/level' + zeroPad2(qlevel()) + '-1600.webp'; }
  function legName () { try { if (typeof g14StationName === 'function') { var s = g14StationName(); if (s) return s; } } catch (_) {} return 'Perjalanan Rel'; }
  function heartStr (n) { var s = ''; for (var i = 0; i < 3; i++) s += (i < n) ? '❤' : '🤍'; return s; }

  // Non-blocking lane read: prefer the already-loaded manifest, else fetch the
  // read-only levelNN.json, else the safe fallback. NEVER writes the JSON.
  function loadLanes (cb) {
    try {
      if (typeof G14_MANIFEST !== 'undefined' && G14_MANIFEST && G14_MANIFEST.laneRatios
        && G14_MANIFEST.laneRatios.lanes && G14_MANIFEST.laneRatios.lanes.length >= 2) {
        cb(G14_MANIFEST.laneRatios.lanes.slice()); return;
      }
    } catch (_) {}
    try {
      fetch('../data/g14-journey/level' + zeroPad2(qlevel()) + '.json')
        .then(function (r) { return r.json(); })
        .then(function (j) { var l = j && j.laneRatios && j.laneRatios.lanes; cb((l && l.length >= 2) ? l.slice() : LANE_FALLBACK.slice()); })
        .catch(function () { cb(LANE_FALLBACK.slice()); });
    } catch (_) { cb(LANE_FALLBACK.slice()); }
  }

  function runMatch (opts, onFinish) {
    injectCSS();
    openShell();
    var reduce = reduced();
    var host = el('div'); host.id = 'g14vs';
    if (!reduce) host.className = 'gvs-anim';
    host.innerHTML =
      '<div class="gvs-scene" data-scene>'
      + '<div class="gvs-bg"><div class="gvs-bgtrack"><div class="gvs-tile"></div><div class="gvs-tile mir"></div><div class="gvs-tile"></div></div></div>'
      + '<div class="gvs-vig"></div>'
      + '<div class="gvs-fg"></div>'
      + '<button class="gvs-x gvs-x-float" data-x aria-label="Keluar">✕</button>'
      + '<div class="gvs-banner"><div class="t1">🏁 PVP MODE</div><div class="t2" data-leg></div><div class="t3">First to the finish line!</div></div>'
      + '</div>';
    document.body.appendChild(host);
    var scene = host.querySelector('.gvs-scene');
    scene.querySelector('[data-leg]').textContent = legName();
    var bgTrack = scene.querySelector('.gvs-bgtrack');
    var bgTiles = scene.querySelectorAll('.gvs-tile');
    // paint the plate onto every mirror-tile; fall back to the gradient sky if it 404s.
    (function () {
      var plate = platePath();
      for (var i = 0; i < bgTiles.length; i++) bgTiles[i].style.backgroundImage = "url('" + plate + "')";
      var pre = new Image();
      pre.onerror = function () { if (bgTrack) bgTrack.style.display = 'none'; scene.classList.add('gvs-fallback'); };
      pre.src = plate;
    })();
    host.querySelector('[data-x]').addEventListener('click', function () { stop(); host.remove(); closeToPicker(); });

    var race = { alive: true, raf: 0, last: 0, players: null, lanes: LANE_FALLBACK.slice(), worldX: 0 };

    // shared BOOST medallion (bottom-center)
    var medallion = el('button', 'gvs-boost'); medallion.type = 'button';
    medallion.innerHTML = '<span class="bi">🚀</span><b class="bt">BOOST</b><span class="bl">READY!</span>';
    scene.appendChild(medallion);
    medallion.addEventListener('click', function () {
      for (var i = 0; i < race.players.length; i++) { if (race.players[i].energy >= BOOST_COST) tryBoost(race.players[i]); }
    });

    function positionItem (it) { it.el.style.left = it.x + '%'; it.el.style.top = (race.lanes[it.lane] * 100) + '%'; }

    function refreshFoot (P) {
      P.efill.style.width = (P.energy / ENERGY_MAX * 100) + '%';
      P.tokEl.textContent = '⚡' + P.tokens;
      var ready = P.energy >= BOOST_COST;
      P.sb.disabled = !ready; P.sb.textContent = ready ? 'BOOST!' : 'BOOST';
    }
    function refreshMedallion () {
      var any = false;
      for (var i = 0; i < race.players.length; i++) { if (race.players[i].dist < 100 && race.players[i].energy >= BOOST_COST) any = true; }
      medallion.classList.toggle('ready', any);
    }
    // Self-contained DOM particle burst at an element's screen centre. No PIXI
    // dependency (PvP is DOM), fully guarded — can never break the race.
    function pvpBurst (el, kind) {
      try {
        if (!el || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
        var r = el.getBoundingClientRect(); if (!r.width) return;
        var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        var c = kind === 'crash' ? { n: 14, cols: ['#ff5a5a', '#ffaa44', '#ffd34d'], smin: 6, smax: 12, spread: 70, up: 0 }
              : kind === 'coin'  ? { n: 10, cols: ['#ffd34d', '#fff0a8', '#ffe08a'], smin: 5, smax: 9,  spread: 46, up: 1 }
              :                    { n: 9,  cols: ['#ffd34d', '#ff8a3d', '#ffffff'], smin: 4, smax: 8,  spread: 40, up: 1 };

            'px;border-radius:' + (Math.random() > 0.5 ? '50%' : '2px') + ';background:' + c.cols[i % c.cols.length] +
            ';z-index:9999;pointer-events:none;will-change:transform,opacity';

            });

        }

    }
    function pvpTone (a, b, wave, delayMs) {
      try { playTone(a, 0.09, wave || 'square'); if (b) setTimeout(function () { try { playTone(b, 0.09, wave || 'square'); } catch (e) {} }, delayMs || 60); } catch (_) {}
    }
    function tryBoost (P) {
      if (P.dist >= 100 || P.energy < BOOST_COST) return;

    }
    function collectToken (P) {
      P.tokens++; P.energy = Math.min(ENERGY_MAX, P.energy + TOKEN_ENERGY);
      P.train.classList.remove('grab'); void P.train.offsetWidth; P.train.classList.add('grab');
      pvpBurst(P.train, 'coin'); pvpTone(880, 1180, 'square');     // coin ding + pop
      refreshFoot(P); refreshMedallion();
    }
    function hitHazard (P, now) {
      P.slowUntil = now + SLOW_MS;
      if (P.hearts > 0) { P.hearts--; P.heartsEl.textContent = heartStr(P.hearts); }
      P.train.classList.remove('slow'); void P.train.offsetWidth; P.train.classList.add('slow');
      pvpBurst(P.train, 'crash');                                  // explosion sparks
      pvpTone(200, 140, 'sawtooth', 70);                           // crash thud
      try { screenFlash('rgba(255,70,70,0.26)'); } catch (_) {}
      if (navigator.vibrate) try { navigator.vibrate([30, 50, 20]); } catch (_) {}
    }

    function buildPlayer (sideKey, info, pal) {
      var trainX = TRAIN_X[sideKey];
      var av = (info.vis && info.vis.emoji) || '🚂';
      // HUD
      var hud = el('div', 'gvs-hud ' + sideKey); styleVars(hud, pal);
      hud.innerHTML =
        '<div class="row1"><span class="av">' + av + '</span><span class="nm">' + esc(info.name) + '</span></div>'
        + '<div class="spd">SPEED <b class="spdv">0</b> KM/H</div>'
        + '<div class="hearts">' + heartStr(3) + '</div>'
        + '<div class="pbar"><div class="pfill"></div></div>';
      scene.appendChild(hud);
      var pfill = hud.querySelector('.pfill'); styleVars(pfill, pal);
      // side controls
      var side = el('div', 'gvs-side ' + sideKey);
      var up = el('button', 'gvs-slane'); up.type = 'button'; up.innerHTML = '▲<small>NAIK</small>'; styleVars(up, pal);
      var dn = el('button', 'gvs-slane'); dn.type = 'button'; dn.innerHTML = '▼<small>TURUN</small>'; styleVars(dn, pal);
      side.appendChild(up); side.appendChild(dn); scene.appendChild(side);
      // foot
      var foot = el('div', 'gvs-foot ' + sideKey); styleVars(foot, pal);
      foot.innerHTML = '<div class="ewrap"><div class="efill"></div></div><span class="tok">⚡0</span>'
        + '<button class="sb" type="button" disabled>BOOST</button>';
      scene.appendChild(foot);
      var sb = foot.querySelector('.sb'); styleVars(sb, pal);
      // train
      var train = trainNode(info.vis); train.classList.add(sideKey); train.style.left = trainX + '%'; scene.appendChild(train);
      // token + hazard pools (2 each, reused — no per-frame allocation)
      var tk = [], hz = [], q;
      for (q = 0; q < 2; q++) { var t = el('span', 'gvs-token ' + sideKey); t.textContent = (q % 2) ? '⚡' : '🪙'; scene.appendChild(t); tk.push({ el: t, on: false, x: 100, lane: 0, scored: false }); }
      for (q = 0; q < 2; q++) { var h = el('span', 'gvs-haz'); h.textContent = (q % 2) ? '🚧' : '🪨'; scene.appendChild(h); hz.push({ el: h, on: false, x: 100, lane: 0, scored: false }); }

      var P = {
        side: sideKey, name: info.name, trainX: trainX, dist: 0, energy: 0, tokens: 0, hearts: 3, lane: 1,
        boostUntil: 0, slowUntil: 0, train: train, tk: tk, hz: hz,
        pfill: pfill, spdv: hud.querySelector('.spdv'), heartsEl: hud.querySelector('.hearts'),
        nmEl: hud.querySelector('.nm'), baseName: info.name,
        efill: foot.querySelector('.efill'), tokEl: foot.querySelector('.tok'), sb: sb,
        nextTok: performance.now() + 700 + Math.random() * 900, nextHaz: performance.now() + 1900 + Math.random() * 1400
      };
      function setLane () { var li = Math.min(P.lane, race.lanes.length - 1); train.style.top = ((race.lanes[li] + NEAR_RAIL_NUDGE) * 100) + '%'; }
      P._setLane = setLane; setLane();
      up.addEventListener('click', function () { if (P.lane > 0) { P.lane--; setLane(); } });                       // NAIK → up screen
      dn.addEventListener('click', function () { if (P.lane < race.lanes.length - 1) { P.lane++; setLane(); } });   // TURUN → down screen
      sb.addEventListener('click', function () { tryBoost(P); });
      P._forceToken = function () { var s = P.tk[0].on ? P.tk[1] : P.tk[0]; s.on = true; s.scored = false; s.lane = P.lane; s.x = P.trainX + 6; s.el.classList.add('on'); positionItem(s); };
      return P;
    }

    // v57.7 A-332 — size every train (and the items) from the RAIL GAP so the loco is a
    // consistent fraction of the lane spacing on any display (no more oversized trains on
    // odd aspect ratios); re-run on resize/orientation change.
    function fitTrains () {
      var sceneH = scene.clientHeight || 300;
      var ls = race.lanes, gaps = [], i;
      for (i = 1; i < ls.length; i++) gaps.push(Math.abs(ls[i] - ls[i - 1]));
      gaps.sort(function (a, b) { return a - b; });
      var gap = gaps.length ? gaps[(gaps.length - 1) >> 1] : 0.16;   // median inter-lane gap (ratio)
      var h = Math.max(TRAIN_H_MIN, Math.min(TRAIN_H_MAX, gap * sceneH * TRAIN_H_GAP_K));
      race.trainH = h;
      if (race.players) for (i = 0; i < race.players.length; i++) { var t = race.players[i].train; if (t && !t.classList.contains('emoji')) t.style.height = h + 'px'; }
      var itemPx = Math.max(16, Math.min(36, h * 0.5));
      var items = scene.querySelectorAll('.gvs-token,.gvs-haz');
      for (i = 0; i < items.length; i++) items[i].style.fontSize = itemPx + 'px';
    }

    function stop () {
      race.alive = false; if (race.raf) { cancelAnimationFrame(race.raf); race.raf = 0; }
      if (race.onResize) { window.removeEventListener('resize', race.onResize); race.onResize = null; }
    }

    function spawnFrom (pool, now) {
      var slot = null;
      for (var k = 0; k < pool.length; k++) { if (!pool[k].on) { slot = pool[k]; break; } }
      if (!slot) return;
      slot.on = true; slot.scored = false; slot.x = 100;
      slot.lane = (Math.random() * race.lanes.length) | 0;
      slot.el.classList.add('on'); positionItem(slot);
    }

    function frame (now) {
      if (!race.alive) return;
      var dt = race.last ? (now - race.last) / 1000 : 0.016; race.last = now;
      if (dt > 0.05) dt = 0.05;
      // hold the simulation still until the 3·2·1·GO countdown finishes
      if (!race.go) { race.raf = requestAnimationFrame(frame); return; }
      var players = race.players, i, j, maxMult = 0;
      for (i = 0; i < players.length; i++) {
        var P = players[i];
        if (P.dist >= 100) continue;
        var boosting = now < P.boostUntil;
        if (P._boostTrail !== boosting) { P._boostTrail = boosting; P.train.classList.toggle('boosting', boosting); }
        var slowed = now < P.slowUntil;
        var mult = boosting ? BOOST_MULT : (slowed ? SLOW_MULT : 1);
        if (mult > maxMult) maxMult = mult;
        var rate = AUTO * mult;
        P.dist += rate * dt; if (P.dist > 100) P.dist = 100;
        P.pfill.style.width = P.dist + '%';
        P.spdv.textContent = Math.round(rate * SPEED_K);
        // spawn
        if (now > P.nextTok) { spawnFrom(P.tk, now); P.nextTok = now + 1400 + Math.random() * 1400; }
        if (now > P.nextHaz) { spawnFrom(P.hz, now); P.nextHaz = now + 2600 + Math.random() * 1800; }
        // tokens (grab if same lane at the train's x)
        for (j = 0; j < P.tk.length; j++) {
          var T = P.tk[j]; if (!T.on) continue;
          var px = T.x; T.x -= ITEM_SPEED * mult * dt; T.el.style.left = T.x + '%';
          if (!T.scored && px > P.trainX && T.x <= P.trainX) {
            T.scored = true;
            if (T.lane === P.lane) { collectToken(P); T.on = false; T.el.classList.remove('on'); }
          } else if (T.x < -6) { T.on = false; T.el.classList.remove('on'); }
        }
        // hazards (slow if same lane at the train's x, unless boosting)
        for (j = 0; j < P.hz.length; j++) {
          var H = P.hz[j]; if (!H.on) continue;
          var hx = H.x; H.x -= ITEM_SPEED * mult * dt; H.el.style.left = H.x + '%';
          if (!H.scored && hx > P.trainX && H.x <= P.trainX) {
            H.scored = true;
            if (H.lane === P.lane && !boosting) { hitHazard(P, now); H.on = false; H.el.classList.remove('on'); }
          } else if (H.x < -6) { H.on = false; H.el.classList.remove('on'); }
        }
        if (P.dist >= 100) { finish(P); return; }
      }
      // v58.0 — live leader crown + finish-line reveal
      var lead = players[0], md = players[0].dist, gap = 0;
      for (i = 1; i < players.length; i++) { if (players[i].dist > lead.dist) lead = players[i]; if (players[i].dist > md) md = players[i].dist; }
      if (players.length === 2) gap = Math.abs(players[0].dist - players[1].dist);
      if (gap > 0.6 && race.leaderSide !== lead.side) { race.leaderSide = lead.side; for (i = 0; i < players.length; i++) setCrown(players[i], players[i] === lead); }
      if (md >= 80 && race._finishEl && !race.finishShown) { race.finishShown = true; race._finishEl.classList.add('show'); }
      // v57.7 — scroll the whole world (rails/ground) at the leading pace, like the
      // original Adventure scene; BOOST visibly rushes it, a hazard-slow drags it. The
      // mirror-tiled track recycles every 2 viewport-widths → perfectly seamless.
      if (bgTrack && maxMult > 0) {
        var vw = scene.clientWidth || 1;
        // keep worldX normalised to [0, 2·vw) every frame so a device rotation (orientation:any,
        // A-325) can't cause a one-frame phase-jump, and avoid float drift over long sessions.
        race.worldX = (race.worldX + WORLD_PX * maxMult * dt) % (2 * vw);
        bgTrack.style.transform = 'translateX(' + (-race.worldX) + 'px)';
      }
      race.raf = requestAnimationFrame(frame);
    }

    function finish (winner) {
      stop();
      onFinish({ side: winner.side, name: winner.name }, host);
    }

    // v57.3 — P2 = vibrant blue (left) / P1 = green (right); identity carried
    // across HUD, side controls, foot, progress bar + neon train outline.
    race.players = [ buildPlayer('p2', opts.p2, CLAY.plB), buildPlayer('p1', opts.p1, CLAY.pl1) ];
    fitTrains();
    // responsive: re-fit train/item sizes + re-anchor lanes on resize / orientation change
    race.onResize = function () { fitTrains(); for (var i = 0; i < race.players.length; i++) race.players[i]._setLane(); };
    window.addEventListener('resize', race.onResize);
    loadLanes(function (lanes) {
      if (!race.alive) return;
      if (lanes && lanes.length >= 2) {
        race.lanes = lanes.slice();
        for (var i = 0; i < race.players.length; i++) { var P = race.players[i]; if (P.lane >= race.lanes.length) P.lane = race.lanes.length - 1; P._setLane(); }
      }
      fitTrains();   // gap now known → final proportional size
    });
    // debug handle for the QA probe
    try {
      window.__g14pvp = {
        race: race, players: race.players,
        byside: function (s) { for (var i = 0; i < race.players.length; i++) if (race.players[i].side === s) return race.players[i]; return null; },
        spawnToken: function (s) { var P = this.byside(s); if (P) P._forceToken(); },
        boost: function (s) { var P = this.byside(s); if (P) { P.energy = BOOST_COST; tryBoost(P); } },
        setDist: function (s, v) { var P = this.byside(s); if (P) P.dist = v; }
      };
    } catch (_) {}
    race.raf = requestAnimationFrame(frame);
    runCountdown();

    // v58.0 — checkered finish line (revealed near the end) + leader crown + 3·2·1·GO
    function ensureFinish () { if (!race._finishEl) { race._finishEl = el('div', 'gvs-finish'); scene.appendChild(race._finishEl); } return race._finishEl; }
    function setCrown (P, on) {
      if (P._crown === on) return; P._crown = on;
      P.nmEl.innerHTML = (on ? '<span class="gvs-crown">👑</span>' : '') + esc(P.baseName);
    }
    function runCountdown () {
      var finishEl = ensureFinish(); void finishEl;   // create it up-front so frame() can reveal it
      if (reduce) { race.go = true; return; }          // no countdown under reduced-motion
      var steps = ['3', '2', '1', 'GO!'], k = 0;
      var ov = el('div', 'gvs-countdown'); scene.appendChild(ov);
      (function tick () {
        if (!race.alive) { if (ov.parentNode) ov.remove(); return; }
        ov.innerHTML = '';
        var n = el('div', 'gvs-cnum' + (steps[k] === 'GO!' ? ' go' : '')); n.textContent = steps[k]; ov.appendChild(n);
        if (steps[k] === 'GO!') race.go = true;
        k++;
        if (k < steps.length) setTimeout(tick, 800);
        else setTimeout(function () { if (ov.parentNode) ov.remove(); }, 700);
      })();
    }
  }

  // ── result / champion banner ────────────────────────────────────────────
  function spawnConfetti (panel) {
    var wrap = el('div', 'gvs-confetti');
    var cols = ['#ff5a5a', '#ffd23f', '#3aa0ff', '#39ff14', '#ff8adf', '#a855f7', '#ffffff'];
    for (var i = 0; i < 26; i++) {
      var p = document.createElement('i');
      p.style.left = (Math.random() * 100) + '%';
      p.style.background = cols[i % cols.length];
      p.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
      p.style.animationDelay = (Math.random() * 0.5) + 's';
      if (i % 3 === 0) p.style.borderRadius = '50%';
      wrap.appendChild(p);
    }
    panel.insertBefore(wrap, panel.firstChild);
  }
  function showResult (host, opts) {
    injectCSS();
    var panel = el('div', 'gvs-panel');
    var btns = '';
    (opts.buttons || []).forEach(function (b, i) { btns += '<button class="gvs-btn" data-i="' + i + '">' + esc(b.label) + '</button>'; });
    panel.innerHTML =
      '<div class="gvs-trophy' + (opts.champ ? ' champ' : '') + '">' + (opts.trophy || '🥇') + '</div>'
      + '<h1>' + esc(opts.title) + '</h1>'
      + '<div class="row">' + btns + '</div>';
    host.appendChild(panel);
    if (!reduced()) spawnConfetti(panel);   // celebratory confetti (respects reduced-motion)
    var nodes = panel.querySelectorAll('.gvs-btn');
    (opts.buttons || []).forEach(function (b, i) { styleVars(nodes[i], b.pal || CLAY.go); nodes[i].addEventListener('click', b.cb); });
  }

  // ── public entry points ─────────────────────────────────────────────────
  window.g14GoRace = function () { showModeModal(); };
  window.g14StartPvP = function () { startPvPFlow(); };
  window.g14StartTournament = function () { startTournamentFlow(); };
})();
</script>
