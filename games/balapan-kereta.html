// v54.14 — Distance KM markers. Spawn an Indonesian highway-style sign every ~150m
// that scrolls past with the player. Adds a sense of "progress through space" beyond
// the abstract progress bar. Pixi Container per marker; auto-recycled on screen exit.
let kmMarkers = []
function buildKMMarkers() {
  const c = new PIXI.Container(); L.kmMarkers = c; stage.addChild(c)
  // Pre-build 3 markers — we'll recycle them as they exit screen.
  for (let i = 0; i < 3; i++) {
    const m = new PIXI.Container()
    // Pole
    const pole = new PIXI.Graphics()
    pole.rect(-1, 0, 2, 38).fill(0x6b7280)
    m.addChild(pole)
    // Sign rectangle (green Indonesian directional)
    const sign = new PIXI.Graphics()
    sign.rect(-22, -12, 44, 22).fill(0x15803d)
    sign.rect(-22, -12, 44, 22).stroke({ color: 0xffffff, width: 1.8 })
    m.addChild(sign)
    // Text — placeholder; updated by tickKMMarkers
    const txt = new PIXI.Text({ text: '0m', style: { fontFamily: 'Fredoka One, sans-serif', fontSize: 11, fill: 0xffffff, fontWeight: '900' } })
    txt.anchor.set(0.5); txt.x = 0; txt.y = -1
    m.addChild(txt)
    m._txt = txt
    m._nextValueAt = 150 + i * 200  // first show at 150m / 350m / 550m
    m.visible = false
    c.addChild(m)
    kmMarkers.push(m)
  }
}
function tickKMMarkers(delta) {
  if (!kmMarkers.length) return
  const W = app.screen.width
  const px = S.speed * delta * 0.95
  for (const m of kmMarkers) {
    if (!m.visible) {
      // Spawn when player reaches the marker's next value.
      if (S.distance >= m._nextValueAt) {
        const targetM = Math.round(m._nextValueAt)
        m._txt.text = targetM + 'm'
        m.x = W + 30
        m.y = laneYs[0] - laneH * 0.4
        m.visible = true
        // Schedule next marker for this slot after a 600m gap.
        m._nextValueAt += 600
      }
      continue
    }
    m.x -= px
    if (m.x < -50) m.visible = false
  }
}

// A-311 — scene mood (kept 'day' = the bright reference panel; sky still recolors
// dynamically via g14ApplyTimeOfDaySky). Hook for future time-of-day scenery.
function g14SceneMood() { return 'day' }

// ── Far scenery → Indonesian backdrop (volcano in hills + mountains + sawah) ──
function buildFarScenery() {
  const c = new PIXI.Container(); L.far = c; stage.addChild(c)
  const W = app.screen.width, H = app.screen.height
  const IS = window.IndoScene
  const pal = IS ? g14Palette() : null
  if (!IS || !pal) {
    // legacy fallback (procedural mountains + haze) if the module fails to load
    for (let i = 0; i < 12; i++) { const g = new PIXI.Graphics(); const mW = 80 + Math.random()*100, mH = 50 + Math.random()*80; g.moveTo(0,0).lineTo(mW/2,-mH).lineTo(mW,0).fill(TH.mountain); g.x = i*(W/6)-20; g.y = gameTop+30; g._speed = 0; c.addChild(g) }
    c._speed = 0; return
  }
  const railY = railTop - 1               // scenery sits ABOVE the rail band
  const bandH = Math.max(80, railY)       // full scenery band from screen top
  const horizonY = Math.round(bandH * 0.62)   // sky above, ground below the horizon
  const sceneH = Math.max(40, railY - horizonY)
  // Indonesian sky gradient (the bright reference sky) covering the whole band,
  // then green ground below the horizon — so the volcano sits against blue sky.
  const sky = new PIXI.Graphics(); IS.paintSky(sky, W, railY, pal); sky._speed = 0; c.addChild(sky)
  const ground = new PIXI.Graphics(); ground.rect(0, horizonY, W, railY - horizonY + 4).fill({ color: pal.grass }); ground._speed = 0; c.addChild(ground)
  // v55.61 B-241 — PARALLAX-3D. Each depth band is tiled TWICE (copy at x=0 and
  // x=W) so it scrolls left and wraps SEAMLESSLY (no gap exposing the canvas).
  // Far = slowest, near = fastest → real depth. Volcano stays a fixed Merapi
  // landmark (so its smoke column never jumps). dt-clamped in tickMid.
  L._farBands = []
  const makeBand = (pf, drawFns) => {
    const band = new PIXI.Container(); band._pf = pf; band._tileW = W; band._speed = 0
    for (let copy = 0; copy < 2; copy++) {
      const tile = new PIXI.Container(); tile.x = copy * W
      drawFns.forEach(fn => { const n = fn(); if (n) tile.addChild(n) })
      band.addChild(tile)
    }
    c.addChild(band); L._farBands.push(band); return band
  }
  // v55.68 — "kesan 3D": AERIAL-PERSPECTIVE haze (a static translucent wash that
  // fades the distance) + WIDER depth-speed separation. Aerial haze is the single
  // strongest pseudo-3D depth cue and is ~free (one flat rect, batched).
  const _hazeC = (pal.haze != null) ? pal.haze : 0xdfeef2
  const hazeWash = (alpha, yTop) => { const hz = new PIXI.Graphics(); hz.rect(0, yTop, W, railY - yTop + 4).fill({ color: _hazeC, alpha: alpha }); hz._speed = 0; c.addChild(hz) }
  // v55.69 B-278 — DEEPER aerial perspective: a graded 3-step haze stack (heaviest
  // at the horizon, fading toward the foreground) reads as real atmospheric depth.
  makeBand(0.05, [() => IS.mountains(W, horizonY + 6, pal)])                          // distant range (slowest)
  hazeWash(0.30, horizonY - 6)                                                        // step 1 — heaviest haze veils the far mountains
  makeBand(0.14, [() => IS.hills(W, horizonY, pal, 0), () => IS.hills(W, horizonY + 10, pal, 1)])
  hazeWash(0.16, horizonY + 8)                                                        // step 2 — medium haze over the mid hills
  hazeWash(0.07, horizonY + Math.max(20, sceneH * 0.45))                              // step 3 — faint near-ground veil (atmosphere thins toward us)
  // v55.69 B-275 — signature landmark for THIS level's station (volcano / Monas /
  // Eiffel / Big Ben / Kremlin domes / skyline / Alps / …) sits between the mid
  // and near hill bands. Volcano-type carries crater coords for the smoke plume.
  // v55.71 A-312 — when a reference city-band SVG exists for this level, it
  // REPLACES the procedural landmark (loaded async as one cached sprite); the
  // procedural drawer stays the fallback when there's no reference.
  let vol
  if (G14_MANIFEST && G14_MANIFEST.cityband) {
    vol = new PIXI.Container(); vol._speed = 0; c.addChild(vol)   // crater stays undefined → no volcano smoke
    g14AddCityBand(c, W, horizonY, railY, bandH)
  } else {
    vol = g14Landmark(g14Journey().landmark, W, horizonY + 10, pal, Math.min(horizonY * 0.78, bandH * 0.5)); vol._speed = 0; c.addChild(vol)
  }
  // v55.69 B-275 — rice paddies are an Indonesian signature; international legs
  // (L21-40) get plain rolling hills instead so the scene reads as Europe/US/Russia.
  const _intlScene = (cfg.level || 1) > 20
  const _nearBand = _intlScene
    ? [() => IS.hills(W, horizonY + 24, pal, 2)]
    : [() => IS.hills(W, horizonY + 24, pal, 2), () => IS.sawahBand(W, horizonY + Math.min(sceneH * 0.3, 30), Math.min(sceneH * 0.7, 60), pal)]
  makeBand(0.40, _nearBand)
  // v55.61 B-258 — living sky (bird flocks / clouds / kites), seeded variety + perf cap
  if (IS.ambient) {
    const _seed = (((typeof cfg !== 'undefined' && cfg.level) || 1) * 7919 + Math.floor(Math.random() * 997)) >>> 0
    L._ambient = IS.ambient(W, railTop, pal, { seed: _seed, density: 1 })
    c.addChild(L._ambient.container)
  }
  // mask the backdrop to the scenery band so hills/ground never draw over the rails
  const mask = new PIXI.Graphics(); mask.rect(0, 0, W, railTop).fill(0xffffff); mask._speed = 0; c.addChild(mask); c.mask = mask
  // smoke in its OWN container (so tickMid's far-scroll never moves the puffs)
  if (L.smoke && L.smoke.parent) { L.smoke.parent.removeChild(L.smoke); L.smoke.destroy({children:true}) }
  L.smoke = new PIXI.Container(); stage.addChild(L.smoke)
  // v55.69 B-275 — only volcano landmarks emit a smoke plume; non-volcano
  // landmarks (Eiffel/Big Ben/Kremlin/…) leave crater coords undefined → no smoke.
  L._craterX = vol._craterX; L._craterY = vol._craterY
  L._smoke = (vol._craterX != null) ? IS.makeSmoke() : null
  L._scenePal = pal; L._smokeT = 0
  c._speed = 0
}

// ── Mid scenery → Indonesian props (houses/palms/trees/poles) at the field edge ──
let midItems = []
function buildMidScenery() {
  const c = new PIXI.Container(); L.mid = c; stage.addChild(c)
  const W = app.screen.width
  const IS = window.IndoScene, pal = IS && g14Palette()
  midItems = []
  if (!IS || !pal) return   // backdrop already carries scenery; skip if module missing
  // props stand on the horizon line, just above the rail band — like the reference
  // (kampung houses + palms at the edge of the rice fields beside the track).
  const baseY = railTop - 3
  // v55.69 B-275 — regional props: Indonesia (L1-20) keeps palms + kampung houses;
  // international legs (L21-40) use roadside trees + telegraph poles (palms in Paris
  // / Moscow broke the illusion). Trees + poles read neutral worldwide.
  const _intl = (cfg.level || 1) > 20
  const kinds = _intl
    ? ['tree', 'pole', 'tree', 'pole', 'tree', 'house', 'pole', 'tree']
    : ['house', 'palm', 'tree', 'pole', 'palm', 'house', 'tree', 'pole']
  const N = Math.max(6, Math.round(W / 150))
  const unit = Math.max(0.5, Math.min(W, app.screen.height) / 760)   // responsive prop scale
  for (let i = 0; i < N; i++) {
    const k = kinds[i % kinds.length]
    const sc = (0.55 + ((i * 7) % 4) / 10) * unit
    let pr
    if (k === 'house') pr = IS.house(pal, sc)
    else if (k === 'palm') pr = IS.palm(pal, sc)
    else if (k === 'tree') pr = IS.tree(pal, sc)
    else pr = IS.pole(pal, sc)
    pr.x = 40 + i * (W / N) + ((i * 23) % 50) - 25
    pr.y = baseY - (i % 2) * 4
    pr._speed = 0.5
    c.addChild(pr); midItems.push(pr)
  }
}

// ── Foreground parallax (2.5D depth POC, v55.46) ──────────
// A CLOSE layer that scrolls FAST and passes IN FRONT of the train. Three depth
// planes (far mountains 0.15× · mid trees ~0.4× · this 1.6×) read as real 3D
// depth — the same parallax trick used by 2.5D games (Ori, Hollow Knight) — with
// zero engine change. Items hug the top + bottom edges so they frame the action
// without covering the 3 lanes. Soft, dark, low-detail = "near camera, slightly
// out of focus." Kept to ~10 blobs so a throttled tablet never feels it.
let foreItems = []
function buildForeScenery() {
  foreItems = []   // reset so a re-init (resize/restart) doesn't keep stale sprite refs
  const c = new PIXI.Container(); L.fore = c; stage.addChild(c)  // after player → in front of train
  const W = app.screen.width, H = app.screen.height
  const IS = window.IndoScene, pal = IS && g14Palette()
  const leaf = (pal ? pal.foliage : ((TH.fore != null) ? TH.fore : 0x14331f))
  const leafDk = (pal ? pal.foliageDk : 0x0e2418)
  // A-311 — static tropical-foliage framing the bottom corners (the reference's
  // lush front). Not in foreItems → stays put while the bushes scroll.
  if (IS && pal) { const frame = IS.foliageFrame(W, H, pal); c.addChild(frame) }
  const unit = Math.max(0.6, Math.min(W, H) / 760)
  const mkBush = (x, baseY, scale) => {
    const g = new PIXI.Graphics()
    const r = 26 * scale * unit
    g.ellipse(-r * 0.8, 0, r * 0.9, r * 0.7).fill({ color: leafDk, alpha: 0.9 })
    g.ellipse(r * 0.8, 0, r * 0.9, r * 0.7).fill({ color: leafDk, alpha: 0.9 })
    g.ellipse(0, -r * 0.35, r * 1.15, r * 0.95).fill({ color: leaf, alpha: 0.92 })
    g.x = x; g.y = baseY
    g._speed = 1.5 + Math.random() * 0.3      // FAST = close to camera (parallax-3D)
    g._baseY = g.y; g._bob = Math.random() * Math.PI * 2
    c.addChild(g); foreItems.push(g)
  }
  // scrolling bushes along the very bottom edge, in front of the train
  for (let i = 0; i < 6; i++) mkBush((i * W / 4) + Math.random() * 60, H - 2, 1.0 + Math.random() * 0.5)
  // v56.7 A-320/J1 — FOREGROUND OCCLUSION PLANE: telegraph poles + signal posts whipping
  // past at 2.1-2.3× IN FRONT of the train. Occlusion is the strongest near-camera depth
  // cue — the scene stops reading flat the moment near objects pass over it.
  const mkPole = (x, kind) => {
    const g = new PIXI.Graphics()
    const ph = Math.max(120, H * 0.34)
    if (kind === 'signal') {
      g.rect(-3, -ph, 6, ph).fill({ color: 0x2e2a26, alpha: 0.92 })
      g.rect(-13, -ph, 26, 16).fill({ color: 0x3a332c, alpha: 0.92 })
      g.circle(-5, -ph + 8, 4.4).fill({ color: 0x67e05f, alpha: 0.95 })
      g.circle(6, -ph + 8, 4.4).fill({ color: 0x8a2f24, alpha: 0.9 })
    } else {
      g.rect(-2.5, -ph, 5, ph).fill({ color: 0x241f1a, alpha: 0.9 })
      g.rect(-16, -ph + 6, 32, 4).fill({ color: 0x241f1a, alpha: 0.9 })
      g.rect(-11, -ph + 16, 22, 3.4).fill({ color: 0x241f1a, alpha: 0.9 })
    }
    g.x = x; g.y = H + 4
    g._speed = 2.1 + Math.random() * 0.2   // near-camera: fastest layer in the scene
    g._baseY = g.y; g._bob = 0; g._pole = true
    c.addChild(g); foreItems.push(g)
  }
  mkPole(W * 0.55, 'pole'); mkPole(W * 1.25, 'signal'); mkPole(W * 1.9, 'pole')
}

// v56.7 A-320/J3 — aerial haze + ground vignette (depth contrast cues; rebuilt on resize)
function g14BuildHaze() {
  const W = app.screen.width, H = app.screen.height
  if (L._haze && L._haze.parent) { L._haze.parent.removeChild(L._haze); L._haze.destroy() }
  const g = new PIXI.Graphics()
  const bh = L._bdHandle
  const fi = (bh && bh.fitInfo) ? bh.fitInfo() : null
  const farTop = fi ? Math.max(0, fi.topY) : 0
  const farBot = fi ? (fi.topY + 0.48 * fi.scaledH) : H * 0.45
  if (farBot > farTop) {
    const steps = 6
    for (let i = 0; i < steps; i++) {   // stronger at the horizon, fading downward
      const a = 0.16 * (1 - i / steps)
      g.rect(0, farTop + (farBot - farTop) * i / steps, W, (farBot - farTop) / steps + 1)
        .fill({ color: 0xdfeef8, alpha: a })
    }
  }
  g.rect(0, H * 0.88, W, H * 0.12).fill({ color: 0x2b1c0d, alpha: 0.08 })
  L._haze = g
  // sit right above the backdrop, below tracks/trains
  const idx = (bh && bh.bg && bh.bg.parent === stage) ? stage.getChildIndex(bh.bg) + 1 : 1
  stage.addChildAt(g, Math.min(idx, stage.children.length))
}

function tickFore(delta) {
  if (!L.fore) return
  const W = app.screen.width
  for (const g of foreItems) {
    g.x -= g._speed * S.speed * delta * 0.4
    if (!g._pole) { g._bob += 0.04 * delta; g.y = g._baseY + Math.sin(g._bob) * 1.5 }
    if (g.x < -90) g.x = W + 60 + Math.random() * 40
  }
  // v56.7 A-320/J2 — LOOK-AROUND PARALLAX on every lane switch: the camera follows the
  // train, so SCENIC layers shift opposite the move, scaled by depth (far shifts least,
  // the foreground plane most). Rail-strip bands are NEVER offset — trains stay glued to
  // their verified rails (zero-tolerance). Frame-rate-independent ease; reduced-motion off.
  if (window.Motion && !g14ReducedMotion()) {
    const dtSec = (delta || 1) / 60
    const tgt = (L.player && L.player._switchDySign) ? -L.player._switchDySign : 0
    S._look = Motion.damp(S._look || 0, tgt, 6, dtSec)
    const lk = S._look
    if (Math.abs(lk) > 0.01 || S._lookApplied) {
      S._lookApplied = Math.abs(lk) > 0.01
      const bh = L._bdHandle
      if (bh && bh.bands && bh.fitInfo) {
        const fi = bh.fitInfo()
        for (const c of bh.bands) {
          if (!c || c.destroyed || c._fy1 > 0.48) continue      // scenic bands only
          const depth = 1 - (c._fy0 / 0.48)                     // far=1 … near-scenic=0
          c.y = fi.topY + c._fy0 * fi.scaledH + lk * 6 * depth
        }
      }
      L.fore.y = lk * 16                                        // nearest layer moves most
    }
  }
}

// ── Tracks ────────────────────────────────────────────────
let trackTies = []
// v55.5 — TIE_W shrunk (was 28→16), TIE_GAP widened (38→58) so sleepers
// occupy less screen and scenery between rails reads as background. Closes B-202.
// v55.41 B-226 — further shrink so the train CHARACTER is the visual star.
const TIE_W = 11, TIE_H = 3, TIE_GAP = 78

function buildTracks() {
  const c = new PIXI.Container(); L.tracks = c; stage.addChild(c)
  trackTies = []   // v55.61 — drop stale (destroyed) tie refs from a previous build (resize) so tickTracks never reads a null sprite
  const W = app.screen.width
  // A-311 — Indonesian ballast palette (reddish-brown gravel, steel rails, grain ties)
  const _is = window.IndoScene, _p = _is && g14Palette()
  const C_GRASS = _p ? _p.grass : 0x4ade80, C_BALLAST = _p ? _p.ballast : 0x6b5b4a,
        C_RAIL = _p ? _p.rail : 0x4b5563, C_SHINE = _p ? _p.railShine : 0x9ca3af, C_TIE = _p ? _p.tie : 0x4e342e

  // v55.5 — Per-lane track redesign (closes B-202). Owner: rail strip should be
  // LESS than 80% of train height. Train spriteHeight ~90px → rail strip ≈ 54px
  // (60% of train). Previously railOffset = laneH * 0.28 = ~67px (134px strip
  // on mobile) — dominated the lane. Now fixed-pixel railOffset 27 → 54px strip.
  // Rest of lane fills with grass + sparse fence + tree dots for breathing room.
  const RAIL_HALF = 18  // v55.41 B-226 — 18 × 2 = 36px rail strip (~30% of bigger train) so the character dominates
  for (let ln = 0; ln < LANE_COUNT; ln++) {
    const cy = laneYs[ln]
    // v55.69 B-278 — Pole-Position taper: far (top) lane has a NARROWER rail
    // gauge + thinner sleepers, near (bottom) lane WIDER → strong forward-depth.
    const _depth = g14LaneDepth(ln)
    const railOffset = RAIL_HALF * _depth
    const tieDrawW = TIE_W * _depth   // sleeper visual width tapers; x-SPACING stays global (wrap math unchanged)

    // Grass fill (full lane height) — Indonesian field green
    const grass = new PIXI.Graphics()
    grass.rect(0, cy - laneH * 0.5, W, laneH).fill(C_GRASS)
    grass.alpha = 0.55
    c.addChild(grass)

    // Lane separator (subtle line between lanes)
    if (ln < LANE_COUNT - 1) {
      const sep = new PIXI.Graphics()
      sep.rect(0, cy + laneH * 0.5 - 1, W, 2).fill(0x1a3a1a)
      sep.alpha = 0.5
      c.addChild(sep)
    }

    // v55.5 — Light grass texture strip above + below rail (depth illusion)
    const upperGrass = new PIXI.Graphics()
    upperGrass.rect(0, cy - laneH * 0.5, W, laneH * 0.5 - railOffset - 2).fill(0x4ade80)
    upperGrass.alpha = 0.12
    c.addChild(upperGrass)
    const lowerGrass = new PIXI.Graphics()
    lowerGrass.rect(0, cy + railOffset + 2, W, laneH * 0.5 - railOffset - 2).fill(0x16a34a)
    lowerGrass.alpha = 0.10
    c.addChild(lowerGrass)

    // Ballast strip (reddish-brown gravel under rails)
    const ballast = new PIXI.Graphics()
    ballast.rect(0, cy - railOffset, W, railOffset * 2).fill(C_BALLAST)
    ballast.alpha = 0.75
    c.addChild(ballast)

    // Steel rails — 2 thin lines at edges of rail strip
    for (const sign of [-1, 1]) {
      const rail = new PIXI.Graphics()
      rail.rect(0, cy + sign * railOffset - 1, W, 2.5).fill(C_RAIL)
      c.addChild(rail)
      // Subtle highlight on top edge
      const highlight = new PIXI.Graphics()
      highlight.rect(0, cy + sign * railOffset - 1.5, W, 0.8).fill(C_SHINE)
      highlight.alpha = 0.85
      c.addChild(highlight)
    }

    // Sleepers (ties) — scrolling, thinner + wider spacing
    const numTies = Math.ceil(W / (TIE_W + TIE_GAP)) + 3
    for (let j = 0; j < numTies; j++) {
      const tie = new PIXI.Graphics()
      tie.rect(-tieDrawW / 2, cy - railOffset - 1, tieDrawW, railOffset * 2 + 2).fill(C_TIE)
      tie.x = j * (TIE_W + TIE_GAP)
      c.addChild(tie)
      trackTies.push({ g: tie, ln })
    }
  }
}

function tickTracks(delta) {
  const W = app.screen.width
  const px = S.speed * delta * 1.0
  const period = (TIE_W + TIE_GAP) * (Math.ceil(W / (TIE_W + TIE_GAP)) + 3)
  for (const t of trackTies) {
    if (!t.g || t.g.destroyed) continue
    t.g.x -= px
    if (t.g.x < -(TIE_W + 10)) t.g.x += period
  }
}

// ── Mid items scroll ─────────────────────────────────────
function tickMid(delta) {
  const W = app.screen.width
  // v55.75 — PARALLAX backdrop bands: scroll each depth band at its own speed and
  // wrap seamlessly so the painterly scene MOVES (train travelling). dt-clamped.
  // v55.77 — parallax band scroll + edge-safe rail bob now live in the SHARED engine
  // (games/train-backdrop.js); the handle scrolls bands at per-depth speed and bobs the
  // whole `stage` (clamped to overscan) so the painted world + train move as one.
  if (L._bdHandle) L._bdHandle.tick(S.speed, delta, stage)
  for (const t of midItems) {
    t.x -= t._speed * S.speed * delta * 0.4
    if (t.x < -60) t.x = W + 20
  }
  // Far — v55.61 B-241: depth-banded parallax, each band tiled 2× → seamless wrap.
  if (L._farBands) {
    const _d = Math.min(delta, 2)   // dt-clamp (throttled-tablet frame spikes)
    // v55.64 B-241 — gentle vertical bob per band = rolling "menanjak/menurun"
    // terrain feel. SCENERY ONLY (masked sky band); the rail + lane Ys are never
    // touched so on-rail alignment holds. Slow + small + scaled by depth.
    S._terrainPhase = (S._terrainPhase || 0) + S.speed * _d * 0.012
    let _bi = 0
    for (const band of L._farBands) {
      band.x -= band._pf * S.speed * _d * 0.4
      if (band.x <= -band._tileW) band.x += band._tileW
      band.y = Math.sin(S._terrainPhase + _bi * 1.7) * (3 + band._pf * 14)   // nearer band rolls more
      _bi++
    }
  }
  // v55.61 B-258 — living sky (birds/clouds/kites), self-paced + dt-clamped
  if (L._ambient) { try { L._ambient.tick(delta) } catch(_){} }
  // v55.46 — foreground parallax (fast, in front of the train) for 2.5D depth
  tickFore(delta)
  // v56.6 B-286/B3 — tick the revived ambient living-sky layer (dt-clamped inside)
  if (L._amb && L._amb.tick) { try { L._amb.tick(delta) } catch (_) {} }
}

// ── Player train ──────────────────────────────────────────
const PLAYER_X = 0.15  // fraction of screen width

// Convert CSS hex string to PIXI integer color
function hexN(h) { return parseInt(h.replace('#',''), 16) }

// Draw train silhouette on a 2D canvas — 5 distinct shapes per category
function drawTrainCard2d(canvas, bodyC, accC, catKey, v) {
  const ctx = canvas.getContext('2d');
  const CW = canvas.width, CH = canvas.height;
  ctx.clearRect(0, 0, CW, CH);
  const vi = ((v||1) - 1) % 5;
  const tY = CH - 4;           // ground line
  const bodyB = tY - 2;        // body bottom

  function rr(x,y,w,h,r=0){ctx.beginPath();if(r>0)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill();}
  function whl(cx,cy,r,rim,spoke){
    ctx.fillStyle=rim;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=spoke;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx-r,cy);ctx.lineTo(cx+r,cy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,cy-r);ctx.lineTo(cx,cy+r);ctx.stroke();
    ctx.fillStyle='#555';ctx.beginPath();ctx.arc(cx,cy,r*0.35,0,Math.PI*2);ctx.fill();
  }
  function bwhl(cx,cy,r){
    ctx.fillStyle='#333';rr(cx-r*2.5,cy-r*0.6,r*5,r*1.2);
    ctx.fillStyle='#666';ctx.beginPath();ctx.arc(cx-r*1.5,cy+r*0.6,r,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+r*1.5,cy+r*0.6,r,0,Math.PI*2);ctx.fill();
  }
  function panto(px,roofY){
    ctx.strokeStyle='#aaa';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(px-5,roofY);ctx.lineTo(px,roofY-9);ctx.lineTo(px+5,roofY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(px-7,roofY-9);ctx.lineTo(px+7,roofY-9);ctx.stroke();
    // Cross-arm detail
    ctx.lineWidth=0.6;
    ctx.beginPath();ctx.moveTo(px-3,roofY-3);ctx.lineTo(px+3,roofY-6);ctx.stroke();
  }
  // Handrail helper
  function handrail(x,y,len,color='rgba(251,191,36,.35)'){
    ctx.fillStyle=color;rr(x,y,len,1);
    rr(x,y-2,1,3);rr(x+len-1,y-2,1,3);
  }
  // Coupling hook helper
  function coupling(x,y,dir=1){
    ctx.fillStyle='#6b7280';rr(x,y,dir*4,3);rr(x+dir*3,y-1,dir*2,5,1);
  }
  // Number board helper
  function numBoard(x,y,w=10,h=5){
    ctx.fillStyle='rgba(0,0,0,.35)';rr(x,y,w,h,1);
    ctx.fillStyle='rgba(255,255,255,.15)';rr(x+1,y+1,w-2,h-2,1);
  }
  // Rivet line helper
  function rivets(x,y,count,gap=4){
    ctx.fillStyle='rgba(255,255,255,.2)';
    for(let i=0;i<count;i++){ctx.beginPath();ctx.arc(x+i*gap,y,0.7,0,Math.PI*2);ctx.fill();}
  }
  // Headlight pair helper
  function headlights(x,y,r=3){
    ctx.fillStyle='#fef08a';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r*0.5,0,Math.PI*2);ctx.fill();
  }
  // Tail light pair helper
  function taillights(x,y,r=2){
    ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fca5a5';ctx.beginPath();ctx.arc(x,y,r*0.5,0,Math.PI*2);ctx.fill();
  }

  // ── MAGLEV ────────────────────────────────────────────────────────────────
  if(catKey&&catKey.includes('maglev')){
    [
      ()=>{ // v1: Low streamlined capsule
        ctx.fillStyle=bodyC;rr(4,CH*.32,CW-10,CH*.42,8);
        ctx.fillStyle=accC;rr(4,CH*.5,CW-14,CH*.08);

      ctx.fillStyle='#e0f2fe';rr(bX+bW-9,CH*.26,8,CH*.2,2);
      for(const f of[.32,.48,.64]) whl(bX+bW*f,tY-2,CH*.18,accC,'#fde68a');
      whl(bX+bW*.1,tY,4,'#374151','#888'); // pilot
      whl(bX+bW*.82,tY,4,'#374151','#888'); // trailer
    },
    ()=>{ // v4: Garratt articulated — two bogies, central tank, very long
      ctx.fillStyle=bodyC;rr(CW*.19,CH*.22,CW*.62,CH*.38,3); // central boiler
      ctx.fillStyle=bodyC;rr(3,CH*.32,CW*.22,CH*.28,2);      // front bogie frame
      ctx.fillStyle=bodyC;rr(CW*.79,CH*.32,CW*.19,CH*.26,2); // rear bogie frame
      ctx.fillStyle=accC;rr(CW*.19,CH*.33,CW*.62,CH*.09);    // band
      ctx.fillStyle='#111';
      rr(CW*.24,CH*.08,5,CH*.14);rr(CW*.21,CH*.06,9,CH*.06,2); // chimney 1
      rr(CW*.34,CH*.08,5,CH*.14);rr(CW*.31,CH*.06,9,CH*.06,2); // chimney 2
      ctx.fillStyle=accC;rr(CW*.8,CH*.24,CW*.19,CH*.36,2);   // cab
      ctx.fillStyle='#dbeafe';rr(CW*.82,CH*.28,CW*.14,CH*.2,2);
      for(const f of[.06,.15]) whl(CW*f,tY-2,5,'#292524','#6b7280');
      for(const f of[.26,.34]) whl(CW*f,tY-2,CH*.13,accC,'#fde68a');
      for(const f of[.64,.72]) whl(CW*f,tY-2,CH*.13,accC,'#fde68a');
      for(const f of[.84,.93]) whl(CW*f,tY-2,5,'#292524','#6b7280');
    },
    ()=>{ // v5: Tank locomotive — side tanks, wide, no tender
      const bX=4,bW=CW-10;
      ctx.fillStyle=bodyC;rr(bX,CH*.22,bW,CH*.5,3);
      ctx.fillStyle=accC; // side tanks (darker panels)
      rr(bX,CH*.24,bW*.3,CH*.28);rr(bX+bW-bW*.3,CH*.24,bW*.3,CH*.28);
      ctx.fillStyle=bodyC;rr(bX+bW*.28,CH*.24,bW*.44,CH*.3,2); // central boiler
      ctx.fillStyle='#1c1917';rr(bX+bW*.1,CH*.08,6,CH*.14);rr(bX+bW*.06,CH*.06,10,CH*.06,2); // chimney
      ctx.fillStyle='#6b7280';ctx.beginPath();ctx.arc(bX+bW*.56,CH*.24,7,Math.PI,0);ctx.fill(); // dome
      ctx.fillStyle=accC;rr(bX+bW-10,CH*.18,12,CH*.54,2);
      ctx.fillStyle='#dbeafe';rr(bX+bW-9,CH*.24,10,CH*.22,2);
      for(const f of[.22,.44,.66]) whl(bX+bW*f,tY-2,CH*.16,'#374151',accC);
    },
  ][vi]();
}

// Draw a train silhouette on a PIXI.Graphics object (center-anchored, W≈70, H≈26)
function drawTrainG(g, bodyC, accC, catKey, trainKey, variant) {
  g.clear()
  const bC = hexN(bodyC), aC = hexN(accC)
  const W = 70, hW = 35, H = 26, hH = 13

  // ── White glow helper: draw an outline glow ─────────────────────────────
  function glowOutline(x, y, w, h, r) {
    // Outer glow layer (widest, most transparent)
    g.roundRect(x - 3, y - 3, w + 6, h + 6, r + 2).fill({ color: 0xffffff, alpha: 0.08 })
    // Inner glow layer
    g.roundRect(x - 1.5, y - 1.5, w + 3, h + 3, r + 1).fill({ color: 0xffffff, alpha: 0.18 })
    // Hard white stroke
    g.roundRect(x, y, w, h, r).stroke({ color: 0xffffff, width: 1.8, alpha: 0.75 })
  }

  if (catKey === 'maglev') {
    // ── Maglev streamlined capsule ──────────────────────────────────────
    g.roundRect(-hW - 3, -hH - 3, W + 6, H + 6, 12).fill({ color: 0xffffff, alpha: 0.08 })
    g.roundRect(-hW - 1, -hH - 1, W + 2, H + 2, 10).fill({ color: 0xffffff, alpha: 0.18 })
    g.roundRect(-hW, -hH, W, H, 9).fill(bC)
    glowOutline(-hW, -hH, W, H, 9)
    // Upper body highlight
    g.roundRect(-hW + 2, -hH + 1, W - 4, 5, 4).fill({ color: 0xffffff, alpha: 0.08 })
    // Speed stripe (double)
    g.rect(-hW + 2, -3, W - 4, 6).fill(aC)
    g.rect(-hW + 2, -1, W - 4, 2).fill({ color: 0xffffff, alpha: 0.15 })
    // Visor windshield
    g.roundRect(-hW + 5, -hH + 3, W - 10, 9, 3).fill(0x0f172a)
    g.roundRect(-hW + 5, -hH + 3, W - 10, 4, 3).fill({ color: 0x93c5fd, alpha: 0.5 })
    // Window pillars
    for (let wp = 0; wp < 4; wp++) g.rect(-hW + 14 + wp * 12, -hH + 3, 1.5, 9).fill({ color: bC, alpha: 0.6 })
    // Nose cone
    g.poly([hW - 8, -hH, hW + 8, 0, hW - 8, hH]).fill(bC)
    g.poly([hW - 8, -hH, hW + 8, 0, hW - 8, hH]).stroke({ color: 0xffffff, width: 1, alpha: 0.5 })
    g.roundRect(hW - 10, -hH, 4, H, 2).fill(aC)
    // Headlights
    g.circle(hW + 2, -3, 3).fill(0xfef08a); g.circle(hW + 2, -3, 1.5).fill(0xffffff)
    g.circle(hW + 2, 3, 3).fill(0xfef08a); g.circle(hW + 2, 3, 1.5).fill(0xffffff)
    // Panel lines
    for (let pl = 0; pl < 5; pl++) g.rect(-hW + 4 + pl * 12, -hH + 1, 0.8, H - 2).fill({ color: 0x000000, alpha: 0.12 })
    // Door markers
    g.rect(-hW + 16, -hH + 2, 8, H - 4).stroke({ color: 0xffffff, width: 0.6, alpha: 0.2 })
    g.rect(-hW + 40, -hH + 2, 8, H - 4).stroke({ color: 0xffffff, width: 0.6, alpha: 0.2 })
    // Levitation rail + glow
    g.rect(-hW + 6, hH, W - 12, 2).fill(0x1e3a8a)
    g.rect(-hW + 6, hH + 2, W - 12, 4).fill(0x38bdf8)
    g.rect(-hW + 6, hH + 2, W - 12, 2).fill({ color: 0x7dd3fc, alpha: 0.7 })
    // Pulsing LED strip under body
    g.rect(-hW + 4, hH - 1, W - 8, 1.5).fill({ color: aC, alpha: 0.45 })
    g.rect(-hW + 8, hH - 1, 6, 1.5).fill({ color: 0xffffff, alpha: 0.3 })
    // Undercarriage sensors
    for (let si = 0; si < 6; si++) {
      g.circle(-hW + 12 + si * 10, hH + 1, 1.5).fill({ color: 0x38bdf8, alpha: 0.5 })
      g.circle(-hW + 12 + si * 10, hH + 1, 0.8).fill({ color: 0xffffff, alpha: 0.7 })
    }
    // Ventilation grilles (roof)
    for (let vi = 0; vi < 3; vi++) g.roundRect(-hW + 8 + vi * 16, -hH - 2, 10, 2, 1).fill({ color: 0x000000, alpha: 0.15 })
    // Aerodynamic fairing covers
    g.poly([-hW, hH, -hW - 4, hH + 3, -hW, hH + 3]).fill({ color: bC, alpha: 0.5 })
    // Number plate
    g.roundRect(-hW + 2, hH - 5, 14, 4, 1).fill({ color: 0x000000, alpha: 0.3 })
    // Tail light
    g.circle(-hW - 1, 0, 2.5).fill(0xef4444); g.circle(-hW - 1, 0, 1.2).fill(0xfca5a5)
    return
  }

  if (catKey === 'hsr') {
    // ── Bullet-nose high-speed train ────────────────────────────────────
    g.roundRect(-hW - 2, -hH - 2, W - 8, H + 4, 5).fill({ color: 0xffffff, alpha: 0.1 })
    // Main body
    g.roundRect(-hW, -hH, W - 12, H, 4).fill(bC)
    // Nose cone (elongated triangle)
    g.poly([hW - 12, -hH, hW + 8, -2, hW + 8, 2, hW - 12, hH]).fill(bC)
    g.poly([hW - 12, -hH, hW + 8, -2, hW + 8, 2, hW - 12, hH]).stroke({ color: 0xffffff, width: 1, alpha: 0.5 })
    g.roundRect(-hW, -hH, W - 12, H, 4).stroke({ color: 0xffffff, width: 1.5, alpha: 0.7 })
    // Upper highlight
    g.roundRect(-hW + 2, -hH + 1, W - 16, 4, 2).fill({ color: 0xffffff, alpha: 0.08 })
    // Speed stripe (accent band)
    g.rect(-hW, -2, W - 6, 5).fill(aC)
    g.rect(-hW, -1, W - 6, 1.5).fill({ color: 0xffffff, alpha: 0.12 })
    // Windshield visor
    g.roundRect(-hW + 4, -hH + 3, W - 22, 9, 2).fill(0x0f172a)
    g.roundRect(-hW + 4, -hH + 3, W - 22, 4, 2).fill({ color: 0xbfdbfe, alpha: 0.5 })
    // Window pillars
    for (let wp = 0; wp < 3; wp++) g.rect(-hW + 14 + wp * 11, -hH + 3, 1, 9).fill({ color: bC, alpha: 0.5 })
    // Headlights (dual)
    g.circle(hW + 4, -2, 3.5).fill(0xfef08a); g.circle(hW + 4, -2, 2).fill(0xffffff)
    g.circle(hW + 4, 2, 2.5).fill(0xfca5a5); g.circle(hW + 4, 2, 1.5).fill(0xfecdd3)
    // Pantograph (detailed diamond shape)
    const px = -hW + 12
    g.rect(px, -hH - 7, 2, 7).fill({ color: 0xd1d5db, alpha: 0.8 })
    g.rect(px + 16, -hH - 7, 2, 7).fill({ color: 0xd1d5db, alpha: 0.8 })
    g.rect(px - 2, -hH - 8, 22, 1.5).fill({ color: 0xd1d5db, alpha: 0.8 })
    // Cross-arm
    g.moveTo(px + 1, -hH).lineTo(px + 9, -hH - 7).stroke({ color: 0xd1d5db, width: 1, alpha: 0.6 })
    g.moveTo(px + 17, -hH).lineTo(px + 9, -hH - 7).stroke({ color: 0xd1d5db, width: 1, alpha: 0.6 })
    // Contact wire
    g.rect(px - 4, -hH - 10, 28, 1).fill({ color: 0xfbbf24, alpha: 0.4 })
    // Bogies/Wheels with suspension detail
    for (const bx of [-24, 10]) {
      // Bogie frame
      g.roundRect(bx - 4, hH - 1, 18, 4, 1.5).fill({ color: 0x1f2937, alpha: 0.6 })
      // Wheels (paired)
      g.circle(bx, hH + 3, 4.5).fill(0x1f2937).stroke({ color: 0x6b7280, width: 1.2 })
      g.circle(bx, hH + 3, 2).fill(0x9ca3af)
      g.circle(bx + 10, hH + 3, 4.5).fill(0x1f2937).stroke({ color: 0x6b7280, width: 1.2 })
      g.circle(bx + 10, hH + 3, 2).fill(0x9ca3af)
      // Suspension springs
      g.rect(bx + 2, hH - 2, 6, 2).fill({ color: 0x6b7280, alpha: 0.4 })
    }
    // Door markings (double doors)
    g.rect(-hW + 18, -hH + 2, 7, H - 4).stroke({ color: 0xffffff, width: 0.6, alpha: 0.2 })
    g.rect(-hW + 38, -hH + 2, 7, H - 4).stroke({ color: 0xffffff, width: 0.5, alpha: 0.15 })
    // Skirt (lower body panel / aerodynamic fairing)
    g.rect(-hW, hH - 3, W - 12, 3).fill({ color: 0x000000, alpha: 0.2 })
    g.rect(-hW, hH - 5, W - 12, 2).fill({ color: bC, alpha: 0.3 })
    // Brake disc indicators (between bogies)
    for (let bi = 0; bi < 3; bi++) g.circle(-10 + bi * 8, hH + 1, 1).fill({ color: 0xd97706, alpha: 0.3 })
    // Ventilation grilles (roof)
    for (let vi = 0; vi < 2; vi++) g.roundRect(-hW + 6 + vi * 18, -hH - 3, 12, 2.5, 1).fill({ color: 0x000000, alpha: 0.12 })
    // Destination LED board
    g.roundRect(-hW + 3, -hH + 13, 16, 5, 1).fill(0x000000)
    g.roundRect(-hW + 4, -hH + 14, 14, 3, 0.5).fill({ color: 0xfbbf24, alpha: 0.6 })
    // Tail light
    g.circle(-hW - 1, -4, 2).fill(0xef4444); g.circle(-hW - 1, -4, 1).fill(0xfca5a5)
    g.circle(-hW - 1, 4, 2).fill(0xef4444); g.circle(-hW - 1, 4, 1).fill(0xfca5a5)
    // Number plate
    g.roundRect(-hW + 2, -hH + 2, 14, 6, 1).fill({ color: 0x000000, alpha: 0.3 })
    // Coupler cover (nose)
    g.roundRect(hW + 6, -3, 4, 6, 1).fill({ color: bC, alpha: 0.6 })
    return
  }

  // ── General body: steam / diesel / emu ──────────────────────────────────
  const isSteam = catKey && catKey.includes('steam')
  const isEmu = catKey && catKey.includes('emu')
  // Glow shell
  g.roundRect(-hW - 3, -hH - 3, W + 6, H + 6, 7).fill({ color: 0xffffff, alpha: 0.08 })
  g.roundRect(-hW - 1.5, -hH - 1.5, W + 3, H + 3, 6).fill({ color: 0xffffff, alpha: 0.15 })
  // Body
  g.roundRect(-hW, -hH, W, H, 4).fill(bC)
  g.roundRect(-hW, -hH, W, H, 4).stroke({ color: 0xffffff, width: 1.5, alpha: 0.7 })
  // Upper body highlight
  g.roundRect(-hW + 2, -hH + 1, W - 4, 3, 2).fill({ color: 0xffffff, alpha: 0.06 })
  // Accent stripe (double band)
  g.rect(-hW, -hH + 3, W, 4).fill(aC)
  g.rect(-hW, -hH + 4, W, 1.5).fill({ color: 0xffffff, alpha: 0.1 })
  g.rect(-hW, -hH + 7, W, 1).fill({ color: 0x000000, alpha: 0.2 })
  // Windows
  const winCount = isSteam ? 1 : isEmu ? 5 : 3
  const winW = isEmu ? 8 : 11
  const winGap = isEmu ? 11 : 16
  for (let i = 0; i < winCount; i++) {
    const wx = -hW + 6 + i * winGap
    g.roundRect(wx, -hH + 6, winW, 9, 2).fill(0x0f172a)
    g.roundRect(wx, -hH + 6, winW, 3.5, 2).fill({ color: 0xbfdbfe, alpha: 0.4 })
    g.roundRect(wx, -hH + 6, winW, 9, 2).stroke({ color: 0x93c5fd, width: 0.8, alpha: 0.5 })
  }
  if (!isSteam) {
    // ── Diesel/EMU nose (integrated, no protruding block) ──
    // Sloped nose end
    g.poly([hW, -hH, hW + 6, -hH + 4, hW + 6, hH - 4, hW, hH]).fill(aC)
    g.poly([hW, -hH, hW + 6, -hH + 4, hW + 6, hH - 4, hW, hH]).stroke({ color: 0xffffff, width: 0.8, alpha: 0.4 })
    // Nose highlight
    g.poly([hW, -hH, hW + 4, -hH + 3, hW + 4, -hH + 6, hW, -hH + 4]).fill({ color: 0xffffff, alpha: 0.08 })
    // Front windshield (on nose) — split pane
    g.roundRect(hW - 12, -hH + 2, 12, 9, 2).fill(0x0f172a)
    g.roundRect(hW - 12, -hH + 2, 12, 4, 2).fill({ color: 0x87ceeb, alpha: 0.35 })
    g.rect(hW - 6, -hH + 2, 1, 9).fill({ color: bC, alpha: 0.4 }) // center pillar
    // Headlights (dual top + marker bottom)
    g.circle(hW + 3, -hH + 5, 3).fill(0xfef08a); g.circle(hW + 3, -hH + 5, 1.8).fill(0xffffff)
    g.circle(hW + 3, -hH + 10, 2).fill(0xfef08a); g.circle(hW + 3, -hH + 10, 1).fill(0xffffff)
    g.circle(hW + 3, hH - 5, 2.5).fill(0xfca5a5); g.circle(hW + 3, hH - 5, 1.2).fill(0xfecdd3)
    // Ditch lights (low-mounted, widely spaced)
    g.circle(hW + 1, hH - 10, 1.5).fill({ color: 0xfef08a, alpha: 0.6 })
    // Exhaust + radiator (diesel hood)
    if (!isEmu) {
      // Exhaust stack
      g.roundRect(-hW + 2, -hH - 4, 8, 4, 1).fill({ color: 0x1f2937, alpha: 0.5 })
      g.roundRect(-hW + 3, -hH - 5, 6, 2, 1).fill({ color: 0x374151, alpha: 0.4 })
      // Radiator grilles (long hood detail)
      for (let gi = 0; gi < 6; gi++) g.rect(-hW + 3 + gi * 2, -hH - 3, 1, 2.5).fill({ color: 0x6b7280, alpha: 0.3 })
      // Radiator fan (round on top)
      g.circle(-hW + 18, -hH - 2, 4).fill({ color: 0x1f2937, alpha: 0.3 })
      g.circle(-hW + 18, -hH - 2, 4).stroke({ color: 0x6b7280, width: 0.8, alpha: 0.3 })
      g.circle(-hW + 18, -hH - 2, 1.5).fill({ color: 0x9ca3af, alpha: 0.3 })
      // Horn (on roof)
      g.rect(hW - 16, -hH - 5, 3, 5).fill({ color: 0xd1d5db, alpha: 0.5 })
      g.roundRect(hW - 17, -hH - 7, 5, 3, 1).fill({ color: 0xfbbf24, alpha: 0.4 })
      // Bell
      g.circle(hW - 8, -hH - 3, 2.5).fill({ color: 0xd97706, alpha: 0.5 })
      g.rect(hW - 8, -hH - 6, 1, 3).fill({ color: 0xd1d5db, alpha: 0.4 })
      // Handrails (nose)
      g.rect(hW - 2, -hH + 12, 8, 1).fill({ color: 0xfbbf24, alpha: 0.3 })
      g.rect(hW + 5, -hH + 8, 1, 5).fill({ color: 0xfbbf24, alpha: 0.3 })
      // Dynamic brake blister (roof hump)
      g.roundRect(-hW + 28, -hH - 3, 14, 3, 1.5).fill({ color: 0x000000, alpha: 0.15 })
    }
    // Pantograph (EMU — detailed diamond)
    if (isEmu) {
      const px = -hW + 10
      g.rect(px, -hH - 8, 2, 8).fill({ color: 0xd1d5db, alpha: 0.7 })
      g.rect(px + 18, -hH - 8, 2, 8).fill({ color: 0xd1d5db, alpha: 0.7 })
      g.rect(px - 2, -hH - 9, 24, 1.5).fill({ color: 0xd1d5db, alpha: 0.7 })
      // Cross arms
      g.moveTo(px + 1, -hH).lineTo(px + 10, -hH - 8).stroke({ color: 0xd1d5db, width: 1, alpha: 0.5 })
      g.moveTo(px + 19, -hH).lineTo(px + 10, -hH - 8).stroke({ color: 0xd1d5db, width: 1, alpha: 0.5 })
      // Contact wire
      g.rect(px - 4, -hH - 11, 30, 1).fill({ color: 0xfbbf24, alpha: 0.35 })
      // Destination LED board
      g.roundRect(-hW + 4, -hH + 14, 14, 4, 1).fill(0x000000)
      g.roundRect(-hW + 5, -hH + 15, 12, 2, 0.5).fill({ color: 0xfbbf24, alpha: 0.5 })
      // Inter-car connector (rear)
      g.roundRect(-hW - 3, -hH + 3, 3, H - 6, 1).fill({ color: 0x374151, alpha: 0.4 })
      // AC unit (roof)
      g.roundRect(-hW + 32, -hH - 3, 12, 3, 1).fill({ color: 0xd1d5db, alpha: 0.2 })
    }
    // Door markings (double door)
    g.rect(-hW + 22, -hH + 2, 6, H - 4).stroke({ color: 0xffffff, width: 0.5, alpha: 0.18 })
    g.rect(-hW + 40, -hH + 2, 6, H - 4).stroke({ color: 0xffffff, width: 0.4, alpha: 0.12 })
    // Grab irons (side handrails)
    g.rect(-hW + 1, -hH + 8, 1, 10).fill({ color: 0xfbbf24, alpha: 0.25 })
    g.rect(hW - 2, -hH + 8, 1, 10).fill({ color: 0xfbbf24, alpha: 0.25 })
  }
  // Rivet dots
  for (const ry of [-hH + 1, hH - 2]) {
    for (let rx = -hW + 4; rx < hW - 14; rx += 8) {
      g.circle(rx, ry, 0.8).fill({ color: 0xffffff, alpha: 0.2 })
    }
  }
  // Number board
  g.roundRect(-hW + 2, -hH + 1, 14, 6, 1).fill({ color: 0x000000, alpha: 0.3 })
  // Bogies + Wheels
  for (const bx of [-24, isSteam ? -4 : 8]) {
    // Bogie frame
    if (!isSteam) g.roundRect(bx - 3, hH - 1, 16, 3, 1).fill({ color: 0x1f2937, alpha: 0.5 })
    // Wheels
    g.circle(bx, hH + 3, 6).fill(0x1f2937).stroke({ color: 0x6b7280, width: 1.2 })
    g.circle(bx, hH + 3, 3.5).fill(0x374151)
    g.circle(bx, hH + 3, 1.5).fill(0x9ca3af)
    g.circle(bx + 10, hH + 3, 6).fill(0x1f2937).stroke({ color: 0x6b7280, width: 1.2 })
    g.circle(bx + 10, hH + 3, 3.5).fill(0x374151)
    g.circle(bx + 10, hH + 3, 1.5).fill(0x9ca3af)
    // Axle
    g.rect(bx, hH + 2.5, 10, 1).fill({ color: 0x6b7280, alpha: 0.4 })
  }
  // Undercarriage
  g.rect(-hW, hH - 1, W, 2.5).fill({ color: 0x000000, alpha: 0.35 })
  // Coupling hooks
  g.rect(-hW - 4, hH - 2, 4, 3).fill({ color: 0x6b7280, alpha: 0.4 })
  if (!isSteam) g.rect(hW, hH - 2, 4, 3).fill({ color: 0x6b7280, alpha: 0.4 })
  if (catKey && catKey.includes('steam')) {
    const v = variant ? (variant-1) : (trainKey||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0) % 5
    // ── Boiler bands (3 rings around cylindrical boiler) ──
    for (let bi = 0; bi < 3; bi++) {
      const bx = -hW + 12 + bi * 18
      g.rect(bx, -hH, 2, H).fill({ color: 0xffffff, alpha: 0.12 })
    }
    // ── Running board / footplate (long horizontal bar) ──
    g.rect(-hW - 2, hH - 4, W + 8, 2.5).fill(aC)
    g.rect(-hW - 2, hH - 4, W + 8, 1).fill({ color: 0xffffff, alpha: 0.2 })
    // ── Smokestack / Chimney ──
    const chX = hW - 16 - v * 2
    const chW = 5 + v % 2
    g.rect(chX, -hH - 12 - v, chW, 12 + v).fill(bC)
    g.rect(chX, -hH - 12 - v, chW, 12 + v).stroke({ color: 0xffffff, width: 0.8, alpha: 0.4 })
    // Chimney cap (wider flared top)
    g.roundRect(chX - 3, -hH - 14 - v, chW + 6, 4, 2).fill(0x1f2937)
    g.roundRect(chX - 3, -hH - 14 - v, chW + 6, 1.5, 1).fill({ color: 0xffffff, alpha: 0.15 })
    // ── Steam dome (brass, raised) ──
    const dX = hW - 30 - v * 2
    g.ellipse(dX, -hH - 3, 6, 7).fill(aC)
    g.ellipse(dX, -hH - 3, 6, 7).stroke({ color: 0xffffff, width: 0.8, alpha: 0.4 })
    g.ellipse(dX, -hH - 6, 4, 3).fill({ color: 0xffffff, alpha: 0.15 }) // highlight
    // ── Safety valve (small between dome and chimney) ──
    g.rect(dX + 8, -hH - 6, 3, 6).fill(0x9ca3af)
    g.circle(dX + 9.5, -hH - 7, 2).fill(0xb8b8b8)
    // ── Sandbox (second smaller dome) ──
    if (v < 3) {
      g.ellipse(dX - 12, -hH - 1, 4, 5).fill(0x6b7280)

    // ── Headlight (on smokebox front) ──

    // ── Smokebox door (circular front face) ──

    g.circle(hW - 1, 0, hH - 4).stroke({ color: 0xffffff, width: 0.6, alpha: 0.2 })
    // ── Cowcatcher / pilot ──
    g.poly([hW + 1, -hH + 5, hW + 8, hH - 3, hW + 1, hH - 3]).fill(0x1f2937)
    for (let ci = 0; ci < 3; ci++) {
      g.rect(hW + 1, hH - 6 + ci * 2.5, 6, 1).fill({ color: 0x9ca3af, alpha: 0.4 })
    }
    // ── Cab (rear, taller with window) ──
    g.roundRect(-hW - 2, -hH - 6, 14, H + 6, 2).fill(aC)
    g.roundRect(-hW - 2, -hH - 6, 14, H + 6, 2).stroke({ color: 0xffffff, width: 0.8, alpha: 0.4 })
    // Cab window
    g.roundRect(-hW + 1, -hH - 3, 8, 8, 1.5).fill(0x0f172a)
    g.roundRect(-hW + 1, -hH - 3, 8, 4, 1.5).fill({ color: 0x87ceeb, alpha: 0.4 })
    // Cab roof
    g.roundRect(-hW - 4, -hH - 8, 18, 3, 1).fill({ color: 0x000000, alpha: 0.3 })
    // ── Tender car (coal wagon behind cab) ──

    g.roundRect(-hW - 24, -hH + 1, 20, H - 2, 3).stroke({ color: 0xffffff, width: 0.8, alpha: 0.35 })
    // Coal load
    g.poly([-hW-22,-hH+1, -hW-18,-hH-3, -hW-12,-hH-2, -hW-6,-hH+1]).fill({ color: 0x111111 })
    // Tender wheels
    g.circle(-hW - 18, hH + 3, 5).fill(0x1f2937).stroke({ color: 0x6b7280, width: 1 })
    g.circle(-hW - 18, hH + 3, 2).fill(0x9ca3af)
    g.circle(-hW - 8, hH + 3, 5).fill(0x1f2937).stroke({ color: 0x6b7280, width: 1 })

    g.rect(hW - 4, hH + 0, 8, 1.5).fill({ color: 0x6b7280, alpha: 0.35 })
    // ── Steam pipes (on side of boiler) ──

    // ── Firebox glow (under boiler, orange) ──
    g.rect(-hW + 14, hH - 2, 12, 3).fill({ color: 0xf97316, alpha: 0.2 })
    g.rect(-hW + 16, hH - 1, 8, 2).fill({ color: 0xfbbf24, alpha: 0.15 })
    // ── Whistle (on boiler top) ──
    g.rect(dX - 4, -hH - 5, 2, 5).fill({ color: 0xd97706, alpha: 0.5 })
    g.circle(dX - 3, -hH - 6, 1.5).fill({ color: 0xf59e0b, alpha: 0.6 })
    // ── Bell (front of boiler) ──
    g.circle(hW - 10, -hH - 3, 2.5).fill({ color: 0xd97706, alpha: 0.45 })
    g.rect(hW - 10, -hH - 6, 1, 3).fill({ color: 0xd1d5db, alpha: 0.35 })
    // ── Handrails (running along boiler) ──
    g.rect(-hW + 12, -hH + 2, hW * 2 - 26, 0.8).fill({ color: 0xfbbf24, alpha: 0.2 })
    // ── Water gauge (cab side) ──
    g.rect(-hW + 2, -hH + 8, 2, 8).fill({ color: 0x0891b2, alpha: 0.3 })
    g.rect(-hW + 2, -hH + 12, 2, 4).fill({ color: 0x22d3ee, alpha: 0.4 })
    // ── Splasher / wheel guard ──
    g.poly([-16, hH - 2, -4, hH - 2, -4, hH + 1, -16, hH + 1]).fill({ color: bC, alpha: 0.3 })
    g.arc(-10, hH + 3, 8, Math.PI, 0).stroke({ color: aC, width: 1.5, alpha: 0.3 })
  }
}

// v54.10 — Premium polish overlay. Adds 4 finishing touches (rim highlight, soft
// underbody shadow, vertical chassis weathering streaks, diagonal shine sweep)
// on top of any procedural train. Universal — every category benefits. Character
// trains use a separate sprite render path and are skipped via isCharacter check
// at the call sites.
function g14PolishOverlay(g) {
  const W = 70, hW = 35, H = 26, hH = 13
  // 1) Top-edge rim highlight (light glances off top of body — adds metallic feel)
  g.rect(-hW + 4, -hH, W - 8, 0.8).fill({ color: 0xffffff, alpha: 0.35 })
  g.rect(-hW + 4, -hH + 0.8, W - 8, 0.6).fill({ color: 0xffffff, alpha: 0.18 })
  // 2) Soft underbody shadow (ground contact gradient — anchors train to ground)
  g.rect(-hW + 2, hH + 6, W - 4, 1).fill({ color: 0x000000, alpha: 0.20 })
  g.rect(-hW + 4, hH + 7, W - 8, 1).fill({ color: 0x000000, alpha: 0.10 })
  // 3) Subtle vertical chassis streak (water/rust weathering — realism touch)
  for (let we = 0; we < 3; we++) {
    g.rect(-hW + 16 + we * 18, -hH + 4, 0.4, H - 8).fill({ color: 0x000000, alpha: 0.08 })
  }
  // 4) Body shine sweep (diagonal highlight band — gives 3D feel without gradient cost)
  g.poly([-hW + 8, -hH + 1, -hW + 22, -hH + 1, -hW + 14, -hH + 8, -hW, -hH + 8]).fill({ color: 0xffffff, alpha: 0.06 })
}

function buildPlayer() {
  const c = new PIXI.Container(); L.player = c; stage.addChild(c)
  // Lock scale.x=1 — drawTrainG authors the sprite right-facing (nose at +X).
  // Any stray negative scale would render the train "backward". Defensive.
  c.scale.x = 1
  c.x = app.screen.width * PLAYER_X

  // v55.95 DIORAMA — contact shadow under the loco (grounds it on the ballast). Behind everything.
  g14ContactShadow(c, (typeof G14_UNIFORM_H !== 'undefined' ? G14_UNIFORM_H : 120) * 1.5)
  // Glow ellipse (v55.95 — dimmed to a faint rim; the dark contact shadow now does the grounding)
  playerGlow = new PIXI.Graphics()
  playerGlow.ellipse(0, 8, 38, 12).fill(0x86efac)
  playerGlow.alpha = 0.12
  c.addChild(playerGlow)

  // Train graphic (replaces emoji Text for cross-device compatibility)
  playerSprite = new PIXI.Graphics()
  drawTrainG(playerSprite, '#1e3a8a', '#3b82f6', 'diesel_id')  // default until train selected
  c.addChild(playerSprite)

  // v55.45 B-230 — the rail strip is now a FIXED 18px half-strip (RAIL_HALF, not
  // the old laneH*0.28). The stale laneH-based wheelOffset pushed the container
  // ~34px below the rail on tall lanes → train "floats off the rail." Container now
  // sits AT lane center; the character sprite's 0.86 wheel-band anchor + procedural
  // wheels (local +19) both land on the bottom rail (lane center +18).
  // v55.87 — owner: wheels on the rail + a 10% margin of laneH (sits ON the rail, not jammed
  // at the very bottom). Applied via _wheelOffset so tickPlayer's lane-snap honours it too.
  const wheelOffset = -g14WheelMargin()
  c.y = laneYs[S.lane] + wheelOffset
  c._wheelOffset = wheelOffset

  // Steam container
  L.steam = new PIXI.Container(); stage.addChild(L.steam)
}

function updatePlayerEmoji() {
  if (!playerSprite || !S.trainCfg) return

  // v55.2 — Character trains use their WebP sprite via PIXI.Assets.load.
  // Replaces v54.87 PIXI.Sprite.from + addEventListener path which silently
  // failed in production (Agent G root cause: load event unreliable; texture
  // stuck at 1×1 placeholder; RAF poll exhausted 60 frames before update).
  // Mirror of the v54.96 balapan-kereta-side.html fix that DOES work in puppeteer.
  // Closes B-201.
  if (S.trainCfg.isCharacter && S.trainCfg.spriteUrl) {
    const url = S.trainCfg.spriteUrl
    if (!L.playerCharImg || L.playerCharImg._url !== url) {
      // v55.45 B-232 — owner: "ukuran keretanya tidak uniform, pastikan sama
      // ketinggiannya, lock aspect ratio perkereta." Every train renders at one
      // UNIFORM height; aspect is preserved (uniform scalar on both axes), so no
      // distortion — wide trains stay wide, none are stretched.
      const targetH = G14_UNIFORM_H
      PIXI.Assets.load(url).then((tex) => {
        // Tear down any previous character sprite
        if (L.playerCharImg && L.playerCharImg.parent) {
          try { L.playerCharImg.parent.removeChild(L.playerCharImg) } catch(_){}
          try { L.playerCharImg.destroy() } catch(_){}
        }
        const img = new PIXI.Sprite(tex)
        img._url = url
        // v55.84 — ZERO-TOLERANCE: anchor at this sprite's MEASURED wheel baseline so the
        // wheels sit EXACTLY on the lane Y (was a fixed 0.86 that sank wheels below the rail).
        img.anchor.set(0.5, g14WheelAnchor(url))
        // v55.38 B-223 — g14 is a HORIZONTAL 3-lane race; forward = RIGHT. Use
        // horizontal MIRROR for left-facing assets; right + forward stay native.
        img.scale.set(g14TrainScale(tex))   // v55.67 B-259 — bounding-box %, fits any train in its lane
        void targetH
        const _faces = (S.trainCfg && S.trainCfg.faces) || 'right'
        // v55.69 B-278 — record base scale + facing sign so depth-scaling can
        // rebuild the scale per lane without losing the mirror.
        img._baseScale = g14TrainScale(tex)
        img._faceSign = (_faces === 'left') ? -1 : 1
        g14ApplyDepthScale(img, S.lane)
        L.playerCharImg = img
        L.player.addChild(img) // TOP of z-stack — covers cleared procedural Graphics
        // v55.95 — match the contact shadow to the loaded loco's footprint width.
        if (L.player._shadow) { try { L.player._shadow.scale.x = Math.max(0.5, (img.width * 0.82) / L.player._shadow._baseW) } catch(_){} }
        try { playerSprite.clear() } catch(_){}
      }).catch((e) => {
        console.warn('[g14] sprite load failed; falling back to procedural', url, e)
        // Procedural fallback (current code path below will draw with bodyColor)
        const cat = S.trainCfg.category || ''
        const drawKey = cat.includes('maglev') ? 'maglev' : cat.includes('hsr') ? 'hsr' : cat.includes('steam') ? 'steam' : cat.includes('emu') ? 'emu' : 'diesel'
        drawTrainG(playerSprite, S.trainCfg.bodyColor, S.trainCfg.accColor, drawKey, S.trainCfg.key, S.trainCfg.variant||1)
      })
    }
    return // skip procedural draw — sprite is loading (or already loaded)
  }

  // Non-character train — procedural path (current behavior, unchanged).
  // If we previously rendered a character sprite, hide it now so it doesn't
  // leak into the next race when a non-character train is selected.
  if (L.playerCharImg && L.playerCharImg.parent) {
    try { L.playerCharImg.parent.removeChild(L.playerCharImg); L.playerCharImg.destroy() } catch(_){}
    L.playerCharImg = null
  }
  const cat = S.trainCfg.category || ''
  const drawKey = cat.includes('maglev') ? 'maglev' : cat.includes('hsr') ? 'hsr' : cat.includes('steam') ? 'steam' : cat.includes('emu') ? 'emu' : 'diesel'
  drawTrainG(playerSprite, S.trainCfg.bodyColor, S.trainCfg.accColor, drawKey, S.trainCfg.key, S.trainCfg.variant||1)
  // v54.10 — Apply universal polish overlay (skip for character trains; they use
  // sprite render via spriteUrl, not procedural). PROTECTED trains untouched.
  if (!S.trainCfg.isCharacter && typeof g14PolishOverlay === 'function') {
    g14PolishOverlay(playerSprite)
  }
}

function tickPlayer(delta) {
  if (!L.player) return
  const targetY = laneYs[S.targetLane] + (L.player._wheelOffset || 0)
  const dy = targetY - L.player.y
  // v54.8 carriage sway, v54.27 polish:
  //   - Position lerp is now MONOTONIC (was `* (1 + sin*0.18)` which could
  //     briefly reverse mid-switch causing the visible "jelly wobble").
  //   - Sway curve is rotation-only (body twist), capped at 0.05 rad.
  //   - Dust kickup only fires in the first 18 frames of the switch (start-of-turn
  //     burst) instead of the entire transition so a slow rebound doesn't keep emitting.
  //   - Cache _switchDySign so camera tilt (below) uses a stable sign even after dy
  //     near-zeroes at the end of the move.
  const dyAbs = Math.abs(dy)
  // v56.6 E2 A-315 — FRAME-RATE-INDEPENDENT lane switch via Motion.damp (the old
  // `dy*0.22*delta` frame-lerp converged HALF as fast at 30fps — the owner's "kasar"
  // on the throttled tablet — and ended in a visible 4px terminal SNAP). Rate 11 ≈
  // the same 60fps feel; sub-pixel landing keeps the v55.84 zero-tolerance (wheels
  // settle EXACTLY on targetY once within 0.5px, imperceptible).
  const _dtSec = (delta || 1) / 60
  if (dyAbs > 0.5) {
    S.switchFrame = (S.switchFrame | 0) + 1
    L.player._switchDySign = Math.sign(dy)
    L.player.y = (window.Motion) ? Motion.damp(L.player.y, targetY, 11, _dtSec)
                                 : L.player.y + dy * 0.22 * delta
    // v55.96 — BANKED lane-change tilt (owner juice #4), now dt-correct too.
    const _bank = 0.12 * (L.player._switchDySign || 0)
    L.player.rotation = (window.Motion) ? Motion.damp(L.player.rotation, _bank, 10, _dtSec)
                                        : L.player.rotation + (_bank - L.player.rotation) * Math.min(1, 0.28 * delta)
    if (S.switchFrame <= 18 && S.switchFrame % 6 === 0 && L.fx) g14SpawnLaneDust()
    // follow-through settle squash on arrival (once, when nearly there)
    if (dyAbs < 3 && !L.player._settled && window.Motion && L.playerCharImg) {
      L.player._settled = true
      Motion.squash(L.playerCharImg.scale, 0.06, 180)
    }
  } else {
    // zero-tolerance landing (sub-pixel → exact; no visible jump)
    L.player.y = targetY
    L.player.rotation = (window.Motion) ? Motion.damp(L.player.rotation, 0, 12, _dtSec) : L.player.rotation * 0.85
    if (Math.abs(L.player.rotation) < 0.002) L.player.rotation = 0
    S.switchFrame = 0
    L.player._switchDySign = 0
    L.player._settled = false
  }

  // v55.84 — removed the ±0.4px vertical sin-bob (it lifted the wheels off the rail).
  // Liveliness now comes from the carriage rotation-sway above + the rail-bob camera,
  // never a vertical float of the train itself.

  // v55.69 B-278 — continuous depth-scale: derive a fractional lane from the
  // train's live Y and rescale the sprite (near=bigger, far=smaller) so the
  // size eases smoothly through a lane switch. Render-only; gameplay untouched.
  if (L.playerCharImg && laneH) {
    const effLane = Math.max(0, Math.min(LANE_COUNT - 1, (L.player.y - railTop - laneH / 2) / laneH))
    g14ApplyDepthScale(L.playerCharImg, effLane)
  }

  // Glow pulse
  if (playerGlow) playerGlow.alpha = 0.18 + Math.sin(S.frame * 0.08) * 0.1

  // Invincibility flash
  if (S.invincible > 0) {
    S.invincible -= delta
    L.player.alpha = Math.sin(S.invincible * 0.7) > 0 ? 1 : 0.3
    if (S.invincible <= 0) L.player.alpha = 1
  }

  // Screen shake on crash. v54.17 A9: replaced rotational jitter (nauseating
  // for some kids) with cinematic scale ZOOM 1→1.08→1 over ~24 frames. Owner:
  // hit-stop weight via scale instead of rotation.
  // v54.51: short-circuit when reduce-motion is on — just decay the timer
  // without applying any visual transform so anak sensori sensitif tetap aman.
  if (S.shakeTimer > 0 && g14ReducedMotion()) {
    S.shakeTimer = 0
  }
  if (S.shakeTimer > 0) {
    S.shakeTimer -= delta
    const t = S.shakeTimer / 22
    stage.x = Math.sin(S.shakeTimer * 1.5) * 7 * t
    stage.y = Math.cos(S.shakeTimer * 1.2) * 4 * t
    stage.rotation = 0
    // Scale zoom: bell curve peaking mid-shake at +0.08
    const zoomScale = 1 + 0.08 * Math.sin(t * Math.PI)
    stage.scale.set(zoomScale)
  } else if (stage.scale && Math.abs(stage.scale.x - 1) > 0.001) {
    // Smooth back to 1.0
    const ns = stage.scale.x + (1 - stage.scale.x) * 0.18
    stage.scale.set(ns)
    stage.x *= 0.8
    stage.y *= 0.8
  } else {
    stage.x *= 0.8
    stage.y *= 0.8
    stage.rotation *= 0.7
  }
  // v54.17 A11 + v54.27 polish: banked-turn camera tilt during lane switch.
  // Was computing `_tiltDy` AFTER tickPlayer's position update, so dy could
  // be near-zero or sign-flipped at the end of the move → 1-frame counter-tilt.
  // Now uses L.player._switchDySign cached at the START of the move (only set
  // while |dy| > 4) so the tilt is monotonic.
  const sign = L.player._switchDySign || 0
  if (sign) {
    const targetTilt = sign * 0.03
    stage.rotation += (targetTilt - stage.rotation) * 0.12
  } else if (Math.abs(stage.rotation) > 0.001) {
    stage.rotation *= 0.85
  }
}

// ── Steam ─────────────────────────────────────────────────
function tickSteam(delta) {
  S.frame++
  // Only spawn smoke for steam trains
  const cat = S.trainCfg?.category || ''
  const isSteamTrain = cat.includes('steam')
  if (S.frame % 3 === 0 && isSteamTrain) spawnSteam()
  // Diesel gets small exhaust puffs (less visible)
  if (S.frame % 8 === 0 && !isSteamTrain && cat.includes('diesel')) spawnSteam()
  for (let i = S.steam.length - 1; i >= 0; i--) {
    const p = S.steam[i]
    p.g.x -= (S.speed * 0.6 + p.vx) * delta
    p.g.y += p.vy * delta
    p.life -= p.decay * delta
    p.g.alpha = p.life * 0.5
    p.g.scale.set(1 + (1 - p.life) * 1.5)
    if (p.life <= 0) { L.steam.removeChild(p.g); S.steam.splice(i, 1) }
  }
}
function spawnSteam() {
  if (!L.player) return
  const px = L.player.x - 24  // top of boiler
  const py = L.player.y - 22
  // v54.17 A16: 3-blob cluster (was single circle) tinted by current TIME_OF_DAY
  // phase's cloudTint when available. BlurFilter strength 2 gives soft cloudlike
  // diffusion. Color falls back to phase-aware white otherwise.
  const g = new PIXI.Graphics()
  const r = 4 + Math.random() * 5
  let tint = S.boosting ? 0xff6622 : 0xdcdcdc
  try {
    const colors = (typeof g14CurrentSkyColors === 'function') ? g14CurrentSkyColors() : null
    if (colors && colors.cloudTint != null && !S.boosting) tint = colors.cloudTint
  } catch(_){}
  // 3-blob cluster
  g.circle(0, 0, r).fill(tint)
  g.circle(-r * 0.7, r * 0.2, r * 0.7).fill(tint)
  g.circle(r * 0.6, -r * 0.3, r * 0.6).fill(tint)
  try {
    if (PIXI.BlurFilter) g.filters = [new PIXI.BlurFilter({ strength: 2 })]
  } catch(_){}
  g.x = px + (Math.random() - 0.5) * 8
  g.y = py
  g.alpha = 0.55
  L.steam.addChild(g)
  S.steam.push({ g, vx: 0.3 + Math.random() * 0.5, vy: -(0.8 + Math.random() * 1.2), life: 1, decay: 0.038 + Math.random() * 0.025 })
}

// ── AI Trains ─────────────────────────────────────────────
function buildAI() {
  L.ai.removeChildren()
  S.aiTrains = []
  // v55.32 B-221 — use NPC_TRAINS (excludes PROTECTED + AEG Thomas pack).
  const pool = shuffle([...NPC_TRAINS]).slice(0, AI_COUNT)
  pool.forEach((cfg, i) => {
    const c = new PIXI.Container()
    g14ContactShadow(c, G14_UNIFORM_H * 1.5)   // v55.95 DIORAMA — grounding shadow (behind train)
    const spr = new PIXI.Graphics()
    // v54.87 — Character AI also uses WebP sprite. Procedural drawn behind as
    // safety placeholder (in case sprite fails to load); sprite covers it.
    drawTrainG(spr, cfg.bodyColor || '#374151', cfg.accColor || '#9ca3af', cfg.category)
    if (!cfg.isCharacter && typeof g14PolishOverlay === 'function') g14PolishOverlay(spr)
    // v55.87 ROOT FIX — the procedural NPC was added at drawTrainG's raw ~58px while the
    // player sprite was ~329px ("npc kekecilan"). Scale it to the SAME G14_UNIFORM_H, wheels
    // on the rail line (local origin). This is what makes player == NPC.
    g14FitProceduralToRail(spr, G14_UNIFORM_H, (cfg.faces === 'left') ? -1 : 1)
    c.addChild(spr)

    // v55.2 — AI character sprite via PIXI.Assets.load (mirrors player path).
    // Replaces v54.87 PIXI.Sprite.from which silently failed. Closes B-201 AI side.
    if (cfg.isCharacter && cfg.spriteUrl) {
      PIXI.Assets.load(cfg.spriteUrl).then((tex) => {
        const img = new PIXI.Sprite(tex)
        img.anchor.set(0.5, g14WheelAnchor(cfg.spriteUrl))   // v55.84 — zero-tolerance: measured wheel baseline (NPC matches player)
        const _faceSign = (cfg.faces === 'left') ? -1 : 1
        const _s = g14TrainScale(tex)                        // v55.87 — NPC == PLAYER height (G14_UNIFORM_H), uniform
        img.scale.set(_s); img.scale.x = _s * _faceSign      // v55.38 B-223 — horizontal mirror, no rotation
        img._baseScale = _s
        img._faceSign = _faceSign
        c._charImg = img
        c.addChild(img)
        if (c._shadow) { try { c._shadow.scale.x = Math.max(0.5, (img.width * 0.82) / c._shadow._baseW) } catch(_){} }
        try { spr.clear() } catch(_){}
      }).catch((e) => {
        console.warn('[g14] AI sprite load fail; keeping procedural', cfg.key, e)
      })
    }

    // Glow
    const glow = new PIXI.Graphics()
    glow.ellipse(0, 8, 28, 9).fill(0x86efac)
    glow.alpha = 0.08   // v55.95 — dimmed; the dark contact shadow now does the grounding
    c.addChild(glow)

    const aiLane = [0, 1, 2].filter(l => l !== S.lane)[i % 2]
    c.y = laneYs[aiLane] - g14WheelMargin()   // v55.87 — same 10% rail margin as the player
    c._aiLane = aiLane; c._aiKey = cfg.key || cfg.name || ''
    // v55.87 — re-fit on resize/rotate (called from the resize handler) so the NPC keeps the
    // uniform height + rail margin at any viewport.
    c._g14RefitRail = function () {
      if (c._charImg && !c._charImg.destroyed && c._charImg.texture) {
        const s = g14TrainScale(c._charImg.texture)
        c._charImg.scale.set(s); c._charImg.scale.x = s * (c._charImg._faceSign || 1)
      } else if (spr && !spr.destroyed) {
        spr.scale.set(1); spr.y = 0
        g14FitProceduralToRail(spr, G14_UNIFORM_H, (cfg.faces === 'left') ? -1 : 1)
      }
      c.y = laneYs[c._aiLane] - g14WheelMargin()
    }
    // 2026-06-21 fairness pass — owner: "AI rubber-band + head start makes it
    // un-winnable". Equal starting grid (was: 0.55-0.70 head start at width).
    // Deterministic per-AI speed tier (was: 0.96 + Math.random() * 0.08).
    c.x = app.screen.width * 0.15
    L.ai.addChild(c)
    // AI tier: train 0 = slower (0.92×), train 1 = faster (1.04×). Both
    // deterministic — no per-frame randomness. Tunes match difficulty without
    // making the race feel rigged.
    const AI_TIERS = [0.92, 1.04]
    // v54.12 — AI thought bubble. Small Pixi Text floating above each AI showing
    // its current "intent" — gives the rival visible personality so the race feels
    // alive instead of empty. State updated by tickAI via _intentText.
    // v54.17 A8: wider bubble (74 vs 64) so we can fit a tiny train silhouette
    // marker to the LEFT of the intent text — kids see WHO is taunting them.
    const bubble = new PIXI.Graphics()
    bubble.roundRect(-37, -36, 74, 18, 6).fill({ color: 0xffffff, alpha: 0.92 })
    bubble.roundRect(-37, -36, 74, 18, 6).stroke({ color: 0x1f2937, width: 1 })
    // tail
    bubble.poly([-3, -18, 0, -10, 3, -18]).fill({ color: 0xffffff, alpha: 0.92 })
    bubble.alpha = 0
    // v55.87 — float the intent overlays ABOVE the now-taller uniform train (was drawn at
    // ~-36, which is now inside the loco body). Lift the whole intent group by the train height.
    const _ovLift = -(G14_UNIFORM_H - 18)
    bubble.y = _ovLift
    c.addChild(bubble)
    // v54.17 A8: tiny tinted train silhouette (12×6 box + dot wheels) using cfg's bodyColor.
    const sil = new PIXI.Graphics()
    const silColor = (cfg.bodyColor && /^#[0-9a-f]{6}$/i.test(cfg.bodyColor))
      ? parseInt(cfg.bodyColor.slice(1), 16) : 0x4b5563
    sil.rect(-26, -32, 12, 6).fill({ color: silColor })
    sil.rect(-20, -34, 5, 2).fill({ color: silColor })  // cab
    sil.circle(-22, -25, 1.4).fill({ color: 0x1f2937 })
    sil.circle(-16, -25, 1.4).fill({ color: 0x1f2937 })
    sil.alpha = 0
    sil.y = _ovLift
    c.addChild(sil)
    const txt = new PIXI.Text({ text: '...', style: { fontFamily: 'Fredoka One, sans-serif', fontSize: 11, fill: 0x1f2937, align: 'center' } })
    txt.anchor.set(0.5)
    txt.x = 5; txt.y = -27 + _ovLift  // shifted +5 for silhouette; lifted above the train (v55.87)
    txt.alpha = 0
    c.addChild(txt)
    // v54.52: assign one of 3 personality archetypes per AI train. Persona drives
    // boost frequency, lane-swap behaviour, and intent vocabulary in tickAI.
    //   - reckless:  boosts 2× more often, doesn't swap lanes
    //   - cautious:  swaps lane when obstacle ahead < 220px in own lane
    //   - copycat:   mirrors player's lane 800ms after a change
    //   - strategic: (v55.79) pre-empts the player's chosen lane + dodges ahead
    //   - aggressive:(v55.79) boosts most + tries to overtake even when level
    const PERSONAS = ['reckless','cautious','copycat','strategic','aggressive']
    const _persona = PERSONAS[(i + Math.floor(Math.random() * PERSONAS.length)) % PERSONAS.length]
    S.aiTrains.push({
      cfg, container: c,
      lane: aiLane,
      speed: S.baseSpeed * (AI_TIERS[i] || 1.0),
      distance: 0,
      hp: 3,  // AI also takes damage — fairness symmetry
      // v54.12 — intent system; v54.17 A8 adds silhouette `sil`.
      bubble, txt, sil,
      intent: 'lurus', intentTimer: 60,
      // v54.42: AI mini-boost matching thought bubble.
      boostTimer: 0,
      // v54.52: persona archetype.
      persona: _persona,
      copycatDelay: 0,
      lastPlayerLane: -1,
      // v54.50: track distance-relative-to-player from last frame so a
      // SIGN CHANGE = overtake event. Throttled by lastWhistleAt to avoid
      // doppler spam on close pacing.
      lastRelDist: 0,
      lastWhistleAt: 0,
    })
  })
}

// v54.12 — Rotate AI intent message (small dictionary). Gives visible personality.
const G14_AI_INTENTS = ['Maju!', 'Hati2!', 'Ngebut...', 'Pindah!', 'Hampir!', 'Wuss!', 'Hindari!']
function g14PickIntent(){ return G14_AI_INTENTS[Math.floor(Math.random()*G14_AI_INTENTS.length)] }

function tickAI(delta) {
  const W = app.screen.width
  const playerX = W * PLAYER_X

  S.aiTrains.forEach(ai => {
    // v54.42: catch-up boost. AI behind the player gets a small chance per
    // frame to fire a "Ngebut..." boost. Effect is bell-curved over ~1.5s
    // and capped at +15%. Keeps the race feeling alive without unfair
    // teleportation. AI ahead of player never gets the boost — only the
    // straggler closes gaps, never the leader runs away.
    const behind = ai.distance < S.distance - 40
    if (ai.boostTimer > 0) ai.boostTimer -= delta
    // v54.52: persona-modulated boost probability + behaviour.
    // v55.79: aggressive boosts most; strategic ~neutral.
    const _personaBoostMult = ai.persona === 'aggressive' ? 2.5 : ai.persona === 'reckless' ? 2.2 : ai.persona === 'cautious' ? 0.6 : 1.0
    // v55.79 — obstacle-reaction: if a hazard is < 300px ahead in the AI's own
    // lane, the rival reacts livelier (≈2× boost chance). Cosmetic-only (AI
    // trains race on relative distance, they don't collide).
    const _aiRelDist = ai.distance - S.distance
    const _aiScreenX = playerX + _aiRelDist * 1.8
    let _obsAheadMult = 1
    for (let oi = 0; oi < S.obstacles.length; oi++) {
      const o = S.obstacles[oi]
      if (o._lane === ai.lane && o.x > _aiScreenX && (o.x - _aiScreenX) < 300) { _obsAheadMult = 2; break }
    }
    // v55.79 — aggressive tries to overtake even when roughly level (small lead
    // allowed) but never runs away far, so it stays fair for ages 5-10.
    const _canBoost = behind || (ai.persona === 'aggressive' && _aiRelDist < 30)
    if (_canBoost && ai.boostTimer <= 0 && Math.random() < 0.0018 * _personaBoostMult * _obsAheadMult) {
      ai.boostTimer = 90
      if (ai.txt) {
        const intent = (ai.persona === 'reckless' || ai.persona === 'aggressive') ? 'Ngebut!' : ai.persona === 'cautious' ? 'Hati2!' : 'Ngebut...'
        ai.intent = intent; ai.txt.text = intent; ai.intentTimer = 150
      }
    }
    // v55.79 — strategic: anticipate the player's chosen lane + swerve off a
    // hazard ahead in its own lane (predict & pre-empt). Throttled to ~0.4s.
    if (ai.persona === 'strategic' && S.frame % 24 === 0) {
      let _blocked = false
      for (let oi = 0; oi < S.obstacles.length; oi++) {
        const o = S.obstacles[oi]
        if (o._lane === ai.lane && o.x > 0 && o.x < 260) { _blocked = true; break }
      }
      if (_blocked) {
        ai.lane = (ai.lane + (Math.random() < 0.5 ? -1 : 1) + 3) % 3
        if (ai.txt) { ai.intent = 'Pindah!'; ai.txt.text = 'Pindah!'; ai.intentTimer = 90 }
      } else if (ai.lane !== S.targetLane && Math.random() < 0.5) {
        ai.lane += Math.sign(S.targetLane - ai.lane)
      }
    }
    // v54.52: cautious AI swaps lane when obstacle ahead < 220px in own lane.
    if (ai.persona === 'cautious' && S.frame % 30 === 0) {
      for (let oi = 0; oi < S.obstacles.length; oi++) {
        const o = S.obstacles[oi]
        if (o._lane === ai.lane && o.x > 0 && o.x < 220) {
          ai.lane = (ai.lane + (Math.random() < 0.5 ? -1 : 1) + 3) % 3
          if (ai.txt) { ai.intent = 'Pindah!'; ai.txt.text = 'Pindah!'; ai.intentTimer = 90 }
          break
        }
      }
    }
    // v54.52: copycat AI mirrors player's lane after 800ms (48 frames at 60fps).
    if (ai.persona === 'copycat') {
      if (S.lane !== ai.lastPlayerLane) {
        ai.copycatDelay = 48
        ai.lastPlayerLane = S.lane
      }
      if (ai.copycatDelay > 0) {
        ai.copycatDelay -= delta
        if (ai.copycatDelay <= 0 && ai.lane !== S.lane) {
          ai.lane = S.lane
          if (ai.txt) { ai.intent = 'Ikut!'; ai.txt.text = 'Ikut!'; ai.intentTimer = 80 }
        }
      }
    }
    const boostMult = ai.boostTimer > 0
      ? 1 + 0.15 * Math.sin(((90 - ai.boostTimer) / 90) * Math.PI)
      : 1
    // v54.50: detect overtake — sign change of (ai.distance - S.distance).
    // Throttle 1.5s to avoid doppler chirp on close pacing.
    const _curRel = ai.distance - S.distance
    const _now = S.frame
    if (ai.lastRelDist !== undefined &&
        Math.sign(_curRel) !== Math.sign(ai.lastRelDist) &&
        Math.abs(_curRel) < 80 && Math.abs(ai.lastRelDist) < 80 &&
        (_now - ai.lastWhistleAt) > 90) {
      ai.lastWhistleAt = _now
      // Descending whistle 880Hz → 440Hz (doppler pass).
      try { playTone(880, 0.10, 'sine'); setTimeout(() => playTone(660, 0.10, 'sine'), 100); setTimeout(() => playTone(440, 0.14, 'sine'), 200) } catch(_){}
    }
    ai.lastRelDist = _curRel
    ai.distance += ai.speed * boostMult * delta * 0.12
    // Screen position based on relative distance
    const relDist = ai.distance - S.distance
    const screenX = playerX + relDist * 1.8
    ai.container.x = screenX
    ai.container.visible = screenX > -80 && screenX < W + 80
    // v55.84 — ZERO-TOLERANCE: NPC sits EXACTLY on its lane (removed the ±0.5px sin float).
    // v55.87 — honour the same 10% rail margin as the player (was overriding it each frame).
    // v56.6 E2 A-315 — AI lane changes TWEEN like the player (was an instant teleport):
    // frame-rate-independent damp toward the lane, sub-pixel snap keeps zero-tolerance.
    {
      const _aiTgt = laneYs[ai.lane] - g14WheelMargin()
      if (window.Motion && Math.abs(ai.container.y - _aiTgt) > 0.5) {
        ai.container.y = Motion.damp(ai.container.y, _aiTgt, 11, (delta || 1) / 60)
        const _lean = 0.10 * Math.sign(_aiTgt - ai.container.y)
        ai.container.rotation = Motion.damp(ai.container.rotation || 0, _lean, 10, (delta || 1) / 60)
      } else {
        ai.container.y = _aiTgt
        if (ai.container.rotation) { ai.container.rotation *= 0.8; if (Math.abs(ai.container.rotation) < 0.002) ai.container.rotation = 0 }
      }
    }
    // v55.69 B-278 — depth-scale the AI sprite to its lane (depth == 1.0 since v55.87 → uniform).
    if (ai.container._charImg && laneH) {
      const _el = Math.max(0, Math.min(LANE_COUNT - 1, (ai.container.y - railTop - laneH / 2) / laneH))
      g14ApplyDepthScale(ai.container._charImg, _el)
    }
    // v54.12 — Update thought bubble: rotate intent every ~2.5s (60 frames *
    // 2.5 = 150 frames), fade in for 30 frames, fade out after 120 frames.
    if (ai.txt && ai.bubble){
      ai.intentTimer -= delta
      if (ai.intentTimer <= 0){
        // v55.78 B-279 declutter — idle chatter was rotating a filler phrase every
        // ~2.5s (constant on-screen "letters"). Now it mostly stays SILENT with the
        // odd brief line; the meaningful event reactions (Ngebut/Pindah/Ikut on real
        // moves) still fire above, so personality reads from racing, not text spam.
        if (Math.random() < 0.3) { ai.intent = g14PickIntent(); ai.txt.text = ai.intent; ai.intentTimer = 150 }
        else { ai.intent = ''; ai.txt.text = ''; ai.intentTimer = 320 + Math.random() * 260 }
      }
      // Bubble visibility window: appears at start of intent, fades out at the end.
      const t = (150 - ai.intentTimer) / 150
      const a = t < 0.18 ? t / 0.18 : t > 0.85 ? (1 - t) / 0.15 : 1
      const tgt = ai.container.visible ? a : 0
      ai.txt.alpha += (tgt - ai.txt.alpha) * 0.15
      ai.bubble.alpha = ai.txt.alpha
      if (ai.sil) ai.sil.alpha = ai.txt.alpha  // v54.17 A8
    }
  })

  // Update race position
  const aiAhead = S.aiTrains.filter(a => a.distance > S.distance).length
  S.position = aiAhead + 1
  const posText = S.position === 1 ? '🥇 Posisi 1!' : S.position === 2 ? '🥈 Posisi 2' : '🥉 Posisi 3'
  document.getElementById('position-badge').textContent = posText
  // v54.17 A5: gap-to-next chip. Show metric gap to the rival above OR behind you.
  const gapEl = document.getElementById('g14-position-gap')
  if (gapEl) {
    let gapText = ''
    if (S.position === 1) {
      // Closest chaser
      const chasers = S.aiTrains.filter(a => a.distance < S.distance)
      if (chasers.length) {
        const top = chasers.reduce((m, a) => a.distance > m ? a.distance : m, -Infinity)
        const gap = Math.max(0, Math.floor(S.distance - top))
        gapText = `+${gap}m unggul`
      }
    } else {
      // Closest leader above
      const leaders = S.aiTrains.filter(a => a.distance > S.distance)
      if (leaders.length) {
        const closest = leaders.reduce((m, a) => a.distance < m ? a.distance : m, Infinity)
        const gap = Math.max(0, Math.floor(closest - S.distance))
        const tgt = S.position === 2 ? '1' : (S.position - 1).toString()
        gapText = `-${gap}m ke #${tgt}`
      }
    }
    gapEl.textContent = gapText
  }
}

// v54.51: reduce-motion gate — honors prefers-reduced-motion media query AND
// an explicit localStorage opt-in. Shake/confetti/dust/zoom short-circuit when on.
function g14ReducedMotion() {
  try {
    if (localStorage.getItem('g14-reduced-motion') === '1') return true
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return true
  } catch(_){}
  return false
}

const OBS_EMOJIS = ['🪨','🐄','🐔','🌵','⚠️','🛑']
// v54.49: per-biome obstacle palette. Cacti only in desert, logs only in forest,
// snowmen only in snow, etc. Empty fallback → use generic OBS_EMOJIS pool.
const OBS_PER_BIOME = {
  // v59.72 — dropped 🪵🧱🐍🦂 (no DB sprite) so every biome pool is 100% emoji-free.
  forest:  ['🪨','🐄','🐔','🌲','🦌','🍄'],
  desert:  ['🪨','🌵','⚠️','🛑'],
  snow:    ['🪨','⛄','🦌','🧊','⚠️','🛑'],
  coastal: ['🪨','🦀','🐚','⚓','🛑','🌴'],
  urban:   ['🚧','🛑','⚠️','🚖','🚸'],
  volcano: ['🪨','🔥','💥','⚠️','🛑','🪨']
}
let OBS_SIZE = 44   // A-311 — responsive: recomputed from viewport in initPixi

// v55.79 — biome-affinity weighted pick. Backward-compatible: any emoji with no
// affinity (or a biome the affinity map doesn't mention) gets weight 1, so an
// all-unweighted pool behaves exactly like the old uniform Math.random() pick.
function g14PickWeightedObstacle(pool, biome) {
  if (!pool || !pool.length) return '🪨'
  const aff = (typeof window !== 'undefined' && window.G14_OBSTACLE_AFFINITY) || null
  if (!aff) return pool[Math.floor(Math.random() * pool.length)]
  let total = 0
  const weights = pool.map(e => {
    const w = (aff[e] && aff[e][biome])
    const ww = (w == null ? 1 : w)
    total += ww
    return ww
  })
  if (total <= 0) return pool[Math.floor(Math.random() * pool.length)]
  let r = Math.random() * total
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i]
    if (r <= 0) return pool[i]
  }
  return pool[pool.length - 1]
}
