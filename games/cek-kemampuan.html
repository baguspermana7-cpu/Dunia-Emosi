<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<meta name="theme-color" content="#38bdf8">
<title>Cek Kemampuan</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css?v=v64.94-20261126b">

<body>
<div class="sky" aria-hidden="true"></div>
<div class="panel">
  <header class="top" id="top" hidden>
    <button type="button" class="me" id="me-btn" aria-label="Ganti pemain"><img id="me-av" class="av" alt="" width="44" height="44"><b id="me-name"></b><span class="swap">Ganti</span></button>
    <div class="stars-total"><img id="me-star" alt="" width="28" height="28"><b id="me-stars">0</b></div>
    <button type="button" class="du-btn du-btn-warn du-btn-sm" id="btn-board" aria-label="Papan Juara"><img id="board-ico" alt="" width="26" height="26"><span class="bl">Papan Juara</span></button>
  </header>

  <div class="rotate" id="rotate" role="status"><img src="../assets/db/mascots/006.webp" alt="" width="282" height="263"><p>Putar HP-mu jadi tegak, ya!</p></div>
  <section class="scr" id="s-name" aria-labelledby="t-name">
    <div class="center">
      <img class="owl big" src="../assets/db/mascots/006.webp" alt="Profesor Owi" width="282" height="263">
      <div class="bubble wide"><h1 id="t-name">Siapa yang main?</h1>
        <div class="who" id="who-list" role="group" aria-label="Pemain"></div>
        <p class="who-new" id="who-new-t">Pemain baru (tamu)</p>
        <input id="name-in" maxlength="12" autocomplete="off" placeholder="Ketik nama" aria-label="Nama">
        <div class="ages" role="group" aria-label="Umur"><button type="button" class="age" data-age="5-6">5-6 tahun</button><button type="button" class="age on" data-age="7-8">7-8 tahun</button><button type="button" class="age" data-age="9-10">9-10 tahun</button></div>
        <button type="button" class="du-btn du-btn-success du-btn-lg" id="name-go">Ayo main!</button>
        <button type="button" class="du-btn du-btn-ghost" id="who-back" hidden>Kembali ke peta</button></div>
    </div>
  </section>

  <section class="scr" id="s-map" aria-label="Peta pulau">
    <div class="guide"><img class="owl" src="../assets/db/mascots/006.webp" alt="" width="282" height="263"><p class="bubble" id="guide-say"></p></div>
    <div class="modes" role="radiogroup" aria-label="Mode tes"><button type="button" class="mode" role="radio" data-mode="normal"><b>Normal</b><span>sekitar 30 menit, paling teliti</span></button><button type="button" class="mode" role="radio" data-mode="cepat"><b>Cepat</b><span>sekitar 15 menit, sedikit kurang teliti</span></button></div>
    <div class="map" id="map"></div>
    <div class="row"><button type="button" class="du-btn du-btn-primary du-btn-lg" id="btn-iq"></button></div>
  </section>

  <section class="scr" id="s-intro" aria-labelledby="t-intro">
    <div class="center">
      <img class="isle-art" id="intro-art" alt="" width="240" height="200">
      <div class="bubble wide"><h1 id="t-intro"></h1><p id="intro-text"></p>
        <p class="mode-tag" id="intro-mode"></p>
        <div class="row"><button type="button" class="du-btn du-btn-success du-btn-lg" id="btn-start">Mulai</button></div></div>
      <button type="button" class="du-btn du-btn-ghost" id="btn-back">Kembali ke peta</button>
    </div>
  </section>

  <section class="scr" id="s-play" aria-label="Soal">
    <div class="bar"><b class="tag" id="play-tag"></b><div class="trail" id="trail" aria-hidden="true"></div>
      <button type="button" class="du-btn du-btn-ghost du-btn-sm" id="btn-pause">Istirahat</button></div>
    <p class="hint" id="hint" aria-live="polite"></p>
    <div class="stage" id="stage"></div>
    <div class="cheer" id="cheer" aria-hidden="true"><img class="owl" src="../assets/db/mascots/006.webp" alt="" width="282" height="263"><span id="cheer-say"></span></div>
  </section>

  <section class="scr" id="s-done" aria-labelledby="t-done">
    <div class="center">
      <div class="card result" id="result-card">
        <img class="isle-art sm" id="done-art" alt="" width="160" height="130">
        <h1 id="t-done">Hebat!</h1>
        <div class="big-stars" id="done-stars"></div>
        <p class="points"><span id="done-points">0</span> poin</p>
        <p id="done-text"></p>
      </div>
      <div class="row"><button type="button" class="du-btn du-btn-success du-btn-lg" id="btn-home">Kembali ke peta</button></div>
    </div>
  </section>

  <section class="scr" id="s-iq" aria-labelledby="t-iq">
    <div class="curtain" id="iq-curtain" aria-hidden="true"></div>
    <div class="center">
      <div class="card iq">
        <img id="iq-trophy" alt="" width="96" height="96">
        <h1 id="t-iq">Perkiraan IQ</h1>
        <div class="gauge" id="iq-gauge"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="g-bg" cx="60" cy="60" r="52"/><circle class="g-fg" id="iq-ring" cx="60" cy="60" r="52" pathLength="100"/></svg>
          <div class="iq-num" id="iq-num">-</div></div>
        <p class="iq-range" id="iq-range"></p>
        <div class="bars" id="iq-bars"></div>
        <p class="tip" id="iq-tip"></p>
        <p class="note" id="iq-note">Perkiraan dari permainan, bukan tes resmi psikolog.</p>
      </div>
      <div class="row"><button type="button" class="du-btn du-btn-warn" id="iq-board">Papan Juara</button><button type="button" class="du-btn du-btn-success" id="iq-home">Kembali ke peta</button></div>
    </div>
  </section>

  <section class="scr" id="s-board" aria-labelledby="t-board">
    <div class="center">
      <div class="card lb">
        <h1 id="t-board">Papan Juara Otak</h1>
        <div class="tabs" role="tablist"><button type="button" role="tab" class="tab on" data-tab="device" aria-selected="true">Di perangkat ini</button><button type="button" role="tab" class="tab" data-tab="online" aria-selected="false">Semua pemain</button></div>
        <p class="board-note" id="board-note"></p>
        <ol class="rows" id="board-rows"></ol>
      </div>
      <button type="button" class="du-btn du-btn-success" id="board-home">Kembali ke peta</button>
    </div>
  </section>
</div>
<div class="fx-layer" id="fx" aria-hidden="true"></div>
