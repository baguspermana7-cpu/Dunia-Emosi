<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lokomotif Pemberani 🚂</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
/* v54.5 — WCAG 2.1 AAA reduced-motion respect. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;height:100svh;overflow:hidden;font-family:'Fredoka One',sans-serif;touch-action:none}
#pixi-canvas{position:fixed;inset:0;width:100vw;height:100svh;display:block}

/* ── HUD Top ── */
#hud-top{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:8px;padding:max(14px,env(safe-area-inset-top)) 16px 8px;background:linear-gradient(180deg,rgba(0,0,0,0.72) 0%,transparent 100%);pointer-events:none}
#btn-back{background:#fff3c4;border:2.5px solid #f59e0b;border-radius:8px;color:#3f2a08;padding:8px 12px;font-size:14px;cursor:pointer;font-family:inherit;pointer-events:all;flex-shrink:0;box-shadow:0 3px 0 #b45309;font-weight:900;min-width:96px;text-align:center}
#btn-back:active{transform:translateY(2px);box-shadow:0 1px 0 #D4956A}
#word-display{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
#word-emoji{font-size:24px;flex-shrink:0}
#word-slots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.slot{display:inline-flex;align-items:center;justify-content:center;width:28px;height:32px;border-radius:8px;border:2px solid rgba(255,255,255,0.35);background:rgba(0,0,0,0.35);color:#fff;font-size:15px;font-weight:900;transition:all .2s;position:relative}
.slot.filled{border-color:#fbbf24;background:rgba(251,191,36,0.28);color:#fde68a;animation:slotFilledBounce .3s cubic-bezier(.34,1.56,.64,1)}
.slot.done{border-color:#4ade80;background:rgba(74,222,128,0.28);color:#bbf7d0;animation:slotPop .3s cubic-bezier(.34,1.56,.64,1)}
/* v54.13 — Slot polish: filled bounce (collect feedback) + next-slot pulse (visual cue for current target) */
.slot.next-target{border-color:#a3e635;box-shadow:0 0 0 2px rgba(163,230,53,0.35),0 0 12px rgba(163,230,53,0.4);animation:slotNextPulse 1.4s ease-in-out infinite}
@keyframes slotFilledBounce{0%{transform:scale(0.6) rotate(-10deg)}50%{transform:scale(1.25) rotate(5deg)}100%{transform:scale(1) rotate(0deg)}}
@keyframes slotPop{from{transform:scale(0.7)}to{transform:scale(1)}}
@keyframes slotNextPulse{0%,100%{box-shadow:0 0 0 2px rgba(163,230,53,0.35),0 0 12px rgba(163,230,53,0.4)}50%{box-shadow:0 0 0 3px rgba(163,230,53,0.55),0 0 18px rgba(163,230,53,0.7)}}
#lives-hud{display:flex;gap:3px;flex-shrink:0}
.life-heart{font-size:20px;transition:all .3s;display:inline-block}
.life-heart.lost{opacity:0.18;transform:scale(0.65);filter:grayscale(1)}

/* ── Next letter hint ── */
/* Hotfix #102-E (2026-04-27): "Karakter seperti ada bertumpuk" — KUMPULKAN
   label and the next-char digit were stacking visually. Added flex-direction:row
   explicit + flex-shrink:0 + white-space:nowrap on label + larger gap so the
   24px char and 10px label sit side-by-side cleanly without one wrapping under. */
#next-letter{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:49;background:rgba(255,248,231,0.92);border:2px solid #FFD6A0;border-radius:14px;padding:5px 16px;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;pointer-events:none;box-shadow:0 3px 0 #D4956A}
#next-label{font-size:10px;color:#92400e;letter-spacing:1.2px;font-weight:700;white-space:nowrap;flex-shrink:0}
#next-char{font-size:24px;font-weight:900;color:#dc2626;text-shadow:0 0 10px rgba(220,38,38,0.35);flex-shrink:0;line-height:1}

/* ── Flash ── */
#flash{position:fixed;inset:0;z-index:99;pointer-events:none;opacity:0;transition:opacity .05s}

/* ── HUD Bottom ──
   Hotfix #104 (2026-04-28): added max-height + responsive padding/font.
   Tablet landscape fullscreen previously stretched the buttons to fill
   half the viewport because flex children had no height cap. */
#hud-bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;padding:8px 14px calc(env(safe-area-inset-bottom,0px)+12px);max-height:clamp(80px,18vh,140px)}
#ctrl-row{display:flex;gap:10px;align-items:stretch;height:100%}
#btn-up{flex:1;padding:clamp(8px,2vh,15px) 0;border-radius:18px;border:3px solid #50E0A0;background:linear-gradient(160deg,#2DBF7E,#1A9E66);color:#fff;font-size:clamp(14px,3.5vmin,22px);cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .08s,box-shadow .08s;font-family:inherit;-webkit-tap-highlight-color:transparent;line-height:1.2;box-shadow:0 5px 0 #0A7A48,0 8px 20px rgba(45,191,126,0.3);font-weight:900}
#btn-up:active{transform:scale(.91) translateY(4px);box-shadow:0 1px 0 #0A7A48}
#btn-dn{flex:1;padding:clamp(8px,2vh,15px) 0;border-radius:18px;border:3px solid #F07050;background:linear-gradient(160deg,#E85A32,#C84020);color:#fff;font-size:clamp(14px,3.5vmin,22px);cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .08s,box-shadow .08s;font-family:inherit;-webkit-tap-highlight-color:transparent;line-height:1.2;box-shadow:0 5px 0 #9A2A10,0 8px 20px rgba(232,90,50,0.3);font-weight:900}
@media (orientation:landscape) and (min-aspect-ratio:16/10){#hud-bottom{max-height:90px}}
#btn-dn:active{transform:scale(.91) translateY(4px);box-shadow:0 1px 0 #9A2A10}
#lane-indicator{flex:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 6px;border-radius:18px;border:3px solid #B8D4FF;background:linear-gradient(160deg,#E8F4FF,#C8E8FF);box-shadow:0 5px 0 #7AADDD}
#lane-dots{display:flex;flex-direction:column;gap:6px;align-items:center}
.lane-dot{width:12px;height:12px;border-radius:50%;background:rgba(100,160,220,0.3);border:2px solid rgba(100,160,220,0.4);transition:all .2s}
.lane-dot.active{background:#3B82F6;box-shadow:0 0 10px #3B82F6;border-color:#93C5FD;transform:scale(1.4)}
#lane-label{font-size:10px;color:#1e40af;letter-spacing:1px;margin-top:2px;font-weight:700}

/* ── Math Quiz Overlay ── */
#math-quiz{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;background:rgba(10,5,25,0.82);backdrop-filter:blur(14px)}
#math-quiz.show{display:flex}
/* v54.35 audit: popIn was referenced but undefined → math card had no entrance animation. */
@keyframes popIn{0%{opacity:0;transform:scale(0.7)}60%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
#math-card{background:linear-gradient(145deg,#1e1b4b,#312e81);border:3px solid #818cf8;border-radius:28px;padding:24px 20px;max-width:300px;width:88%;text-align:center;animation:popIn .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 60px rgba(129,140,248,0.4),0 20px 40px rgba(0,0,0,.6)}
#math-question{font-size:34px;font-weight:900;color:#e0e7ff;margin-bottom:4px}
#math-timer-bar{height:6px;background:rgba(255,255,255,0.12);border-radius:4px;margin:8px 0 16px;overflow:hidden}
#math-timer-fill{height:100%;background:linear-gradient(90deg,#4ade80,#22c55e);border-radius:4px;transition:width 0.1s linear}
#math-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.math-btn{padding:14px 8px;border-radius:16px;border:2px solid;color:#fff;font-size:20px;font-weight:900;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;transition:transform .08s}
.math-btn:active{transform:scale(.91)}
.math-btn:nth-child(1){background:linear-gradient(160deg,#6D28D9,#7C3AED);border-color:#A78BFA;box-shadow:0 4px 0 #4C1D95}
.math-btn:nth-child(2){background:linear-gradient(160deg,#C2410C,#EA580C);border-color:#FB923C;box-shadow:0 4px 0 #9A3412}
.math-btn:nth-child(3){background:linear-gradient(160deg,#0D9488,#14B8A6);border-color:#2DD4BF;box-shadow:0 4px 0 #0F766E}
.math-btn:nth-child(4){background:linear-gradient(160deg,#D97706,#F59E0B);border-color:#FCD34D;box-shadow:0 4px 0 #B45309}
#math-label{font-size:12px;color:#a5b4fc;letter-spacing:1.5px;margin-bottom:8px;font-weight:700}

/* Overlays handled by game-modal.js */

/* ── Screen shake ── */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shaking{animation:shake .3s ease}

/* ── v54.20 — G15 Word Adventure ── */

/* C2: Combo streak HUD chip */
#g15-streak{position:fixed;top:max(56px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;font-family:'Fredoka One',cursive;background:linear-gradient(135deg,#fde047,#f59e0b);color:#451a03;padding:5px 14px;border-radius:14px;font-size:13px;letter-spacing:1px;font-weight:900;box-shadow:0 4px 12px rgba(245,158,11,0.45);pointer-events:none;opacity:0;transform:translateX(-50%) scale(0.7);transition:all 250ms cubic-bezier(.34,1.56,.64,1)}
#g15-streak.show{opacity:1;transform:translateX(-50%) scale(1)}
#g15-streak.epic{background:linear-gradient(135deg,#fbbf24,#ef4444,#fbbf24);background-size:200% 100%;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.4);animation:g15StreakShimmer 1.4s linear infinite}
@keyframes g15StreakShimmer{0%{background-position:0% 0}100%{background-position:200% 0}}

/* C4: Last-life red vignette + heartbeat pulse */
#g15-vignette{position:fixed;inset:0;z-index:48;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(239,68,68,0);transition:box-shadow 600ms ease;opacity:0}
#g15-vignette.last-life{opacity:1;animation:g15Vignette 1.4s ease-in-out infinite}
@keyframes g15Vignette{0%,100%{box-shadow:inset 0 0 80px 16px rgba(239,68,68,0.32)}50%{box-shadow:inset 0 0 160px 32px rgba(239,68,68,0.55)}}

/* C5: TTS toggle button */
#g15-tts-toggle{position:fixed;top:max(56px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:60;background:rgba(0,0,0,0.6);color:#fff;border:1.5px solid rgba(255,255,255,0.3);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
#g15-tts-toggle.muted{opacity:0.45}
#g15-tts-toggle:active{transform:scale(0.9)}

/* C6: Anti-frustration assist toast */
.g15-assist-toast{position:fixed;top:30%;left:50%;transform:translate(-50%,0);z-index:75;background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff;padding:14px 18px;border-radius:18px;font-family:'Fredoka One',cursive;font-size:14px;text-align:center;box-shadow:0 14px 36px rgba(99,102,241,0.55);max-width:280px;animation:g15AssistIn 400ms cubic-bezier(.34,1.56,.64,1) forwards}
.g15-assist-toast button{margin-top:10px;padding:10px 22px;border-radius:12px;border:0;background:#fde047;color:#451a03;font-family:inherit;font-weight:900;cursor:pointer;font-size:13px;box-shadow:0 3px 0 #b45309}
@keyframes g15AssistIn{0%{opacity:0;transform:translate(-50%,30px) scale(0.7)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}

/* C10: Heart recovery banner */
.g15-heart-banner{position:fixed;top:24%;left:50%;transform:translate(-50%,0);z-index:70;font-family:'Fredoka One',cursive;font-size:26px;color:#fff;text-shadow:0 0 14px rgba(244,114,182,0.8),0 4px 14px rgba(0,0,0,0.6);padding:8px 22px;background:linear-gradient(135deg,rgba(244,114,182,0.95),rgba(168,85,247,0.85));border:2px solid #fde047;border-radius:18px;pointer-events:none;animation:g15HeartIn 1500ms cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes g15HeartIn{0%{opacity:0;transform:translate(-50%,30px) scale(0.4) rotate(-3deg)}20%{opacity:1;transform:translate(-50%,-8px) scale(1.18) rotate(3deg)}80%{opacity:1;transform:translate(-50%,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-30px) scale(0.9)}}

/* C19: Math iris-wipe */
#g15-iris{position:fixed;inset:0;z-index:380;pointer-events:none;background:radial-gradient(circle at center,transparent var(--g15iris,100%),rgba(15,23,42,0.96) calc(var(--g15iris,100%) + 1px));transition:background 500ms ease}
#g15-iris.show{pointer-events:none}
#g15-iris-station{position:fixed;left:50%;top:35%;transform:translate(-50%,-50%) scale(0);z-index:381;background:linear-gradient(135deg,#fde047,#f59e0b);border:3px solid #b45309;border-radius:18px;padding:14px 28px;font-family:'Fredoka One',cursive;font-size:22px;color:#451a03;text-shadow:0 1px 2px rgba(255,255,255,0.4);box-shadow:0 12px 36px rgba(0,0,0,0.5);transition:transform 600ms cubic-bezier(.34,1.56,.64,1);pointer-events:none}
#g15-iris-station.show{transform:translate(-50%,-50%) scale(1)}

/* ── Train Select Screen ── */
#train-select{position:fixed;inset:0;z-index:900;background:linear-gradient(180deg,#1a1028 0%,#2a1848 40%,#1e1230 70%,#140e22 100%);display:flex;flex-direction:column;overflow:hidden}
#ts-header{padding:12px 16px 6px;flex-shrink:0;display:flex;align-items:center;gap:10px;position:relative;z-index:2}
#ts-back{background:#fff3c4;border:2.5px solid #f59e0b;border-radius:8px;color:#3f2a08;padding:8px 12px;font-size:14px;cursor:pointer;font-family:inherit;flex-shrink:0;box-shadow:0 3px 0 #b45309;font-weight:900;min-width:112px;text-align:center}
#ts-back:active{transform:translateY(2px);box-shadow:0 1px 0 #b45309}
#ts-title-wrap{flex:1;text-align:center}
#ts-title{font-size:16px;font-weight:900;color:#e9d5ff;text-shadow:0 0 20px rgba(139,92,246,0.7);line-height:1}
#ts-subtitle{font-size:10px;color:rgba(233,213,255,0.4);letter-spacing:1.5px;margin-top:1px}
#station-intro{display:flex;align-items:center;gap:10px;background:rgba(139,92,246,0.14);border:1.5px solid rgba(139,92,246,0.4);border-radius:14px;margin:8px 12px 0;padding:8px 14px;flex-shrink:0}
.si-icon{font-size:28px;flex-shrink:0}
.si-text{text-align:left}
.si-label{font-size:8px;color:rgba(233,213,255,0.45);letter-spacing:1.8px;font-weight:700;display:block}
.si-name{font-size:15px;font-weight:900;color:#e9d5ff;display:block;line-height:1.2}
.si-landmark{font-size:10px;color:rgba(233,213,255,0.55);display:block;margin-top:1px}
/* Filter tabs */
#type-filter{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 2px;flex-shrink:0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#type-filter::-webkit-scrollbar{display:none}
.tfbtn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:2px solid rgba(139,92,246,0.3);background:rgba(139,92,246,0.08);color:rgba(196,181,253,0.7);font-size:11px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:inherit;transition:all .12s;letter-spacing:0.3px}
.tfbtn.active{background:rgba(139,92,246,0.45);border-color:#a78bfa;color:#fff;box-shadow:0 0 14px rgba(139,92,246,0.5)}
/* Train count badge */
#ts-count{font-size:9px;color:rgba(196,181,253,0.5);text-align:center;padding:4px 0 2px;letter-spacing:0.8px;flex-shrink:0}
#ts-grid-wrap{flex:1;overflow-y:auto;padding:10px 16px 24px;-webkit-overflow-scrolling:touch}
#train-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
@media(min-width:500px){#train-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
@media(min-width:900px){#train-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.tcard{border-radius:12px;border:1.5px solid rgba(180,160,220,0.2);background:rgba(248,240,255,0.08);cursor:pointer;-webkit-tap-highlight-color:transparent;overflow:hidden;display:flex;flex-direction:column;transition:all .14s;box-shadow:0 2px 6px rgba(0,0,0,0.15)}
.tcard:hover{border-color:rgba(167,139,250,0.4);background:rgba(139,92,246,0.1)}
.tcard.selected{border-color:#a78bfa;background:rgba(139,92,246,0.22);box-shadow:0 0 14px rgba(139,92,246,0.4)}
.tcard:active{transform:scale(0.95)}
.tcard canvas{width:100%;aspect-ratio:2.5/1;display:block;image-rendering:pixelated;image-rendering:crisp-edges;padding:4px}
.tcard-info{padding:4px 6px 5px}
.tname{font-size:10px;font-weight:700;color:#e9d5ff;display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub{font-size:7px;color:rgba(167,139,250,0.5);display:block;margin-top:1px;letter-spacing:0.3px;text-transform:uppercase}

/* ── Station Banner (shown at game start) ── */
#station-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;display:none;flex-direction:column;align-items:center;gap:3px;background:rgba(0,0,0,0.88);border:2.5px solid rgba(139,92,246,0.7);border-radius:24px;padding:20px 32px;backdrop-filter:blur(18px);pointer-events:none;opacity:1;transition:opacity .5s,transform .5s}
#station-banner.visible{display:flex}
#station-banner.fade-out{opacity:0;transform:translate(-50%,-55%)}
#sb-label{font-size:10px;color:rgba(233,213,255,0.5);letter-spacing:2.5px;font-weight:700}
#sb-icon{font-size:40px;line-height:1;margin:4px 0}
#sb-name{font-size:22px;font-weight:900;color:#e9d5ff;text-align:center;text-shadow:0 0 16px rgba(139,92,246,0.8)}
#sb-landmark{font-size:13px;color:rgba(233,213,255,0.65);text-align:center}

/* ── Station chip in HUD ── */
#station-chip{position:fixed;top:66px;right:10px;z-index:49;background:rgba(0,0,0,0.68);border:1.5px solid rgba(139,92,246,0.45);border-radius:10px;padding:3px 9px;pointer-events:none}
.sc-label{font-size:8px;color:rgba(233,213,255,0.45);letter-spacing:1.2px;display:block}
.sc-name{font-size:10px;font-weight:700;color:#e9d5ff;white-space:nowrap;display:block}
</style>
</head>
<body>
<canvas id="pixi-canvas"></canvas>
<script src="train-shared.js?v=54.27-20260624af"></script>
<audio id="game-bgm" src="../Sounds/train-bgm.mp3" loop preload="auto" style="display:none"></audio>
<!-- v54.28 I13: loop the train ambient SFX (was one-shot, faded after first cycle, leaving silence). -->
<audio id="train-sfx" src="../Sounds/train-crossing-sfx.mp3" loop preload="auto" style="display:none"></audio>

<!-- v54.20: G15 Word Adventure DOM scaffolds -->
<div id="g15-streak"></div>
<div id="g15-vignette"></div>
<button id="g15-tts-toggle" type="button" aria-label="Suara huruf" onclick="g15ToggleTTS()">🔊</button>
<div id="g15-iris"></div>
<div id="g15-iris-station">🚉 Stasiun</div>

<!-- HUD Top -->
<div id="hud-top">
  <button id="btn-back" type="button" onclick="goBack()">← Kembali</button>
  <button id="btn-pause" onclick="togglePause()" style="pointer-events:all;background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.25);border-radius:10px;color:#fff;padding:5px 8px;font-size:14px;cursor:pointer;font-family:inherit;flex-shrink:0">⏸</button>
  <div id="word-display">
    <span id="word-emoji">❓</span>
    <div id="word-slots"></div>
  </div>
  <div id="lives-hud"></div>
</div>

<!-- Next letter hint -->
<div id="next-letter">
  <span id="next-label">KUMPULKAN</span>
  <span id="next-char">?</span>
</div>

<!-- HUD Bottom -->
<div id="hud-bottom">
  <div id="ctrl-row">
    <button id="btn-up" ontouchstart="switchLane(-1);event.preventDefault()" onclick="switchLane(-1)">▲<br><span style="font-size:11px">ATAS</span></button>
    <div id="lane-indicator">
      <div id="lane-dots">
        <div class="lane-dot" id="ld0"></div>
        <div class="lane-dot" id="ld1"></div>
        <div class="lane-dot" id="ld2"></div>
      </div>
      <div id="lane-label">JALUR</div>
    </div>
    <button id="btn-dn" ontouchstart="switchLane(1);event.preventDefault()" onclick="switchLane(1)">▼<br><span style="font-size:11px">BAWAH</span></button>
  </div>
</div>

<!-- Flash -->
<div id="flash"></div>

<!-- Math Quiz -->
<div id="math-quiz">
  <div id="math-card">
    <div id="math-label">❓ SOAL MATEMATIKA</div>
    <div id="math-question">5 + 3 = ?</div>
    <div id="math-timer-bar"><div id="math-timer-fill" style="width:100%"></div></div>
    <div id="math-choices"></div>
  </div>

// Polyfill ctx.roundRect for older Android WebViews (Chrome < 99)
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    const radius = Math.min(+r || 0, w / 2, h / 2);
    this.beginPath();
    this.moveTo(x + radius, y);
    this.lineTo(x + w - radius, y);
    this.arcTo(x + w, y, x + w, y + radius, radius);
    this.lineTo(x + w, y + h - radius);
    this.arcTo(x + w, y + h, x + w - radius, y + h, radius);
    this.lineTo(x + radius, y + h);
    this.arcTo(x, y + h, x, y + h - radius, radius);
    this.lineTo(x, y + radius);
    this.arcTo(x, y, x + radius, y, radius);
    this.closePath();
    return this;
  };
}

// ── Config ───────────────────────────────────────────────────────────────────
const cfg = (() => { try { return JSON.parse(sessionStorage.getItem('g15Config') || '{}'); } catch { return {}; } })();
const LEVEL = Math.max(1, Math.min(30, cfg.level || 1));

// Save level progress — Hotfix #115: prefer shared save-engine (avatar-keyed).
// Fallback to legacy slot-0 path if not loaded.
function saveG15Progress(stars) {
  const lv = (typeof cfg !== 'undefined' ? cfg.level : (typeof S !== 'undefined' ? S.level : 1)) || 1
  if (typeof window.saveLevelProgress === 'function') {
    window.saveLevelProgress('g15', lv, stars)
    return
  }
  try {
    const key = 'dunia-0-progress'
    const prog = JSON.parse(localStorage.getItem(key) || '{}')
    if (!prog.g15) prog.g15 = { completed: [], stars: {} }
    if (!prog.g15.completed.includes(lv)) prog.g15.completed.push(lv)
    if ((prog.g15.stars[lv] || 0) < stars) prog.g15.stars[lv] = stars
    localStorage.setItem(key, JSON.stringify(prog))
  } catch(_) {}
}
function goBack() { try{document.getElementById('game-bgm').pause()}catch(_){}; history.back(); }
window.addEventListener('resize',()=>{
  if(typeof app==='undefined' || !app) return;
  app.renderer.resize(Math.min(window.innerWidth,1400),Math.min(window.innerHeight,1000));
  // Recompute responsive layout on device rotation / window resize.
  W = app.screen.width; H = app.screen.height;
  TRAIN_X = Math.max(40, Math.round(W * 0.05));  // Task #59 — 5% base (per-train clamp in buildTrain)
  const topHUD = 120, botHUD = 115;
  const available = H - topHUD - botHUD;
  LANE_Y = [
    topHUD + available * 0.18,
    topHUD + available * 0.50,
    topHUD + available * 0.82
  ];
  if (selectedTrain && selectedTrain.isCharacter && typeof buildTrain === 'function') {
    try { buildTrain(); } catch(_) {}  // rebuild re-applies RZ.trainScale + rail-anchor + 5% clamp
  } else if (trainContainer) {
    trainContainer.x = TRAIN_X; trainContainer.y = LANE_Y[1];
  }
});
function togglePause() {
  gamePaused = !gamePaused;
  document.getElementById('btn-pause').textContent = gamePaused ? '▶' : '⏸';
  // Task #63 — pause the math-quiz wall-clock timer so it doesn't auto-fail while
  // user is paused. On pause: clearTimeout + record remaining. On resume: restart
  // with remaining time. Timer fill CSS is also frozen/resumed.
  if (mathQuizActive && typeof _mathTimerStart === 'number') {
    const fill = document.getElementById('math-timer-fill');
    if (gamePaused) {
      if (mathTimerRaf) { clearTimeout(mathTimerRaf); mathTimerRaf = null; }
      const elapsed = performance.now() - _mathTimerStart;
      _mathTimerRemaining = Math.max(0, 8000 - elapsed);
      if (fill) {
        // Freeze fill width at current interpolated value (style.width reflects target; use computed)
        const cs = getComputedStyle(fill);
        fill.style.transition = 'none';
        fill.style.width = cs.width;
      }
    } else {
      _mathTimerStart = performance.now() - (8000 - (_mathTimerRemaining || 8000));
      mathTimerRaf = setTimeout(() => {
        if (mathQuizActive) answerMath(false, null, true);
      }, _mathTimerRemaining || 8000);
      if (fill) {
        requestAnimationFrame(() => {
          fill.style.transition = `width ${(_mathTimerRemaining || 8000)}ms linear`;
          requestAnimationFrame(() => { fill.style.width = '0%'; });
        });
      }
    }
  }
  if (typeof GamePause !== 'undefined') {
    if (gamePaused) GamePause.show(); else GamePause.hide();
  } else {
    // v54.28 I13: pause the looping train-sfx alongside BGM. Was running
    // through pauses, sounding like the train kept moving while frozen.
    try{const bgm=document.getElementById('game-bgm');gamePaused?bgm.pause():bgm.play().catch(()=>{})}catch(_){}
    try{const sfx=document.getElementById('train-sfx');if(sfx){gamePaused?sfx.pause():sfx.play().catch(()=>{})}}catch(_){}
  }
}

function genMathQuestion() {
  const maxN = LEVEL <= 4 ? 5 : LEVEL <= 9 ? 10 : 15;
  const useSubtract = LEVEL > 4;
  const op = useSubtract && Math.random() < 0.4 ? '-' : '+';
  let a, b, ans;
  if (op === '+') {
    a = Math.floor(Math.random() * (maxN + 1));
    b = Math.floor(Math.random() * (maxN - a + 1));
    ans = a + b;
  } else {
    a = Math.floor(Math.random() * (maxN + 1));
    b = Math.floor(Math.random() * (a + 1));
    ans = a - b;
  }
  return { text: `${a} ${op} ${b} = ?`, answer: ans };
}

function genWrongOptions(correct, count) {
  const opts = new Set([correct]);
  let safety = 0;
  while (opts.size < count + 1 && safety++ < 30) {
    const delta = Math.floor(Math.random() * 5) + 1;
    const wrong = Math.max(0, correct + (Math.random() < 0.5 ? delta : -delta));
    if (wrong !== correct && wrong >= 0 && wrong <= 20) opts.add(wrong);
  }
  // Sequential pad — always advances even if candidate is duplicate.
  // Defensive guard against unbounded-while bug class (2026-05-04 410597c).
  let pad = 1;
  while (opts.size < count + 1 && pad < 30) {
    const v = correct + pad;
    if (v !== correct && v >= 0 && v <= 20) opts.add(v);
    const v2 = correct - pad;
    if (v2 !== correct && v2 >= 0 && v2 <= 20) opts.add(v2);
    pad++;
  }
  return shuffle([...opts]).slice(0, count + 1);
}

// ── PixiJS Init ───────────────────────────────────────────────────────────────
async function initPixi() {
  app = new PIXI.Application();
  await app.init({
    canvas: document.getElementById('pixi-canvas'),
    width: window.innerWidth, height: window.innerHeight,
    backgroundColor: T.sky, antialias: true,
    resolution: window.devicePixelRatio || 1, autoDensity: true
  });
  W = app.screen.width; H = app.screen.height;
  // Task #59 — TRAIN_X defaults to 5% of viewport (per-train clamp happens inside
  // buildTrain via CharacterTrain.computeTrainX for character trains).
  TRAIN_X = Math.max(40, Math.round(W * 0.05));
  const topHUD = 120, botHUD = 115;
  const available = H - topHUD - botHUD;
  LANE_Y = [
    topHUD + available * 0.18,
    topHUD + available * 0.50,
    topHUD + available * 0.82
  ];
  stage = app.stage;
  bgLayer       = new PIXI.Container(); stage.addChild(bgLayer);
  trackLayer    = new PIXI.Container(); stage.addChild(trackLayer);
  trainContainer= new PIXI.Container(); stage.addChild(trainContainer);
  boxLayer      = new PIXI.Container(); stage.addChild(boxLayer);
  particleLayer = new PIXI.Container(); stage.addChild(particleLayer);

  buildBackground();
  buildTracks();
  buildTrain();
  updateLivesHUD();
  updateLaneDots();
  refreshHUD();
  updateStationChip();
  showStationBanner(getCurrentStation());

  gameRunning = true;
  // v54.28 I13: BGM volume lift 0.20 → 0.35 with a 200ms ramp so it's actually
  // audible against the train ambient. Was easy to miss entirely.
  try {
    const bgm = document.getElementById('game-bgm')
    if (bgm) {
      bgm.volume = 0.0
      bgm.play().catch(()=>{})
      const tStart = performance.now()
      const ramp = () => {
        const k = Math.min(1, (performance.now() - tStart) / 200)
        bgm.volume = 0.35 * k
        if (k < 1) requestAnimationFrame(ramp)
      }
      ramp()
    }
  } catch(_){}
  try{const sfx=document.getElementById('train-sfx');if(sfx){sfx.currentTime=0;sfx.volume=0.55;sfx.play().catch(()=>{})}}catch(_){}
  startTime = Date.now();
  let spawnTimer = 0;
  const spawnInterval = () => Math.max(45, 90 - LEVEL * 2);

  app.ticker.add((ticker) => {
    if (!gameRunning || gamePaused || mathQuizActive) return;
    const dt = ticker.deltaTime;

    // Character train animation — wheel spin, body bob, smoke
    if (characterTrainInstance) { characterTrainInstance.tick(dt, gameSpeed); }

    // Scroll sleepers
    for (const s of sleepers) { s.x -= gameSpeed * dt; if (s.x < -20) s.x += W + 40; }

    // Stars (night/space theme)
    if (BG_THEME === 0 || BG_THEME === 3) {
      for (const st of bgStars) {
        st.x -= st._speed * dt;
        if (st.x < 0) { st.x = W; st.y = Math.random() * H * 0.65; }
      }
    }

    // Clouds move
    for (const c of bgClouds) {
      c.x -= c._speed * dt;
      if (c.x < -200) c.x = W + 150;
    }

    // Signal posts scroll with track
    for (const p of bgSignalPosts) {
      p.x -= gameSpeed * dt * 0.6;
      if (p.x < -40) p.x = W + 40 + Math.random() * 50;
    }

    // Birds drift left
    if (bgBirds.length) {
      const t = performance.now() * 0.004;
      for (const b of bgBirds) {
        b.x -= b._speed * dt;
        b.y = b._baseY + Math.sin(t + b._phase) * 5;
        b.scale.y = 0.7 + Math.sin(t * 4 + b._phase) * 0.3;
        if (b.x < -30) { b.x = W + 30; b._baseY = H * (0.1 + Math.random() * 0.18); }
      }
    }

    // Fireflies (forest theme)
    if (BG_THEME === 2) {
      for (const ff of bgFireflies) {
        ff._phase += 0.04 * dt;
        ff.alpha = 0.3 + Math.sin(ff._phase) * 0.6;
        ff.x += ff._vx * dt;
        ff.y += Math.sin(ff._phase * 0.7) * 0.3 * dt;
        if (ff.x < 0) ff.x = W; if (ff.x > W) ff.x = 0;
      }
    }

    // Rainbow fade
    if (rainbow) {
      rainbow.alpha -= 0.008 * dt;
      if (rainbow.alpha <= 0) { bgLayer.removeChild(rainbow); rainbow = null; }
    }

    // Steam puffs
    for (let i = steamPuffs.length - 1; i >= 0; i--) {
      const p = steamPuffs[i];
      p.x += p._vx * dt; p.y += p._vy * dt;
      p.alpha -= 0.018 * dt;
      p.scale.x += 0.025 * dt; p.scale.y += 0.025 * dt;
      if (p.alpha <= 0) { particleLayer.removeChild(p); steamPuffs.splice(i, 1); }
    }

    // Wheel spin
    for (const w of wheels) w.rotation += 0.09 * dt * (gameSpeed / 2);

    // Spawn
    spawnTimer += dt;
    totalBoxSpawned += dt;
    mathBoxTimer += dt;
    heartBoxTimer += dt;

    if (spawnTimer >= spawnInterval()) {
      spawnTimer = 0;
      spawnLetterBox();
    }

    // Math box — Hotfix #102-B: skip on easy mode (user "jangan terlalu banyak
    // huruf filler" — math/heart boxes felt like distractor noise on easy).
    if (mathBoxTimer >= nextMathAt && getDifficulty() !== 'easy') {
      mathBoxTimer = 0; nextMathAt = MATH_BOX_INTERVAL();
      spawnSpecialBox('math');
    }

    // Heart box (only if lives < MAX)
    if (heartBoxTimer >= nextHeartAt && lives < MAX_LIVES) {
      heartBoxTimer = 0; nextHeartAt = HEART_BOX_INTERVAL();
      spawnSpecialBox('heart');
    }

    // Move + check boxes
    for (let i = letterBoxes.length - 1; i >= 0; i--) {
      const b = letterBoxes[i];
      b.container.x -= gameSpeed * dt;

      // Glow pulse
      if (b.glowGfx) {
        b._glowPhase = (b._glowPhase || 0) + 0.1 * dt;
        b.glowGfx.alpha = 0.45 + Math.sin(b._glowPhase) * 0.4;
      }

      // Collision: must match lane AND be within Y proximity (fix phantom hit)
      if (!invincible && b.container.x < TRAIN_X + 52 && b.container.x > TRAIN_X - 52) {
        if (b.lane === playerLane && Math.abs(b.container.y - trainContainer.y) < 42) {
          collectBox(b, i);
          continue;
        }
      }

      if (b.container.x < -90) { boxLayer.removeChild(b.container); letterBoxes.splice(i, 1); }
    }

    // v54.28 I12: smooth Y tween toward target lane (was teleport-snap to
    // LANE_Y[playerLane] every frame, which made carriage-bob look glitchy
    // mid-switch). _tweenY is the current displayed Y; it lerps at ~0.22/frame
    // (≈120ms ease-out) toward LANE_Y[playerLane]. Bounce + bob are then
    // added on top of the smooth carrier value.
    const targetLaneY = LANE_Y[playerLane];
    if (trainContainer._tweenY == null) trainContainer._tweenY = targetLaneY;
    const ldy = targetLaneY - trainContainer._tweenY;
    if (Math.abs(ldy) > 0.5) trainContainer._tweenY += ldy * 0.22 * dt;
    else trainContainer._tweenY = targetLaneY;

    if (trainContainer._bounceT > 0) {
      trainContainer._bounceT -= 0.1 * dt;
      trainContainer.y = trainContainer._tweenY - Math.sin(trainContainer._bounceT * Math.PI) * 6;
    } else {
      trainContainer._bounceT = 0;
      const bob = Math.sin(performance.now() * 0.003) * 1.4;
      trainContainer.y = trainContainer._tweenY + bob;
    }
    // v54.28 I12: tiny lead-rotation while the lerp is in flight (subtle banking
    // INTO the turn before the body finishes moving). Direction = sign(ldy).
    if (Math.abs(ldy) > 4 && (!trainContainer._leanTimer || trainContainer._leanTimer <= 0)) {
      trainContainer.rotation += (Math.sign(ldy) * 0.04 - trainContainer.rotation) * 0.18 * dt;
    }
    // v54.20 C1: banking lean lerp toward 0.
    if (trainContainer._leanTimer && trainContainer._leanTimer > 0) {
      trainContainer._leanTimer -= dt;
      const k = Math.max(0, Math.min(1, trainContainer._leanTimer / 18));
      trainContainer.rotation = (trainContainer._leanTarget || 0) * k;
    } else if (trainContainer.rotation) {
      trainContainer.rotation *= 0.85;
      if (Math.abs(trainContainer.rotation) < 0.002) trainContainer.rotation = 0;
    }
    // v54.20 C17: ghost-letter anticipation preview
    g15UpdateGhostLetter();
    // v54.20 C15: character train enhanced idle micro-anim
    try { g15TickCharIdle(dt) } catch(_){}

    // Steam emit
    if (Math.random() < 0.05 * dt) emitSteam();
  });
}

// ── Train: Parametric from selectedTrain ──────────────────────────────────────
// Character train instance (Casey JR / Linus Brave) — managed by CharacterTrain module.
let characterTrainInstance = null;

function buildTrain() {
  if (!selectedTrain) selectedTrain = TRAIN_CATALOG[0];
  trainContainer.x = TRAIN_X;
  trainContainer.y = LANE_Y[1];
  trainContainer._bounceT = 0;

  // Hotfix #112-G (2026-05-01): clear stale train children to prevent
  // sprite stacking ("ada 2 sprite gambar kereta bertumpuk") when
  // buildTrain runs again on level replay or character switch.
  // Previously trainContainer.removeChildren() was NEVER called → old
  // programmatic Graphics + new mount stacked.
  try {
    if (typeof wheels !== 'undefined' && Array.isArray(wheels)) wheels.length = 0
    trainContainer.removeChildren()
  } catch (_) {}

  // Dispose previous character instance if switching
  if (characterTrainInstance) { characterTrainInstance.dispose(); characterTrainInstance = null; }

  // Character train branch — mount bg-removed WebP sprite with animated wheels + smoke.
  // Task #60 — derived rail-anchor algorithm: wheel-bottom lands EXACTLY on rail surface.
  // Task #59 — per-train TRAIN_X = 5% of W (clamped to train's leftmost wheel safe-min).
  if (selectedTrain.isCharacter && window.CharacterTrain) {
    const rzScale = (window.RZ && typeof RZ.trainScale === 'function') ? RZ.trainScale() : 1;
    const scaledCfg = CharacterTrain.scaleConfig(selectedTrain, rzScale);
    // G15 rail surface — top of upper rail line drawn in buildTracks() at lY+14.
    // Wheel bottom must land here; engine.wheelAnchor(scaledCfg) returns the lowest
    // wheel-bottom Y in sprite-local coords (already scale-corrected).
    const railSurfaceY = LANE_Y[1] + 14;
    const anchor = CharacterTrain.wheelAnchor(scaledCfg);
    trainContainer.y = railSurfaceY - anchor;
    // Optional per-train fine-tune (was bottomPaddingOffset; now a pure visual nudge,
    // default 0 — rail anchoring no longer needs to compensate for sprite padding).
    if (typeof scaledCfg.visualOffset === 'number') trainContainer.y += scaledCfg.visualOffset;
    // Per-train TRAIN_X (5% rule + wheel-safe clamp).
    TRAIN_X = CharacterTrain.computeTrainX(scaledCfg, W, 0.05);
    trainContainer.x = TRAIN_X;
    // Sprite faces RIGHT naturally — don't mirror container
    trainContainer.scale.x = 1;
    characterTrainInstance = CharacterTrain.mount(trainContainer, scaledCfg);
    if (characterTrainInstance) characterTrainInstance.setSmokeParent(stage);
    return;
  }

  // Flip so locomotive faces RIGHT (direction of travel) — programmatic trains
  trainContainer.scale.x = -1;

  const g = new PIXI.Graphics();
  const c = selectedTrain;

  // Dispatch to type-specific builder
  if (c.type === 'steam') drawSteamBody(g, c);
  else if (c.type === 'diesel') drawDieselBody(g, c);
  else if (c.type === 'electric' || c.type === 'tram') drawElectricBody(g, c);
  else if (c.type === 'highspeed') drawHighSpeedBody(g, c);
  else if (c.type === 'heritage') drawHeritageBody(g, c);
  else drawSteamBody(g, c); // fallback

  trainContainer.addChild(g);
  // v54.11 — Universal polish overlay (skips character trains; they take the early
  // return above). Adds 4 cheap finishing touches per L110 (extracted lesson from G14).
  g15ApplyProceduralPolish(g, c);
  addWheels(c);
}

// blend two hex colors (t=0 → a, t=1 → b)
function blendColor(a,b,t){
  const ar=(a>>16)&0xff,ag=(a>>8)&0xff,ab=a&0xff;
  const br=(b>>16)&0xff,bg=(b>>8)&0xff,bb=b&0xff;
  const nr=Math.round(ar+(br-ar)*t),ng=Math.round(ag+(bg-ag)*t),nb=Math.round(ab+(bb-ab)*t);
  return (nr<<16)|(ng<<8)|nb;
}

function addWheels(c) {
  const isSmall = (c.type==='tram'||c.sub==='shunter'||c.sub==='narrow'||c.sub==='prairie');
  const isSteam = (c.type==='steam');
  const wheelColor = c.k;

  let wheelDefs;
  if (isSteam) {
    wheelDefs=[
      {x:-64,r:11},{x:-47,r:11},{x:-30,r:11}, // driving
      {x:-73,r:7},{x:8,r:7},                    // small loco
      {x:30,r:7},{x:54,r:7},                    // tender
      {x:70,r:7},{x:102,r:7},                   // passenger
      {x:126,r:7},{x:142,r:7},                  // caboose
    ];
  } else if (c.type==='tram'||isSmall) {
    wheelDefs=[{x:-30,r:8},{x:-10,r:8},{x:10,r:8},{x:30,r:8}];
  } else if (c.type==='highspeed') {
    wheelDefs=[{x:-70,r:9},{x:-40,r:9},{x:10,r:9},{x:60,r:9},{x:100,r:9},{x:140,r:9}];
  } else {
    wheelDefs=[
      {x:-65,r:9},{x:-40,r:9},{x:-15,r:9}, // loco
      {x:38,r:8},{x:68,r:8},                 // coach 1
      {x:98,r:8},{x:128,r:8},                // coach 2
    ];
  }

  for(const{x,r} of wheelDefs){
    const wc=new PIXI.Container(); wc.x=x; wc.y=14;
    const wg=new PIXI.Graphics();
    wg.circle(0,0,r).fill({color:wheelColor});
    wg.circle(0,0,r).stroke({width:2,color:c.b});
    wg.rect(-1.5,-r+2,3,r*2-4).fill({color:c.w});
    wg.rect(-r+2,-1.5,r*2-4,3).fill({color:c.w});
    wg.circle(0,0,2.5).fill({color:c.b});
    wc.addChild(wg);
    trainContainer.addChild(wc);
    wheels.push(wc);
  }
}

// ── Letter / Special Boxes ────────────────────────────────────────────────────
const BOX_COLORS = [0xe11d48, 0x7c3aed, 0x0284c7, 0x059669, 0xd97706, 0xbe123c, 0x0d9488, 0x6d28d9];

function spawnLetterBox() {
  if (!gameRunning) return;
  const word = WORDS_LIST[currentWordIdx];
  if (!word) return;
  const targetLetter = word.word[currentLetterIdx];
  const allLetters = 'ABCDEFGHIJKLMNOPRSTUVWY';
  const lanesToFill = shuffle([0, 1, 2]);
  const isEasy = getDifficulty() === 'easy';
  const numBoxes = isEasy ? 1 : 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < Math.min(numBoxes, 3); i++) {
    const lane = lanesToFill[i];
    const isTarget = (i === 0);
    const letter = isTarget ? targetLetter : randomDistractor(targetLetter, allLetters);
    const color = BOX_COLORS[Math.floor(Math.random() * BOX_COLORS.length)];
    letterBoxes.push(createBox({ type: 'letter', lane, letter, isTarget, color }));
  }
}

function spawnSpecialBox(type) {
  if (!gameRunning) return;
  const lane = Math.floor(Math.random() * 3);
  const color = type === 'math' ? 0xd97706 : 0x16a34a;
  letterBoxes.push(createBox({ type, lane, letter: type === 'math' ? '?' : '❤', isTarget: false, color }));
}

function randomDistractor(avoid, pool) {
  let c; do { c = pool[Math.floor(Math.random() * pool.length)]; } while (c === avoid); return c;
}

function createBox({ type, lane, letter, isTarget, color }) {
  const container = new PIXI.Container();
  const lY = LANE_Y[lane];
  container.x = W + 55; container.y = lY - 8;
  const BW = 44, BH = 44;

  // Glow
  let glowGfx = null;
  const glowColor = type === 'math' ? 0xfbbf24 : type === 'heart' ? 0x4ade80 : isTarget ? 0xfbbf24 : null;
  if (glowColor) {
    glowGfx = new PIXI.Graphics();
    glowGfx.roundRect(-BW/2 - 7, -BH/2 - 7, BW + 14, BH + 14, 11).fill({ color: glowColor });
    glowGfx.alpha = 0.55;
    container.addChild(glowGfx);
  }

  // Box body
  const bg = new PIXI.Graphics();
  bg.roundRect(-BW/2, -BH/2, BW, BH, 10).fill({ color });
  bg.roundRect(-BW/2, -BH/2, BW, BH, 10).stroke({
    width: isTarget || type !== 'letter' ? 3 : 1.5,
    color: glowColor || 0xffffff,
    alpha: glowColor ? 1 : 0.4
  });
  container.addChild(bg);

  // Top shine
  const shine = new PIXI.Graphics();
  shine.roundRect(-BW/2 + 2, -BH/2 + 2, BW - 4, 10, 6).fill({ color: 0xffffff });
  shine.alpha = 0.18; container.addChild(shine);

  // Label
  const isEmoji = type !== 'letter';
  const txt = new PIXI.Text({
    text: isEmoji ? (type === 'math' ? '?' : '♥') : letter,
    style: {
      fontFamily: 'Fredoka One, sans-serif',
      fontSize: isEmoji ? 26 : 22,
      fontWeight: '900',
      fill: 0xffffff,
      dropShadow: true, dropShadowBlur: 4, dropShadowDistance: 2, dropShadowColor: 0x000000
    }
  });
  txt.anchor.set(0.5);
  container.addChild(txt);

  boxLayer.addChild(container);
  return { container, lane, letter, isTarget, type, glowGfx, _glowPhase: 0 };
}

function g15StreakAdd() {
  g15Streak++;
  const el = document.getElementById('g15-streak');
  if (!el) return;
  el.textContent = '🔥 ' + g15Streak + 'x';
  el.classList.add('show');
  el.classList.toggle('epic', g15Streak >= 7);
  // Scale pulse on each increment. v54.26 polish: clear inline at end so the
  // CSS rule (which already centers via `transform:translateX(-50%) scale(1)`)
  // can re-take over. Without clearing, the chip stays inline-scaled forever.
  el.style.transform = 'translateX(-50%) scale(1.25)';
  setTimeout(() => { if (el) el.style.transform = ''; }, 200);
  if (g15Streak >= 7) g15BriefSlowMo();
}
function g15StreakReset() {
  g15Streak = 0;
  const el = document.getElementById('g15-streak');
  if (el) {
    el.classList.remove('show', 'epic');
    el.textContent = '';
    // v54.26 polish: clear inline transform so the CSS rules for `.show`/normal
    // can take back over next time. Without this, the chip stays scaled at 1.25
    // after a long streak that just reset.
    el.style.transform = '';
  }
}
function g15BriefSlowMo() {
  if (typeof app === 'undefined' || !app.ticker) return;
  const prev = app.ticker.speed;
  app.ticker.speed = 0.45;

// C3: per-letter SFX pitch ladder — C-major scale climb
const G15_C_MAJOR = [523.25, 587.33, 659.25, 698.46, 783.99, 880.0, 987.77, 1046.5];  // C5..C6
function g15LetterChime(letterIdx) {
  try {
    const i = letterIdx % G15_C_MAJOR.length;
    const freq = G15_C_MAJOR[i];
    if (typeof playTone === 'function') playTone(freq, 0.10, 'sine');
  } catch(_){}
}

}

// C12: math timer scales with level + difficulty
function g15MathTimerSec() {
  const diff = (typeof getDifficulty === 'function') ? getDifficulty() : 'medium';
  const lvl = (typeof LEVEL !== 'undefined') ? LEVEL : 1;
  if (diff === 'easy') return 14;
  if (diff === 'medium') return Math.max(7, 12 - Math.floor((lvl - 8) / 2));
  return Math.max(5, 10 - Math.floor((lvl - 15) / 3));
}

// C17: ghost-letter anticipation preview — pulse #next-char brighter as a matching box approaches
function g15UpdateGhostLetter() {
  if (typeof letterBoxes === 'undefined') return;
  const word = WORDS_LIST[currentWordIdx];
  if (!word) return;
  const target = word.word[currentLetterIdx];
  if (!target) return;
  // Distance to nearest matching letter box (smaller = brighter)
  let nearestDx = Infinity;
  const W = app.screen.width;
  for (const b of letterBoxes) {
    if (b.letter === target) {
      const dx = b.container.x - TRAIN_X;
      if (dx > 0 && dx < nearestDx) nearestDx = dx;
    }
  }
  const ch = document.getElementById('next-char');
  if (!ch) return;
  if (nearestDx === Infinity) {
    ch.style.textShadow = '0 0 10px rgba(220,38,38,0.35)';
    return;
  }
  const proximity = Math.max(0, 1 - nearestDx / W);
  const glow = 10 + proximity * 22;
  ch.style.textShadow = `0 0 ${glow}px rgba(253,224,71,${0.5 + proximity * 0.5})`;
}

// C14: speed-streak visual cue — short flash of 8 horizontal white lines
function g15SpeedStreak() {
  if (!stage) return;
  const W2 = (typeof W !== 'undefined') ? W : app.screen.width;
  const H2 = (typeof H !== 'undefined') ? H : app.screen.height;
  for (let i = 0; i < 8; i++) {
    const g = new PIXI.Graphics();
    const y = H2 * 0.2 + Math.random() * (H2 * 0.6);
    const len = 80 + Math.random() * 120;
    g.rect(0, 0, len, 1.6).fill({ color: 0xffffff, alpha: 0.7 });
    g.x = W2 + 20; g.y = y;
    g._vx = -(18 + Math.random() * 12);
    g._life = 1;
    bgLayer.addChild(g);
    let t = 0;
    const tickFn = (ticker) => {
      t += ticker.deltaTime;
      g.x += g._vx * ticker.deltaTime;
      g.alpha = Math.max(0, 1 - t / 35);
      if (g.alpha <= 0) { try { bgLayer.removeChild(g); } catch(_){} app.ticker.remove(tickFn); }
    };
    if (app && app.ticker) app.ticker.add(tickFn);
  }
}

// ── Box Collection ────────────────────────────────────────────────────────────
function collectBox(box, idx) {
  if (box.type === 'heart') {
    lives = Math.min(MAX_LIVES, lives + 1);
    spawnCollectParticles(box.container.x, box.container.y, 0x4ade80);
    updateLivesHUD();
    flashScreen('green');
    boxLayer.removeChild(box.container);
    letterBoxes.splice(idx, 1);
    g15ShowHeartBanner();   // v54.20 C10
    g15UpdateVignette();
    return;
  }

  if (box.type === 'math') {
    boxLayer.removeChild(box.container);
    letterBoxes.splice(idx, 1);
    // v54.20 C19: iris-wipe cinematic before math quiz appears.
    g15MathIrisIn(() => showMathQuiz());
    return;
  }

  const word = WORDS_LIST[currentWordIdx];
  if (!word) return;
  const liveTarget = word.word[currentLetterIdx];
  const isCorrect = box.letter === liveTarget;
  if (isCorrect) {
    spawnCollectParticles(box.container.x, box.container.y, 0xfbbf24);
    boxLayer.removeChild(box.container);
    letterBoxes.splice(idx, 1);
    // v54.20 C3: per-letter pitch ladder chime; C2: streak inc
    g15LetterChime(currentLetterIdx);
    g15StreakAdd();
    currentLetterIdx++;
    if (currentLetterIdx >= word.word.length) onWordComplete();
    else { refreshHUD(); g15SpeakLetter(word.word[currentLetterIdx]); }
  } else {
    // v54.20 C8: graceful first-wrong per word — orange flash, 600ms invuln, no heart loss.
    if (g15IsFirstWrongInWord()) {
      flashScreen('orange');
      invincible = true;
      setTimeout(() => { invincible = false; }, 600);
      try { playTone(440, 0.06, 'square') } catch(_){}
      g15StreakReset();   // even graceful wrong resets streak
    } else if (!invincible) {
      wrongTaps++; triggerWrong(); g15StreakReset();
    }
    boxLayer.removeChild(box.container);
    letterBoxes.splice(idx, 1);
  }
}

// ── Rainbow effect ────────────────────────────────────────────────────────────
// v54.20 C11: draw-in left→right then fade. Animate per-color stroke alpha over time.
function spawnRainbow() {
  if (rainbow) { bgLayer.removeChild(rainbow); rainbow = null; }
  const colors = [0xff6b6b, 0xffa500, 0xffd700, 0x4ade80, 0x38bdf8, 0x818cf8, 0xf472b6];
  const cx = W * 0.5, cy = H * 0.85;
  const rb = new PIXI.Graphics();
  rb.alpha = 0;
  bgLayer.addChild(rb);
  rainbow = rb;
  let elapsed = 0;
  const DRAW_MS = 500, HOLD_MS = 250, FADE_MS = 750;
  const startT = performance.now();
  function _tick(){
    elapsed = performance.now() - startT;
    rb.clear();
    if (elapsed < DRAW_MS) {
      // sweep angle PI → 0 (left → right)
      const k = elapsed / DRAW_MS;
      for (let i = 0; i < colors.length; i++) {
        const r = 180 + i * 22;
        rb.arc(cx, cy, r, Math.PI, Math.PI - Math.PI * k, false).stroke({ width: 16, color: colors[i], alpha: 0.55 });
      }
      rb.alpha = 0.7;
    } else if (elapsed < DRAW_MS + HOLD_MS) {
      for (let i = 0; i < colors.length; i++) {
        const r = 180 + i * 22;
        rb.arc(cx, cy, r, Math.PI, 0, false).stroke({ width: 16, color: colors[i], alpha: 0.55 });
      }
      rb.alpha = 0.7;
    } else if (elapsed < DRAW_MS + HOLD_MS + FADE_MS) {
      const fk = (elapsed - DRAW_MS - HOLD_MS) / FADE_MS;
      for (let i = 0; i < colors.length; i++) {
        const r = 180 + i * 22;
        rb.arc(cx, cy, r, Math.PI, 0, false).stroke({ width: 16, color: colors[i], alpha: 0.55 });
      }
      rb.alpha = 0.7 * (1 - fk);
    } else {
      try { bgLayer.removeChild(rb); } catch(_){}
      rainbow = null;
      if (app && app.ticker) app.ticker.remove(_tick);
      return;
    }
  }
  if (app && app.ticker) app.ticker.add(_tick);
}

// ── Word Complete / Game Logic ─────────────────────────────────────────────────
function onWordComplete() {
  document.querySelectorAll('.slot').forEach(s => { s.classList.remove('filled'); s.classList.add('done'); });
  trainContainer._bounceT = Math.PI;
  spawnRainbow();
  spawnCollectParticles(TRAIN_X, trainContainer.y, 0xfbbf24);
  spawnCollectParticles(TRAIN_X - 30, trainContainer.y - 20, 0xc084fc);
  spawnCollectParticles(TRAIN_X + 30, trainContainer.y - 20, 0x4ade80);
  flashScreen('green');
  // v54.20 C3: word-complete arpeggio
  g15WordCompleteArpeggio();
  // v54.20 C9: carriage tilt during boost-out (only for steam/heritage trains)
  if (selectedTrain && (selectedTrain.type === 'steam' || selectedTrain.type === 'heritage')) {
    trainContainer._leanTarget = -0.05;
    trainContainer._leanTimer = 20;
  }
  // v54.25 H1 + H2: word-complete progression
  try {
    if (window.TrainShared) {
      TrainShared.dailyChallenge.progress('g15', 1)
      if (selectedTrain && selectedTrain.key === 'linus_brave') TrainShared.achievements.unlock('linus_brave_finish')
      if (g15Streak >= 10) TrainShared.achievements.unlock('word_10_in_row')
      if (selectedTrain) TrainShared.passport.stamp('g15', selectedTrain.key || 'unknown', 0)
    }
  } catch(_){}
  const _prevSpeed = gameSpeed
  gameSpeed = Math.max(0.4, gameSpeed * 0.35)
  // v54.20 C14: speed-streak cue right BEFORE the speed bump.
  setTimeout(() => { try { g15SpeedStreak() } catch(_){}; gameSpeed = Math.min(_prevSpeed * 1.12, 8) }, 1000)
  currentWordIdx++;
  if (currentWordIdx >= WORDS_LIST.length) { setTimeout(showWin, 700); return; }
  currentLetterIdx = 0;
  // Purge stale letter boxes — they were spawned for the prior word; keeping them
  // would confuse the player (e.g., boxes showing old-word letters while HUD prompts new word).
  // Keep non-letter specials (hearts, math) since they're word-independent.
  for (let i = letterBoxes.length - 1; i >= 0; i--) {
    const b = letterBoxes[i];
    if (b.type === 'letter') { try { boxLayer.removeChild(b.container); } catch(_){}; letterBoxes.splice(i, 1); }
  }
  setTimeout(refreshHUD, 500);
}

function triggerWrong() {
  if (invincible) return;
  invincible = true;
  // Easy mode: 50% chance to survive (shield)
  if (getDifficulty() === 'easy' && Math.random() < 0.5) {
    flashScreen('yellow');
    setTimeout(() => { invincible = false; }, 800);
    return;
  }
  lives--; if (lives < 0) lives = 0;
  updateLivesHUD();
  document.body.classList.add('shaking');
  setTimeout(() => document.body.classList.remove('shaking'), 320);
  flashScreen('red');
  // v54.20 C4: vignette update; C6: maybe offer assist when last-life + idx 0
  try { g15UpdateVignette(); g15MaybeOfferAssist(); } catch(_){}
  if (lives <= 0) { setTimeout(showLose, 600); return; }
  setTimeout(() => { invincible = false; }, 900);
}

// ── Particles ─────────────────────────────────────────────────────────────────
// v54.28 I14: pooled particle system.
// Was: every particle registered its own `app.ticker.add(closure)` and removed
// itself with `app.ticker.remove(tick)`. On a word-complete burst that's 48
// closures created + removed in the same lifecycle — Pixi's ticker list churns,
// and each closure carries the per-particle state via closure-capture (GC churn).
// Now: a single _g15FXPool array is ticked ONCE per frame via _g15TickFX.
// spawnCollectParticles just pushes plain objects. Much friendlier to V8 hot path.
const _g15FXPool = [];
let _g15FXBound = false;
function _g15TickFX(ticker){
  const d = ticker.deltaTime;
  for (let i = _g15FXPool.length - 1; i >= 0; i--) {
    const p = _g15FXPool[i];
    p.gfx.x += p.vx * d; p.gfx.y += p.vy * d;
    p.vy += 0.18 * d;
    p.gfx.alpha -= 0.035 * d;
    if (p.gfx.alpha <= 0) {
      try { particleLayer.removeChild(p.gfx) } catch(_){}
      _g15FXPool.splice(i, 1);
    }
  }
}
function _g15EnsureFXTicker(){
  if (_g15FXBound || !app || !app.ticker) return;
  app.ticker.add(_g15TickFX);
  _g15FXBound = true;
}
function spawnCollectParticles(x, y, mainColor) {
  const colors = [mainColor, 0xfbbf24, 0x38bdf8, 0xf472b6, 0xc084fc, 0x4ade80];
  _g15EnsureFXTicker();
  for (let i = 0; i < 16; i++) {
    const gfx = new PIXI.Graphics();
    const r = 3 + Math.random() * 3.5;
    gfx.circle(0, 0, r).fill({ color: colors[i % colors.length] });
    gfx.x = x; gfx.y = y; gfx.alpha = 1;
    particleLayer.addChild(gfx);
    const angle = (Math.PI * 2 * i) / 16 + Math.random() * 0.5;
    const spd = 2.5 + Math.random() * 4;
    _g15FXPool.push({ gfx, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd - 1.5 });
  }
}

function refreshHUD() {
  const word = WORDS_LIST[currentWordIdx]; if (!word) return;
  // v54.20 C5: speak the next target letter when HUD refreshes (new word or progression).
  try { g15SpeakLetter(word.word[currentLetterIdx]) } catch(_){}
  document.getElementById('word-emoji').textContent = word.emoji;
  const slotsEl = document.getElementById('word-slots');
  slotsEl.innerHTML = '';
  for (let i = 0; i < word.word.length; i++) {
    const s = document.createElement('span');
    // v54.13 — Tag the slot at currentLetterIdx as next-target. Pulsing lime ring
    // guides the kid's eye to the slot they need to fill next without text-only hint.
    let cls = 'slot';
    if (i < currentLetterIdx) cls += ' filled';
    else if (i === currentLetterIdx) cls += ' next-target';
    s.className = cls;
    s.textContent = i < currentLetterIdx ? word.word[i] : '_';
    slotsEl.appendChild(s);
  }
  document.getElementById('next-char').textContent = word.word[currentLetterIdx] || '✓';
}

function updateLaneDots() {

  }
}

function switchLane(dir) {
  if (!gameRunning || mathQuizActive) return;
  const n = Math.max(0, Math.min(2, playerLane + dir));
  if (n === playerLane) return;
  playerLane = n; updateLaneDots();
  // v54.20 C1: banking lean — small rotation in direction of travel, lerps back via tickTrainAnim
  trainContainer._leanTarget = dir * 0.08;
  trainContainer._leanTimer = 18;
  if (navigator.vibrate) { try { navigator.vibrate(10) } catch(_){} }
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') switchLane(-1);
  if (e.key === 'ArrowDown') switchLane(1);
});
document.getElementById('pixi-canvas').addEventListener('click', e => {
  if (!gameRunning || mathQuizActive) return;
  const y = e.clientY;
  for (let i = 0; i < 3; i++) {
    if (Math.abs(y - LANE_Y[i]) < 55) { playerLane = i; updateLaneDots(); return; }
  }
});

// ── Win / Lose ─────────────────────────────────────────────────────────────────
function showWin() {
  gameRunning = false;
  // Hotfix #102-C (2026-04-27): stop the Pixi ticker so it doesn't keep firing
  // 60fps callbacks (with early-return on !gameRunning) after game-end. User
  // reported "no respond hang" — every frame the loop checked the flag, doing
  // nothing useful but eating CPU. Stop here AND in showLose to guarantee halt.
  try { if (app && app.ticker) app.ticker.stop() } catch(_){}
  // v54.28 I13: stop looped train-sfx so it doesn't bleed into the result modal.
  try { const sfx = document.getElementById('train-sfx'); if (sfx) { sfx.pause(); sfx.currentTime = 0 } } catch(_){}
  const elapsed = (Date.now() - startTime) / 1000;
  const totalQ = mathCorrect + wrongTaps;
  try{document.getElementById('game-bgm').pause()}catch(_){}
  const finalStars = GameScoring.calc({
    correct: mathCorrect,
    total: Math.max(totalQ, 1),
    wrong: wrongTaps,
    time: elapsed,
    maxTime: WORDS_LIST.length * 15
  });
  sessionStorage.setItem('g15Result', JSON.stringify({ stars: finalStars }));
  saveG15Progress(finalStars);
  // Msg + title must align with stars — zero correct = fail, not "Sempurna"
  // v54.40: final-level mastery → Lulus Akademi recognition. Parity with G14.
  const isFinalMastery = LEVEL >= 30 && finalStars >= 5 && wrongTaps === 0
  const msg = isFinalMastery
    ? `Kamu menyelesaikan semua 30 kata-petualangan! Lulus Akademi Lokomotif! Matematika benar: ${mathCorrect}`
    : mathCorrect === 0
      ? `Belum ada jawaban benar. Ayo coba lagi!`
      : wrongTaps === 0
        ? `Sempurna! Tidak ada kesalahan! Matematika Benar: ${mathCorrect}`
        : `${wrongTaps} kesalahan. Matematika benar: ${mathCorrect}. Terus berlatih!`;
  const title = isFinalMastery ? '🎓 LULUS AKADEMI LOKOMOTIF!' :
    finalStars >= 5 ? 'Sempurna!' : finalStars >= 4 ? 'Hebat!' : finalStars >= 3 ? 'Bagus!' : finalStars >= 1 ? 'Coba Lagi' : 'Gagal! Coba Lagi';
  const emoji = isFinalMastery ? '🎓' :
    finalStars >= 5 ? '🏆' : finalStars >= 4 ? '🌟' : finalStars >= 3 ? '⭐' : finalStars >= 1 ? '💪' : '😞';
  const nextLevel = LEVEL < 30 ? () => { sessionStorage.setItem('g15Config', JSON.stringify({level: LEVEL + 1})); location.reload(); } : null;
  if (isFinalMastery) {
    try { window.TrainShared && TrainShared.achievements && TrainShared.achievements.unlock('lulus_akademi_g15') } catch(_){}
  }
  GameModal.show({
    emoji, title, stars: finalStars, msg,
    onNext: nextLevel, onAgain: () => restartGame(), onBack: () => goBack()
  });
}

function showLose() {
  gameRunning = false;
  // Hotfix #102-C: see showWin — same ticker.stop to prevent post-game hang.
  try { if (app && app.ticker) app.ticker.stop() } catch(_){}
  try { const sfx = document.getElementById('train-sfx'); if (sfx) { sfx.pause(); sfx.currentTime = 0 } } catch(_){}  // v54.28 I13
  sessionStorage.setItem('g15Result', JSON.stringify({ stars: 0 }));
  GameModal.show({
    emoji: '😞', title: 'Gagal! Coba Lagi', stars: 0, msg: 'Jangan menyerah, ayo coba lagi!',
    onAgain: () => restartGame(), onBack: () => goBack()
  });
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let activeTrainFilter = 'all';

  activeTrainFilter = btn.dataset.filter;

const TYPE_LABEL = {
  'steam':'Steam','diesel':'Diesel','electric':'Elektrik',
  'highspeed':'Highspeed','tram':'Tram','heritage':'Heritage'
};

function buildTrainGrid() {
  const grid = document.getElementById('train-grid');
  grid.innerHTML = '';
  const filtered = activeTrainFilter === 'all'
    ? TRAIN_CATALOG
    : TRAIN_CATALOG.filter(e => e.type === activeTrainFilter);
  const countEl = document.getElementById('ts-count');
  if (countEl) countEl.textContent = filtered.length + ' KERETA ' + (activeTrainFilter === 'all' ? 'TERSEDIA' : (TYPE_LABEL[activeTrainFilter]||'').toUpperCase());
  filtered.forEach(entry => {
    const card = document.createElement('div');
    card.className = 'tcard' + (selectedTrain && selectedTrain.id === entry.id ? ' selected' : '');
    const info = document.createElement('div');
    info.className = 'tcard-info';
    const name = document.createElement('span');
    name.className = 'tname';
    name.textContent = (entry.isCharacter ? '⭐ ' : '') + entry.name;
    const sub = document.createElement('span');
    sub.className = 'tsub';
    sub.textContent = (TYPE_LABEL[entry.type] || entry.type) + (entry.sub ? ' · ' + entry.sub : '');
    info.appendChild(name);
    info.appendChild(sub);

    // Character train → use real sprite IMG (not generated canvas)
    if (entry.isCharacter && entry.spriteUrl) {
      const img = document.createElement('img');
      img.src = entry.spriteUrl;
      img.alt = entry.name;
      // Sprites vary widely in aspect (1.37 .. 7.21). Use max-width with auto height
      // so tall trains (Casey JR, Linus) stay chunky and wide trains (JZ 711, Malivlak)
      // render at readable height instead of being squished into a 36px band.
      img.style.cssText = 'width:auto;height:auto;max-width:120px;max-height:48px;object-fit:contain;display:block;margin:0 auto;';
      card.appendChild(img);
    } else {
      const canvas = document.createElement('canvas');
      canvas.width = 100; canvas.height = 36;
      card.appendChild(canvas);
      try {
        drawTrainPreview2d(canvas, entry);
      } catch(e) {
        try {
          const ctx = canvas.getContext('2d');
          if (ctx) {
            ctx.fillStyle = '#' + entry.b.toString(16).padStart(6, '0');
            ctx.fillRect(0, 0, 120, 48);
          }
        } catch(_) {}
      }
    }
    card.appendChild(info);
    grid.appendChild(card);
    card.addEventListener('click', () => {
      selectedTrain = entry;
      document.getElementById('train-select').style.display = 'none';
      initPixi().catch(e => console.error('g15 pixi init error:', e));
    });
  });
}

function _hex(n) {
  return `rgb(${(n>>16)&0xff},${(n>>8)&0xff},${n&0xff})`;
}

function drawTrainPreview2d(canvas, c) {
  const ctx = canvas.getContext('2d');
  const CW = canvas.width, CH = canvas.height;
  ctx.clearRect(0, 0, CW, CH);
  const type = c.type, sub = c.sub;
  const B=_hex(c.b),R=_hex(c.r),S=_hex(c.s),W=_hex(c.w),K=_hex(c.k);
  const V=c.v||1; const vi=V-1;

  // ── Track (all types) ───────────────────────────────────────────────────
  ctx.fillStyle='#3b2a14'; ctx.fillRect(0,CH-7,CW,7);
  for(let i=0;i<CW;i+=10){ctx.fillStyle='#5a3a1a';ctx.fillRect(i,CH-6,7,5);}
  ctx.fillStyle='#999'; ctx.fillRect(0,CH-7,CW,2);
  ctx.fillStyle='#999'; ctx.fillRect(0,CH-4,CW,2);
  const tY=CH-7; // top of track

  // ── Helper: draw spoked wheel ────────────────────────────────────────────
  function wheel(cx,cy,r,rimC,spokeC,hubC,spokes){
    ctx.fillStyle=rimC; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=spokeC; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
    const n=spokes||6;
    for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*(r-1),cy+Math.sin(a)*(r-1));ctx.stroke();}
    ctx.fillStyle=hubC; ctx.beginPath(); ctx.arc(cx,cy,2.2,0,Math.PI*2); ctx.fill();
  }
  function bogie(cx,cy,rimC,spokeC){
    ctx.fillStyle='#555'; ctx.fillRect(cx-14,cy-3,28,5);
    ctx.beginPath(); ctx.arc(cx-9,cy+1,5,0,Math.PI*2); ctx.fillStyle=rimC; ctx.fill();
    ctx.beginPath(); ctx.arc(cx+9,cy+1,5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=spokeC; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(cx-9,cy+1,5,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx+9,cy+1,5,0,Math.PI*2); ctx.stroke();
  }
  function pantoV(cx,roofY,w,col){
    ctx.strokeStyle=col||'#ccc'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(cx-w/2,roofY+1); ctx.lineTo(cx,roofY-9); ctx.lineTo(cx+w/2,roofY+1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-w/4,roofY-4); ctx.lineTo(cx+w/4,roofY-4); ctx.stroke();
    ctx.fillStyle=col||'#ccc'; ctx.fillRect(cx-w/2-1,roofY,3,5); ctx.fillRect(cx+w/2-1,roofY,3,5);
  }
  function catWire(col){
    ctx.strokeStyle=col||'rgba(180,180,180,0.6)'; ctx.lineWidth=1;
    ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(0,4); ctx.lineTo(CW,4); ctx.stroke(); ctx.setLineDash([]);
  }

  // ══════════════════════════════════════════════════════════════════════════
  // STEAM  — each vi is a structurally different locomotive type
  // ══════════════════════════════════════════════════════════════════════════
  if(type==='steam'){
    const wY=tY;

    if(sub==='classic'){
      if(vi===0){ // 0-4-0T saddle tank shunter – tiny, no tender
        ctx.fillStyle=B; ctx.fillRect(28,10,50,20);
        ctx.fillStyle=R; ctx.beginPath(); ctx.arc(53,10,13,Math.PI,0); ctx.fill(); // saddle tank
        ctx.fillStyle=W; ctx.fillRect(60,13,10,9);
        ctx.fillStyle='#111'; ctx.fillRect(32,0,8,12); ctx.fillRect(29,0,14,4);
        ctx.fillStyle=S; ctx.beginPath(); ctx.arc(48,10,5,Math.PI,0); ctx.fill();
        wheel(40,wY,9,K,S,R,6); wheel(60,wY,9,K,S,R,6);
        ctx.strokeStyle=R; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(40,wY); ctx.lineTo(60,wY); ctx.stroke();
      } else if(vi===1){ // 2-6-0 Mogul + tender
        ctx.fillStyle=B; ctx.fillRect(16,11,68,17);
        ctx.beginPath(); ctx.ellipse(16,19,4,8,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=R; ctx.fillRect(86,7,26,21); ctx.fillStyle=W; ctx.fillRect(89,10,8,8); ctx.fillRect(99,10,8,8);
        ctx.fillStyle='#111'; ctx.fillRect(20,1,8,11); ctx.fillRect(17,1,14,4);
        ctx.fillStyle=S; ctx.beginPath(); ctx.arc(68,11,5,Math.PI,0); ctx.fill();
        wheel(10,wY+3,5,K,S,R,4);
        [34,52,70].forEach(x=>wheel(x,wY,8,K,S,R,6));
        ctx.strokeStyle=R; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(34,wY); ctx.lineTo(70,wY); ctx.stroke();
        ctx.fillStyle=S; ctx.fillRect(82,21,4,7); ctx.fillRect(112,21,4,7);
      } else if(vi===2){ // 4-6-2 Pacific + long tender
        ctx.fillStyle=B; ctx.fillRect(10,11,78,16);
        ctx.beginPath(); ctx.ellipse(10,19,4,8,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=R; ctx.fillRect(90,6,26,22); ctx.fillStyle=W; ctx.fillRect(93,9,8,8); ctx.fillRect(104,9,7,8);
        ctx.fillStyle='#111'; ctx.fillRect(16,2,7,10); ctx.fillRect(13,2,13,4);
        ctx.fillStyle=R; ctx.fillRect(12,4,6,13); ctx.fillRect(24,4,6,13); // deflectors
        ctx.fillStyle=S; ctx.beginPath(); ctx.arc(76,11,5,Math.PI,0); ctx.fill();
        wheel(5,wY+3,4,K,S,R,4);
        [28,46,64].forEach(x=>wheel(x,wY,9,K,S,R,6));

        ctx.fillStyle='#111'; ctx.fillRect(18,0,7,13); ctx.fillRect(15,0,13,4);
        ctx.fillStyle='#111'; ctx.fillRect(28,0,7,13); ctx.fillRect(25,0,13,4);
        ctx.fillStyle=S; ctx.beginPath(); ctx.arc(78,10,5,Math.PI,0); ctx.fill();
        wheel(7,wY+3,4,K,S,R,4);
        [26,42,58,74].forEach(x=>wheel(x,wY,8,K,S,R,6));
        ctx.strokeStyle=R; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(26,wY); ctx.lineTo(74,wY); ctx.stroke();
        ctx.fillStyle=S; ctx.fillRect(88,21,4,7); ctx.fillRect(116,21,4,7);

        ctx.fillStyle=W; ctx.fillRect(52,11,10,10); ctx.fillRect(64,11,10,10);

        [98,110].forEach(x=>wheel(x,wY,7,K,S,R,6));

      }

    } else if(sub==='pacific'){
      if(vi===0){ // Standard exposed-motion Pacific
        ctx.fillStyle=B; ctx.fillRect(16,11,76,16);
        ctx.beginPath(); ctx.ellipse(16,19,5,8,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=R; ctx.fillRect(94,6,22,22); ctx.fillStyle=W; ctx.fillRect(97,9,8,7); ctx.fillRect(107,9,7,7);
        ctx.fillStyle='#1a1a1a'; ctx.fillRect(20,2,7,10); ctx.fillRect(17,2,13,4);
        ctx.fillStyle=S; ctx.beginPath(); ctx.arc(80,11,5,Math.PI,0); ctx.fill();
        ctx.fillStyle=R; ctx.fillRect(14,4,7,14); ctx.fillRect(26,4,7,14);

        ctx.fillStyle=S; ctx.fillRect(90,21,4,7); ctx.fillRect(116,21,4,7);

      } else if(vi===2){ // Cab-forward (cab at FRONT, firebox at back)
        ctx.fillStyle=R; ctx.fillRect(0,7,26,21); // cab first
        ctx.fillStyle=W; ctx.fillRect(3,10,10,9); ctx.fillRect(14,10,9,9);
        ctx.fillStyle=B; ctx.fillRect(26,11,72,16);
        ctx.beginPath(); ctx.ellipse(98,19,5,8,0,0,Math.PI*2); ctx.fill();

function showStationBanner(station) {
  const el = document.getElementById('station-banner');
  document.getElementById('sb-icon').textContent = station.icon;
  document.getElementById('sb-name').textContent = station.name;
  document.getElementById('sb-landmark').textContent = station.landmark;
  el.classList.remove('fade-out');
  el.classList.add('visible');
  setTimeout(() => {
    el.classList.add('fade-out');
    setTimeout(() => el.classList.remove('visible', 'fade-out'), 600);
  }, 3000);
}

function updateStationChip() {
  const station = getCurrentStation();
  document.getElementById('sc-name').textContent = station.name;
  document.getElementById('station-chip').style.display = 'block';
}

// ── RDE Layer 3 — Responsive Display Engine wiring ─────────────────────────────
// Mirrors DOM HUD + math quiz font-sizes to window.RZ.fontScale() so they track
// the same fluid clamp as PixiJS games. Safe no-op if the runtime is absent.
function applyRdeScaling() {
  if (!window.RZ) return;
  const q = (sel) => document.querySelector(sel);
  const set = (el, prop, val) => { if (el) el.style[prop] = (typeof val === 'number' ? val + 'px' : val); };
  // Math quiz panel
  set(q('#math-label'), 'fontSize', window.RZ.fontScale(12));
  set(q('#math-question'), 'fontSize', window.RZ.fontScale(34));
  document.querySelectorAll('.math-btn').forEach(b => {
    b.style.fontSize = window.RZ.fontScale(20) + 'px';
    b.style.minWidth = window.RZ.btn('sm') + 'px';
  });
  // HUD — word emoji, next char chip, station banner, life hearts
  set(q('#word-emoji'), 'fontSize', window.RZ.fontScale(24));
  set(q('#next-char'), 'fontSize', window.RZ.fontScale(24));
  set(q('#sb-name'), 'fontSize', window.RZ.fontScale(22));
  set(q('#sb-landmark'), 'fontSize', window.RZ.fontScale(13));
  document.querySelectorAll('.life-heart').forEach(h => {
    h.style.fontSize = window.RZ.fontScale(20) + 'px';
  });
}

// ── Boot ───────────────────────────────────────────────────────────────────────
showTrainSelect();
if (window.RZ) window.RZ.onResize(applyRdeScaling);
