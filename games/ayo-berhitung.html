<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<meta name="theme-color" content="#4c6ef5">
<title>Ayo Berhitung!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   AYO BERHITUNG! — laid out to match the reference the owner supplied, screen
   for screen: the blue panel, the star counter over a progress rail, the
   OPERASI and LEVEL segmented pills, the coloured action row, and a page of
   ten bersusun questions on pale cards with per-digit answer boxes and a green
   tick when a card is right.
   Nothing here computes an answer: every number comes from
   data/berhitung-engine.js, which is property-tested separately. This file is
   layout, input and persistence.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --panel:#4c6ef5; --panel-2:#4263eb; --panel-ink:#ffffff;
  --seg-bg:#e9edf6; --seg-active:#ffffff; --seg-ink:#4a5568; --seg-ink-active:#1f2937;
  --red:#ef5350; --red-d:#c62828;
  --grey:#cfd4de; --grey-ink:#3b4252;
  --amber:#e8833a; --amber-d:#c96a26;
  --green:#2fa96b; --green-d:#227d4f;
  --teal:#2aa9a1; --teal-d:#1d857f;
  --yellow:#f2b705; --yellow-d:#c99400;
  --navy:#2b3550;
  --page-bg:#f6f7fa; --card:#f1f8f3; --card-line:#dfe9e2; --card-shadow:0 1px 2px rgba(16,24,40,.06);
  --ink:#1f2937; --ink-soft:#5b6472; --ink-faint:#8a93a0;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tap:44px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--page-bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
  padding:12px 12px max(18px,env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
button{border:0;background:none;color:inherit;cursor:pointer;font-size:15px}
:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── blue control panel ──────────────────────────────────────────────────── */
.panel{background:linear-gradient(180deg,var(--panel),var(--panel-2));color:var(--panel-ink);
  border-radius:16px;padding:16px 18px 14px;margin:0 auto 14px;max-width:1360px;
  box-shadow:0 4px 14px rgba(66,99,235,.22)}
.panel h1{font-size:26px;font-weight:900;letter-spacing:.2px;margin-bottom:2px}
.panel .lede{font-size:13.5px;font-weight:700;opacity:.92;margin-bottom:12px}
.meter{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.star{display:inline-flex;align-items:center;gap:7px;background:#fff;color:#243056;border-radius:999px;
  padding:7px 16px;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;
  box-shadow:0 2px 0 rgba(0,0,0,.08)}
.star i{font-style:normal;color:#f0a500}
.rail{flex:1;height:10px;border-radius:999px;background:rgba(255,255,255,.28);overflow:hidden}
.rail>i{display:block;height:100%;width:0;background:#fff;border-radius:999px;
  transition:width .25s cubic-bezier(.2,.8,.3,1)}
.star{transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.star.bump{transform:scale(1.06)}
.star i{display:inline-block;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.star.bump i{transform:rotate(72deg) scale(1.2)}
.rail{position:relative;overflow:hidden}
.rail.shine::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);
  transform:translateX(-100%);animation:shine .7s ease}
@keyframes shine{to{transform:translateX(100%)}}
.ctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctrl-label{font-size:11px;font-weight:900;letter-spacing:1.2px;opacity:.85}
/* The active pill is a SLIDING panel, not a background that swaps: the eye
   follows one object moving instead of two states blinking, which is most of
   what "smooth" means on a control like this. */
.seg{position:relative;display:inline-flex;background:var(--seg-bg);border-radius:12px;padding:4px;gap:4px;
  isolation:isolate}
.seg .ind{position:absolute;top:4px;left:0;height:calc(100% - 8px);border-radius:9px;background:var(--seg-active);
  box-shadow:0 1px 2px rgba(16,24,40,.18);z-index:0;opacity:0;
  transition:transform .26s cubic-bezier(.22,1,.36,1),width .26s cubic-bezier(.22,1,.36,1),opacity .18s ease}
.seg button{position:relative;z-index:1}
/* 44px everywhere, not only on phones: the tablet sizes sat at 38px and a
   thumb needs the same room on an iPad as on an iPhone. */
.seg button{min-height:44px;min-width:44px;padding:0 15px;border-radius:9px;font-weight:800;color:var(--seg-ink);
  font-size:14.5px;white-space:nowrap;background:transparent;
  transition:background-color .16s ease,color .16s ease,box-shadow .16s ease,transform .1s ease}
.seg button:active{transform:scale(.97)}
.seg button[aria-pressed="true"]{background:transparent;color:var(--seg-ink-active);box-shadow:none}
.act{min-height:44px;padding:0 16px;border-radius:10px;font-weight:800;font-size:14.5px;color:#fff;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.act{transition:transform .1s ease,filter .14s ease,box-shadow .14s ease}
.act:active{transform:scale(.98)}
@media (hover:hover){ .act:hover{filter:brightness(1.05)} .pg:hover{background:#f4f6fb} }
.act.red{background:var(--red)} .act.grey{background:var(--grey);color:var(--grey-ink)}
.act.amber{background:var(--amber)} .act.green{background:var(--green)}
.act.teal{background:var(--teal)} .act.yellow{background:var(--yellow);color:#4a3600}
.act.navy{background:var(--navy);padding:0 12px}
.row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}

/* ── question cards ──────────────────────────────────────────────────────── */
.sheet{max-width:1360px;margin:0 auto;display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
.sheet{transition:opacity .16s ease,transform .18s cubic-bezier(.4,0,1,1)}
.sheet.out-left{opacity:0;transform:translateX(-26px)}
.sheet.out-right{opacity:0;transform:translateX(26px)}
@media (max-width:1000px){ .sheet{grid-template-columns:repeat(2,1fr)} }
@media (max-width:640px){ .sheet{grid-template-columns:1fr} }
.q{position:relative;background:var(--card);border:1px solid var(--card-line);border-radius:14px;
  padding:14px 16px 16px;box-shadow:var(--card-shadow);break-inside:avoid;
  transition:background-color .18s ease,border-color .18s ease,box-shadow .22s ease,transform .22s ease}
.q.ok{transform:translateY(-2px);box-shadow:0 6px 16px rgba(34,125,79,.14)}
/* a single sweep of light across a card that has just been solved */
.q.just::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);
  transform:translateX(-100%);animation:sweep .55s cubic-bezier(.3,.7,.3,1)}
@keyframes sweep{to{transform:translateX(100%)}}
.q.no-yet{animation:halo .5s ease}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(239,83,80,.35)}100%{box-shadow:0 0 0 12px rgba(239,83,80,0)}}
/* cards arrive in sequence rather than all at once; --i is set per card */
.sheet.enter .q{opacity:0;transform:translateY(10px);animation:cardIn .34s cubic-bezier(.22,1,.36,1) forwards;
  animation-delay:calc(var(--i) * 34ms)}
@keyframes cardIn{to{opacity:1;transform:none}}
.q.hunt{animation:hunt .7s ease}
@keyframes hunt{0%,100%{box-shadow:var(--card-shadow)}
  35%{box-shadow:0 0 0 4px rgba(232,131,58,.35),0 8px 18px rgba(232,131,58,.18)}}
.q .no{position:absolute;top:10px;left:12px;min-width:22px;height:22px;border-radius:7px;color:#fff;
  font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 6px}
.q .label{margin-left:30px;font-size:13px;font-weight:800;color:var(--ink-soft);
  font-variant-numeric:tabular-nums}
.q .tick{position:absolute;top:8px;right:10px;width:26px;height:26px;border-radius:50%;
  color:#fff;display:none;align-items:center;justify-content:center;font-size:15px;font-weight:900;
  transform:scale(.4);opacity:0;transition:transform .26s cubic-bezier(.34,1.56,.64,1),opacity .18s ease}
.q.ok .tick,.q.no-yet .tick{display:flex;transform:scale(1);opacity:1}
.q.ok .tick{background:var(--green)}
.q.no-yet .tick{background:var(--red)}
.q.ok{background:#e9f7ef;border-color:#c3e6d0}
.q.no-yet{background:#fdf0ef;border-color:#f3c8c4}

/* the bersusun block: one digit per cell, right aligned, operator in its own
   column so a wide operator never shifts the place values out of line */
/* One grid holds the operands, the rule AND the answer boxes, all on the same
   column track, so the units box sits exactly under the units digit. Two grids
   (one for the sum, one for the boxes) can only ever look nearly aligned --
   which is what "kurang presisi" was. Column width is a fixed px so a digit and
   a box are the same width by construction, not by coincidence. */
.sum{--col:34px;display:grid;justify-content:end;align-items:center;gap:2px 6px;margin:10px 0 2px;
  font-variant-numeric:tabular-nums;font-size:30px;font-weight:800;color:#111827;line-height:1.16}
.sum .op{grid-column:1;text-align:center;color:#111827}
.sum .d{width:var(--col);text-align:center}
.sum .rule{grid-column:1/-1;height:3px;background:#111827;border-radius:2px;margin:5px 0 3px}
.boxes{display:contents}
.boxes input{width:var(--col);height:40px;padding:0;text-align:center;font-size:19px;font-weight:900;
  color:#111827;font-variant-numeric:tabular-nums;background:#fff;border:1px solid #cfd8d2;border-radius:7px;
  transition:border-color .16s ease,background-color .16s ease,box-shadow .16s ease,transform .1s ease}
.boxes input:focus{outline:none;border-color:var(--panel);box-shadow:0 0 0 3px rgba(76,110,245,.22);
  transform:translateY(-1px)}
.boxes input.ink{animation:ink .16s cubic-bezier(.34,1.56,.64,1)}
@keyframes ink{0%{transform:scale(1.14)}100%{transform:scale(1)}}
.boxes input:not(:placeholder-shown){border-color:#b9c4bd}
.q.ok .boxes input{border-color:#9fd3b4;background:#fbfffc}
.q.no-yet .boxes input{border-color:#eab3ae;background:#fffafa}
.q.shake .boxes input{animation:boxShake .2s ease}
@keyframes boxShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.story{margin:10px 0 2px;font-size:14.5px;font-weight:700;line-height:1.5;color:#1f2937}

/* ── pager ───────────────────────────────────────────────────────────────── */
/* Not visible in the reference crop, but 100 pages need a way to move between
   them; styled from the same palette so it reads as part of the panel. */
.pager{max-width:1360px;margin:16px auto 0;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.pager .pg{min-height:var(--tap);padding:0 18px;border-radius:10px;background:#fff;border:1px solid #dfe3ec;
  font-weight:800;color:var(--grey-ink)}
.pager .pg[disabled]{opacity:.45;cursor:default}
.pager .now{font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.pager input{width:74px;height:var(--tap);text-align:center;font-weight:900;border:1px solid #dfe3ec;
  border-radius:10px;font-variant-numeric:tabular-nums;font-size:16px}

/* ── badge sheet ─────────────────────────────────────────────────────────── */
.modal{position:fixed;inset:0;background:rgba(17,24,39,.55);display:none;align-items:center;justify-content:center;
  padding:18px;z-index:60}
.modal[open]{display:flex;animation:fadeIn .16s ease}
.modal[open] .box{animation:popIn .22s cubic-bezier(.34,1.56,.64,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.bdg{opacity:0;transform:translateY(6px);animation:bdgIn .26s ease forwards}
@keyframes bdgIn{to{opacity:1;transform:none}}
.modal .box{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:18px 18px 16px;
  box-shadow:0 18px 40px rgba(0,0,0,.25)}
.modal h2{font-size:19px;font-weight:900;margin-bottom:10px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.bdg{border:1px solid #e6e9f0;border-radius:12px;padding:10px;text-align:center;font-weight:800;font-size:13px;
  color:var(--ink-soft);background:#fafbfe}
.bdg.on{background:#fff8e1;border-color:#f3d98b;color:#7a5b00}
/* toast: says the page is finished without taking the screen away */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px) scale(.96);background:#14351f;color:#fff;
  font-weight:800;font-size:15px;padding:12px 20px;border-radius:999px;box-shadow:0 10px 24px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .32s cubic-bezier(.22,1.5,.36,1);z-index:70}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.bdg b{display:block;font-size:22px;margin-bottom:4px}

/* ── phone: the panel keeps its shape, just tighter, and nothing may push the
   page sideways (a child scrolling a worksheet horizontally loses their place) */
@media (max-width:640px){
  body{padding:8px 8px max(14px,env(safe-area-inset-bottom));overflow-x:hidden}
  .panel{padding:14px 12px 12px;border-radius:14px}
  .panel h1{font-size:22px}
  .panel .lede{font-size:12.5px}
  .ctrls{gap:8px}
  .seg{flex-wrap:wrap}
  /* 44px is the thumb minimum; below it a child taps the gap between pills */
  .seg button{padding:0 12px;font-size:14px;min-height:44px;min-width:44px}
  .act{padding:0 13px;font-size:14px;min-height:44px}
  .row2{gap:8px}
  .sum{font-size:26px;--col:30px}
  .boxes input{height:40px;font-size:18px}
  /* iOS zooms the whole page when a text field under 16px takes focus */
  .pager input{width:64px;font-size:16px}
}

/* One switch for all of it. Motion is decoration here: every state it conveys
   is also written in the DOM, so removing it removes nothing but the movement. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .sheet.out-left,.sheet.out-right{opacity:1;transform:none}
  .sheet.enter .q{opacity:1;transform:none;animation:none}
}
body[data-motion="off"] *,body[data-motion="off"] *::before,body[data-motion="off"] *::after{
  animation:none!important;transition:none!important}

/* ── print: the sheet only, key on its own page ──────────────────────────── */
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;padding:0}
  .panel,.pager,.modal,.noprint{display:none!important}
  .print-head{display:block!important;margin-bottom:8mm;font-weight:900}
  .sheet{grid-template-columns:repeat(3,1fr);gap:8mm}
  .q{background:#fff!important;border:1px solid #111;box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  .q .tick,.q .state{display:none!important}
  .boxes input{border:1px solid #666}
  #answer-key{display:block!important;break-before:page;page-break-before:always}
}
.print-head,#answer-key{display:none}
</style>
</head>
<body>

<div class="panel" role="region" aria-label="Pengaturan latihan">
  <h1>Ayo Berhitung!</h1>
  <p class="lede" id="lede">1000 soal penjumlahan — 10 soal per halaman, 100 halaman. Jawaban tersimpan saat pindah halaman.</p>

  <div class="meter">
    <span class="star"><i>★</i> <span id="solved">0</span> /<span id="total">1000</span></span>
    <span class="rail"><i id="rail-fill"></i></span>
  </div>

  <div class="ctrls">
    <span class="ctrl-label" id="lbl-op">OPERASI</span>
    <span class="seg" id="seg-op" role="group" aria-labelledby="lbl-op"></span>
    <span class="ctrl-label" id="lbl-lv">LEVEL</span>
    <span class="seg" id="seg-lv" role="group" aria-labelledby="lbl-lv"></span>
    <span class="ctrl-label" id="lbl-dg">DIGIT</span>
    <span class="seg" id="seg-dg" role="group" aria-labelledby="lbl-dg"></span>
    <button class="act red" id="btn-new">Soal Baru</button>
    <button class="act grey" id="btn-repeat">↺ Ulangi Halaman</button>
  </div>

  <div class="row2">
    <button class="act amber" id="btn-find">🔎 Cari Salah</button>
    <button class="act green" id="btn-print-page">Cetak Halaman</button>
    <button class="act teal" id="btn-print-range">🖨 Cetak Rentang</button>
    <button class="act yellow" id="btn-badges">🏅 Lencana</button>
    <button class="act navy" id="btn-sound" aria-pressed="true" aria-label="Suara">🔊</button>
  </div>
</div>

<p class="print-head" id="print-head"></p>
<main class="sheet" id="sheet" aria-label="Soal"></main>
<p class="sr" id="live" role="status" aria-live="polite"></p>

<nav class="pager" aria-label="Halaman">
  <button class="pg" id="pg-prev">← Sebelumnya</button>
  <span class="now">Halaman</span>
  <label class="sr" for="pg-input">Nomor halaman</label>
  <input id="pg-input" type="text" inputmode="numeric" value="1">
  <span class="now">dari <span id="pg-total">100</span></span>
  <button class="pg" id="pg-next">Berikutnya →</button>
</nav>

<div id="answer-key"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal-badges" role="dialog" aria-modal="true" aria-labelledby="bdg-title">
  <div class="box">
    <h2 id="bdg-title">Lencana</h2>
    <div class="badges" id="badge-grid"></div>
    <button class="act grey" id="btn-badges-close">Tutup</button>
  </div>
</div>

<script src="data/berhitung-engine.js?v=v60.8-20260921a"></script>
<script src="data/freeze-watchdog.js?v=v60.8-20260921a"></script>
<script src="sw-reload.js?v=v60.8-20260921a"></script>
<script>
(function () {
  'use strict'
  var B = window.Berhitung
  var $ = function (id) { return document.getElementById(id) }

  var PAGES = 100, PER_PAGE = 10, TOTAL = PAGES * PER_PAGE

  // Labels exactly as the reference prints them.
  var OPS = [
    { key: 'add',      label: 'Tambah', word: 'penjumlahan' },
    { key: 'subtract', label: 'Kurang', word: 'pengurangan' },
    { key: 'multiply', label: 'Kali',   word: 'perkalian' },
    { key: 'divide',   label: 'Bagi',   word: 'pembagian' },
    { key: 'word',     label: 'Cerita', word: 'cerita' }
  ]
  var LEVELS = [
    { key: 'easy',   label: 'Mudah' },
    { key: 'medium', label: 'Sedang' },
    { key: 'hard',   label: 'Sulit' }
  ]
  var BADGE_COLORS = ['#ef5350','#3b82f6','#22a06b','#7c5cd6','#f08c2e','#ec4899','#0ea5e9','#8b5cf6','#84cc16','#f43f5e']
  var OPSYM = { add: '+', subtract: '−', multiply: '×', divide: '÷' }

  // ── persistence ──────────────────────────────────────────────────────────
  // One versioned store. The panel promises "jawaban tersimpan saat pindah
  // halaman", so every keystroke is checkpointed, not just page turns.
  var STORE = 'berhitung-v2', SCHEMA = 2
  function fresh () { return { schemaVersion: SCHEMA, prefs: { sound: true }, op: 'add', level: 'medium', digits: 0, page: 1, sets: {}, xp: 0 } }
  function load () {
    try {
      var raw = JSON.parse(localStorage.getItem(STORE) || 'null')
      if (!raw || raw.schemaVersion !== SCHEMA) return fresh()
      raw.sets = raw.sets || {}
      return raw
    } catch (_) { return fresh() }     // corrupt data fails safe
  }
  var DB = load()
  function save () { try { localStorage.setItem(STORE, JSON.stringify(DB)) } catch (_) {} }

  // A set is one (operation, level, page). Its answers and its "Soal Baru"
  // nonce live under that key, so every page keeps its own work and every page
  // is reproducible from its seed.
  // The digit length is part of the KEY as well as the seed: "2 digit" is a
  // different thousand questions from "bebas", and a child's work on one must
  // not be mistaken for work on the other.
  function setKey (op, lv, page) { return op + '|' + lv + '|d' + digitsMode + '|' + page }
  function setState (op, lv, page) {
    var k = setKey(op, lv, page)
    if (!DB.sets[k]) DB.sets[k] = { nonce: 0, answers: {}, solved: {} }
    return DB.sets[k]
  }
  function seedFor (op, lv, page, nonce) {
    return 'ayo|' + op + '|' + lv + '|d' + digitsMode + '|p' + page + '|n' + (nonce || 0)
  }

  // ── current page ─────────────────────────────────────────────────────────
  var op = DB.op, level = DB.level, page = Math.min(PAGES, Math.max(1, DB.page || 1))
  var digitsMode = DB.digits || 0        // 0 = bebas (the difficulty's own range)
  var session = null

  function buildPage () {
    var st = setState(op, level, page)
    var cfg = {
      operation: op, difficulty: level, questionCount: PER_PAGE, mode: 'worksheet',
      seed: seedFor(op, level, page, st.nonce)
    }
    if (digitsMode) cfg.digits = digitsMode
    session = B.buildSession(cfg)
    DB.op = op; DB.level = level; DB.page = page; DB.digits = digitsMode
    save()
    render()
  }

  function opInfo () { for (var i = 0; i < OPS.length; i++) if (OPS[i].key === op) return OPS[i]; return OPS[0] }

  // ── rendering ────────────────────────────────────────────────────────────
  function sumBlock (q, boxes) {
    var rows = q.operands.map(String)
    // The answer can be longer than either operand (825 + 777 = 1602), and the
    // boxes share this grid, so the track count is the WIDEST of the three.
    var width = Math.max.apply(null, rows.map(function (r) { return r.length })
      .concat([String(Math.abs(q.expected)).length]))
    var el = document.createElement('div')
    el.className = 'sum'
    el.style.gridTemplateColumns = 'auto repeat(' + width + ', var(--col))'
    el.setAttribute('role', 'img')
    el.setAttribute('aria-label', rows.join(' ' + OPSYM[q.operation] + ' ') + ' sama dengan berapa')
    rows.forEach(function (r, i) {
      var o = document.createElement('span')
      o.className = 'op'
      o.textContent = (i === rows.length - 1) ? OPSYM[q.operation] : ''
      el.appendChild(o)
      for (var k = 0; k < width - r.length; k++) { var pad = document.createElement('span'); pad.className = 'd'; el.appendChild(pad) }
      r.split('').forEach(function (ch) { var d = document.createElement('span'); d.className = 'd'; d.textContent = ch; el.appendChild(d) })
    })
    var rule = document.createElement('span'); rule.className = 'rule'; el.appendChild(rule)
    if (boxes) {
      // the answer row: an empty operator cell, then blanks, then the boxes --
      // each one landing on its own place-value column
      var spacer = document.createElement('span'); spacer.className = 'op'; el.appendChild(spacer)
      var ansLen = boxes.childElementCount
      for (var k = 0; k < width - ansLen; k++) { var pad2 = document.createElement('span'); pad2.className = 'd'; el.appendChild(pad2) }
      el.appendChild(boxes)        // .boxes is display:contents, so the inputs ARE grid items
    }
    return el
  }

  function render () {
    var st = setState(op, level, page)
    var sheet = $('sheet')
    sheet.innerHTML = ''
    // restart the entrance animation for this page's cards
    sheet.classList.remove('enter'); void sheet.offsetWidth
    if (!reduced()) sheet.classList.add('enter')
    session.questions.forEach(function (q, i) {
      var card = document.createElement('div')
      card.className = 'q'
      card.id = 'q' + i
      card.style.setProperty('--i', String(i))   // staggers the entrance

      var no = document.createElement('span')
      no.className = 'no'
      no.style.background = BADGE_COLORS[i % BADGE_COLORS.length]
      no.textContent = String(i + 1)
      card.appendChild(no)

      var tick = document.createElement('span')
      tick.className = 'tick'; tick.textContent = '✓'
      tick.setAttribute('aria-hidden', 'true')
      card.appendChild(tick)

      var state = document.createElement('span')
      state.className = 'sr'; state.id = 'st' + i
      card.appendChild(state)

      var cells = String(Math.abs(q.expected)).length
      var boxes = document.createElement('div')
      boxes.className = 'boxes'
      for (var c = 0; c < cells; c++) {
        var inp = document.createElement('input')
        inp.type = 'text'; inp.inputMode = 'numeric'; inp.maxLength = 1
        inp.placeholder = ' '            // lets :not(:placeholder-shown) style a filled box
        inp.dataset.q = String(i); inp.dataset.c = String(c)
        inp.setAttribute('aria-label', 'Soal ' + (i + 1) + ', angka ke-' + (c + 1))
        inp.addEventListener('input', onInput)
        inp.addEventListener('keydown', onKey)
        boxes.appendChild(inp)
      }

      if (q.operation === 'word') {
        var p = document.createElement('p'); p.className = 'story'; p.textContent = q.prompt
        card.appendChild(p)
        var wrapWord = document.createElement('div')
        wrapWord.className = 'sum'
        wrapWord.style.gridTemplateColumns = 'repeat(' + cells + ', var(--col))'
        wrapWord.appendChild(boxes)
        card.appendChild(wrapWord)
      } else {
        var lab = document.createElement('div')
        lab.className = 'label'
        lab.textContent = q.operands.join(' ' + OPSYM[q.operation] + ' ')
        card.appendChild(lab)
        card.appendChild(sumBlock(q, boxes))   // boxes live INSIDE the place-value grid
      }
      sheet.appendChild(card)

      var saved = st.answers[q.id]
      if (saved) {
        var ins = card.querySelectorAll('.boxes input')
        saved.split('').forEach(function (ch, k) { if (ins[k]) ins[k].value = ch })
        mark(i, B.grade(q, saved).correct, saved.length === ins.length)
      }
    })
    // The reference's sentence, with the digit mode named when one is chosen --
    // otherwise the panel would promise "1000 soal penjumlahan" while quietly
    // serving a narrower set.
    $('lede').textContent = TOTAL + ' soal ' + opInfo().word +
      (digitsMode ? ' ' + digitsMode + ' digit' : '') + ' — ' + PER_PAGE +
      ' soal per halaman, ' + PAGES + ' halaman. Jawaban tersimpan saat pindah halaman.'
    $('pg-input').value = String(page)
    $('pg-prev').disabled = page <= 1
    $('pg-next').disabled = page >= PAGES
    $('print-head').textContent = 'Ayo Berhitung! — ' + opInfo().label + ' · ' + levelLabel() +
      ' · halaman ' + page + ' dari ' + PAGES
    renderSegments()
    updateMeter()
  }

  function levelLabel () { for (var i = 0; i < LEVELS.length; i++) if (LEVELS[i].key === level) return LEVELS[i].label; return '' }

  var DIGITS = [
    { key: 0, label: 'Bebas' }, { key: 1, label: '1' }, { key: 2, label: '2' }, { key: 3, label: '3' }
  ]
  function renderSegments () {
    seg($('seg-op'), OPS, op, function (v) { if (v !== op) { op = v; turn(buildPage) } })
    seg($('seg-lv'), LEVELS, level, function (v) { if (v !== level) { level = v; turn(buildPage) } })
    seg($('seg-dg'), DIGITS, digitsMode, function (v) { if (v !== digitsMode) { digitsMode = v; turn(buildPage) } })
  }
  function seg (host, items, current, onPick) {
    // Rebuild only when the options themselves change. Rebuilding on every
    // render would restart the indicator's transition from nothing, and the
    // slide -- the whole point -- would never be seen.
    if (host.dataset.built !== String(items.length)) {
      host.innerHTML = ''
      var ind = document.createElement('span')
      ind.className = 'ind'
      host.appendChild(ind)
      items.forEach(function (it) {
        var b = document.createElement('button')
        b.type = 'button'
        b.textContent = it.label
        b.dataset.value = String(it.key)
        b.addEventListener('click', function () { onPick(it.key) })
        host.appendChild(b)
      })
      host.dataset.built = String(items.length)
    }
    var buttons = host.querySelectorAll('button')
    var active = null
    for (var i = 0; i < buttons.length; i++) {
      var on = buttons[i].dataset.value === String(current)
      buttons[i].setAttribute('aria-pressed', String(on))
      if (on) active = buttons[i]
    }
    moveIndicator(host, active)
  }

  function moveIndicator (host, active) {
    var ind = host.querySelector('.ind')
    if (!ind || !active) return
    // measured from layout, so it lands exactly on the pill at any font size
    var place = function () {
      ind.style.width = active.offsetWidth + 'px'
      ind.style.transform = 'translateX(' + active.offsetLeft + 'px)'
      ind.style.opacity = '1'
    }
    if (ind.style.opacity !== '1') {
      // first placement must not animate in from x=0
      var prev = ind.style.transition
      ind.style.transition = 'none'
      place()
      void ind.offsetWidth
      ind.style.transition = prev
    } else place()
  }

  function mark (i, correct, complete) {
    var card = $('q' + i), st = $('st' + i), tick = card && card.querySelector('.tick')
    if (!card) return
    var wrong = complete === true && correct === false
    card.classList.toggle('ok', correct === true)
    card.classList.toggle('no-yet', wrong)
    // The visible signal is the corner disc and the glyph inside it -- a tick or
    // a cross -- so the state never rests on colour alone. The words go to the
    // screen reader, which is also why they are not painted over the disc.
    if (tick) tick.textContent = correct === true ? '✓' : wrong ? '✕' : ''
    st.textContent = correct === true ? 'Soal ' + (i + 1) + ' benar'
      : wrong ? 'Soal ' + (i + 1) + ' belum benar' : ''
    // The shake belongs to the boxes, not the card: a card that jumps takes the
    // question with it, and the child is reading the question.
    if (wrong && !card.classList.contains('shake')) {
      card.classList.add('shake')
      setTimeout(function () { card.classList.remove('shake') }, 240)
      // put the caret back on the first digit: a wrong answer is retyped from
      // the left, and making the child reach for it is friction, not feedback
      var first = card.querySelector('.boxes input')
      if (first && document.activeElement && document.activeElement.closest('.q') === card) {
        setTimeout(function () { first.focus({ preventScroll: true }); first.select && first.select() }, 220)
      }
    }
    if (correct === true && !card.dataset.celebrated) {
      card.dataset.celebrated = '1'
      if (!reduced()) {
        card.classList.add('just')
        setTimeout(function () { card.classList.remove('just') }, 600)
      }
    }
    if (correct !== true) delete card.dataset.celebrated
  }

  function onInput (e) {
    var el = e.target
    el.value = el.value.replace(/[^0-9]/g, '').slice(-1)
    var i = +el.dataset.q
    if (el.value && !reduced()) {
      el.classList.remove('ink'); void el.offsetWidth; el.classList.add('ink')
      setTimeout(function () { el.classList.remove('ink') }, 180)
    }
    var nextBox = el.parentNode.children[+el.dataset.c + 1]
    if (el.value && nextBox) nextBox.focus()
    commit(i)
  }
  function onKey (e) {
    var el = e.target, i = +el.dataset.q, c = +el.dataset.c
    if (e.key === 'Backspace' && !el.value) {
      var prev = el.parentNode.children[c - 1]
      if (prev) { prev.focus(); e.preventDefault() }
    } else if (e.key === 'ArrowLeft') {
      var l = el.parentNode.children[c - 1]; if (l) { l.focus(); e.preventDefault() }
    } else if (e.key === 'ArrowRight') {
      var r = el.parentNode.children[c + 1]; if (r) { r.focus(); e.preventDefault() }
    } else if (e.key === 'Enter') {
      var nc = $('q' + (i + 1))
      var first = nc && nc.querySelector('.boxes input')
      if (first) { first.focus(); e.preventDefault() }
    }
  }

  function commit (i) {
    var q = session.questions[i]
    var st = setState(op, level, page)
    var ins = document.querySelectorAll('#q' + i + ' .boxes input')
    var text = ''
    for (var k = 0; k < ins.length; k++) text += ins[k].value.trim()
    st.answers[q.id] = text
    var complete = text.length === ins.length
    var correct = complete && B.grade(q, text).correct
    var newlySolved = false
    if (correct) {
      if (!st.solved[q.id]) { st.solved[q.id] = true; DB.xp += 10; newlySolved = true; chime() }
    } else if (st.solved[q.id]) {
      delete st.solved[q.id]                       // an edited-away answer stops counting
    }
    mark(i, correct, complete)
    save()                                          // saved on every keystroke, not just page turns
    updateMeter()
    if (newlySolved) {
      bumpStar()
      focusNextUnsolved(i)
      if (Object.keys(st.solved).length >= PER_PAGE) pageComplete()
    }
  }

  // After a card is finished the caret should already be where the child is
  // going next. It moves only on a NEW solve, so correcting an old answer never
  // yanks the caret away mid-thought.
  function focusNextUnsolved (from) {
    for (var step = 1; step <= session.questions.length; step++) {
      var i = (from + step) % session.questions.length
      var card = $('q' + i)
      if (!card || card.classList.contains('ok')) continue
      var box = card.querySelector('.boxes input')
      if (box) { box.focus({ preventScroll: true }) }
      return
    }
  }

  function bumpStar () {
    var el = document.querySelector('.star'), rail = document.querySelector('.rail')
    if (reduced()) return
    if (el) { el.classList.add('bump'); setTimeout(function () { el.classList.remove('bump') }, 320) }
    if (rail) { rail.classList.remove('shine'); void rail.offsetWidth; rail.classList.add('shine')
      setTimeout(function () { rail.classList.remove('shine') }, 720) }
  }

  var toastT = null
  function toast (msg) {
    var t = $('toast')
    t.textContent = msg
    t.classList.add('show')
    clearTimeout(toastT)
    toastT = setTimeout(function () { t.classList.remove('show') }, 2200)
  }

  function pageComplete () {
    toast('Halaman ' + page + ' selesai! 🎉')
    fanfare()
  }

  // ── progress across the whole 1000 ───────────────────────────────────────
  function solvedCount () {
    var n = 0
    for (var p = 1; p <= PAGES; p++) {
      var k = setKey(op, level, p)
      var s = DB.sets[k]
      if (s) n += Object.keys(s.solved).length
    }
    return n
  }
  var shownCount = null, countTimer = null
  function updateMeter () {
    var n = solvedCount()
    $('total').textContent = String(TOTAL)
    // the rail is a plain width transition; the number is interpolated so it
    // reads as counting rather than snapping
    $('rail-fill').style.width = (n === 0 ? 0 : Math.max(0.6, n / TOTAL * 100)) + '%'
    if (shownCount === null || reduced()) { shownCount = n; $('solved').textContent = String(n); return }
    if (n === shownCount) return
    clearInterval(countTimer)
    var from = shownCount, t0 = performance.now(), dur = 280
    countTimer = setInterval(function () {
      var k = Math.min(1, (performance.now() - t0) / dur)
      var v = Math.round(from + (n - from) * (1 - Math.pow(1 - k, 3)))
      $('solved').textContent = String(v)
      if (k >= 1) { clearInterval(countTimer); shownCount = n }
    }, 16)
  }
  function reduced () {
    try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) } catch (_) { return false }
  }
  // Fade the sheet out, swap it, fade it back: a page turn that reads as a turn.
  // dir: -1 = going back, +1 = going forward, 0 = swap in place
  function turn (fn, dir) {
    var sheet = $('sheet')
    if (reduced()) { fn(); return }
    var out = dir === -1 ? 'out-right' : dir === 1 ? 'out-left' : 'out-left'
    sheet.classList.add(out)
    setTimeout(function () {
      fn()
      sheet.classList.remove(out)
    }, 170)
  }

  // ── actions ──────────────────────────────────────────────────────────────
  function newQuestions () {
    var st = setState(op, level, page)
    st.nonce = (st.nonce || 0) + 1        // a NEW page, still reproducible from its seed
    st.answers = {}; st.solved = {}
    save(); turn(buildPage)
    announce('Soal baru untuk halaman ' + page)
  }
  function repeatPage () {
    var st = setState(op, level, page)
    st.answers = {}; st.solved = {}       // same seed, blank sheet
    save(); turn(buildPage)
    announce('Halaman ' + page + ' diulang dengan soal yang sama')
  }
  function findWrong () {
    for (var i = 0; i < session.questions.length; i++) {
      var card = $('q' + i)
      if (!card.classList.contains('ok')) {
        var box = card.querySelector('.boxes input')
        card.scrollIntoView({ block: 'center', behavior: reduced() ? 'auto' : 'smooth' })
        box.focus({ preventScroll: true })
        card.classList.remove('hunt'); void card.offsetWidth; card.classList.add('hunt')
        setTimeout(function () { card.classList.remove('hunt') }, 760)
        announce('Soal ' + (i + 1) + ' belum benar')
        return
      }
    }
    announce('Semua soal di halaman ini sudah benar')
  }
  function buildKey (pages) {
    var host = $('answer-key')
    host.innerHTML = '<h2>Kunci jawaban</h2>'
    pages.forEach(function (p) {
      var st = setState(op, level, p)
      var s = B.buildSession({ operation: op, difficulty: level, questionCount: PER_PAGE, mode: 'worksheet',
                               seed: seedFor(op, level, p, st.nonce) })
      var h = document.createElement('h3'); h.textContent = 'Halaman ' + p
      var ol = document.createElement('ol')
      s.questions.forEach(function (q) {
        var li = document.createElement('li')
        li.textContent = (q.operation === 'word' ? q.prompt : q.operands.join(' ' + OPSYM[q.operation] + ' ')) + ' = ' + q.expected
        ol.appendChild(li)
      })
      host.appendChild(h); host.appendChild(ol)
    })
  }
  function printPage () { buildKey([page]); window.print() }
  function printRange () {
    var raw = window.prompt('Cetak halaman berapa sampai berapa? Contoh: 1-5', page + '-' + Math.min(PAGES, page + 4))
    if (!raw) return
    var m = String(raw).match(/^\s*(\d+)\s*-\s*(\d+)\s*$/)
    if (!m) { alert('Tulis seperti 1-5 ya.'); return }
    var a = Math.max(1, Math.min(PAGES, +m[1])), b = Math.max(1, Math.min(PAGES, +m[2]))
    if (b < a) { var t = a; a = b; b = t }
    if (b - a > 19) { alert('Maksimal 20 halaman sekali cetak.'); return }
    // render every page in the range into the sheet, print, then restore
    var sheet = $('sheet')
    var keep = sheet.innerHTML, keepPage = page
    var html = ''
    for (var p = a; p <= b; p++) { page = p; buildPage(); html += sheet.innerHTML }
    sheet.innerHTML = html
    buildKey(rangeArr(a, b))
    $('print-head').textContent = 'Ayo Berhitung! — ' + opInfo().label + ' · ' + levelLabel() + ' · halaman ' + a + '–' + b
    window.print()
    page = keepPage; buildPage(); sheet.innerHTML = sheet.innerHTML || keep
  }
  function rangeArr (a, b) { var out = []; for (var i = a; i <= b; i++) out.push(i); return out }

  // ── badges ───────────────────────────────────────────────────────────────
  var BADGES = [
    { id: 'first', icon: '⭐', name: 'Soal pertama', test: function (n) { return n >= 1 } },
    { id: 'ten', icon: '🔟', name: '10 soal benar', test: function (n) { return n >= 10 } },
    { id: 'page', icon: '📄', name: 'Satu halaman penuh', test: function (n, full) { return full >= 1 } },
    { id: 'fifty', icon: '🏅', name: '50 soal benar', test: function (n) { return n >= 50 } },
    { id: 'hundred', icon: '🏆', name: '100 soal benar', test: function (n) { return n >= 100 } },
    { id: 'fivepages', icon: '📚', name: '5 halaman penuh', test: function (n, full) { return full >= 5 } }
  ]
  function fullPages () {
    var f = 0
    for (var p = 1; p <= PAGES; p++) {
      var s = DB.sets[setKey(op, level, p)]
      if (s && Object.keys(s.solved).length >= PER_PAGE) f++
    }
    return f
  }
  function openBadges () {
    var n = solvedCount(), f = fullPages()
    var host = $('badge-grid')
    host.innerHTML = ''
    BADGES.forEach(function (b, idx) {
      var on = b.test(n, f)
      var el = document.createElement('div')
      el.className = 'bdg' + (on ? ' on' : '')
      el.style.animationDelay = (reduced() ? 0 : idx * 70) + 'ms'   // reveal, not a wall
      el.innerHTML = '<b>' + b.icon + '</b>' + b.name + (on ? '' : ' — belum')
      host.appendChild(el)
    })
    $('modal-badges').setAttribute('open', '')
    $('btn-badges-close').focus()
  }

  // ── sound ────────────────────────────────────────────────────────────────
  var actx = null
  function chime () {
    if (!DB.prefs.sound) return
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)()
      var o = actx.createOscillator(), g = actx.createGain()
      o.connect(g); g.connect(actx.destination)
      o.type = 'sine'; o.frequency.value = 880
      g.gain.setValueAtTime(0.0001, actx.currentTime)
      g.gain.exponentialRampToValueAtTime(0.08, actx.currentTime + 0.02)
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.18)
      o.start(); o.stop(actx.currentTime + 0.2)
    } catch (_) {}
  }

  function fanfare () {
    if (!DB.prefs.sound) return
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)()
      ;[0, 0.12, 0.24].forEach(function (t, i) {
        var o = actx.createOscillator(), g = actx.createGain()
        o.connect(g); g.connect(actx.destination)
        o.type = 'sine'; o.frequency.value = [660, 880, 1175][i]
        g.gain.setValueAtTime(0.0001, actx.currentTime + t)
        g.gain.exponentialRampToValueAtTime(0.07, actx.currentTime + t + 0.02)
        g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + t + 0.16)
        o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.18)
      })
    } catch (_) {}
  }

  function announce (msg) { $('live').textContent = msg }

  // ── wiring ───────────────────────────────────────────────────────────────
  $('btn-new').addEventListener('click', newQuestions)
  $('btn-repeat').addEventListener('click', repeatPage)
  $('btn-find').addEventListener('click', findWrong)
  $('btn-print-page').addEventListener('click', printPage)
  $('btn-print-range').addEventListener('click', printRange)
  $('btn-badges').addEventListener('click', openBadges)
  $('btn-badges-close').addEventListener('click', function () { $('modal-badges').removeAttribute('open'); $('btn-badges').focus() })
  $('modal-badges').addEventListener('click', function (e) { if (e.target === this) this.removeAttribute('open') })
  $('btn-sound').addEventListener('click', function () {
    DB.prefs.sound = !DB.prefs.sound; save()
    this.setAttribute('aria-pressed', String(DB.prefs.sound))
    this.textContent = DB.prefs.sound ? '🔊' : '🔇'
  })
  $('pg-prev').addEventListener('click', function () { if (page > 1) { page--; turn(buildPage, -1); window.scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' }) } })
  $('pg-next').addEventListener('click', function () { if (page < PAGES) { page++; turn(buildPage, 1); window.scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' }) } })
  $('pg-input').addEventListener('change', function () {
    var n = parseInt(this.value, 10)
    if (!(n >= 1 && n <= PAGES)) { this.value = String(page); return }
    var dir = n > page ? 1 : -1
    page = n; turn(buildPage, dir); window.scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' })
  })
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('modal-badges').hasAttribute('open')) $('modal-badges').removeAttribute('open')
  })
  window.addEventListener('resize', function () { renderSegments() })
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { renderSegments() })
  window.addEventListener('pagehide', save)
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') save() })

  if (reduced()) document.body.dataset.motion = 'off'
  $('btn-sound').textContent = DB.prefs.sound ? '🔊' : '🔇'
  $('btn-sound').setAttribute('aria-pressed', String(DB.prefs.sound))
  $('pg-total').textContent = String(PAGES)

  // a small surface for the headless gate; no game logic lives here
  window.__berhitung = {
    get db () { return DB }, get session () { return session },
    get page () { return page }, get op () { return op }, get level () { return level },
    goPage: function (n) { page = n; buildPage() },
    get digits () { return digitsMode },
    setDigits: function (v) { digitsMode = v; buildPage() },
    setOp: function (v) { op = v; buildPage() },
    setLevel: function (v) { level = v; buildPage() },
    solvedCount: solvedCount, newQuestions: newQuestions, repeatPage: repeatPage
  }

  buildPage()
})()
</script>
