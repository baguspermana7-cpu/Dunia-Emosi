/* End modal */

<script>
'use strict'
/* =============================================================================
 * g14-side.html  (v54.88 foundation)
 * =============================================================================
 * Side-scrolling cartoon train racing — replaces top-down 3-lane G14 for the
 * "side-race (beta)" experience per owner reference image 2 ("Train Racing").
 *
 * Architecture:
 *   - Pixi fullscreen canvas
 *   - Upper 65%: parallax background via shared TrainBG engine (sky + landscape)
 *   - Lower 35%: rail + sleepers + train + obstacles
 *   - Train sprite: side-on profile from `spriteUrl` (Thomas, Casey, etc.)
 *   - JUMP mechanic: train arcs up + over an obstacle
 *   - Distance-based finish at 1000m
 *
 * Owner-mandate (v54.88+): ensure no bug, no error. Premium side-on feel.
 * Shares modules with g14.html — single source of truth for trains-db + obstacles.
 * ========================================================================== */

const W = window.innerWidth
const H = window.innerHeight

const app = new PIXI.Application()
let stage = null
let bgContainer = null
let railContainer = null
let trainContainer = null
let trainSprite = null
let obstacleLayer = null
let particleLayer = null

// Game state
const S = {
  running: false,
  paused: false,
  gameOver: false,
  distance: 0,
  targetDistance: 1000,
  speed: 4.0,            // px per tick at 60fps
  baseSpeed: 4.0,
  jumping: false,
  jumpY: 0,
  jumpVel: 0,
  jumpStartedAt: 0,
  hp: 3,
  maxHp: 3,
  invincible: 0,
  coins: 0,
  trainCfg: null,
  obstacles: [],
  spawnTimer: 0,
  nextSpawnAt: 4.0,      // seconds
  frame: 0,
  finished: false,
  // v54.89 — animated scene
  clouds: [],            // {x, y, scale, speed}
  birds: [],             // {x, y, vy, frame}
  smokePuffs: [],        // {x, y, alpha, scale, drift}
  smokeTimer: 0,
  nextBirdAt: 8,
  timeOfDay: 'pagi',     // 'pagi'|'siang'|'sore' — set at init
  milestones: [200, 400, 600, 800],
  milestonesPassed: 0,
  // v54.90 — race + pickups
  aiTrain: null,         // PIXI.Container — behind player ghost
  aiDistanceOffset: 30,  // AI lags player by this many metres (varies during race)
  aiPhase: 0,            // for AI speed wobble
  coins: [],             // {sprite, y, scored}
  coinScore: 0,
  nextCoinAt: 2.5,
  coinTimer: 0,
  // v54.92 — power-ups + finish
  hearts: [],            // {sprite, scored}
  nextHeartAt: 18,
  heartTimer: 0,
  finishFlagSpawned: false,
}

// Layout
const SKY_FRAC = 0.65            // upper 65% = sky/landscape
const RAIL_Y_FRAC = 0.78         // rail surface at 78% of screen
const PLAYER_X_FRAC = 0.25       // player at 25% from left
const GROUND_FILL_COLOR = 0x2e7d32 // grass green

// Physics
const GRAVITY = 1500              // px/s²
const JUMP_VELOCITY = 720         // initial upward velocity

// ── INIT ────────────────────────────────────────────────────────────────────
;(async () => {
  await app.init({
    canvas: document.getElementById('pixi-canvas'),
    width: W,
    height: H,
    backgroundAlpha: 1,
    backgroundColor: 0xbfdbfe,    // sky default
    antialias: false,
    resolution: window.devicePixelRatio || 1,
    autoDensity: true,
  })
  stage = app.stage
  S.trainCfg = pickTrain()
  document.getElementById('train-name').textContent = (S.trainCfg && S.trainCfg.name) || 'Kereta'
  S.timeOfDay = pickTimeOfDay() // v54.89 — random pagi/siang/sore per race
  buildLayers()
  buildBackground()
  buildClouds()  // v54.89
  buildRail()
  buildTrain()
  buildAITrain() // v54.90
  setupInput()
  runCountdown(() => {
    S.running = true
    S.frame = 0
    // v54.91 — Wire ObstacleEngine + schedule first puzzle
    try { g14sWireObstacleEngine() } catch(e) { console.warn('OE wire fail', e) }
  })

  // Start ticker
  app.ticker.add((tickerOrDelta) => tick(tickerOrDelta))

  // Resize
  window.addEventListener('resize', onResize)
})()

// v54.89 — pick a random time-of-day per race for variety
function pickTimeOfDay() {
  const r = Math.random()
  if (r < 0.45) return 'pagi'   // 45% morning (bright)
  if (r < 0.80) return 'siang'  // 35% noon (vivid)
  return 'sore'                 // 20% afternoon (warm)
}

const TIME_PALETTES = {
  pagi:  { skyTop: [135,206,235], skyBot: [200,234,250], ground: 0x2e7d32, hillNear: 0x66bb6a, hillFar: 0x90a4ae, sunColor: 0xfff7c0, sunGlow: 0xfde047 },
  siang: { skyTop: [110,190,235], skyBot: [185,225,250], ground: 0x388e3c, hillNear: 0x4caf50, hillFar: 0x9ba8b3, sunColor: 0xfff9c4, sunGlow: 0xfff176 },
  sore:  { skyTop: [255,170,110], skyBot: [255,213,168], ground: 0x5d4037, hillNear: 0x8d6e63, hillFar: 0xa1887f, sunColor: 0xffab40, sunGlow: 0xff7043 },
}

function pickTrain() {
  const key = sessionStorage.getItem('g14-side-train') || 'aeg_thomas'
  if (!window.TRAIN_CATS) return null
  for (const cat of window.TRAIN_CATS) {
    for (const t of (cat.trains || [])) {
      if (t.key === key) return { ...t, category: cat.key }
    }
  }
  // Fallback to first character train
  for (const cat of window.TRAIN_CATS) {
    for (const t of (cat.trains || [])) {
      if (t.isCharacter && t.spriteUrl) return { ...t, category: cat.key }
    }
  }
  return null
}

function buildLayers() {
  bgContainer = new PIXI.Container()
  railContainer = new PIXI.Container()
  trainContainer = new PIXI.Container()
  obstacleLayer = new PIXI.Container()
  particleLayer = new PIXI.Container()
  stage.addChild(bgContainer)
  stage.addChild(railContainer)
  stage.addChild(trainContainer)
  stage.addChild(obstacleLayer)
  stage.addChild(particleLayer)
}

function buildBackground() {
  const pal = TIME_PALETTES[S.timeOfDay] || TIME_PALETTES.pagi
  const skyH = H * SKY_FRAC + 20

  // Sky gradient (top 65% of screen) — uses time-of-day palette
  const sky = new PIXI.Graphics()
  for (let i = 0; i < 16; i++) {
    const t = i / 15
    const r = Math.round(pal.skyTop[0] + (pal.skyBot[0] - pal.skyTop[0]) * t)
    const g = Math.round(pal.skyTop[1] + (pal.skyBot[1] - pal.skyTop[1]) * t)
    const b = Math.round(pal.skyTop[2] + (pal.skyBot[2] - pal.skyTop[2]) * t)
    sky.rect(0, (skyH * i / 16), W, skyH / 16 + 1).fill((r << 16) | (g << 8) | b)
  }
  // Sun (position varies per time-of-day)
  const sunX = S.timeOfDay === 'sore' ? W * 0.65 : (S.timeOfDay === 'siang' ? W * 0.55 : W * 0.82)
  const sunY = S.timeOfDay === 'sore' ? skyH * 0.45 : skyH * 0.22
  sky.circle(sunX, sunY, 50).fill(pal.sunGlow).stroke({ color: pal.sunGlow, width: 6, alpha: 0.5 })
  sky.circle(sunX, sunY, 36).fill(pal.sunColor)
  bgContainer.addChild(sky)
  bgContainer._sky = sky

  // Distant mountains (static, parallax 0×)
  const mtn = new PIXI.Graphics()
  const peaks = [
    [0.05, 0.50, 0.18], [0.18, 0.62, 0.22], [0.35, 0.48, 0.20],
    [0.55, 0.58, 0.24], [0.72, 0.50, 0.20], [0.90, 0.60, 0.22],
  ]
  peaks.forEach(([x, peakY, w]) => {
    const cx = W * x
    const py = skyH * peakY
    const halfW = W * w
    mtn.poly([cx - halfW, skyH * 0.85, cx, py, cx + halfW, skyH * 0.85]).fill(pal.hillFar)
  })
  bgContainer.addChild(mtn)

  // Mid-ground hills + trees (parallax via container x offset)
  const hills = new PIXI.Container()
  const hillG = new PIXI.Graphics()
  // 8 hill shapes spread 1.5× screen width for seamless loop
  for (let i = 0; i < 8; i++) {
    const cx = W * (0.1 + i * 0.20)
    const cy = skyH * 0.78
    const rx = W * 0.18
    const ry = skyH * 0.14
    hillG.ellipse(cx, cy, rx, ry).fill(pal.hillNear)
  }
  // Distant trees
  for (let i = 0; i < 16; i++) {
    const tx = (i + 0.5) * (W / 12) + (Math.sin(i * 17) * 30)
    const ty = skyH * 0.84
    hillG.rect(tx - 2, ty, 4, 12).fill(0x6d4c41)
    hillG.circle(tx, ty - 2, 9).fill(S.timeOfDay === 'sore' ? 0x6d4c41 : 0x388e3c)
  }
  hills.addChild(hillG)
  bgContainer.addChild(hills)
  bgContainer._hills = hills

  // NPCs (waving villagers near fence — visible at random X)
  const npcLayer = new PIXI.Container()
  const NPC_SPOTS = [0.15, 0.42, 0.68, 0.88]
  NPC_SPOTS.forEach((xFrac, i) => {
    const npc = new PIXI.Container()
    npc.x = W * xFrac + Math.random() * 60
    npc.y = H * RAIL_Y_FRAC - 38
    const g = new PIXI.Graphics()
    // Body
    g.circle(0, -16, 6).fill(0xffe082) // head
    g.rect(-5, -10, 10, 14).fill(0xff7043) // body
    g.rect(-5, 2, 4, 8).fill(0x424242)  // leg L
    g.rect(1, 2, 4, 8).fill(0x424242)   // leg R
    npc.addChild(g)
    // Wave hand (Pixi text)
    const hand = new PIXI.Text({ text: '👋', style: { fontSize: 14 } })
    hand.anchor.set(0.5, 0.5)
    hand.x = -10; hand.y = -8
    npc.addChild(hand)
    npc._hand = hand
    npc._wavePhase = Math.random() * Math.PI * 2
    npc._baseX = npc.x
    npcLayer.addChild(npc)
  })
  bgContainer.addChild(npcLayer)
  bgContainer._npcs = npcLayer

  // Close fence (parallax 1.0×)
  const fence = new PIXI.Graphics()
  const fenceY = H * RAIL_Y_FRAC - 30
  fence.rect(0, fenceY, W, 5).fill(0x8d6e63)
  for (let i = 0; i < Math.ceil(W / 50) + 1; i++) {
    const fx = i * 50
    fence.rect(fx, fenceY - 18, 4, 22).fill(0x6d4c41)
  }
  bgContainer.addChild(fence)
  bgContainer._fence = fence
  bgContainer._fenceY = fenceY

  // Grass ground
  const ground = new PIXI.Graphics()
  ground.rect(0, H * SKY_FRAC, W, H - H * SKY_FRAC).fill(pal.ground)
  ground.rect(0, H * SKY_FRAC, W, 4).fill(0x4caf50)
  bgContainer.addChildAt(ground, 0)
}

// v54.89 — clouds drift across sky
function buildClouds() {
  const skyH = H * SKY_FRAC + 20
  const cloudLayer = new PIXI.Container()
  for (let i = 0; i < 5; i++) {
    const c = new PIXI.Graphics()
    const cx = (i / 5) * W * 1.4 - 100
    const cy = skyH * (0.15 + Math.random() * 0.20)
    const scale = 0.7 + Math.random() * 0.5
    c.circle(0, 0, 18 * scale).fill(0xffffff)
    c.circle(-14 * scale, 4 * scale, 14 * scale).fill(0xffffff)
    c.circle(16 * scale, 4 * scale, 16 * scale).fill(0xffffff)
    c.circle(8 * scale, -10 * scale, 12 * scale).fill(0xfafafa)
    c.x = cx
    c.y = cy
    cloudLayer.addChild(c)
    S.clouds.push({ sprite: c, speed: 0.15 + Math.random() * 0.25 })
  }
  bgContainer.addChild(cloudLayer)
  bgContainer._cloudLayer = cloudLayer
}

function buildRail() {
  // Rail surface
  const rail = new PIXI.Graphics()
  const railY = H * RAIL_Y_FRAC
  // Ballast (gravel base)
  rail.rect(0, railY - 4, W, 28).fill(0x8d6e63)
  // Two parallel steel rails
  rail.rect(0, railY, W, 4).fill(0x424242)
  rail.rect(0, railY + 12, W, 4).fill(0x424242)
  // Sleepers
  for (let i = 0; i < Math.ceil(W / 40) + 2; i++) {
    rail.rect(i * 40 + (S.frame * 0.5) % 40, railY - 2, 18, 22).fill(0x4e342e)
  }
  railContainer.addChild(rail)
  railContainer._rail = rail
}

function buildTrain() {
  const cfg = S.trainCfg
  if (!cfg) return

  // Container — train always at fixed X, Y animates for jump
  trainContainer.x = W * PLAYER_X_FRAC
  trainContainer.y = H * RAIL_Y_FRAC - 4  // baseline at rail top

  if (cfg.isCharacter && cfg.spriteUrl) {
    trainSprite = PIXI.Sprite.from(cfg.spriteUrl)
    trainSprite.anchor.set(0.5, 1.0) // bottom-center
    const targetH = (cfg.spriteHeight || 90) * 1.5 // side view = bigger
    trainSprite.scale.set(0.5)
    const onLoad = () => {
      if (trainSprite.texture && trainSprite.texture.height > 1) {
        trainSprite.scale.set(targetH / trainSprite.texture.height)
      }
    }
    if (trainSprite.texture && trainSprite.texture.source && trainSprite.texture.source.loaded) onLoad()
    else if (trainSprite.texture && trainSprite.texture.source && typeof trainSprite.texture.source.addEventListener === 'function') {
      trainSprite.texture.source.addEventListener('load', onLoad)
    } else {
      let tries = 0
      const tk = () => { if (trainSprite.texture && trainSprite.texture.height > 1) { onLoad(); return } if (tries++ < 60) requestAnimationFrame(tk) }
      tk()
    }
  } else {
    // Procedural side-on locomotive (fallback for non-character trains)
    trainSprite = new PIXI.Graphics()
    drawProceduralSideLoco(trainSprite, cfg.bodyColor || '#1976d2', cfg.accColor || '#e53935')
  }
  trainContainer.addChild(trainSprite)
}

function drawProceduralSideLoco(g, bodyHex, accHex) {
  const body = parseHex(bodyHex)
  const acc = parseHex(accHex)
  // Side profile: chassis + cab + chimney + 3 wheels + smokebox
  g.rect(-50, -32, 100, 26).fill(body) // boiler
  g.rect(-40, -52, 30, 20).fill(body)  // cab
  g.rect(-30, -52, 14, 6).fill(0x1c1917) // cab roof
  g.rect(20, -42, 18, 10).fill(0x1c1917) // smokebox front
  g.rect(28, -56, 8, 14).fill(0x424242)  // chimney
  // Yellow trim stripe
  g.rect(-50, -16, 100, 3).fill(acc)
  // 3 wheels (large center, 2 small bogies)
  g.circle(-32, -2, 9).fill(0x1c1917)
  g.circle(-32, -2, 6).fill(acc)
  g.circle(0, -2, 12).fill(0x1c1917)
  g.circle(0, -2, 8).fill(acc)
  g.circle(28, -2, 9).fill(0x1c1917)
  g.circle(28, -2, 6).fill(acc)
}

function parseHex(s) {
  if (typeof s !== 'string') return 0x6b7280
  return parseInt(s.replace(/^#/, ''), 16) || 0x6b7280
}

// v54.90 — AI competitor train in background lane (slightly behind player)
function buildAITrain() {
  // Pick a different character train as opponent (random non-player AEG)
  const candidates = []
  if (window.TRAIN_CATS) {
    for (const cat of window.TRAIN_CATS) {
      for (const t of (cat.trains || [])) {
        if (t.isCharacter && t.spriteUrl && t.key !== (S.trainCfg && S.trainCfg.key)) {
          candidates.push({ ...t, category: cat.key })
        }
      }
    }
  }
  const aiCfg = candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : null
  if (!aiCfg) return

  S.aiTrain = new PIXI.Container()
  // Place AI in a "back lane" — visually behind/above the player rail
  S.aiTrain.x = W * 0.10 // start further left (visually behind)
  S.aiTrain.y = H * RAIL_Y_FRAC - 26 // slightly above player rail (behind in perspective)
  S.aiTrain.scale.set(0.65) // smaller (further away)
  S.aiTrain.alpha = 0.85

  if (aiCfg.spriteUrl) {
    const img = PIXI.Sprite.from(aiCfg.spriteUrl)
    img.anchor.set(0.5, 1.0)
    const targetH = (aiCfg.spriteHeight || 90) * 1.5
    img.scale.set(0.5)
    const onLoad = () => {
      if (img.texture && img.texture.height > 1) img.scale.set(targetH / img.texture.height)
    }
    if (img.texture && img.texture.source && img.texture.source.loaded) onLoad()
    else if (img.texture && img.texture.source && typeof img.texture.source.addEventListener === 'function') {
      img.texture.source.addEventListener('load', onLoad)
    } else {
      let tries = 0
      const tk = () => { if (img.texture && img.texture.height > 1) { onLoad(); return } if (tries++ < 60) requestAnimationFrame(tk) }
      tk()
    }
    S.aiTrain.addChild(img)
  }
  // Insert BEHIND obstacle layer but BEFORE player container layering
  stage.addChildAt(S.aiTrain, stage.getChildIndex(trainContainer))
}

// v54.91 — ObstacleEngine integration: pause race, show puzzle, resume on success
function g14sWireObstacleEngine() {
  if (!window.ObstacleEngine) return
  window.ObstacleEngine.attach({
    pauseTick: () => { S.running = false; S.paused = true },
    resumeTick: () => { if (!S.gameOver && !S.finished) { S.paused = false; S.running = true } },
    slowDown: () => {},
    resumeSpeed: () => {},
    cameraZoom: () => {},
    takeHP: (n) => {
      if (S.hp > 0) S.hp = Math.max(0, S.hp - n)
    },
    awardReward: (reward) => {
      if (!reward) return
      if (reward.coins) S.coinScore += reward.coins
    },
  })
  // Schedule first puzzle 40-55s into race; re-arm after each.
  function _scheduleNext() {
    const delayMs = 40000 + Math.random() * 15000
    setTimeout(() => {
      if (!S.running || S.gameOver || S.finished) return
      const id = _pickObstacleId()
      try {
        window.ObstacleEngine.spawn(id).then(() => _scheduleNext())
      } catch(e) {
        console.warn('[g14-side] OE.spawn failed', e)
        _scheduleNext()
      }
    }, delayMs)
  }
  function _pickObstacleId() {
    const OE = window.ObstacleEngine
    const registry = OE._registry || {}
    const allIds = Object.keys(registry)
    if (allIds.length === 0) return 'missing_rail_triangle'
    if (typeof OE.pickAdaptiveCandidates === 'function') {
      const pool = OE.pickAdaptiveCandidates()
      return pool[Math.floor(Math.random() * pool.length)]
    }
    return allIds[Math.floor(Math.random() * allIds.length)]
  }
  _scheduleNext()
}

function g14sJump() {
  if (!S.running || S.paused || S.gameOver) return
  if (S.jumping) return
  S.jumping = true
  S.jumpVel = -JUMP_VELOCITY
  S.jumpStartedAt = S.frame
  try { if (typeof playTone === 'function') playTone({ freq: 440, dur: 0.10, vol: 0.10 }) } catch {}
}

// ── TICK ────────────────────────────────────────────────────────────────────

function tick(tickerOrDelta) {
  if (!S.running || S.paused || S.gameOver) return
  S.frame++

  // Pixi 8 ticker: get deltaTime from ticker
  let deltaMS = 16.67
  if (tickerOrDelta && typeof tickerOrDelta === 'object' && tickerOrDelta.deltaMS) deltaMS = tickerOrDelta.deltaMS
  const dt = deltaMS / 1000

  // Scroll world
  const scrollDx = S.speed * (deltaMS / 16.67)
  S.distance += scrollDx * 0.4 // 0.4 m per scroll px (calibrate for 1000m goal)

  // Animate rail (re-draw sleepers offset by frame counter)
  if (railContainer._rail) {
    railContainer._rail.clear()
    const rail = railContainer._rail
    const railY = H * RAIL_Y_FRAC
    rail.rect(0, railY - 4, W, 28).fill(0x8d6e63)
    rail.rect(0, railY, W, 4).fill(0x424242)
    rail.rect(0, railY + 12, W, 4).fill(0x424242)
    for (let i = 0; i < Math.ceil(W / 40) + 2; i++) {
      const sx = i * 40 - (S.frame * scrollDx * 0.4) % 40
      rail.rect(sx, railY - 2, 18, 22).fill(0x4e342e)
    }
  }

  // v54.89 — Parallax background animation
  // Hills (slow scroll, 0.25× speed of train)
  if (bgContainer._hills) {
    bgContainer._hills.x -= scrollDx * 0.25
    if (bgContainer._hills.x < -W * 0.6) bgContainer._hills.x = 0
  }
  // Fence (1.0× speed)
  if (bgContainer._fence) {
    bgContainer._fence.x -= scrollDx
    if (bgContainer._fence.x < -50) bgContainer._fence.x = 0
  }
  // Clouds drift across sky
  S.clouds.forEach(c => {
    c.sprite.x -= scrollDx * c.speed * 0.4
    if (c.sprite.x < -100) c.sprite.x = W + 100
  })
  // NPCs wave + scroll out + recycle
  if (bgContainer._npcs) {
    const npcs = bgContainer._npcs
    npcs.x -= scrollDx
    if (npcs.x < -W * 0.5) {
      // Re-randomize NPC positions for variety
      npcs.x = 0
      npcs.children.forEach((npc, i) => {
        npc.x = (W * (0.15 + i * 0.25)) + Math.random() * 80
      })
    }
    npcs.children.forEach(npc => {
      if (!npc._hand) return
      npc._wavePhase += 0.2
      const wave = Math.sin(npc._wavePhase)
      npc._hand.rotation = wave * 0.4
      npc._hand.y = -8 - Math.abs(wave) * 3
    })
  }

  // v54.89 — Smoke trail behind train (steam locos only — smokePos populated)
  S.smokeTimer += dt
  if (S.smokeTimer >= 0.12 && S.trainCfg && S.trainCfg.smokePos) {
    S.smokeTimer = 0
    const puff = new PIXI.Graphics()
    puff.circle(0, 0, 6 + Math.random() * 4).fill(0xeeeeee)
    puff.x = trainContainer.x - 30
    puff.y = trainContainer.y - 70 + S.jumpY
    puff.alpha = 0.85
    particleLayer.addChild(puff)
    S.smokePuffs.push({ sprite: puff, vy: -8, vx: -1.2, life: 1.6 })
  }
  // Update smoke puffs
  for (let i = S.smokePuffs.length - 1; i >= 0; i--) {
    const p = S.smokePuffs[i]
    p.life -= dt
    p.sprite.x += p.vx
    p.sprite.y += p.vy * dt * 6
    p.sprite.scale.x = p.sprite.scale.y = 1 + (1.6 - p.life) * 0.5
    p.sprite.alpha = p.life / 1.6 * 0.85
    if (p.life <= 0) {
      particleLayer.removeChild(p.sprite)
      S.smokePuffs.splice(i, 1)
    }
  }

  // v54.89 — Bird flock fly-by every 8-14s
  S.nextBirdAt -= dt
  if (S.nextBirdAt <= 0) {
    S.nextBirdAt = 8 + Math.random() * 6
    spawnBirds()
  }
  for (let i = S.birds.length - 1; i >= 0; i--) {
    const b = S.birds[i]
    b.frame++
    b.sprite.x += b.vx
    b.sprite.y += Math.sin(b.frame * 0.1) * 0.5
    if (b.sprite.x < -50) {
      bgContainer.removeChild(b.sprite)
      S.birds.splice(i, 1)
    }
  }

  // v54.89 — Milestone signposts at 200/400/600/800
  if (S.milestonesPassed < S.milestones.length && S.distance >= S.milestones[S.milestonesPassed]) {
    spawnMilestone(S.milestonesPassed + 1)
    S.milestonesPassed++
  }

  // v54.90 — AI competitor wobble
  if (S.aiTrain) {
    S.aiPhase += 0.04
    // AI lags 20–60m behind player, wobbles ±20m every ~6s.
    S.aiDistanceOffset = 40 + Math.sin(S.aiPhase) * 18
    // Visual X: tracks player but offset by aiDistanceOffset / 5 px
    const targetX = W * 0.10 - Math.min(60, Math.max(-30, (S.aiDistanceOffset - 40) * 0.8))
    S.aiTrain.x += (targetX - S.aiTrain.x) * 0.04
    // Subtle bob
    S.aiTrain.y = H * RAIL_Y_FRAC - 26 + Math.sin(S.frame * 0.20) * 1.2
  }

  // v54.92 — Heart power-up spawn every 18-30s (rare HP restore)
  S.heartTimer += dt
  if (S.heartTimer >= S.nextHeartAt && !S.finished && S.hp < S.maxHp) {
    spawnHeart()
    S.heartTimer = 0
    S.nextHeartAt = 18 + Math.random() * 12
  }
  for (let i = S.hearts.length - 1; i >= 0; i--) {
    const hp = S.hearts[i]
    hp.sprite.x -= scrollDx
    hp.sprite.rotation = Math.sin(S.frame * 0.10 + i) * 0.15
    if (hp.sprite.x < -50) {
      particleLayer.removeChild(hp.sprite)
      S.hearts.splice(i, 1)
      continue
    }
    if (!hp.scored && Math.abs(hp.sprite.x - trainContainer.x) < 50) {
      const trainY = H * RAIL_Y_FRAC - 4 + S.jumpY - 35
      if (Math.abs(hp.sprite.y - trainY) < 40) {
        hp.scored = true
        if (S.hp < S.maxHp) S.hp++
        try { if (typeof playTone === 'function') { playTone({ freq: 880, dur: 0.10, vol: 0.10 }); setTimeout(() => playTone({ freq: 1320, dur: 0.14, vol: 0.10 }), 80) } } catch {}
        hp.sprite.alpha = 0.3
        setTimeout(() => { try { particleLayer.removeChild(hp.sprite); const idx = S.hearts.indexOf(hp); if (idx >= 0) S.hearts.splice(idx, 1) } catch {} }, 100)
      }
    }
  }

  // v54.92 — Finish flag at 980m (slightly before 1000m so it scrolls past as we win)
  if (S.distance >= 980 && !S.finishFlagSpawned && !S.finished) {
    S.finishFlagSpawned = true
    spawnFinishFlag()
  }

  // v54.90 — Coin pickups spawn every 2.5-5s at varying jump heights
  S.coinTimer += dt
  if (S.coinTimer >= S.nextCoinAt && !S.finished) {
    spawnCoin()
    S.coinTimer = 0
    S.nextCoinAt = 2.5 + Math.random() * 2.5
  }
  // Move + collect coins
  for (let i = S.coins.length - 1; i >= 0; i--) {
    const c = S.coins[i]
    c.sprite.x -= scrollDx
    c.sprite.rotation += 0.08 // spin
    if (c.sprite.x < -50) {
      particleLayer.removeChild(c.sprite)
      S.coins.splice(i, 1)
      continue
    }
    // Collection: within ~50px horizontally + within ~40px vertically of train center
    if (!c.scored && Math.abs(c.sprite.x - trainContainer.x) < 50) {
      const trainY = H * RAIL_Y_FRAC - 4 + S.jumpY - 35 // train sprite center approx
      if (Math.abs(c.sprite.y - trainY) < 40) {
        c.scored = true
        S.coinScore++
        try { if (typeof playTone === 'function') playTone({ freq: 1175, dur: 0.10, vol: 0.10 }) } catch {}
        // Visual collect
        c.sprite.tint = 0xfff7c0
        c.sprite.alpha = 0.3
        setTimeout(() => {
          try { particleLayer.removeChild(c.sprite); const idx = S.coins.indexOf(c); if (idx >= 0) S.coins.splice(idx, 1) } catch {}
        }, 100)
      }
    }
  }

  // v54.89 — Subtle train bob (chuff rhythm)
  if (!S.jumping) {
    const bob = Math.sin(S.frame * 0.18) * 1.4
    trainContainer.y = H * RAIL_Y_FRAC - 4 + bob
  }

  // Jump physics
  if (S.jumping) {
    S.jumpVel += GRAVITY * dt
    S.jumpY += S.jumpVel * dt
    if (S.jumpY >= 0) {
      S.jumpY = 0
      S.jumpVel = 0
      S.jumpingMissed = false
      S.jumping = false
      // v54.90 — Landing dust puff
      spawnLandingDust()
      try { if (typeof playTone === 'function') playTone({ freq: 200, dur: 0.08, vol: 0.10 }) } catch {}
    }
  }
  // Jump Y override (replaces the bob below if jumping)
  if (S.jumping) {
    trainContainer.y = H * RAIL_Y_FRAC - 4 + S.jumpY
    trainContainer.rotation = Math.sin(S.frame * 0.15) * 0.04
  } else {
    trainContainer.rotation = 0
  }

  // Spawn obstacles
  S.spawnTimer += dt
  if (S.spawnTimer >= S.nextSpawnAt && !S.finished) {
    spawnObstacle()
    S.spawnTimer = 0
    const mode = (window.ObstacleEngine && window.ObstacleEngine.getMode) ? window.ObstacleEngine.getMode() : 'easy'
    S.nextSpawnAt = mode === 'hard' ? (3 + Math.random() * 2) : (4 + Math.random() * 3)
  }

  // Move + collide obstacles
  for (let i = S.obstacles.length - 1; i >= 0; i--) {
    const o = S.obstacles[i]
    o.sprite.x -= scrollDx * (o.speedMul || 1.0)
    if (o.sprite.x < -100) {
      obstacleLayer.removeChild(o.sprite)
      S.obstacles.splice(i, 1)
      continue
    }
    // v54.89 — Skip collision for decoration items (milestone signposts)
    if (o.isDecoration) continue
    // Collision: train fixed-X area vs obstacle
    if (S.invincible <= 0 && Math.abs(o.sprite.x - trainContainer.x) < 50) {
      const trainBottom = H * RAIL_Y_FRAC + S.jumpY
      const obstacleTop = H * RAIL_Y_FRAC - o.height
      if (trainBottom > obstacleTop + 8) {
        crashOn(o)
        break
      }
    }
  }

  // Update HUD
  if (S.frame % 6 === 0) {
    document.getElementById('hud-dist').textContent = Math.floor(S.distance) + 'm / ' + S.targetDistance + 'm'
    document.getElementById('hud-hp').textContent = '❤️'.repeat(Math.max(0, S.hp)) || '💀'
    // v54.90 — Position vs AI
    const pos = S.aiTrain ? (S.aiDistanceOffset > 0 ? 'Posisi 1 🥇' : 'Posisi 2 🥈') : 'Mulai!'
    document.getElementById('hud-pos').textContent = pos + ' · 🪙 ' + S.coinScore
  }

  // Decrement invincible
  if (S.invincible > 0) S.invincible -= dt

  // Finish check
  if (S.distance >= S.targetDistance && !S.finished) {
    S.finished = true
    S.running = false
    // v54.92 — Confetti burst around train + finish chime
    spawnConfetti(trainContainer.x, trainContainer.y - 40)
    try {
      if (typeof playTone === 'function') {
        playTone({ freq: 523, dur: 0.14, vol: 0.12 })
        setTimeout(() => playTone({ freq: 659, dur: 0.14, vol: 0.12 }), 120)
        setTimeout(() => playTone({ freq: 784, dur: 0.20, vol: 0.12 }), 240)
        setTimeout(() => playTone({ freq: 1047, dur: 0.30, vol: 0.12 }), 420)
      }
    } catch {}
    // Slow scroll for celebration
    S.speed = 1.0
    setTimeout(() => endRace('🏁 Selamat! Kamu sampai di tujuan! 🚂', 'win'), 1400)
  }

  // Game over check
  if (S.hp <= 0 && !S.gameOver) {
    S.gameOver = true
    S.running = false
    endRace('💪 Ayo coba lagi! Kereta perlu istirahat.', 'lose')
  }
}

// v54.92 — Confetti burst (called at race finish)
function spawnConfetti(cx, cy) {
  const colors = [0xef4444, 0xfde047, 0x60a5fa, 0x22c55e, 0xa855f7, 0xff7043]
  for (let i = 0; i < 40; i++) {
    const c = new PIXI.Graphics()
    const color = colors[Math.floor(Math.random() * colors.length)]
    c.rect(-3, -5, 6, 10).fill(color)
    c.x = cx + (Math.random() - 0.5) * 100
    c.y = cy - 20
    c.rotation = Math.random() * Math.PI * 2
    particleLayer.addChild(c)
    const vx = (Math.random() - 0.5) * 8
    const vy = -8 - Math.random() * 8
    let life = 2.0
    let curVx = vx, curVy = vy
    const tick = () => {
      life -= 0.016
      curVy += 0.3 // gravity
      c.x += curVx
      c.y += curVy
      c.rotation += 0.1
      if (life > 0 && c.y < H + 50) requestAnimationFrame(tick)
      else { try { particleLayer.removeChild(c); c.destroy() } catch {} }
    }
    tick()
  }
}

      if (life > 0) requestAnimationFrame(tick)
      else { try { particleLayer.removeChild(dust); dust.destroy() } catch {} }
    }
    tick()
  }
}

// v54.89 — Milestone signpost at 200/400/600/800m
function spawnMilestone(num) {
  const totalKm = (num * 200) + 'm'
  const post = new PIXI.Container()

  post.y = H * RAIL_Y_FRAC

  // Sign board
  const g = new PIXI.Graphics()

  g.roundRect(-32, -68, 64, 22, 6).fill(0xfde047).stroke({ color: 0x92400e, width: 2 })
  post.addChild(g)
  const label = new PIXI.Text({ text: totalKm, style: { fontSize: 14, fill: 0x5a2a00, fontWeight: 'bold', fontFamily: 'Fredoka One, sans-serif' } })
  label.anchor.set(0.5, 0.5)
  label.x = 0
  label.y = -57
  post.addChild(label)

  obstacleLayer.addChild(post)
  // Treat as decoration — scroll with same speed but no collision
  S.obstacles.push({ sprite: post, type: { id: '__milestone__' }, height: 0, isDecoration: true })
}

function spawnObstacle() {
  const type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)]
  const text = new PIXI.Text({
    text: type.icon,
    style: {
      fontSize: Math.max(type.height, type.width),
      fontFamily: 'Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif',
    }
  })
  text.anchor.set(0.5, 1.0)
  text.x = W + 60
  text.y = H * RAIL_Y_FRAC
  obstacleLayer.addChild(text)
  S.obstacles.push({ sprite: text, type, height: type.height })
}

function crashOn(o) {
  S.hp = Math.max(0, S.hp - 1)
  S.invincible = 1.2 // 1.2s grace
  // Visual: red shake + flash
  try { if (typeof playTone === 'function') playTone({ freq: 220, dur: 0.18, vol: 0.14 }) } catch {}

  // v54.91 — Red screen flash overlay
  const flash = document.createElement('div')
  flash.style.cssText = 'position:fixed;inset:0;background:radial-gradient(circle,rgba(239,68,68,0.4) 0%,rgba(239,68,68,0.1) 70%,transparent 100%);pointer-events:none;z-index:150;animation:g14sFlash 0.45s ease-out forwards;'
  document.body.appendChild(flash)
  setTimeout(() => { try { flash.remove() } catch {} }, 500)

  // v54.91 — Camera shake (canvas-level via CSS transform)
  const canvas = document.getElementById('pixi-canvas')
  if (canvas) {
    canvas.style.animation = 'none'
    requestAnimationFrame(() => {
      canvas.style.animation = 'g14sShake 0.35s ease-out'
      setTimeout(() => { canvas.style.animation = '' }, 360)
    })
  }

  // Soft mode? still HP loss but won't game-over until 0
  const mode = (window.ObstacleEngine && window.ObstacleEngine.getMode) ? window.ObstacleEngine.getMode() : 'easy'
  if (mode === 'easy' && S.hp > 0) {
    // Easy: keep going, no game-over until obvious
  }
  // Remove obstacle (already hit)
  try {
    obstacleLayer.removeChild(o.sprite)
    const idx = S.obstacles.indexOf(o)
    if (idx >= 0) S.obstacles.splice(idx, 1)
  } catch {}
}

// ── COUNTDOWN ──────────────────────────────────────────────────────────────

function runCountdown(done) {
  const ov = document.getElementById('countdown')
  const num = document.getElementById('countdown-num')
  ov.classList.add('show')
  const seq = ['3', '2', '1', 'MULAI!']
  let i = 0
  function step() {
    num.textContent = seq[i]
    num.style.animation = 'none'
    requestAnimationFrame(() => { num.style.animation = '' })
    if (i++ < seq.length - 1) setTimeout(step, 850)
    else {
      setTimeout(() => { ov.classList.remove('show'); done && done() }, 900)
    }
  }
  step()
}

// ── END ────────────────────────────────────────────────────────────────────

function endRace(title, outcome) {
  document.getElementById('end-title').textContent = title
  const stats = [
    'Jarak: ' + Math.floor(S.distance) + 'm',
    'Sisa HP: ' + Math.max(0, S.hp) + '/' + S.maxHp,
    '🪙 Koin terkumpul: ' + S.coinScore,
    outcome === 'win' ? '🏆 Hebat! Kamu sampai duluan!' : '🌱 Kamu sudah hebat! Coba lagi ya.',
  ]
  document.getElementById('end-stats').innerHTML = stats.join('<br>')
  document.getElementById('end-modal').classList.add('show')
}

function g14sRestart() {
  location.reload()
}

function goBack() {
  // Try to navigate back to the picker (g14.html)
  if (document.referrer && document.referrer.includes('g14.html')) {
    history.back()
  } else {
    location.href = 'g14.html'
  }
}

function onResize() {
  // Simplified — just reload on big resize to avoid mid-race layout corruption
  // (production would do proper resize handling; v54.88 MVP keeps it simple)
  // Don't reload during active race; just let canvas reflow.
}

window.addEventListener('keydown', e => {
  if (e.code === 'Escape') goBack()
})
