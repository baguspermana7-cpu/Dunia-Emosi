<script>
'use strict'
/* =============================================================================
 * g14-side.html  (v54.88 foundation)
 * =============================================================================
 * Side-scrolling cartoon train racing — replaces top-down 3-lane G14 for the
 * "side-race (beta)" experience per owner reference image 2 ("Train Racing").
 *
 * Architecture:
 *   - Pixi fullscreen canvas
 *   - Upper 65%: parallax background via shared TrainBG engine (sky + landscape)
 *   - Lower 35%: rail + sleepers + train + obstacles
 *   - Train sprite: side-on profile from `spriteUrl` (Thomas, Casey, etc.)
 *   - JUMP mechanic: train arcs up + over an obstacle
 *   - Distance-based finish at 1000m
 *
 * Owner-mandate (v54.88+): ensure no bug, no error. Premium side-on feel.
 * Shares modules with g14.html — single source of truth for trains-db + obstacles.
 * ========================================================================== */

const W = window.innerWidth
const H = window.innerHeight

const app = new PIXI.Application()
let stage = null
let bgContainer = null
let railContainer = null
let trainContainer = null
let trainSprite = null
let obstacleLayer = null
let particleLayer = null

// Game state
const S = {
  running: false,
  paused: false,
  gameOver: false,
  distance: 0,
  targetDistance: 1000,
  speed: 4.0,            // px per tick at 60fps
  baseSpeed: 4.0,
  jumping: false,
  jumpY: 0,
  jumpVel: 0,
  jumpStartedAt: 0,
  hp: 3,
  maxHp: 3,
  invincible: 0,
  coins: 0,
  trainCfg: null,
  obstacles: [],
  spawnTimer: 0,
  nextSpawnAt: 4.0,      // seconds
  frame: 0,
  finished: false,
}

// Layout
const SKY_FRAC = 0.65            // upper 65% = sky/landscape
const RAIL_Y_FRAC = 0.78         // rail surface at 78% of screen
const PLAYER_X_FRAC = 0.25       // player at 25% from left
const GROUND_FILL_COLOR = 0x2e7d32 // grass green

// Physics
const GRAVITY = 1500              // px/s²
const JUMP_VELOCITY = 720         // initial upward velocity

// ── INIT ────────────────────────────────────────────────────────────────────
;(async () => {
  await app.init({
    canvas: document.getElementById('pixi-canvas'),
    width: W,
    height: H,
    backgroundAlpha: 1,
    backgroundColor: 0xbfdbfe,    // sky default
    antialias: false,
    resolution: window.devicePixelRatio || 1,
    autoDensity: true,
  })
  stage = app.stage
  S.trainCfg = pickTrain()
  document.getElementById('train-name').textContent = (S.trainCfg && S.trainCfg.name) || 'Kereta'
  buildLayers()
  buildBackground()
  buildRail()
  buildTrain()
  setupInput()
  runCountdown(() => { S.running = true; S.frame = 0 })

  // Start ticker
  app.ticker.add((tickerOrDelta) => tick(tickerOrDelta))

  // Resize
  window.addEventListener('resize', onResize)
})()

function pickTrain() {
  const key = sessionStorage.getItem('g14-side-train') || 'aeg_thomas'
  if (!window.TRAIN_CATS) return null
  for (const cat of window.TRAIN_CATS) {
    for (const t of (cat.trains || [])) {
      if (t.key === key) return { ...t, category: cat.key }
    }
  }
  // Fallback to first character train
  for (const cat of window.TRAIN_CATS) {
    for (const t of (cat.trains || [])) {
      if (t.isCharacter && t.spriteUrl) return { ...t, category: cat.key }
    }
  }
  return null
}

function buildLayers() {
  bgContainer = new PIXI.Container()
  railContainer = new PIXI.Container()
  trainContainer = new PIXI.Container()
  obstacleLayer = new PIXI.Container()
  particleLayer = new PIXI.Container()
  stage.addChild(bgContainer)
  stage.addChild(railContainer)
  stage.addChild(trainContainer)
  stage.addChild(obstacleLayer)
  stage.addChild(particleLayer)
}

function buildBackground() {
  // Sky gradient (top 65% of screen)
  const sky = new PIXI.Graphics()
  const skyH = H * SKY_FRAC + 20
  for (let i = 0; i < 16; i++) {
    const t = i / 15
    const r = Math.round(135 + (175 - 135) * t)
    const g = Math.round(206 + (220 - 206) * t)
    const b = Math.round(235 + (250 - 235) * t)
    sky.rect(0, (skyH * i / 16), W, skyH / 16 + 1).fill((r << 16) | (g << 8) | b)
  }
  // Sun
  sky.circle(W * 0.82, skyH * 0.22, 36).fill(0xfff7c0)
  sky.circle(W * 0.82, skyH * 0.22, 50).stroke({ color: 0xfde047, width: 4, alpha: 0.6 })
  bgContainer.addChild(sky)

  // Distant mountains (parallax 0.2×)
  const mtn = new PIXI.Graphics()
  const peaks = [
    [0.05, 0.50, 0.18], [0.18, 0.62, 0.22], [0.35, 0.48, 0.20],
    [0.55, 0.58, 0.24], [0.72, 0.50, 0.20], [0.90, 0.60, 0.22],
  ]
  peaks.forEach(([x, peakY, w]) => {
    const cx = W * x
    const py = skyH * peakY
    const halfW = W * w
    mtn.poly([cx - halfW, skyH * 0.85, cx, py, cx + halfW, skyH * 0.85]).fill(0x90a4ae)
  })
  bgContainer.addChild(mtn)

  // Mid-ground hills (parallax 0.5×)
  const hills = new PIXI.Graphics()
  for (let i = 0; i < 4; i++) {
    const cx = W * (0.1 + i * 0.28)
    const cy = skyH * 0.78
    const rx = W * 0.18
    const ry = skyH * 0.14
    hills.ellipse(cx, cy, rx, ry).fill(0x66bb6a)
  }
  // Distant trees
  for (let i = 0; i < 10; i++) {
    const tx = (i + 0.5) * (W / 10) + (Math.sin(i * 17) * 30)
    const ty = skyH * 0.84
    hills.rect(tx - 2, ty, 4, 12).fill(0x6d4c41)
    hills.circle(tx, ty - 2, 9).fill(0x388e3c)
  }
  bgContainer.addChild(hills)

  // Close fence (parallax 1.0×)
  const fence = new PIXI.Graphics()
  const fenceY = H * RAIL_Y_FRAC - 30
  fence.rect(0, fenceY, W, 5).fill(0x8d6e63)
  for (let i = 0; i < Math.ceil(W / 50) + 1; i++) {
    const fx = i * 50
    fence.rect(fx, fenceY - 18, 4, 22).fill(0x6d4c41)
  }
  bgContainer.addChild(fence)

  // Grass ground (between sky bottom and rail)
  const ground = new PIXI.Graphics()
  ground.rect(0, H * SKY_FRAC, W, H - H * SKY_FRAC).fill(GROUND_FILL_COLOR)
  // Lighter strip top
  ground.rect(0, H * SKY_FRAC, W, 4).fill(0x4caf50)
  bgContainer.addChildAt(ground, 0) // behind everything else
}

function buildRail() {
  // Rail surface
  const rail = new PIXI.Graphics()
  const railY = H * RAIL_Y_FRAC
  // Ballast (gravel base)
  rail.rect(0, railY - 4, W, 28).fill(0x8d6e63)
  // Two parallel steel rails
  rail.rect(0, railY, W, 4).fill(0x424242)
  rail.rect(0, railY + 12, W, 4).fill(0x424242)
  // Sleepers
  for (let i = 0; i < Math.ceil(W / 40) + 2; i++) {
    rail.rect(i * 40 + (S.frame * 0.5) % 40, railY - 2, 18, 22).fill(0x4e342e)
  }
  railContainer.addChild(rail)
  railContainer._rail = rail
}

function buildTrain() {
  const cfg = S.trainCfg
  if (!cfg) return

  // Container — train always at fixed X, Y animates for jump
  trainContainer.x = W * PLAYER_X_FRAC
  trainContainer.y = H * RAIL_Y_FRAC - 4  // baseline at rail top

  if (cfg.isCharacter && cfg.spriteUrl) {
    trainSprite = PIXI.Sprite.from(cfg.spriteUrl)
    trainSprite.anchor.set(0.5, 1.0) // bottom-center
    const targetH = (cfg.spriteHeight || 90) * 1.5 // side view = bigger
    trainSprite.scale.set(0.5)
    const onLoad = () => {
      if (trainSprite.texture && trainSprite.texture.height > 1) {
        trainSprite.scale.set(targetH / trainSprite.texture.height)
      }
    }
    if (trainSprite.texture && trainSprite.texture.source && trainSprite.texture.source.loaded) onLoad()
    else if (trainSprite.texture && trainSprite.texture.source && typeof trainSprite.texture.source.addEventListener === 'function') {
      trainSprite.texture.source.addEventListener('load', onLoad)
    } else {
      let tries = 0
      const tk = () => { if (trainSprite.texture && trainSprite.texture.height > 1) { onLoad(); return } if (tries++ < 60) requestAnimationFrame(tk) }
      tk()
    }
  } else {
    // Procedural side-on locomotive (fallback for non-character trains)
    trainSprite = new PIXI.Graphics()
    drawProceduralSideLoco(trainSprite, cfg.bodyColor || '#1976d2', cfg.accColor || '#e53935')
  }
  trainContainer.addChild(trainSprite)
}

function drawProceduralSideLoco(g, bodyHex, accHex) {
  const body = parseHex(bodyHex)
  const acc = parseHex(accHex)
  // Side profile: chassis + cab + chimney + 3 wheels + smokebox
  g.rect(-50, -32, 100, 26).fill(body) // boiler
  g.rect(-40, -52, 30, 20).fill(body)  // cab
  g.rect(-30, -52, 14, 6).fill(0x1c1917) // cab roof
  g.rect(20, -42, 18, 10).fill(0x1c1917) // smokebox front
  g.rect(28, -56, 8, 14).fill(0x424242)  // chimney
  // Yellow trim stripe
  g.rect(-50, -16, 100, 3).fill(acc)
  // 3 wheels (large center, 2 small bogies)
  g.circle(-32, -2, 9).fill(0x1c1917)
  g.circle(-32, -2, 6).fill(acc)
  g.circle(0, -2, 12).fill(0x1c1917)
  g.circle(0, -2, 8).fill(acc)
  g.circle(28, -2, 9).fill(0x1c1917)
  g.circle(28, -2, 6).fill(acc)
}

function parseHex(s) {
  if (typeof s !== 'string') return 0x6b7280
  return parseInt(s.replace(/^#/, ''), 16) || 0x6b7280
}

// ── INPUT ───────────────────────────────────────────────────────────────────

function setupInput() {
  document.getElementById('btn-jump').addEventListener('touchstart', e => { e.preventDefault(); g14sJump() }, { passive: false })
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); g14sJump() }
  })
  // Tap anywhere (except UI) to jump
  document.getElementById('pixi-canvas').addEventListener('pointerdown', () => g14sJump())
}

function g14sJump() {
  if (!S.running || S.paused || S.gameOver) return
  if (S.jumping) return
  S.jumping = true
  S.jumpVel = -JUMP_VELOCITY
  S.jumpStartedAt = S.frame
  try { if (typeof playTone === 'function') playTone({ freq: 440, dur: 0.10, vol: 0.10 }) } catch {}
}

// ── TICK ────────────────────────────────────────────────────────────────────

function tick(tickerOrDelta) {
  if (!S.running || S.paused || S.gameOver) return
  S.frame++

  // Pixi 8 ticker: get deltaTime from ticker
  let deltaMS = 16.67
  if (tickerOrDelta && typeof tickerOrDelta === 'object' && tickerOrDelta.deltaMS) deltaMS = tickerOrDelta.deltaMS
  const dt = deltaMS / 1000

  // Scroll world
  const scrollDx = S.speed * (deltaMS / 16.67)
  S.distance += scrollDx * 0.4 // 0.4 m per scroll px (calibrate for 1000m goal)

  // Animate rail (re-draw sleepers offset by frame counter)
  if (railContainer._rail) {
    railContainer._rail.clear()
    const rail = railContainer._rail
    const railY = H * RAIL_Y_FRAC
    rail.rect(0, railY - 4, W, 28).fill(0x8d6e63)
    rail.rect(0, railY, W, 4).fill(0x424242)
    rail.rect(0, railY + 12, W, 4).fill(0x424242)
    for (let i = 0; i < Math.ceil(W / 40) + 2; i++) {
      const sx = i * 40 - (S.frame * scrollDx * 0.4) % 40
      rail.rect(sx, railY - 2, 18, 22).fill(0x4e342e)
    }
  }

  // Jump physics
  if (S.jumping) {
    S.jumpVel += GRAVITY * dt
    S.jumpY += S.jumpVel * dt
    if (S.jumpY >= 0) {
      S.jumpY = 0
      S.jumpVel = 0
      S.jumpingMissed = false
      S.jumping = false
    }
  }
  trainContainer.y = H * RAIL_Y_FRAC - 4 + S.jumpY
  // Small horizontal sway on jump
  if (S.jumping) trainContainer.rotation = Math.sin(S.frame * 0.15) * 0.04
  else trainContainer.rotation = 0

  // Spawn obstacles
  S.spawnTimer += dt
  if (S.spawnTimer >= S.nextSpawnAt && !S.finished) {
    spawnObstacle()
    S.spawnTimer = 0
    const mode = (window.ObstacleEngine && window.ObstacleEngine.getMode) ? window.ObstacleEngine.getMode() : 'easy'
    S.nextSpawnAt = mode === 'hard' ? (3 + Math.random() * 2) : (4 + Math.random() * 3)
  }

  // Move + collide obstacles
  for (let i = S.obstacles.length - 1; i >= 0; i--) {
    const o = S.obstacles[i]
    o.sprite.x -= scrollDx * (o.speedMul || 1.0)
    if (o.sprite.x < -100) {
      obstacleLayer.removeChild(o.sprite)
      S.obstacles.splice(i, 1)
      continue
    }
    // Collision: train fixed-X area vs obstacle
    if (S.invincible <= 0 && Math.abs(o.sprite.x - trainContainer.x) < 50) {
      const trainBottom = H * RAIL_Y_FRAC + S.jumpY
      const obstacleTop = H * RAIL_Y_FRAC - o.height
      if (trainBottom > obstacleTop + 8) {
        crashOn(o)
        break
      }
    }
  }

  // Update HUD
  if (S.frame % 6 === 0) {
    document.getElementById('hud-dist').textContent = Math.floor(S.distance) + 'm / ' + S.targetDistance + 'm'
    document.getElementById('hud-hp').textContent = '❤️'.repeat(Math.max(0, S.hp)) || '💀'
  }

  // Decrement invincible
  if (S.invincible > 0) S.invincible -= dt

  // Finish check
  if (S.distance >= S.targetDistance && !S.finished) {
    S.finished = true
    S.running = false
    endRace('🏁 Selamat! Kamu sampai di tujuan! 🚂', 'win')
  }

  // Game over check
  if (S.hp <= 0 && !S.gameOver) {
    S.gameOver = true
    S.running = false
    endRace('💪 Ayo coba lagi! Kereta perlu istirahat.', 'lose')
  }
}

// ── OBSTACLES ───────────────────────────────────────────────────────────────

const OBSTACLE_TYPES = [
  { id: 'rock',    icon: '🪨', height: 36, width: 40 },
  { id: 'branch',  icon: '🌳', height: 60, width: 44 },
  { id: 'barrier', icon: '🚧', height: 50, width: 48 },
  { id: 'water',   icon: '💧', height: 22, width: 60 },
  { id: 'cow',     icon: '🐮', height: 46, width: 56 },
]

function spawnObstacle() {
  const type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)]
  const text = new PIXI.Text({
    text: type.icon,
    style: {
      fontSize: Math.max(type.height, type.width),
      fontFamily: 'Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif',
    }
  })
  text.anchor.set(0.5, 1.0)
  text.x = W + 60
  text.y = H * RAIL_Y_FRAC
  obstacleLayer.addChild(text)
  S.obstacles.push({ sprite: text, type, height: type.height })
}

function crashOn(o) {
  S.hp = Math.max(0, S.hp - 1)
  S.invincible = 1.2 // 1.2s grace
  // Visual: red shake
  try { if (typeof playTone === 'function') playTone({ freq: 220, dur: 0.18, vol: 0.14 }) } catch {}
  // Soft mode? still HP loss but won't game-over until 0
  // Mode check (Hard = stricter)
  const mode = (window.ObstacleEngine && window.ObstacleEngine.getMode) ? window.ObstacleEngine.getMode() : 'easy'
  if (mode === 'easy' && S.hp > 0) {
    // Easy: keep going, no game-over until obvious
  }
  // Remove obstacle (already hit)
  try {
    obstacleLayer.removeChild(o.sprite)
    const idx = S.obstacles.indexOf(o)
    if (idx >= 0) S.obstacles.splice(idx, 1)
  } catch {}
}

// ── COUNTDOWN ──────────────────────────────────────────────────────────────

function runCountdown(done) {
  const ov = document.getElementById('countdown')
  const num = document.getElementById('countdown-num')
  ov.classList.add('show')
  const seq = ['3', '2', '1', 'MULAI!']
  let i = 0
  function step() {
    num.textContent = seq[i]
    num.style.animation = 'none'
    requestAnimationFrame(() => { num.style.animation = '' })
    if (i++ < seq.length - 1) setTimeout(step, 850)
    else {
      setTimeout(() => { ov.classList.remove('show'); done && done() }, 900)
    }
  }
  step()
}

// ── END ────────────────────────────────────────────────────────────────────

function endRace(title, outcome) {
  document.getElementById('end-title').textContent = title
  const stats = [
    'Jarak: ' + Math.floor(S.distance) + 'm',
    'Sisa HP: ' + Math.max(0, S.hp) + '/' + S.maxHp,
    outcome === 'win' ? '🏆 1 koin bonus dari setiap rintangan terlewati!' : '🌱 Kamu sudah hebat! Coba lagi ya.',
  ]
  document.getElementById('end-stats').innerHTML = stats.join('<br>')
  document.getElementById('end-modal').classList.add('show')
}

function g14sRestart() {
  location.reload()
}

function goBack() {
  // Try to navigate back to the picker (g14.html)
  if (document.referrer && document.referrer.includes('g14.html')) {
    history.back()
  } else {
    location.href = 'g14.html'
  }
}

function onResize() {

  // (production would do proper resize handling; v54.88 MVP keeps it simple)

}

window.addEventListener('keydown', e => {
  if (e.code === 'Escape') goBack()
})
