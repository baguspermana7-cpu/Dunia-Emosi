	<!-- Chromium may detach an ArrayBuffer passed to decodeAudioData. The
	     bundled audio loader retries the same buffer, so always decode a copy. -->
	<script>
		for (const AudioContextClass of [
			window.AudioContext,
			window.webkitAudioContext,
			window.OfflineAudioContext,
			window.webkitOfflineAudioContext
		]) {
			if (!AudioContextClass || AudioContextClass.prototype.__offlineDecodePatched) continue;
			const originalDecodeAudioData = AudioContextClass.prototype.decodeAudioData;
			if (typeof originalDecodeAudioData !== 'function') continue;
			AudioContextClass.prototype.decodeAudioData = function (audioData, ...args) {
				let safeAudioData = audioData;
				try {
					safeAudioData = audioData.slice(0);
				} catch (_) {
					// Let the native implementation report genuinely invalid input.
				}
				return originalDecodeAudioData.call(this, safeAudioData, ...args);
			};
			AudioContextClass.prototype.__offlineDecodePatched = true;
		}
		// pixi-sound 2.x can finish two concurrent decodes for the same media.
		// Older browsers silently accepted the second assignment; current
		// Chromium throws. Preserve the legacy behavior for an already-set node.
		try {
			const sourcePrototype = window.AudioBufferSourceNode && window.AudioBufferSourceNode.prototype;
			const bufferDescriptor = sourcePrototype && Object.getOwnPropertyDescriptor(sourcePrototype, 'buffer');
			if (bufferDescriptor && bufferDescriptor.configurable && bufferDescriptor.get && bufferDescriptor.set) {
				Object.defineProperty(sourcePrototype, 'buffer', {
					configurable: true,
					enumerable: bufferDescriptor.enumerable,
					get: bufferDescriptor.get,
					set(value) {
						if (value && bufferDescriptor.get.call(this)) return;
						bufferDescriptor.set.call(this, value);
					}
				});
			}
		} catch (_) {
			// Continue with the native implementation if it cannot be wrapped.
		}
	</script>
