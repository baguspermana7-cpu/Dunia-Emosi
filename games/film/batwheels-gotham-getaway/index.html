<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Batwheels</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script defer src="phaser-e11f8d8aba681e4edec6.bundle.js?477bba7ec01d2b30cc55"></script><script defer src="main-dcab7893b1877cec2d87.bundle.js?477bba7ec01d2b30cc55"></script><link href="css/main.b02ef64e5ee63189826a.css?477bba7ec01d2b30cc55" rel="stylesheet"></head>

  <body>
    <div id="rotation-cover"></div>
    <div id="game"></div>
<script>
/* ===========================================================================
 * "?hero=" — start this game on the chaser the child picked in the wrapper.
 * ===========================================================================
 * The wrapper (games/film-play.html) shows its own "pilih pengejar" screen and
 * then opens this page as  index.html?targetScene=Game&hero=bam
 *
 *   * `targetScene` is the ENGINE'S OWN entry point (it merges every query param
 *     into its config and swaps the destination of the single PreloadEnd hop).
 *     We do not touch it here.
 *   * the LEVEL is not readable from the URL -- `Game.init` builds
 *     `runSettings = Object.assign({}, defaults, data.runSettings)` and derives
 *     hero / villain / theme / dynamic asset-pack from it. So the only thing this
 *     file does is add `selectedLevel` to the data of the engine's own
 *     `SceneManager.start('Game', ...)` call. Hero and level are 1:1.
 *
 * WHAT THIS DELIBERATELY DOES NOT DO: it never synthesises input into the game's
 * menus (no clicks, no pointer events, no emit). An earlier build did, tapped a
 * Title button that was still parked off-screen mid-tween, re-entered the
 * transition system while it was already transitioning, so Title never stopped
 * and kept rendering until its textures were unloaded under it and WebGL died on
 * a null texture. This hook only ever reads a table and copies an object.
 *
 * It also mutates nothing: every payload is rebuilt as a fresh object, and
 * `this.level` in the engine is only ever a READ reference to a shared level
 * singleton.
 * ======================================================================== */
(function () {
  'use strict';

  /* =====================================================================
   * KOMPOSISI + CAT
   * =====================================================================
   * Yang lama menyimpan tiga anggapan yang ternyata salah, dan ketiganya
   * jadi keluhan pemilik:
   *
   *  1. "hero dan level 1:1". Benar di data aslinya, tapi bukan keharusan.
   *     Satu level itu (hero, villain, tema) — tiga field terpisah pada satu
   *     objek. Yang mengunci hanya pemuat aset yang dikunci per-tema.
   *  2. "cat cukup dengan skeleton.color". Itu MULTIPLY murni: hanya bisa
   *     menggelapkan. Bodi gelap tidak akan pernah bisa jadi terang. Sekarang
   *     catnya dipanggang ke tekstur oleh wrapper sebelum Spine memuatnya.
   *  3. Bendera `owns` dilepas hanya oleh LevelSelect — padahal "Next Level"
   *     lewat transisi GameReplay, sehingga level yang baru diset justru
   *     DITIMPA balik: "lanjut" mengulang level yang sama selamanya.
   *
   * Aturan sekarang: hero dan villain pilihan anak ditempelkan ke SETIAP
   * level yang dimasuki, jadi mereka bertahan lewat replay, next-level, dan
   * level-select — sementara kota tetap maju seperti aslinya. Tidak ada lagi
   * bendera kepemilikan untuk dilupakan.
   * =================================================================== */

  var VILLAIN_PAIR = { prank: 'bam-prank', jestah: 'bibi-jestah', ducky: 'redbird-ducky',
                       quizz: 'batwing-quizz', snowy: 'buff-snowy' };
  var HERO_PAIR = { bam: 'bam-prank', bibi: 'bibi-jestah', redbird: 'redbird-ducky',
                    batwing: 'batwing-quizz', buff: 'buff-snowy' };
  /* Kota -> level. Kota yang memilih catatan level dasar, jadi rintangan,
     ramp dan penyetelan kesulitan tiap kota tetap seperti aslinya. */
  var CITY_LEVEL = { funstreet: 'level1', scrapyard: 'level2', docks: 'level3',
                     citysky: 'level4', frozenstreet: 'level5' };
  /* VFX senjata villain didorong oleh TEMA di mesin aslinya, bukan oleh
     villain. Begitu villain bisa muncul di kota mana pun, VFX-nya harus ikut
     dimuat sendiri atau senjatanya menembak tanpa gambar. */
  var VILLAIN_FX = { ducky: 'ink', quizz: 'question-cloud', snowy: 'snowdrift' };

  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }

  var cfg = null;
  try {
    var raw = sessionStorage.getItem('gg_custom');
    if (raw) {
      var c = JSON.parse(raw);
      if (c && has(HERO_PAIR, c.hero) && has(VILLAIN_PAIR, c.villain) && has(CITY_LEVEL, c.city)) {
        cfg = { hero: c.hero, villain: c.villain, city: c.city,
                paint: (typeof c.paint === 'string' && c.paint.indexOf('blob:') === 0) ? c.paint : null };
      }
    }
  } catch (e) {}
  /* Tanpa konfigurasi yang sah, game ini harus persis seperti aslinya.
     JANGAN `return` di sini: gerbang audio di bawah hidup di IIFE yang sama,
     dan keluar lebih awal akan ikut mematikannya untuk gotham polos. Cukup
     lewati bagian komposisinya. */
  var LEVEL = cfg ? CITY_LEVEL[cfg.city] : null;
  var GAME = null;

  function copy(src, extra) {
    var out = {}, k;
    if (src) { for (k in src) { if (has(src, k)) out[k] = src[k]; } }
    if (extra) { for (k in extra) { if (has(extra, k)) out[k] = extra[k]; } }
    return out;
  }

  /* ---- cat: alihkan halaman atlas hero ke hasil cat wrapper --------------
     Loader Phaser memuat halaman atlas lewat elemen Image biasa, jadi satu
     penyetel `src` sudah cukup. Semua UV tetap sah karena yang berubah hanya
     piksel di dalam region bodi. Hanya URL milik pasangan hero yang dialihkan;
     apa pun yang lain lewat apa adanya. */
  if (cfg && cfg.paint) {
    try {
      var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
      var want = HERO_PAIR[cfg.hero] + '-0.png';
      Object.defineProperty(HTMLImageElement.prototype, 'src', {
        configurable: true,
        get: function () { return d.get.call(this); },
        set: function (v) {
          try { if (typeof v === 'string' && v.indexOf(want) >= 0) v = cfg.paint; } catch (e) {}
          d.set.call(this, v);
        }
      });
    } catch (e) {}
  }

  /* ---- komposisi ---------------------------------------------------------
     Dua sambungan, keduanya API publik Phaser:
       START  — sebelum `init`, antre kerangka tambahan ke loader scene itu,
                jadi ia ikut termuat bersama aset tema tanpa perlu gerbang.
       create — dibungkus supaya hero/villain pilihan ditempelkan ke objek
                level SESAAT sebelum kendaraan dibuat.
     Objek level itu singleton bersama, jadi menempelkannya bersifat idempoten
     dan bertahan lewat SEMUA jalur masuk ke scene Game. */
  function spineURLs(key) {
    return ['assets/animations/' + key + '.json', 'assets/animations/' + key + '.atlas'];
  }

  function queueSpines(scene) {
    var need = [HERO_PAIR[cfg.hero], VILLAIN_PAIR[cfg.villain]];
    if (VILLAIN_FX[cfg.villain]) need.push(VILLAIN_FX[cfg.villain]);
    for (var i = 0; i < need.length; i++) {
      var k = need[i];
      try {
        if (scene.cache && scene.cache.custom && scene.cache.custom.spine &&
            scene.cache.custom.spine.exists(k)) continue;
        var u = spineURLs(k);
        scene.load.spine(k, u[0], u[1], true);
      } catch (e) {}
    }
  }

  function spineReady(scene, key) {
    try {
      var c = scene.cache && scene.cache.custom && scene.cache.custom.spine;
      return !!(c && c.exists && c.exists(key));
    } catch (e) { return false; }
  }

  /* Menempelkan hero/villain HANYA kalau kerangka keduanya benar-benar sudah
     ada di cache. Menempelkannya tanpa itu membuat Spine meledak dengan
     `skeletonData` null dan balapannya tidak pernah muncul — terukur. Kalau
     belum siap, biarkan level memakai pasangan aslinya: game tetap jalan,
     dan catnya tetap terpakai kalau hero pilihan memang hero level itu. */
  function compose(scene) {
    try {
      if (!scene || !scene.level) return;
      var hp = HERO_PAIR[cfg.hero], vp = VILLAIN_PAIR[cfg.villain];
      if (spineReady(scene, hp)) scene.level.hero = cfg.hero;
      if (spineReady(scene, vp)) scene.level.villain = cfg.villain;
      /* Jejak apa yang BENAR-BENAR tersusun, bukan apa yang diminta. Kanvas
         WebGL tidak bisa dibaca ulang (buffer gambarnya tidak dipertahankan),
         jadi tanpa ini komposisinya hanya bisa ditebak dari tangkapan layar. */
      window.__ggComposed = { minta: cfg, jadi: { hero: scene.level.hero, villain: scene.level.villain },
                              spine: { hero: spineReady(scene, hp), villain: spineReady(scene, vp) } };
    } catch (e) {}
  }

  function wireGameScene() {
    var sc = GAME && GAME.scene && GAME.scene.getScene && GAME.scene.getScene('Game');
    if (!sc || sc.__ggWired) return;
    sc.__ggWired = true;
    /* Antre di PRELOAD, bukan di event `start`. `start` menyala sebelum `init`,
       dan berkas yang diantre di sana tidak ikut termuat -- terukur: Spine
       melempar `skeletonData` null karena kerangkanya belum ada saat kendaraan
       dibuat. Membungkus `preload` menaruh antrean kita SESUDAH mesin mengantre
       asetnya sendiri, jadi semuanya termuat dalam satu putaran loader. */
    var origPreload = sc.preload;
    sc.preload = function () {
      var r = (typeof origPreload === 'function') ? origPreload.apply(this, arguments) : undefined;
      try { queueSpines(this); } catch (e) {}
      return r;
    };
    var origCreate = sc.create;
    if (typeof origCreate === 'function') {
      sc.create = function () { compose(this); return origCreate.apply(this, arguments); };
    }
  }

  function patch(P) {
    var SM = P && P.Scenes && P.Scenes.SceneManager && P.Scenes.SceneManager.prototype;
    if (!SM || SM.__ggHeroPatched) return !!SM;
    SM.__ggHeroPatched = true;
    var start = SM.start;
    SM.start = function (key, data) {
      GAME = this.game;
      if (cfg) wireGameScene();
      if (key === 'Game') {
        hideGate();
        /* Hanya ronde PERTAMA yang diarahkan ke kota pilihan. Sesudah itu
           mesinnya sendiri yang menentukan level — itulah yang membuat
           "Next Level" benar-benar maju alih-alih mengulang. */
        if (cfg && !SM.__ggSeeded) {
          SM.__ggSeeded = true;
          data = copy(data, { runSettings: copy(data && data.runSettings, { selectedLevel: LEVEL }) });
        }
      }
      return start.call(this, key, data);
    };
    return true;
  }


  /* Both bundles are `defer`, so this inline script runs BEFORE Phaser exists.
     Trap the assignment instead of racing it, with a bounded poll as a fallback
     in case defineProperty is refused. */
  if (window.Phaser) {
    patch(window.Phaser);
  } else {
    try {
      var held;
      Object.defineProperty(window, 'Phaser', {
        configurable: true,
        get: function () { return held; },
        set: function (v) { held = v; try { patch(v); } catch (e) {} }
      });
    } catch (e) {}
    var tries = 0;
    var timer = setInterval(function () {
      if ((window.Phaser && patch(window.Phaser)) || ++tries > 600) clearInterval(timer);
    }, 50);
  }

  /* =======================================================================
   * AUDIO — "Ketuk layar untuk mulai!"
   * =======================================================================
   * Deep-linking straight into Game skips the LevelSelect tap that normally
   * unlocks audio, so the race could start on a suspended AudioContext.
   *
   * MEASURED, though: the wrapper serves this game from the SAME ORIGIN, and
   * Chrome propagates user activation to same-origin documents in the frame
   * tree -- so the child's tap on the wrapper's picker usually unlocks us
   * already. Verified with --autoplay-policy=document-user-activation-required:
   * arriving through the picker gives `sound.locked === false`, while loading
   * this page directly with no tap anywhere gives `sound.locked === true`.
   *
   * So the gate is a FALLBACK, not a toll booth: it is built during preload but
   * removes itself the moment it sees the sound manager come up already
   * unlocked. In the normal flow the child never sees it (the wrapper's own
   * splash still covers the frame at that point). It only ever becomes visible
   * on a browser that did not inherit the activation -- and then it is a real,
   * honest "tap to start" rather than a silent race.
   *
   * We never synthesise a gesture: browsers ignore untrusted events for autoplay
   * unlock anyway, and it is the pattern that crashed the old build. It also
   * auto-dismisses when the race starts, so it can never block gameplay.
   * ==================================================================== */
  var gate = null, gateGone = false;

  function unlockAudio() {
    try {
      var s = GAME && GAME.sound;
      if (!s) return;
      if (s.context && s.context.state === 'suspended' && s.context.resume) s.context.resume();
      if (s.locked && s.unlock) s.unlock();
    } catch (e) {}
  }

  function onGesture() {
    unlockAudio();
    /* the sound manager may not exist yet if the tap lands very early */
    var n = 0, t = setInterval(function () { unlockAudio(); if (++n > 6) clearInterval(t); }, 400);
    hideGate();
  }

  function hideGate() {
    if (gateGone) return;
    gateGone = true;
    if (gate && gate.parentNode) gate.parentNode.removeChild(gate);
    gate = null;
  }

  function buildGate() {
    var css = document.createElement('style');
    css.textContent =
      '#gg-tap-gate{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;cursor:pointer;' +
      '-webkit-tap-highlight-color:transparent;text-align:center;color:#efe9ff;' +
      "font-family:'Fredoka One','Baloo 2',system-ui,sans-serif;" +
      'background:radial-gradient(120% 90% at 50% 50%,rgba(58,42,120,.93) 0,rgba(34,26,82,.96) 45%,rgba(12,9,34,.98) 100%)}' +
      '#gg-tap-gate .in{padding:34px 64px;border-radius:34px;background:#1a1440;animation:ggPulse 1.6s ease-in-out infinite;' +
      'box-shadow:0 12px 0 #0d0a28,0 24px 46px rgba(0,0,0,.5),inset 0 3px 4px rgba(255,255,255,.12)}' +
      '#gg-tap-gate .t{font-size:58px;font-weight:800;line-height:1.05;color:#ffe08a;text-shadow:0 4px 0 rgba(0,0,0,.32)}' +
      "#gg-tap-gate .s{margin-top:14px;font-family:'Baloo 2',system-ui,sans-serif;font-weight:700;font-size:26px;color:#c3b8ff}" +
      '@keyframes ggPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}' +
      '@media(prefers-reduced-motion:reduce){#gg-tap-gate .in{animation:none}}';
    document.head.appendChild(css);

    gate = document.createElement('div');
    gate.id = 'gg-tap-gate';
    gate.setAttribute('role', 'button');
    gate.setAttribute('tabindex', '0');
    gate.setAttribute('aria-label', 'Ketuk untuk mulai balapan');
    gate.innerHTML = '<div class="in"><div class="t">Ketuk layar untuk mulai!</div>' +
                     '<div class="s">Biar suara balapannya ikut menyala</div></div>';
    gate.addEventListener('pointerdown', onGesture);
    gate.addEventListener('click', onGesture);
    gate.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') { ev.preventDefault(); onGesture(); }
    });
    document.body.appendChild(gate);

    /* If the sound manager comes up already unlocked (the normal path -- the
       picker tap propagated into this same-origin frame) then no tap is owed
       and the gate must get out of the child's way. */
    var n = 0;
    var watch = setInterval(function () {
      var s = GAME && GAME.sound;
      if (gateGone || (s && !s.locked) || ++n > 150) { clearInterval(watch); hideGate(); }
    }, 200);
  }

  if (document.body) buildGate();
  else document.addEventListener('DOMContentLoaded', buildGate);

  /* Whatever happens, the child's FIRST real touch in this document resumes the
     context -- a plain listener on real input, nothing synthesised. */
  document.addEventListener('pointerdown', function once(ev) {
    if (!ev.isTrusted) return;
    document.removeEventListener('pointerdown', once, true);
    unlockAudio();
  }, true);
})();
</script>
  </body>
</html>
