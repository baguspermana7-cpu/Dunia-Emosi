<div>
  <div id="content">
      <div id="drawing-tool-loader">
        <img src="Resources/img/kids/sprite_loader.png" alt="" />
      </div>
      <div id="drawing-tool">
        <div id="drawing-tool-logo" style="background-image: url(Images/logo_tcm1399-221494.png)"></div>
        <div id="canvas-wrapper"></div>
        <div id="tools-wrapper">
          <div id="tools-drawer-handle"></div>
          <div id="tools">
            <div id="tool-crayon" class="tool"></div>
            <div id="tool-marker" class="tool"></div>
            <div id="tool-brush" class="tool"></div>
            <div id="tool-eraser" class="tool"></div>
             <div id="tool-bucket" class="tool disabled"></div>
          </div>
        </div>
        <div id="palette"></div>

        <div class="button" id="drawing-tool-close-btn"></div>
        <div class="button" id="drawing-tool-done-btn"></div>

        <div id="drawing-tool-confirm-overlay"></div>
        <div class="drawing-tool-confirm-popup" id="drawing-tool-confirm-exit-popup">
          <div class="actions">
            <span class="button continue"></span>
            <a class="button trash" href="../sodorpaintshop.html"></a>
          </div>
        </div>
        <div class="drawing-tool-confirm-popup" id="drawing-tool-confirm-clear-popup">
          <div class="actions">
            <span class="button continue"></span>
            <span class="button clear-canvas"></span>
          </div>
        </div>

        <div id="drawing-tool-done-popup">
          <div id="drawing-tool-done-preview-pin"></div>
          <div id="drawing-tool-done-preview-folded-corner"></div>
          <img id="drawing-tool-preview">
          <div class="actions">
            <span class="button continue"></span>
            <span class="button print"></span>
            <span class="button save"></span>
            <a class="button trash" href="../sodorpaintshop.html"></a>
          </div>
        </div>
      </div>
      
      <form id="drawing-tool-download-form" action="" method="post" target="drawing-tool-download-frame">
        <input type="hidden" value="" id="drawing-tool-download-input" name="image" />
      </form>
      <iframe id="drawing-tool-download-frame" name="drawing-tool-download-frame"></iframe>
      <iframe id="drawing-tool-print-frame" src="Resources/kidsdrawingtool-print.html"></iframe>
