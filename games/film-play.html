<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<title>Film Anak — Main</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;height:100dvh;background:#000;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-family:'Fredoka One','Baloo 2',system-ui,sans-serif}
  /* The game runs in an iframe sized to its FIXED design resolution (so the game's own
     scaler sees a sane window → no zoom/stretch/crop from a huge/odd device viewport),
     then we CSS-transform-scale the whole iframe to letterbox-fit the real screen. This is
     engine-agnostic + DPR-proof — works for every game regardless of its internal scaling. */
  #stage{position:fixed;inset:0;overflow:hidden;background:#000}
  #frame{position:absolute;top:0;left:0;border:0;display:block;background:#000;transform-origin:0 0}
  /* Always-visible HOME button — clear claymorphism pill (icon + label), top-left safe-area,
     ABOVE the game (z-index high). Never dims below .72 so a kid can always leave the game. */
  #back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);z-index:2147483000;
    display:flex;align-items:center;gap:7px;min-height:44px;padding:8px 15px 8px 11px;border:0;cursor:pointer;
    font-family:'Fredoka One','Baloo 2',system-ui,sans-serif;font-size:15px;font-weight:800;color:#3a2b12;
    background:linear-gradient(180deg,#fff2c2,#ffd968);border-radius:16px;
    box-shadow:0 4px 0 #d9a92e,0 8px 18px rgba(0,0,0,.5),inset 0 2px 5px rgba(255,255,255,.85);
    opacity:.96;transition:transform .08s ease,opacity .25s ease}
  #back:active{transform:translateY(3px);box-shadow:0 1px 0 #d9a92e,inset 0 2px 6px rgba(0,0,0,.12)}
  #back svg{width:20px;height:20px;flex-shrink:0}
  /* dim only slightly when idle — still clearly visible */
  body.dim #back{opacity:.72}
  #err{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;color:#fff;text-align:center}
  #err.show{display:flex}
  #err a{color:#ffe08a;font-weight:800}
  /* Instant loading splash over the black-before-game gap — thumbnail bg + spinner + text.
     Fades out as soon as the game's own canvas appears (then the game shows its own loader). */
  #splash{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0c0922;overflow:hidden;transition:opacity .45s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .bg{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(16px) brightness(.42);transform:scale(1.12)}
  #splash .sp{position:relative;width:54px;height:54px;border-radius:50%;border:6px solid rgba(255,255,255,.16);border-top-color:#ffd968;animation:spin .9s linear infinite}
  #splash .tx{position:relative;color:#fff;font-weight:800;font-size:17px;text-shadow:0 2px 7px rgba(0,0,0,.65)}
  #splash .sub{position:relative;margin-top:-8px;color:#d9cfff;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:12px;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* ---- Custom-chaser picker (gotham-getaway only): pick hero -> color -> race.
     Above the splash (z 7), below the Home button. Letterbox-safe, zero-emoji, claymorphism. */
  #gg-picker{position:fixed;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(130% 100% at 50% -10%,#1b2547,#0a0e1c 72%);padding:calc(env(safe-area-inset-top,0px) + 58px) 16px 22px;overflow:auto}
  #gg-picker.show{display:flex}
  .gg-step{display:none;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:940px}
  .gg-step.on{display:flex}
  .gg-title{color:#ffd968;font-size:clamp(20px,3.6vw,30px);font-weight:800;text-shadow:0 3px 0 rgba(0,0,0,.45);text-align:center;letter-spacing:.4px}
  .gg-sub{color:#bcd0ff;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13px;margin-top:-10px;text-align:center}
  .gg-heroes{display:flex;flex-wrap:wrap;gap:13px;justify-content:center}
  .gg-hero{width:150px;height:132px;border:0;border-radius:22px;cursor:pointer;position:relative;
    background:linear-gradient(180deg,#28355f,#161d34);box-shadow:0 6px 0 #0b1120,0 10px 20px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.14);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .1s ease}
  .gg-hero:active{transform:translateY(3px)}
  .gg-hero img{width:112px;height:76px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
  .gg-hero span{color:#eaf1ff;font-weight:800;font-size:14px;font-family:'Fredoka One',sans-serif}
  .gg-hero.sel{outline:4px solid #ffd968;box-shadow:0 6px 0 #b9922a,0 0 26px rgba(255,217,104,.55)}
  .gg-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:4px}
  .gg-btn{min-height:52px;padding:12px 30px;border:0;border-radius:18px;cursor:pointer;font-weight:800;font-size:17px;color:#3a2b12;
    font-family:'Fredoka One',sans-serif;background:linear-gradient(180deg,#ffe08a,#ffc531);box-shadow:0 5px 0 #d9a92e,0 9px 18px rgba(0,0,0,.4);transition:transform .08s ease}
  .gg-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d9a92e}
  .gg-btn[disabled]{opacity:.4;pointer-events:none}
  .gg-btn.ghost{background:linear-gradient(180deg,#3a466e,#28324f);color:#dfe8ff;box-shadow:0 5px 0 #161d34}
  .gg-preview{position:relative;width:230px;height:156px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 7px 11px rgba(0,0,0,.6))}
  .gg-preview img{max-width:100%;max-height:100%;object-fit:contain}
  .gg-preview .tint{position:absolute;inset:0;mix-blend-mode:multiply;pointer-events:none;
    -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
  .gg-swatches{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;max-width:540px}
  .gg-sw{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.7);cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,.5);transition:transform .1s ease}
  .gg-sw.sel{outline:4px solid #ffd968;transform:scale(1.12)}
</style>
</head>
<body>
  <button id="back" onclick="goHome()" aria-label="Kembali ke Film Anak">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3a2b12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
    <span>Beranda</span>
  </button>
  <div id="splash">
    <div class="bg" id="splashbg"></div>
    <div class="sp"></div>
    <div class="tx">Memuat game…</div>
    <div class="sub">Sebentar ya, lagi disiapin</div>
  </div>
  <!-- Custom-chaser picker (only shown for batwheels-gotham-getaway; built by JS) -->
  <div id="gg-picker">
    <div class="gg-step on" id="gg-s1">
      <div class="gg-title">Pilih Pengejarmu</div>
      <div class="gg-sub">Siapa yang akan mengejar penjahat?</div>
      <div class="gg-heroes" id="gg-heroes"></div>
      <div class="gg-row">
        <button class="gg-btn" id="gg-next" disabled>Lanjut</button>
        <button class="gg-btn ghost" id="gg-skip">Lewati</button>
      </div>
    </div>
    <div class="gg-step" id="gg-s2">
      <div class="gg-title">Warnai Mobilmu</div>
      <div class="gg-sub">Pilih warna untuk pengejarmu</div>
      <div class="gg-preview"><img id="gg-pimg" alt="pengejar"><div class="tint" id="gg-tint"></div></div>
      <div class="gg-swatches" id="gg-swatches"></div>
      <div class="gg-row">
        <button class="gg-btn" id="gg-start">Mulai Mengejar!</button>
        <button class="gg-btn ghost" id="gg-back">Kembali</button>
      </div>
    </div>
  </div>
  <div id="stage"><iframe id="frame" title="Film Anak game" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope" allowfullscreen scrolling="no"></iframe></div>
  <div id="err">
    <div style="font-size:20px;font-weight:900">Game tidak ditemukan</div>
    <a href="film-anak.html">← Kembali ke daftar Film Anak</a>
  </div>
<script>
  // Whitelist — only these slugs may be framed (no arbitrary iframe injection).
  var GAMES = {
    'batwheels-by-you':1,'batwheels-breakdown':1,'batwheels-gotham-getaway':1,
    'batwheels-playroom':1,'batwheels-match-up':1,'batwheels-pranking-prank':1,
    'batwheels-jigsaw':1,'batwheels-toy-trouble':1,'thomas-rail-muddle':1
  };
  function qs(k){ try{ return new URLSearchParams(location.search).get(k); }catch(e){ return null; } }
  var slug = (qs('g')||'').replace(/[^a-z0-9-]/g,'');
  // Each game's fixed DESIGN resolution [w,h] (measured). The iframe is locked to this size so
  // the game's own scaler renders at native design (no device-viewport zoom/crop), then we
  // transform-scale the iframe to fit. Default 16:9 for anything unmapped.
  var DIM = {
    'batwheels-breakdown':[1920,768], 'batwheels-gotham-getaway':[1920,768], 'batwheels-playroom':[1920,768],
    'batwheels-jigsaw':[1440,900], 'batwheels-match-up':[1440,900],
    'batwheels-toy-trouble':[1280,800], 'thomas-rail-muddle':[1280,800],
    'batwheels-by-you':[1280,720], 'batwheels-pranking-prank':[1280,720]
  };
  function fitStage(){
    var fr = document.getElementById('frame'); if(!fr) return;
    var d = DIM[slug] || [1280,720], W = d[0], H = d[1];
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw / W, vh / H);
    fr.style.width = W + 'px'; fr.style.height = H + 'px';
    fr.style.transform = 'translate(' + Math.round((vw - W*s)/2) + 'px,' + Math.round((vh - H*s)/2) + 'px) scale(' + s + ')';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', function(){ setTimeout(fitStage, 60); });
  var splash = document.getElementById('splash');
  function hideSplash(){ if(splash){ splash.classList.add('hide'); setTimeout(function(){ if(splash) splash.style.display='none'; }, 500); } }
  // Load the game iframe (optionally with a query, e.g. ?chaser=hero,color). Splash fades
  // once the game's own canvas is up.
  function loadGame(extra){
    fitStage();  // size the iframe BEFORE the game boots so it sees its design window
    var thumb = document.getElementById('splashbg');
    if (thumb) thumb.style.backgroundImage = "url('../assets/film-thumbs/" + slug + ".webp')";
    var fr = document.getElementById('frame');
    fr.src = 'film/' + slug + '/index.html' + (extra || '');
    document.title = 'Film Anak — ' + slug;
    var tries = 0, poll = setInterval(function(){
      tries++;
      var ready = false;
      try { var d = fr.contentDocument; if (d){ var cs = d.querySelectorAll('canvas'); for (var i=0;i<cs.length;i++){ var r=cs[i].getBoundingClientRect(); if (r.width>40 && r.height>40){ ready=true; break; } } } } catch(e){}
      if (ready || tries > 120){ clearInterval(poll); hideSplash(); }  // fallback ~48s
    }, 400);
  }

  // ---- Custom-chaser picker (gotham-getaway only): pick hero -> color -> loadGame(?chaser)
  var GG_HEROES = [['bam','Bam'],['bibi','Bibi'],['redbird','Redbird'],['batwing','Batwing'],['buff','Buff']];
  var GG_COLORS = [['Asli','ffffff'],['Merah','ff3b30'],['Oranye','ff9500'],['Kuning','ffd60a'],['Hijau','34c759'],['Toska','30d5c8'],['Biru','0a84ff'],['Ungu','af52de'],['Pink','ff2d92']];
  var ggHero = null, ggColor = 'ffffff';
  function ggImg(id){ return 'film/assets/gg-heroes/' + id + '.webp'; }
  function ggApplyTint(){ var t = document.getElementById('gg-tint'); t.style.background = (ggColor === 'ffffff') ? 'transparent' : ('#' + ggColor); }
  function showChaserPicker(){
    var pk = document.getElementById('gg-picker'); pk.classList.add('show');
    var hc = document.getElementById('gg-heroes');
    GG_HEROES.forEach(function(h){
      var btn = document.createElement('button'); btn.className = 'gg-hero';
      btn.innerHTML = '<img src="' + ggImg(h[0]) + '" alt=""><span>' + h[1] + '</span>';
      btn.onclick = function(){ ggHero = h[0];
        [].forEach.call(hc.children, function(c){ c.classList.remove('sel'); }); btn.classList.add('sel');
        document.getElementById('gg-next').disabled = false; };
      hc.appendChild(btn);
    });
    var sw = document.getElementById('gg-swatches');
    GG_COLORS.forEach(function(c, i){
      var d = document.createElement('div'); d.className = 'gg-sw' + (i === 0 ? ' sel' : ''); d.title = c[0];
      d.style.background = (c[1] === 'ffffff') ? 'linear-gradient(135deg,#fff,#dfe6f5)' : ('#' + c[1]);
      d.onclick = function(){ ggColor = c[1];
        [].forEach.call(sw.children, function(x){ x.classList.remove('sel'); }); d.classList.add('sel'); ggApplyTint(); };
      sw.appendChild(d);
    });
    document.getElementById('gg-next').onclick = function(){
      document.getElementById('gg-s1').classList.remove('on'); document.getElementById('gg-s2').classList.add('on');
      var pi = document.getElementById('gg-pimg'); pi.src = ggImg(ggHero);
      var t = document.getElementById('gg-tint'); t.style.webkitMaskImage = "url('" + ggImg(ggHero) + "')"; t.style.maskImage = "url('" + ggImg(ggHero) + "')";
      ggApplyTint();
    };
    document.getElementById('gg-back').onclick = function(){
      document.getElementById('gg-s2').classList.remove('on'); document.getElementById('gg-s1').classList.add('on'); };
    document.getElementById('gg-skip').onclick = function(){ document.getElementById('gg-picker').classList.remove('show'); loadGame(''); };
    document.getElementById('gg-start').onclick = function(){
      document.getElementById('gg-picker').classList.remove('show');
      var q = (ggColor && ggColor !== 'ffffff') ? ('?chaser=' + ggHero + ',' + ggColor) : ('?chaser=' + ggHero);
      loadGame(q);
    };
  }

  if (GAMES[slug]) {
    if (slug === 'batwheels-gotham-getaway') { showChaserPicker(); }  // pick chaser first
    else { loadGame(''); }
  } else {
    document.getElementById('frame').style.display = 'none';
    hideSplash();
    document.getElementById('err').classList.add('show');
  }
  // Always exit straight to the Film Anak hub (not history.back — a game may have pushed
  // internal states). Kids need one reliable way out.
  function goHome(){ location.href = 'film-anak.html'; }
  // gently dim to .72 when idle (still clearly visible); any tap brightens it
  var dimT;
  function wake(){ document.body.classList.remove('dim'); clearTimeout(dimT); dimT=setTimeout(function(){document.body.classList.add('dim')},5000); }
  window.addEventListener('pointerdown', wake, {passive:true});
  wake();
  // Android hardware-back / browser-back stays inside the app (no accidental exit)
</script>
<script src="sw-reload.js?v=55.69-20260628a"></script>
</body>
</html>
