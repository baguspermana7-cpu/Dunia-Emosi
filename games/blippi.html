<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6FD1">
<link rel="manifest" href="../manifest.json">
<title>Blippi Petualangan Penemuan</title>
<!-- Blippi lives in its own repo (/game1/), outside this PWA's scope: opening it directly made the installed app
     show Chrome's custom-tab bar (title + URL on the app's purple theme colour). Framing it from a page INSIDE the
     scope keeps the child in the full-screen app. game1 detects the frame and sends "home" to the top window. -->
<style>
  html, body { margin: 0; height: 100%; background: #1F6FD1; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #1F6FD1; }
</style>
</head>
<body>
<iframe id="g" src="/game1/?dari=dunia" allow="autoplay; fullscreen; screen-wake-lock" allowfullscreen title="Blippi Petualangan Penemuan"></iframe>
<script>
  // the game asks to go home through postMessage; only our own origin is listened to
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return
    if (e.data === 'blippi:home') location.href = '../index.html'
  })
  document.getElementById('g').focus()
</script>
</body>
</html>
