<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
<meta name="theme-color" content="#0B1226">
<title>🧮 Kuis Matematika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ───────────────────────────────────────────────────────
   Base + tokens
   ─────────────────────────────────────────────────────── */
:root {
  --bg:       #0B1226;
  --surface:  #131A33;
  --card:     #1A2347;
  --ink:      #F1F5F9;
  --muted:    rgba(241,245,249,0.65);
  --line:     rgba(255,255,255,0.10);
  --cyan:     #06B6D4;
  --blue:     #0EA5E9;
  --violet:   #8B5CF6;
  --pink:     #EC4899;
  --gold:     #FCD34D;
  --mint:     #34D399;
  --peach:    #FB923C;
  --red-soft: #F87171;
  --font:     'Inter', system-ui, sans-serif;
  --font-display: 'Fredoka One', cursive;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  min-height: 100%;
  height: 100svh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 15% 0%, rgba(6,182,212,0.22) 0%, transparent 45%),
    radial-gradient(ellipse at 85% 100%, rgba(139,92,246,0.20) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}
body > * { position: relative; z-index: 1; }

/* ───── Screen primitives ───── */
.scr { display: none; min-height: 100svh; padding: 16px 14px 28px; flex-direction: column; }
.scr.active { display: flex; }

.app-header {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 4px 16px;
  flex-shrink: 0;
}
.hdr-btn {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--line);
  border-radius: 14px;
  color: var(--ink);
  font-size: 18px;
  cursor: pointer;
  font-family: inherit;
}
.hdr-btn:active { transform: scale(0.95); }
.hdr-title {
  flex: 1;
  font-family: var(--font-display);
  font-size: clamp(18px, 5vw, 24px);
  text-align: center;
  background: linear-gradient(135deg, #67E8F9, #C4B5FD);
  -webkit-background-clip: text;
  color: transparent;
  letter-spacing: 0.5px;
}
.hdr-stars {
  padding: 6px 12px;
  background: linear-gradient(135deg, #FBBF24, #F59E0B);
  color: #1E1B4B;
  border-radius: 999px;
  font-weight: 900;
  font-size: 13px;
}

/* ─────────────────────────────────────────────────────
   HUB (Screen A) — 4-card menu
   ───────────────────────────────────────────────────── */
#hub-screen .hub-intro {
  text-align: center;
  padding: 18px 12px 24px;
}
#hub-screen .hub-emoji-big {
  font-size: clamp(72px, 18vw, 120px);
  filter: drop-shadow(0 12px 30px rgba(6,182,212,0.4));
  animation: hubFloat 3s ease-in-out infinite;
  display: inline-block;
}
@keyframes hubFloat {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(-8px); }
}
#hub-screen .hub-intro h1 {
  font-family: var(--font-display);
  font-size: clamp(24px, 6vw, 36px);
  margin: 10px 0 4px;
  background: linear-gradient(135deg, var(--cyan), var(--violet), var(--pink));
  -webkit-background-clip: text;
  color: transparent;
}
#hub-screen .hub-intro p {
  color: var(--muted);
  font-size: 14px;
  max-width: 460px;
  margin: 0 auto;
}
.hub-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  padding: 0 4px;
  max-width: 580px;
  margin: 0 auto;
  width: 100%;
}
@media (min-width: 540px) {
  .hub-grid { grid-template-columns: 1fr 1fr; }
}
.hub-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  padding: 20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  border: 1.5px solid var(--line);
  border-radius: 18px;
  color: var(--ink);
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  transition: transform 220ms cubic-bezier(0.34,1.56,0.64,1),
              border-color 200ms, background 200ms;
  overflow: hidden;
}
.hub-card.active {
  border-color: rgba(252,211,77,0.55);
  background: linear-gradient(135deg, rgba(252,211,77,0.10), rgba(6,182,212,0.10));
  box-shadow: 0 12px 32px rgba(252,211,77,0.18),
              inset 0 1px 0 rgba(255,255,255,0.12);
}
.hub-card.active:hover { transform: translateY(-4px); }
.hub-card.locked {
  opacity: 0.55;
  filter: saturate(0.6);
  cursor: not-allowed;
}
.hub-card.locked::after {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(135deg,
    transparent 0, transparent 12px,
    rgba(255,255,255,0.03) 12px, rgba(255,255,255,0.03) 14px);
  pointer-events: none;
}
.hub-card .hub-emoji {
  font-size: 44px;
  line-height: 1;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
}
.hub-card h3 {
  font-family: var(--font-display);
  font-size: 18px;
  margin: 4px 0 2px;
  color: var(--ink);
}
.hub-card p {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.45;
}
.hub-card .hub-cta {
  margin-top: 8px;
  padding: 6px 14px;
  background: linear-gradient(135deg, var(--cyan), var(--blue));
  color: white;
  border-radius: 999px;
  font-weight: 800;
  font-size: 12px;
}
.hub-card .coming-soon {
  margin-top: 8px;
  padding: 4px 12px;
  background: rgba(255,255,255,0.08);
  border: 1px dashed rgba(255,255,255,0.20);
  color: rgba(255,255,255,0.55);
  border-radius: 999px;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.4px;
  text-transform: uppercase;
}
.hub-card .hub-tier-pills {
  display: flex; gap: 4px; margin-top: 6px;
  flex-wrap: wrap;
}
.hub-tier-pill {
  font-family: var(--font-mono);
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  border: 1px solid var(--line);
}
.hub-tier-pill.easy   { background: rgba(6,182,212,0.18); color: #67E8F9; }
.hub-tier-pill.medium { background: rgba(139,92,246,0.18); color: #DDD6FE; }
.hub-tier-pill.hard   { background: rgba(236,72,153,0.18); color: #FBCFE8; }

/* ─────────────────────────────────────────────────────
   LEVEL GRID (Screen B) — 50 levels
   ───────────────────────────────────────────────────── */
#level-screen .level-stats {
  display: flex; gap: 10px; align-items: center; justify-content: center;
  padding: 6px 16px 20px;
  flex-wrap: wrap;
}
.tier-section {
  margin: 0 6px 16px;
}
.tier-section h4 {
  font-family: var(--font-display);
  color: var(--ink);
  font-size: 14px;
  padding: 4px 12px 10px;
  display: flex; align-items: center; gap: 8px;
}
.tier-section h4 .tier-tag {
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.5px;
}
.tier-section h4 .tier-tag.easy   { background: rgba(6,182,212,0.25); color: #67E8F9; }
.tier-section h4 .tier-tag.medium { background: rgba(139,92,246,0.25); color: #DDD6FE; }
.tier-section h4 .tier-tag.hard   { background: rgba(236,72,153,0.25); color: #FBCFE8; }
.level-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(54px, 1fr));
  gap: 8px;
  padding: 4px 6px;
  max-width: 640px;
  margin: 0 auto;
}
.lvl-btn {
  aspect-ratio: 1;
  display: grid; place-items: center;
  background: rgba(255,255,255,0.06);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 16px;
  cursor: pointer;
  position: relative;
  transition: transform 180ms cubic-bezier(0.34,1.56,0.64,1), border-color 180ms;
}
.lvl-btn:hover { transform: translateY(-2px); border-color: var(--cyan); }
.lvl-btn:active { transform: scale(0.95); }
.lvl-btn.locked {
  opacity: 0.42;
  cursor: not-allowed;
  background: rgba(0,0,0,0.30);
}
.lvl-btn.locked::after {
  content: '🔒';
  position: absolute;
  font-size: 14px;
}
.lvl-btn.locked .lvl-num { opacity: 0.30; }
.lvl-btn .star-row {
  position: absolute;
  bottom: 4px; left: 0; right: 0;
  text-align: center;
  font-size: 7px;
  letter-spacing: 0.5px;
  color: var(--gold);
  line-height: 1;
}

/* ─────────────────────────────────────────────────────
   QUIZ (Screen C)
   ───────────────────────────────────────────────────── */
#quiz-screen { padding-bottom: 80px; }
.q-pills {
  display: flex; align-items: center; gap: 6px;
}
.q-pill {
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.5px;
  border: 1px solid var(--line);
}
.q-pill.easy   { background: rgba(6,182,212,0.22); color: #67E8F9; }
.q-pill.medium { background: rgba(139,92,246,0.22); color: #DDD6FE; }
.q-pill.hard   { background: rgba(236,72,153,0.22); color: #FBCFE8; }

.progress-wrap {
  height: 5px;
  background: rgba(255,255,255,0.06);
  border-radius: 4px;
  overflow: hidden;
  margin: 0 0 14px;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
  width: 0%;
  transition: width 360ms cubic-bezier(0.22,0.61,0.36,1);
}
.ops-preview {
  display: block;
  width: max-content;
  margin: 0 auto 12px;
  padding: 7px 18px;
  background: rgba(252,211,77,0.14);
  border: 1px solid rgba(252,211,77,0.35);
  border-radius: 999px;
  color: #FDE68A;
  font-size: 13px;
  font-weight: 700;
  font-family: var(--font-mono);
  letter-spacing: 0.5px;
}
.shape-emoji {
  font-size: clamp(100px, 18vh, 200px);
  text-align: center;
  display: block;
  margin: 6px auto 14px;
  filter: drop-shadow(0 20px 44px rgba(0,0,0,0.45))
          drop-shadow(0 0 28px rgba(6,182,212,0.35));
  animation: shapeFloat 3s ease-in-out infinite;
}

/* Decorative floating math symbols — fills the empty space without
   distracting from the question. Very low opacity. */
.q-decor {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.q-decor span {
  position: absolute;
  font-family: 'Fredoka One', cursive;
  font-size: clamp(36px, 8vw, 64px);
  opacity: 0.08;
  color: var(--cyan);
  animation: decorFloat var(--dur, 16s) ease-in-out infinite;
}
.q-decor span:nth-child(1) { top: 12%;  left: 6%;   color: #06B6D4; --dur: 14s; }
.q-decor span:nth-child(2) { top: 24%;  right: 8%;  color: #8B5CF6; --dur: 18s; animation-delay: -3s; }
.q-decor span:nth-child(3) { top: 58%;  left: 4%;   color: #EC4899; --dur: 16s; animation-delay: -6s; }
.q-decor span:nth-child(4) { top: 72%;  right: 6%;  color: #FCD34D; --dur: 15s; animation-delay: -2s; }
.q-decor span:nth-child(5) { top: 38%;  left: 10%;  color: #34D399; --dur: 17s; animation-delay: -8s; }
.q-decor span:nth-child(6) { top: 85%;  right: 12%; color: #FB923C; --dur: 19s; animation-delay: -4s; }
@keyframes decorFloat {
  0%, 100% { transform: translateY(0) rotate(0); }
  50%      { transform: translateY(-20px) rotate(6deg); }
}
@keyframes shapeFloat {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(-8px); }
}
.q-text {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(28px, 6vw, 44px);
  font-weight: 400;
  color: var(--ink);
  text-align: center;
  padding: 28px 34px;
  margin: 16px auto 24px;
  max-width: 780px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid var(--line);
  border-radius: 24px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.4),
              inset 0 1px 0 rgba(255,255,255,0.10);
  line-height: 1.4;
  letter-spacing: 1px;
  position: relative;
  z-index: 2;
}
.q-text.word {
  font-family: var(--font);
  font-size: clamp(17px, 3.6vw, 21px);
  font-weight: 600;
  letter-spacing: 0;
  line-height: 1.55;
}

/* CHOICES — 2×2 grid horizontal layout (Kahoot/Duolingo style) */
.q-choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  max-width: 720px;
  margin: 0 auto;
  padding: 0 12px;
}
@media (max-width: 460px) {
  .q-choices { gap: 10px; padding: 0 6px; }
}

.q-choice {
  position: relative;
  display: flex; align-items: center; gap: 14px;
  padding: 18px 18px 18px 14px;
  min-height: 84px;
  font-family: 'Fredoka One', cursive;
  font-size: clamp(20px, 5vw, 28px);
  font-weight: 400;
  color: var(--ink);
  text-align: left;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  border: 2px solid var(--line);
  border-radius: 22px;
  cursor: pointer;
  text-shadow: 0 1px 2px rgba(0,0,0,0.30);
  box-shadow: 0 12px 32px rgba(0,0,0,0.30),
              inset 0 1px 0 rgba(255,255,255,0.10);
  transition: transform 200ms cubic-bezier(0.34,1.56,0.64,1),
              border-color 180ms, box-shadow 180ms, background-color 180ms;
}
/* Each choice gets a different gradient tint (Kahoot-inspired) for variety */
.q-choice:nth-child(1) { background: linear-gradient(140deg, rgba(6,182,212,0.18), rgba(14,116,144,0.12)); border-color: rgba(6,182,212,0.40); }
.q-choice:nth-child(2) { background: linear-gradient(140deg, rgba(14,165,233,0.18), rgba(3,105,161,0.12)); border-color: rgba(14,165,233,0.40); }
.q-choice:nth-child(3) { background: linear-gradient(140deg, rgba(139,92,246,0.18), rgba(109,40,217,0.12)); border-color: rgba(139,92,246,0.40); }
.q-choice:nth-child(4) { background: linear-gradient(140deg, rgba(236,72,153,0.18), rgba(190,24,93,0.12)); border-color: rgba(236,72,153,0.40); }

.q-choice::before {
  content: 'A';
  flex-shrink: 0;
  width: 48px; height: 48px;
  display: grid; place-items: center;
  background: linear-gradient(140deg, var(--cyan), #0E7490);
  border-radius: 14px;
  font-family: var(--font-display);
  font-size: 22px;
  color: #ECFEFF;
  box-shadow: 0 6px 16px rgba(6,182,212,0.50),
              inset 0 1px 0 rgba(255,255,255,0.30);
  text-shadow: none;
}
.q-choice:nth-child(2)::before { content: 'B'; background: linear-gradient(140deg, var(--blue), #0369A1); box-shadow: 0 6px 16px rgba(14,165,233,0.50), inset 0 1px 0 rgba(255,255,255,0.30); }
.q-choice:nth-child(3)::before { content: 'C'; background: linear-gradient(140deg, var(--violet), #6D28D9); box-shadow: 0 6px 16px rgba(139,92,246,0.50), inset 0 1px 0 rgba(255,255,255,0.30); }
.q-choice:nth-child(4)::before { content: 'D'; background: linear-gradient(140deg, var(--pink), #BE185D); box-shadow: 0 6px 16px rgba(236,72,153,0.45), inset 0 1px 0 rgba(255,255,255,0.30); }

/* Symbol layout (comparison only — 3 buttons row) */
.q-choices.symbol-row {
  grid-template-columns: 1fr 1fr 1fr;
  max-width: 540px;
}
.q-choice.symbol {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: var(--font-display);
  font-size: clamp(36px, 8vw, 56px);
  padding: 22px 14px;
  min-height: 110px;
}
.q-choice.symbol::before { display: none; }

@media (hover: hover) {
  .q-choice:hover {
    transform: translateY(-2px);
    border-color: rgba(6,182,212,0.55);
    background: rgba(6,182,212,0.10);
    box-shadow: 0 14px 32px rgba(6,182,212,0.28);
  }
}
.q-choice:active { transform: scale(0.97); background: rgba(255,255,255,0.10); }

.q-choice.correct {
  background: rgba(16,185,129,0.20) !important;
  border-color: rgba(110,231,183,0.65) !important;
  box-shadow: 0 12px 36px rgba(16,185,129,0.35),
              0 0 0 1px rgba(110,231,183,0.45) !important;
  animation: qCorrectPulse 520ms cubic-bezier(0.34,1.56,0.64,1);
}
.q-choice.correct::before {
  content: '✓' !important;
  background: linear-gradient(140deg, #10B981, #047857) !important;
}
@keyframes qCorrectPulse {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.04); }
  100% { transform: scale(1); }
}
.q-choice.wrong {
  background: rgba(251,146,60,0.18) !important;
  border-color: rgba(253,186,116,0.55) !important;
  box-shadow: 0 12px 32px rgba(251,146,60,0.28) !important;
  animation: qWrongShake 420ms ease;
}
.q-choice.wrong::before {
  content: '✕' !important;
  background: linear-gradient(140deg, var(--peach), #C2410C) !important;
}
@keyframes qWrongShake {
  0%,100% { transform: translateX(0); }
  20%     { transform: translateX(-8px); }
  40%     { transform: translateX(7px); }
  60%     { transform: translateX(-5px); }
  80%     { transform: translateX(4px); }
}
.q-choice[disabled] {
  cursor: default;
  pointer-events: none;
}
.q-choice[disabled]:not(.correct):not(.wrong) { opacity: 0.42; }

/* ─────────────────────────────────────────────────────
   RESULT (Screen D)
   ───────────────────────────────────────────────────── */
#result-screen { align-items: center; justify-content: center; text-align: center; }
.result-card {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(20px) saturate(150%);
  border: 1.5px solid rgba(252,211,77,0.40);
  border-radius: 24px;
  padding: 32px 28px;
  max-width: 480px;
  width: calc(100% - 32px);
  margin: auto;
  box-shadow: 0 30px 80px rgba(0,0,0,0.45);
}
.result-emoji {
  font-size: clamp(80px, 16vw, 120px);
  display: block;
  margin: 0 auto 8px;
  animation: hubFloat 2s ease-in-out infinite;
}
.result-card h2 {
  font-family: var(--font-display);
  font-size: clamp(24px, 6vw, 32px);
  background: linear-gradient(135deg, var(--cyan), var(--pink));
  -webkit-background-clip: text;
  color: transparent;
  margin-bottom: 4px;
}
.result-stars {
  font-size: clamp(32px, 8vw, 48px);
  letter-spacing: 4px;
  margin: 8px 0;
}
.result-detail {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 22px;
}
.result-actions {
  display: flex; gap: 12px; flex-direction: column;
}
.btn {
  padding: 14px 22px;
  border-radius: 14px;
  font-family: var(--font);
  font-weight: 800;
  font-size: 15px;
  border: none;
  cursor: pointer;
  transition: transform 180ms cubic-bezier(0.34,1.56,0.64,1);
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: linear-gradient(135deg, var(--cyan), var(--blue));
  color: white;
  box-shadow: 0 10px 26px rgba(6,182,212,0.45);
}
.btn-secondary {
  background: rgba(255,255,255,0.08);
  color: var(--ink);
  border: 1px solid var(--line);
}

/* ─────────────────────────────────────────────────────
   Streak chip + intro overlay + question transitions + confetti
   ───────────────────────────────────────────────────── */
.streak-chip {
  padding: 4px 10px;
  background: linear-gradient(135deg, var(--gold), var(--peach));
  color: #422006;
  border-radius: 999px;
  font-family: var(--font-display);
  font-size: 12px;
  letter-spacing: 0.5px;
  box-shadow: 0 4px 12px rgba(252,211,77,0.45);
  display: none;
  animation: streakPop 320ms cubic-bezier(0.34,1.56,0.64,1);
}
.streak-chip.visible { display: inline-block; }
@keyframes streakPop {
  0%   { transform: scale(0.5); opacity: 0; }
  60%  { transform: scale(1.12); opacity: 1; }
  100% { transform: scale(1); }
}

/* Question enter / exit transitions */
.q-text, .shape-emoji, .q-choices {
  transition: transform 280ms cubic-bezier(0.34,1.56,0.64,1), opacity 220ms;
}
.q-transition-out .q-text,
.q-transition-out .shape-emoji,
.q-transition-out .q-choices {
  opacity: 0;
  transform: translateY(-16px);
}
.q-transition-in .q-text,
.q-transition-in .shape-emoji,
.q-transition-in .q-choices {
  animation: qSlideIn 360ms cubic-bezier(0.34,1.56,0.64,1) backwards;
}
.q-transition-in .shape-emoji { animation-delay: 0ms; }
.q-transition-in .q-text       { animation-delay: 80ms; }
.q-transition-in .q-choices    { animation-delay: 160ms; }
@keyframes qSlideIn {
  0%   { opacity: 0; transform: translateY(16px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* Intro overlay — "READY?" / "3" / "2" / "1" / "MULAI!" */
.intro-overlay {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  background: radial-gradient(circle at center,
    rgba(11,18,38,0.85), rgba(11,18,38,0.98));
  z-index: 9000;
  pointer-events: all;
}
.intro-text {
  font-family: var(--font-display);
  font-size: clamp(56px, 16vw, 120px);
  background: linear-gradient(135deg, var(--cyan), var(--violet), var(--pink));
  -webkit-background-clip: text;
  color: transparent;
  filter: drop-shadow(0 16px 36px rgba(6,182,212,0.4));
  animation: introBurst 520ms cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes introBurst {
  0%   { transform: scale(0.3); opacity: 0; }
  60%  { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(1); }
}

/* Confetti for result screen */
.confetti-piece {
  position: absolute;
  width: 8px; height: 12px;
  pointer-events: none;
  opacity: 0;
}
.confetti-piece.go {
  animation: confettiFall 1800ms ease-out forwards;
}
@keyframes confettiFall {
  0%   { transform: translate(0, 0) rotate(0); opacity: 1; }
  100% { transform: translate(var(--cx, 0), 90vh) rotate(720deg); opacity: 0; }
}

/* Result screen — staggered star pop */
.result-stars span {
  display: inline-block;
  opacity: 0;
  transform: scale(0.3);
  animation: starPop 480ms cubic-bezier(0.34,1.56,0.64,1) forwards;
}
.result-stars span:nth-child(1) { animation-delay: 200ms; }
.result-stars span:nth-child(2) { animation-delay: 400ms; }
.result-stars span:nth-child(3) { animation-delay: 600ms; }
@keyframes starPop {
  0%   { opacity: 0; transform: scale(0.3) rotate(-20deg); }
  60%  { opacity: 1; transform: scale(1.25) rotate(0); }
  100% { opacity: 1; transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>

<script src="data/math-rules.js?v=55.45-20260627ea"></script>
<script src="data/save-engine.js?v=20260621c"></script>
<script>
(function () {
  'use strict';

  // ── Constants ──────────────────────────────────────
  const GAME_ID   = 'g25';
  const MAX_LEVEL = 50;
  // 5 shapes — owner spec (2026-06-21): ? ALWAYS at the END of equation.
  // missingOperand → inverse standard ("ans inverseOp a = ?"); was "a op ? = ans".
  // missingOperator → chained 3-operand ("a op b op c = ?"); was "a ? b = ans".
  const SHAPES    = ['standard','missingOperand','missingOperator','comparison','word'];
  const SHAPE_EMOJI = {
    standard:        '🧮',
    inverse:         '🔄',
    missingOperand:  '🔄',
    chained:         '🔗',
    missingOperator: '🔗',
    comparison:      '⚖️',
    word:            '📖'
  };
  const TIERS = {
    easy:   { label: 'EASY',   pill: 'easy',   perPage: 6,  ops: 'Hari ini: + − ×' },
    medium: { label: 'MEDIUM', pill: 'medium', perPage: 8,  ops: 'Hari ini: + − × ÷' },
    hard:   { label: 'HARD',   pill: 'hard',   perPage: 10, ops: 'Hari ini: + − × ÷' }
  };

  // 50-level distribution: easy 1-17, medium 18-34, hard 35-50
  function tierForLevel (lv) {
    if (lv <= 17) return 'easy';
    if (lv <= 34) return 'medium';
    return 'hard';
  }
  function opsLabel (tier, lv) {
    if (tier === 'easy')   return 'Hari ini: + − ×';
    if (tier === 'medium') {
      if (lv > 20) return 'Hari ini: + − × ÷';
      if (lv >= 15) return 'Hari ini: + − ×';
      return 'Hari ini: + −';
    }
    return 'Hari ini: + − × ÷';
  }

  // ── State ──────────────────────────────────────────
  const state = {
    screen: 'hub',
    level: 1,
    tier: 'easy',
    pool: [],
    idx: 0,
    correct: 0,
    wrong: 0,
    stars: 0,
    streak: 0,
    bestStreak: 0
  };

  // ── Audio (Web Audio synth — zero asset files, kid-safe) ─────
  let _audioCtx = null;
  function _ctx () {
    if (_audioCtx) return _audioCtx;
    try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { _audioCtx = null; }
    return _audioCtx;
  }
  function _tone (freq, dur, type, vol) {
    const ctx = _ctx();
    if (!ctx) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.value = 0;
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(vol || 0.18, ctx.currentTime + 0.01);
    g.gain.linearRampToValueAtTime(0, ctx.currentTime + (dur || 0.18));
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + (dur || 0.18) + 0.02);
  }
  function sfxCorrect () {
    // Cheerful arpeggio C5 → E5 → G5
    _tone(523, 0.12, 'triangle', 0.16);
    setTimeout(() => _tone(659, 0.12, 'triangle', 0.16), 90);
    setTimeout(() => _tone(784, 0.20, 'triangle', 0.18), 180);
  }
  function sfxWrong () {
    // Soft descending blip (NOT harsh)
    _tone(330, 0.16, 'sine', 0.14);
    setTimeout(() => _tone(247, 0.20, 'sine', 0.12), 110);
  }
  function sfxLevelStart () { _tone(659, 0.08, 'triangle', 0.16); }
  function sfxCountdown ()  { _tone(523, 0.06, 'square', 0.12); }
  function sfxGo ()         { _tone(880, 0.18, 'triangle', 0.20); setTimeout(() => _tone(1175, 0.24, 'triangle', 0.18), 80); }
  function sfxResultStar () { _tone(880, 0.10, 'triangle', 0.18); }
  function sfxFanfare () {
    // C-E-G-C major fanfare for high stars
    const notes = [523, 659, 784, 1047];
    notes.forEach((f, i) => setTimeout(() => _tone(f, 0.20, 'triangle', 0.18), i * 110));
  }

  // ── Haptic ───────────────────────────────────────────
  function hapticTap (pat) {
    if (navigator.vibrate) try { navigator.vibrate(pat || 12); } catch (e) {}
  }

  // ── Background music — very subtle ambient drone (Web Audio synth) ──
  // No asset files. Two slow oscillators (C3 + G3) routed through a low-pass
  // filter and a gain cap of 0.045 (~ −27 dBFS). Compliance: starts only
  // after first user gesture.
  const _bgm = {
    started: false,
    nodes: null,
    targetGain: 0.045
  };
  function startBGM () {
    const ctx = _ctx();
    if (!ctx || _bgm.started) return;
    try {
      const masterGain = ctx.createGain();
      masterGain.gain.value = 0;
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 600;
      filter.Q.value = 0.6;
      const o1 = ctx.createOscillator();
      o1.type = 'sine';
      o1.frequency.value = 130.8;     // C3
      const o2 = ctx.createOscillator();
      o2.type = 'sine';
      o2.frequency.value = 196.0;     // G3
      const o3 = ctx.createOscillator();
      o3.type = 'triangle';
      o3.frequency.value = 261.6;     // C4 — gentle high overtone
      // Slow gentle LFO on the C3 frequency for breathing feel
      const lfo = ctx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.13;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 1.2;
      lfo.connect(lfoGain);
      lfoGain.connect(o1.frequency);
      o1.connect(filter); o2.connect(filter); o3.connect(filter);
      filter.connect(masterGain);
      masterGain.connect(ctx.destination);
      o1.start(); o2.start(); o3.start(); lfo.start();
      // Fade in 1.2s
      masterGain.gain.linearRampToValueAtTime(_bgm.targetGain, ctx.currentTime + 1.2);
      _bgm.nodes = { masterGain, filter, o1, o2, o3, lfo };
      _bgm.started = true;
    } catch (e) {}
  }
  function stopBGM () {
    if (!_bgm.started || !_bgm.nodes) return;
    const ctx = _ctx();
    try {
      _bgm.nodes.masterGain.gain.cancelScheduledValues(ctx.currentTime);
      _bgm.nodes.masterGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
      setTimeout(() => {
        try {
          _bgm.nodes.o1.stop(); _bgm.nodes.o2.stop();
          _bgm.nodes.o3.stop(); _bgm.nodes.lfo.stop();
        } catch (e) {}
        _bgm.started = false;
        _bgm.nodes = null;
      }, 700);
    } catch (e) {}
  }
  // Attach BGM start to the first user interaction (autoplay policy)
  let _bgmPrimed = false;
  function primeBGMOnGesture () {
    if (_bgmPrimed) return;
    _bgmPrimed = true;
    const arm = () => {
      try { _ctx() && _ctx().resume && _ctx().resume(); } catch (e) {}
      document.removeEventListener('pointerdown', arm);
      document.removeEventListener('keydown', arm);
    };
    document.addEventListener('pointerdown', arm, { once: true, passive: true });
    document.addEventListener('keydown', arm, { once: true, passive: true });
  }
  primeBGMOnGesture();

  // ── Save helpers ───────────────────────────────────
  function loadAllStars () {
    // Try the avatar-keyed shared format first
    try {
      const fn = window._activeAvatarSlug;
      if (typeof fn === 'function') {
        const slug = fn();
        const key = slug ? 'dunia-avatar-' + slug + '-progress' : 'dunia-0-progress';
        const prog = JSON.parse(localStorage.getItem(key) || '{}');
        const g = prog[GAME_ID];
        if (g && g.stars) return g.stars;
      }
    } catch (e) {}
    return {};
  }
  function levelStars (lv) {
    const map = loadAllStars();
    return map[lv] || 0;
  }
  function totalStarsEarned () {
    const map = loadAllStars();
    return Object.values(map).reduce((s, n) => s + (n || 0), 0);
  }
  function maxUnlockedLevel () {
    // L1 always unlocked. To unlock L(n+1), need stars on L(n).
    const map = loadAllStars();
    for (let i = 1; i <= MAX_LEVEL; i++) {
      if (!map[i] || map[i] < 1) return i;
    }
    return MAX_LEVEL;
  }
  function persistLevel (lv, stars) {
    try {
      if (typeof window.saveLevelProgress === 'function') {
        window.saveLevelProgress(GAME_ID, lv, stars);
      } else {
        // Fallback — write directly
        const key = 'dunia-0-progress';
        const prog = JSON.parse(localStorage.getItem(key) || '{}');
        if (!prog[GAME_ID]) prog[GAME_ID] = { completed: [], stars: {} };
        if (!prog[GAME_ID].completed.includes(lv)) prog[GAME_ID].completed.push(lv);
        if ((prog[GAME_ID].stars[lv] || 0) < stars) prog[GAME_ID].stars[lv] = stars;
        localStorage.setItem(key, JSON.stringify(prog));
      }
    } catch (e) { console.warn('persist fail', e); }
  }

  // ── Screen routing ─────────────────────────────────
  window.showScreen = function (which) {
    state.screen = which;
    document.querySelectorAll('.scr').forEach(s => s.classList.remove('active'));
    const map = { hub:'hub-screen', level:'level-screen', quiz:'quiz-screen', result:'result-screen' };
    const el = document.getElementById(map[which]);
    if (el) el.classList.add('active');
    if (which === 'hub')   refreshHub();
    if (which === 'level') refreshLevelGrid();
    // Decor + BGM only on quiz screen
    const decor = document.getElementById('q-decor');
    if (decor) decor.style.display = (which === 'quiz') ? '' : 'none';
    if (which === 'quiz') startBGM(); else stopBGM();
    window.scrollTo({ top: 0, behavior: 'instant' });
  };

  window.goHome = function () {
    window.location.href = '../index.html';
  };

  window.confirmExitQuiz = function () {
    if (state.idx > 0 && state.idx < state.pool.length) {
      if (!confirm('Yakin keluar? Progress level ini akan hilang.')) return;
    }
    showScreen('level');
  };

  // ── HUB refresh ────────────────────────────────────
  function refreshHub () {
    document.getElementById('hub-stars').textContent = '⭐ ' + totalStarsEarned();
  }
  document.getElementById('card-quiz').addEventListener('click', function () {
    showScreen('level');
  });

  // ── LEVEL GRID ─────────────────────────────────────
  function refreshLevelGrid () {
    const unlocked = maxUnlockedLevel();
    const total = totalStarsEarned();
    const cap = MAX_LEVEL * 3;
    document.getElementById('level-stars').textContent = '⭐ ' + total + '/' + cap;
    const tiersWrap = document.getElementById('level-tiers');
    tiersWrap.innerHTML = '';

    const tierRanges = [
      { id:'easy',   range:[1,17],  label:'EASY · + − ×' },
      { id:'medium', range:[18,34], label:'MEDIUM · + − × ÷' },
      { id:'hard',   range:[35,50], label:'HARD · semua + maks 30' }
    ];
    tierRanges.forEach(function (t) {
      const sec = document.createElement('div');
      sec.className = 'tier-section';
      const h4 = document.createElement('h4');
      h4.innerHTML = '<span class="tier-tag ' + t.id + '">' + t.label + '</span>';
      sec.appendChild(h4);
      const grid = document.createElement('div');
      grid.className = 'level-grid';
      for (let lv = t.range[0]; lv <= t.range[1]; lv++) {
        const btn = document.createElement('button');
        const stars = levelStars(lv);
        const isUnlocked = lv <= unlocked;
        btn.className = 'lvl-btn' + (isUnlocked ? '' : ' locked');
        if (!isUnlocked) btn.disabled = true;
        const numEl = document.createElement('span');
        numEl.className = 'lvl-num';
        numEl.textContent = lv;
        btn.appendChild(numEl);
        if (stars > 0) {
          const sr = document.createElement('div');
          sr.className = 'star-row';
          sr.textContent = '⭐'.repeat(Math.max(1, Math.min(3, stars)));
          btn.appendChild(sr);
        }
        btn.addEventListener('click', function () {
          if (!isUnlocked) return;
          startLevel(lv);
        });
        grid.appendChild(btn);
      }
      sec.appendChild(grid);
      tiersWrap.appendChild(sec);
    });
  }

  // ── Intro overlay (READY → 3-2-1 → MULAI!) ───────────────
  function playIntro (cb) {
    const ov = document.createElement('div');
    ov.className = 'intro-overlay';
    const txt = document.createElement('div');
    txt.className = 'intro-text';
    txt.textContent = 'Ready?';
    ov.appendChild(txt);
    document.body.appendChild(ov);
    sfxLevelStart();
    const sequence = ['Ready?', '3', '2', '1', 'Mulai!'];
    let i = 0;
    function step () {
      if (i >= sequence.length) {
        ov.style.opacity = '0';
        setTimeout(() => { try { ov.remove(); } catch (e) {} cb && cb(); }, 200);
        return;
      }
      const word = sequence[i];
      txt.textContent = word;
      // Re-trigger animation
      txt.style.animation = 'none';
      void txt.offsetWidth;
      txt.style.animation = '';
      if (word === 'Mulai!') sfxGo();
      else if (word === 'Ready?') sfxLevelStart();
      else sfxCountdown();
      i++;
      const delay = (word === 'Ready?') ? 700 : (word === 'Mulai!' ? 500 : 450);
      setTimeout(step, delay);
    }
    step();
  }

  // ── QUIZ ───────────────────────────────────────────
  function startLevel (lv) {
    state.level = lv;
    state.tier = tierForLevel(lv);
    const cfg = TIERS[state.tier];
    state.pool = [];
    state.idx = 0;
    state.correct = 0;
    state.wrong = 0;
    state.stars = 0;
    state.streak = 0;
    state.bestStreak = 0;

    if (typeof window.makeMathQuestionV2 !== 'function') {
      alert('Gagal memuat math engine. Refresh halaman dan coba lagi.');
      showScreen('hub');
      return;
    }
    for (let i = 0; i < cfg.perPage; i++) {
      const shape = SHAPES[i % SHAPES.length];
      const q = window.makeMathQuestionV2(lv, MAX_LEVEL, state.tier, shape);
      state.pool.push(q);
    }
    document.getElementById('q-level').textContent = 'Lv.' + lv;
    const pill = document.getElementById('q-tier-pill');
    pill.className = 'q-pill ' + cfg.pill;
    pill.textContent = cfg.label;
    document.getElementById('q-stars').textContent = '⭐ 0';
    document.getElementById('q-streak').classList.remove('visible');
    document.getElementById('ops-preview').textContent = opsLabel(state.tier, lv);
    showScreen('quiz');
    // Play the intro overlay, then render the first question.
    playIntro(function () { renderQuestion(); });
  }

  function renderQuestion () {
    if (state.idx >= state.pool.length) return finishLevel();
    const q = state.pool[state.idx];
    const scr = document.getElementById('quiz-screen');
    // Apply enter animation by toggling class
    scr.classList.remove('q-transition-in');
    void scr.offsetWidth;     // force reflow
    scr.classList.add('q-transition-in');

    document.getElementById('q-progress').style.width = ((state.idx / state.pool.length) * 100) + '%';
    document.getElementById('shape-emoji').textContent = SHAPE_EMOJI[q.shape] || '🧮';
    const qTextEl = document.getElementById('q-text');
    qTextEl.textContent = q.q;
    qTextEl.classList.toggle('word', q.shape === 'word');

    const choicesEl = document.getElementById('q-choices');
    choicesEl.innerHTML = '';
    choicesEl.classList.remove('symbol-row');
    if (q.shape === 'comparison') {
      choicesEl.classList.add('symbol-row');
    }
    q.choices.forEach(function (c, i) {
      const btn = document.createElement('button');
      btn.className = 'q-choice';
      if (q.shape === 'comparison') btn.classList.add('symbol');
      btn.textContent = String(c);
      btn.addEventListener('click', function () { onAnswer(i, btn); });
      choicesEl.appendChild(btn);
    });
  }

  function onAnswer (idx, btn) {
    const q = state.pool[state.idx];
    const picked = q.choices[idx];
    const correct = String(picked) === String(q.ans);
    document.querySelectorAll('#q-choices .q-choice').forEach(b => b.setAttribute('disabled',''));
    btn.classList.add(correct ? 'correct' : 'wrong');
    if (!correct) {
      sfxWrong();
      hapticTap([14, 40, 14]);
      const btns = document.querySelectorAll('#q-choices .q-choice');
      for (let i = 0; i < btns.length; i++) {
        if (String(q.choices[i]) === String(q.ans)) {
          btns[i].classList.add('correct');
          break;
        }
      }
      state.wrong++;
      state.streak = 0;
      document.getElementById('q-streak').classList.remove('visible');
    } else {
      sfxCorrect();
      hapticTap(12);
      state.correct++;
      state.stars++;
      state.streak++;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;
      document.getElementById('q-stars').textContent = '⭐ ' + state.stars;
      // Show streak chip when 2 or more consecutive correct
      if (state.streak >= 2) {
        const sc = document.getElementById('q-streak');
        sc.textContent = '🔥 ×' + state.streak;
        sc.classList.add('visible');
        // Re-trigger pop animation
        sc.style.animation = 'none';
        void sc.offsetWidth;
        sc.style.animation = '';
      }
    }
    state.idx++;
    setTimeout(renderQuestion, 900);
  }

  function spawnConfetti (count) {
    const colors = ['#06B6D4', '#0EA5E9', '#8B5CF6', '#EC4899', '#FCD34D', '#34D399', '#FB923C'];
    const card = document.querySelector('#result-screen .result-card');
    if (!card) return;
    const rect = card.getBoundingClientRect();
    for (let i = 0; i < (count || 40); i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.background = colors[i % colors.length];
      p.style.left = (rect.left + rect.width * Math.random()) + 'px';
      p.style.top = rect.top + 'px';
      p.style.borderRadius = (Math.random() > 0.5 ? '50%' : '2px');
      p.style.setProperty('--cx', ((Math.random() - 0.5) * 400) + 'px');
      document.body.appendChild(p);
      requestAnimationFrame(() => p.classList.add('go'));
      setTimeout(() => { try { p.remove(); } catch (e) {} }, 2200);
    }
  }

  function finishLevel () {
    const total = state.pool.length;
    const ratio = state.correct / total;
    const stars = ratio >= 0.85 ? 3 : (ratio >= 0.6 ? 2 : (ratio >= 0.3 ? 1 : 0));
    persistLevel(state.level, stars);
    document.getElementById('q-progress').style.width = '100%';
    const emoji = stars >= 3 ? '🎉' : (stars >= 2 ? '😊' : (stars >= 1 ? '👍' : '🙂'));
    const title = stars >= 3 ? 'Sempurna!' : (stars >= 2 ? 'Hebat!' : (stars >= 1 ? 'Bagus!' : 'Lain Kali!'));
    document.getElementById('r-emoji').textContent = emoji;
    document.getElementById('r-title').textContent = title;
    // Star reveal — wrap each character in span for staggered pop
    const sr = document.getElementById('r-stars');
    sr.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const span = document.createElement('span');
      span.textContent = i < stars ? '⭐' : '☆';
      sr.appendChild(span);
      if (i < stars) setTimeout(sfxResultStar, 200 + i * 200);
    }
    const detail = 'Skor: ' + state.correct + ' dari ' + total;
    const streakBit = state.bestStreak >= 3 ? ' · Streak terbaik 🔥 ×' + state.bestStreak : '';
    document.getElementById('r-detail').textContent = detail + streakBit;
    const nextBtn = document.getElementById('r-next');
    if (state.level >= MAX_LEVEL) {
      nextBtn.style.display = 'none';
    } else {
      nextBtn.style.display = '';
      nextBtn.onclick = function () { nextLevel(); };
    }
    showScreen('result');
    // Particle + fanfare for ≥ 2 stars
    if (stars >= 2) {
      setTimeout(() => spawnConfetti(stars >= 3 ? 60 : 32), 250);
      setTimeout(sfxFanfare, 600);
    }
  }

  window.nextLevel = function () {
    if (state.level >= MAX_LEVEL) { showScreen('level'); return; }
    startLevel(state.level + 1);
  };

  // ── Boot ────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', function () {
    refreshHub();
  });
})();
</script>
</body>
</html>
