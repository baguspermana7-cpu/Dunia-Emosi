<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<meta name="theme-color" content="#2f6bd8">
<title>⚔️ Matematika Petualangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   MATEMATIKA PETUALANGAN — kids math adventure (A-344, 2026-07-12)
   Owner design match. Beranda → Peta → Sub → Pilih Skill → Game → Hasil.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --blue:#2f6bd8; --blue-d:#1e4fa8; --sky:#6db8ff;
  --green:#4caf50; --green-d:#2f8f43; --lime:#8bd44f;
  --gold:#ffcf3f; --gold-d:#e8a900; --orange:#ff8a3d; --orange-d:#e2661a;
  --purple:#7b53c9; --purple-d:#5b39a0; --pink:#ff6fae;
  --red:#e8503f; --cream:#fff6df; --parch:#f0d9a8; --parch-d:#c99a53;
  --ink:#3a2a12; --ink-soft:#6b5535; --white:#ffffff;
  --font:'Nunito',system-ui,sans-serif; --disp:'Baloo 2','Fredoka',cursive;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;height:100svh;overflow:hidden;font-family:var(--font);
  background:#0e2447;color:var(--ink);user-select:none;-webkit-user-select:none}
img{display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ── Screen system ── */
.scr{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden}
.scr.active{display:flex}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.bg-scrim{position:absolute;inset:0;z-index:1;pointer-events:none}

/* ── Clay button base ── */
.clay{border-radius:22px;font-family:var(--disp);font-weight:700;color:#fff;
  box-shadow:0 8px 0 rgba(0,0,0,.20), inset 0 3px 0 rgba(255,255,255,.45), inset 0 -6px 10px rgba(0,0,0,.14);
  transition:transform .12s cubic-bezier(.34,1.56,.64,1), box-shadow .12s;
  border:3px solid rgba(255,255,255,.55)}
.clay:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.20), inset 0 2px 0 rgba(255,255,255,.4)}
.clay.gold{background:linear-gradient(180deg,#ffe07a,var(--gold) 60%,var(--gold-d));color:#5a3d00;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.clay.green{background:linear-gradient(180deg,#a4e07a,var(--green) 60%,var(--green-d))}
.clay.blue{background:linear-gradient(180deg,#8cc4ff,var(--blue) 62%,var(--blue-d))}
.clay.orange{background:linear-gradient(180deg,#ffc38a,var(--orange) 60%,var(--orange-d))}
.clay.purple{background:linear-gradient(180deg,#c3a6ef,var(--purple) 60%,var(--purple-d))}
.clay.red{background:linear-gradient(180deg,#ff9b8f,var(--red) 60%,#b83a2c)}
.clay:disabled{filter:grayscale(.6) brightness(.85);opacity:.7;cursor:not-allowed}

/* ── Top HUD (energy/coins/gems) ── */
.hud{position:relative;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0) + 8px) 12px 8px}
.hud .spacer{flex:1}
.hud-chip{display:flex;align-items:center;gap:5px;background:rgba(20,30,55,.62);
  backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.30);border-radius:999px;
  padding:5px 12px 5px 6px;color:#fff;font-family:var(--disp);font-weight:700;font-size:15px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.2)}
.hud-chip img{width:24px;height:24px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.hud-chip small{font-size:11px;opacity:.8;font-weight:600}
.hud-chip.energy .en-timer{font-size:10px;color:#ffe08a;margin-left:2px}
.icon-btn{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;
  background:rgba(20,30,55,.55);border:2px solid rgba(255,255,255,.30);font-size:22px;color:#fff;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.2);transition:transform .12s}
.icon-btn:active{transform:scale(.9)}

/* ═════ BERANDA ═════ */
#scr-beranda .bg-scrim{background:linear-gradient(180deg,rgba(10,30,70,.05),rgba(10,30,70,.28))}
.br-hero-wrap{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;padding:0 16px 22px;text-align:center}
.br-hero{position:absolute;right:2%;bottom:12%;height:62%;max-height:520px;z-index:2;
  filter:drop-shadow(0 16px 24px rgba(0,0,0,.4));animation:heroBob 3.2s ease-in-out infinite}
@keyframes heroBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.br-title{position:relative;z-index:4;margin-bottom:auto;margin-top:6px;pointer-events:none}
.br-title h1{font-family:var(--disp);font-weight:800;line-height:.95;
  font-size:clamp(30px,8.5vw,58px);color:#ffe884;
  text-shadow:0 2px 0 var(--orange-d),0 4px 0 var(--orange-d),0 7px 12px rgba(0,0,0,.5),0 0 2px #7a4a00;
  -webkit-text-stroke:2px #7a3d00;letter-spacing:.5px}
.br-title .sub{display:inline-block;margin-top:6px;font-family:var(--disp);font-weight:700;
  font-size:clamp(13px,3.4vw,20px);color:#fff;background:linear-gradient(180deg,var(--purple),var(--purple-d));
  padding:4px 18px;border-radius:999px;-webkit-text-stroke:0;text-shadow:0 2px 2px rgba(0,0,0,.35);
  box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.5)}
.br-play{position:relative;z-index:4;font-size:clamp(22px,6vw,30px);padding:16px 46px;margin-bottom:14px;
  animation:playPulse 1.8s ease-in-out infinite}
@keyframes playPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.br-menu{position:relative;z-index:4;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:420px}
.br-menu button{width:66px;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:rgba(20,30,55,.5);border:2px solid rgba(255,255,255,.3);border-radius:18px;padding:8px 4px;
  color:#fff;font-family:var(--disp);font-weight:700;font-size:10.5px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18);transition:transform .12s}
.br-menu button:active{transform:scale(.92)}
.br-menu button img{width:34px;height:34px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}

/* ═════ MAP (peta + sub) ═════ */
.map-wrap{position:absolute;inset:0;z-index:1;overflow:hidden}
.map-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* A-346 R1: stronger tint + vignette so the owner's baked map markers recede →
   our own clean node layer + golden path is unambiguously the interactive hero. */
.map-scrim{position:absolute;inset:0;z-index:2;background:
  linear-gradient(rgba(7,16,40,.34),rgba(7,16,40,.44)),
  radial-gradient(125% 95% at 50% 42%,transparent 40%,rgba(5,12,32,.66))}
/* current-node hero "kamu di sini" pin */
.node-pin{position:absolute;left:50%;top:-46px;transform:translateX(-50%);width:40px;height:40px;
  border-radius:50%;overflow:hidden;border:3px solid #fff;background:radial-gradient(circle,#bfe0ff,#6ba7ee);
  box-shadow:0 4px 10px rgba(0,0,0,.4);animation:pinBob 1.3s ease-in-out infinite;z-index:6}
.node-pin img{width:100%;height:100%;object-fit:cover;object-position:top}
.node-pin::after{content:'';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
  border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #fff}
@keyframes pinBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
.map-topbar{position:relative;z-index:6;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0) + 8px) 12px 8px}
.map-title{flex:1;text-align:center;font-family:var(--disp);font-weight:800;font-size:clamp(16px,4.6vw,24px);
  color:#ffe884;text-shadow:0 2px 0 var(--orange-d),0 4px 8px rgba(0,0,0,.5);-webkit-text-stroke:1.4px #7a3d00}
.map-svg{position:absolute;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}
.node{position:absolute;z-index:4;transform:translate(-50%,-50%);width:56px;height:56px;
  display:grid;place-items:center;border-radius:50%;font-family:var(--disp);font-weight:800;font-size:20px;
  color:#fff;border:3px solid rgba(255,255,255,.85);cursor:pointer;
  background:linear-gradient(180deg,#8cc4ff,var(--blue) 60%,var(--blue-d));
  box-shadow:0 6px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.5);transition:transform .14s}
.node:active{transform:translate(-50%,-50%) scale(.9)}
.node.cleared{background:linear-gradient(180deg,#a4e07a,var(--green) 60%,var(--green-d))}
.node.current{background:linear-gradient(180deg,#ffe07a,var(--gold) 60%,var(--gold-d));color:#5a3d00;
  animation:nodePulse 1.4s ease-in-out infinite}
@keyframes nodePulse{0%,100%{box-shadow:0 6px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.5),0 0 0 0 rgba(255,207,63,.7)}
  50%{box-shadow:0 6px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.5),0 0 0 10px rgba(255,207,63,0)}}
.node.locked{background:linear-gradient(180deg,#9aa4b2,#5f6b7d);color:#dfe6ef;cursor:not-allowed;border-color:rgba(255,255,255,.5)}
.node.locked::after{content:'🔒';position:absolute;font-size:22px}
.node.locked .node-lbl{opacity:0}
.node .stars{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:11px;
  letter-spacing:-1px;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.node .boss{position:absolute;top:-16px;font-size:18px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}

/* ═════ PILIH SKILL ═════ */
#scr-skill{background:radial-gradient(120% 90% at 50% 0%,#3a74d8,#16305f)}
.skill-inner{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:16px;gap:14px;text-align:center;overflow-y:auto}
.skill-inner h2{font-family:var(--disp);font-weight:800;font-size:clamp(22px,6vw,34px);color:#fff;
  text-shadow:0 3px 0 rgba(0,0,0,.25)}
.skill-inner .lvl-tag{background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.3);border-radius:999px;
  padding:5px 16px;font-family:var(--disp);font-weight:700;color:#ffe884;font-size:15px}
.skill-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:380px;width:100%}
.skill-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:22px}
.skill-card img{width:54px;height:54px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.skill-card .cap{font-family:var(--disp);font-weight:700;font-size:14px}
.skill-card .mix{font-size:44px;line-height:54px}

/* ═════ GAMEPLAY ═════ */
#scr-game .bg-scrim{background:linear-gradient(180deg,rgba(8,20,45,0) 40%,rgba(8,20,45,.5))}
.game-top{position:relative;z-index:5;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0) + 8px) 12px 6px}
.hp-col{flex:1;display:flex;flex-direction:column;gap:3px}
.hp-name{font-family:var(--disp);font-weight:700;font-size:12px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.hp-bar{height:12px;border-radius:8px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.4);overflow:hidden}
.hp-fill{height:100%;border-radius:6px;transition:width .4s cubic-bezier(.22,.61,.36,1)}
.hp-fill.foe{background:linear-gradient(90deg,#ff8a6a,var(--red))}
.hearts{display:flex;gap:2px;justify-content:flex-end}
.hearts img{width:26px;height:26px}
.arena{position:relative;z-index:3;flex:0 0 clamp(44%,50%,56%);display:flex;align-items:flex-end;justify-content:space-between;padding:0 5% 0 6%}
.fighter{position:relative;text-align:center}
.fighter::after{content:'';position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
  width:78%;height:16px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.32),transparent 70%);z-index:-1}
/* glossy highlight LINE under each fighter (owner: "dikasi line buat highlight") */
.fighter::before{content:'';position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
  width:64%;height:4px;border-radius:4px;z-index:-1;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
  box-shadow:0 0 12px 2px rgba(255,255,255,.5);animation:hlPulse 2.6s ease-in-out infinite}
.hero-side::before{background:linear-gradient(90deg,transparent,rgba(140,220,120,.9),transparent);box-shadow:0 0 12px 2px rgba(120,210,90,.5)}
#fh-foe::before{background:linear-gradient(90deg,transparent,rgba(255,150,120,.9),transparent);box-shadow:0 0 12px 2px rgba(255,120,90,.5)}
@keyframes hlPulse{0%,100%{opacity:.55;width:60%}50%{opacity:1;width:70%}}
/* owner: ksatria ≥2×, monster ≥3×. Scale from the feet (transform-origin bottom)
   so bigger sprites stay grounded. clamp keeps it responsive across tablet/phone. */
.fighter img.sprite{height:clamp(150px,34vh,300px);max-height:44vh;filter:drop-shadow(0 12px 14px rgba(0,0,0,.45));transform-origin:50% 100%}
.fighter img.mon-sprite{height:clamp(210px,50vh,420px);max-height:62vh;filter:drop-shadow(0 16px 18px rgba(0,0,0,.5));animation:slimeWob 2.2s ease-in-out infinite;transform-origin:50% 100%}
.fighter .slime{font-size:clamp(150px,42vh,300px);line-height:1;filter:drop-shadow(0 14px 16px rgba(0,0,0,.45));animation:slimeWob 2s ease-in-out infinite;display:inline-block;transform-origin:50% 100%}
@keyframes slimeWob{0%,100%{transform:scaleY(1) translateY(0)}50%{transform:scaleY(.94) translateY(-6px)}}
/* subtle background parallax — driven by one cheap rAF loop (no canvas blur) */
.bgimg,.map-img{will-change:transform;transform:scale(1.1)}
/* ── dynamic layered parallax (all transforms, one rAF loop, reduced-motion safe) ── */
.mp-clouds,.mp-embers,.mp-fg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mp-clouds{z-index:2}.mp-embers{z-index:2}.mp-fg{z-index:4}
.mp-clouds i{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.92),rgba(255,255,255,0));filter:blur(1px);will-change:transform}
.mp-clouds i:nth-child(1){left:8%;top:12%;width:26%;height:16%}
.mp-clouds i:nth-child(2){left:52%;top:6%;width:34%;height:20%;opacity:.85}
.mp-clouds i:nth-child(3){left:30%;top:22%;width:20%;height:12%;opacity:.7}
.mp-fg .mp-bush{position:absolute;bottom:-3%;width:38%;height:34%;filter:blur(3px);
  background:radial-gradient(ellipse at 50% 100%,rgba(24,70,36,.6),rgba(24,70,36,0) 68%);will-change:transform}
.mp-fg .mp-bush.l{left:-8%}.mp-fg .mp-bush.r{right:-8%}
.mp-embers i{position:absolute;bottom:-4%;width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,224,140,.95),rgba(255,170,60,0) 70%);
  animation:mpEmber linear infinite;will-change:transform,opacity}
.mp-embers i:nth-child(1){left:18%;animation-duration:7s;animation-delay:0s}
.mp-embers i:nth-child(2){left:34%;animation-duration:9s;animation-delay:1.4s;width:6px;height:6px}
.mp-embers i:nth-child(3){left:60%;animation-duration:8s;animation-delay:.7s}
.mp-embers i:nth-child(4){left:74%;animation-duration:10s;animation-delay:2.2s;width:5px;height:5px}
.mp-embers i:nth-child(5){left:46%;animation-duration:8.5s;animation-delay:3s}
.mp-embers i:nth-child(6){left:86%;animation-duration:9.5s;animation-delay:1s;width:6px;height:6px}
@keyframes mpEmber{0%{transform:translateY(0) scale(.6);opacity:0}
  12%{opacity:.9}80%{opacity:.7}100%{transform:translateY(-78vh) scale(1);opacity:0}}
/* menacing soft aura behind the monster (always-on, cheap) */
#fh-foe{isolation:isolate}
#fh-foe .mon-aura{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);
  width:120%;height:78%;z-index:-1;pointer-events:none;border-radius:50%;
  background:radial-gradient(ellipse at 50% 60%,rgba(168,80,220,.42),rgba(120,40,180,.14) 55%,transparent 72%);
  filter:blur(6px);animation:monAura 2.8s ease-in-out infinite}
@keyframes monAura{0%,100%{opacity:.55;transform:translateX(-50%) scale(1)}50%{opacity:.9;transform:translateX(-50%) scale(1.08)}}
/* per-level bonus banner */
.bonus-banner{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#ffe07a,var(--gold-d));
  color:#5a3d00;font-family:var(--disp);font-weight:800;font-size:14px;padding:6px 16px;border-radius:999px;
  border:2px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.2);animation:playPulse 1.6s ease-in-out infinite}
.mon-preview{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35));animation:slimeWob 2.4s ease-in-out infinite}
.choice.right::after{content:'';position:absolute;left:8%;right:8%;bottom:5px;height:3px;border-radius:3px;background:rgba(255,255,255,.9);box-shadow:0 0 8px rgba(255,255,255,.7)}
.choice{position:relative}
/* chest reward pop */
.chest-pop{position:fixed;inset:0;z-index:75;display:grid;place-items:center;pointer-events:none}
.chest-pop img{width:120px;animation:chestBounce .8s cubic-bezier(.34,1.56,.64,1)}
@keyframes chestBounce{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.2) rotate(5deg);opacity:1}100%{transform:scale(1)}}
.hero-side img.sprite{animation:heroBob 3s ease-in-out infinite}
.attack-hero{animation:atkHero .45s ease}
@keyframes atkHero{0%{transform:translateX(0)}40%{transform:translateX(40px) rotate(-6deg)}100%{transform:translateX(0)}}
.attack-foe{animation:atkFoe .45s ease}
@keyframes atkFoe{0%{transform:translateX(0)}40%{transform:translateX(-30px)}100%{transform:translateX(0)}}
.hurt{animation:hurtShake .4s ease}
@keyframes hurtShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.dmg-pop{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-family:var(--disp);
  font-weight:800;font-size:26px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6);pointer-events:none;
  animation:dmgFly .8s ease forwards}
@keyframes dmgFly{0%{opacity:0;transform:translate(-50%,0) scale(.5)}30%{opacity:1;transform:translate(-50%,-30px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-70px)}}
/* P3d — story speech clouds over the fighters (learn math + reading) */
/* clouds float in the empty CENTER column between knight (far-left) & monster (far-right)
   so they never cover a character; width capped so a single cloud stays in the middle
   third; font kept readable (proportional, not tiny). Tail points down at the speaker. */
.mp-cloud{position:absolute;top:1%;z-index:8;width:max-content;max-width:min(300px,40%);
  padding:9px 14px;border-radius:16px;text-align:center;
  font-family:var(--body);font-weight:700;font-size:clamp(13px,2.7vw,17px);line-height:1.3;color:#3a2a12;
  background:linear-gradient(180deg,#fffdf5,#fff0cf);border:2.5px solid #d8a24a;
  box-shadow:0 6px 14px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.7);
  pointer-events:none;opacity:0;transform:translateY(6px) scale(.92);
  animation:mpCloudIn .28s cubic-bezier(.34,1.56,.64,1) forwards}
.mp-cloud.hero{left:27%;border-bottom-left-radius:4px}
.mp-cloud.foe{right:27%;border-bottom-right-radius:4px;background:linear-gradient(180deg,#fff5f5,#ffe0e0);border-color:#e0794a;color:#5a2418}
.mp-cloud::after{content:'';position:absolute;bottom:-9px;width:0;height:0;border:8px solid transparent}
.mp-cloud.hero::after{left:14%;border-top-color:#d8a24a;border-bottom:0}
.mp-cloud.foe::after{right:14%;border-top-color:#e0794a;border-bottom:0}
/* portrait: sprites meet at center (no side gap) — float the cloud in the top sky
   band above the heads instead, centered, so it never covers a face. */
@media (orientation:portrait){
  .mp-cloud.hero,.mp-cloud.foe{left:8%;right:8%;width:auto;max-width:none;top:0}
  .mp-cloud.hero::after{left:26%}.mp-cloud.foe::after{right:26%}
}
.mp-cloud.out{animation:mpCloudOut .25s ease forwards}
@keyframes mpCloudIn{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes mpCloudOut{to{opacity:0;transform:translateY(-8px) scale(.95)}}
.qpanel{position:relative;z-index:4;flex:1;display:flex;flex-direction:column;justify-content:flex-start;
  gap:10px;padding:8px 14px calc(env(safe-area-inset-bottom,0) + 14px);
  background:linear-gradient(180deg,rgba(255,246,223,0),rgba(255,246,223,.0));min-height:0;overflow-y:auto}
.qprog{height:7px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden;margin:0 2px}
.qprog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--gold),var(--orange));transition:width .35s}
.qcard{background:var(--cream);border:3px solid #fff;border-radius:22px;padding:14px 18px;text-align:center;
  font-family:var(--disp);font-weight:800;color:var(--ink);font-size:clamp(24px,7vw,40px);letter-spacing:1px;
  box-shadow:0 10px 0 rgba(0,0,0,.16),inset 0 3px 0 rgba(255,255,255,.7)}
.qcard.word{font-size:clamp(16px,4.2vw,22px);font-weight:700;letter-spacing:0;line-height:1.4}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.sym{grid-template-columns:1fr 1fr 1fr}
.choice{padding:16px 10px;border-radius:20px;font-family:var(--disp);font-weight:800;
  font-size:clamp(20px,5.5vw,30px);color:#fff;text-shadow:0 2px 2px rgba(0,0,0,.28);min-height:60px}
.choice.c0{background:linear-gradient(180deg,#8cc4ff,var(--blue) 62%,var(--blue-d))}
.choice.c1{background:linear-gradient(180deg,#a4e07a,var(--green) 60%,var(--green-d))}
.choice.c2{background:linear-gradient(180deg,#ffc38a,var(--orange) 60%,var(--orange-d))}
.choice.c3{background:linear-gradient(180deg,#c3a6ef,var(--purple) 60%,var(--purple-d))}
.choice.right{background:linear-gradient(180deg,#a4e07a,var(--green-d))!important;animation:rightPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes rightPop{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}
.choice.wrongc{background:linear-gradient(180deg,#ff9b8f,#b83a2c)!important;animation:wrongShk .4s ease}
@keyframes wrongShk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.choice:disabled{opacity:.5;filter:grayscale(.3)}
.choice.right:disabled,.choice.wrongc:disabled{opacity:1;filter:none}
.game-tools{display:flex;justify-content:center;gap:10px;margin-top:2px}
.tool-btn{display:flex;align-items:center;gap:5px;background:rgba(20,30,55,.55);border:2px solid rgba(255,255,255,.35);
  border-radius:14px;padding:6px 12px;color:#fff;font-family:var(--disp);font-weight:700;font-size:13px}
.tool-btn img{width:22px;height:22px}
.tool-btn:disabled{opacity:.45}

/* A-346 R2 — battle juice: screen shake + combo flash */
.shake-sm{animation:shakeSm .28s ease}
.shake-lg{animation:shakeLg .42s ease}
@keyframes shakeSm{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,1px)}}
@keyframes shakeLg{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-2px)}}
.combo-pop{position:fixed;left:50%;top:30%;transform:translateX(-50%);z-index:40;font-family:var(--disp);
  font-weight:800;font-size:clamp(28px,9vw,54px);color:#ffe884;-webkit-text-stroke:2px #e2661a;
  text-shadow:0 4px 10px rgba(0,0,0,.45);pointer-events:none;animation:comboPop .75s cubic-bezier(.34,1.56,.64,1)}
@keyframes comboPop{0%{opacity:0;transform:translateX(-50%) scale(.4)}40%{opacity:1;transform:translateX(-50%) scale(1.15)}100%{opacity:0;transform:translateX(-50%) scale(1) translateY(-22px)}}
.wrong-vig{position:fixed;inset:0;z-index:38;pointer-events:none;box-shadow:inset 0 0 90px 24px rgba(232,80,63,.55);opacity:0;animation:wrongVig .5s ease}
@keyframes wrongVig{0%,100%{opacity:0}30%{opacity:1}}
/* R2 super meter */
.super-wrap{position:relative;height:15px;border-radius:9px;background:rgba(0,0,0,.34);border:2px solid rgba(255,255,255,.42);overflow:hidden;margin:0 2px 6px}
.super-fill{height:100%;width:0;background:linear-gradient(90deg,#ffd54a,#ff8a3d);transition:width .3s cubic-bezier(.22,.61,.36,1)}
.super-wrap.ready{animation:superReady .8s ease-in-out infinite}
.super-wrap.ready .super-fill{width:100%!important;background:linear-gradient(90deg,#fff0a0,#ffcf3f,#ff8a3d)}
@keyframes superReady{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,207,63,.7)}50%{box-shadow:0 0 12px 3px rgba(255,207,63,.65),inset 0 0 8px rgba(255,240,160,.6)}}
.super-lbl{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:9.5px;font-family:var(--disp);font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);letter-spacing:.5px}
.super-flash{position:fixed;inset:0;z-index:42;pointer-events:none;background:radial-gradient(circle,rgba(255,244,180,.9),rgba(255,180,60,.25) 55%,transparent);opacity:0;animation:superFlash .6s ease}
@keyframes superFlash{0%,100%{opacity:0}22%{opacity:1}}
.super-txt{position:fixed;left:50%;top:24%;transform:translateX(-50%);z-index:43;font-family:var(--disp);font-weight:800;font-size:clamp(40px,12vw,82px);color:#fff;-webkit-text-stroke:3px #e2661a;text-shadow:0 6px 16px rgba(0,0,0,.5);pointer-events:none;animation:comboPop .85s cubic-bezier(.34,1.56,.64,1)}
/* R3 screen transition + unlock banner */
.scr.active{animation:scrIn .34s cubic-bezier(.22,.61,.36,1)}
@keyframes scrIn{0%{opacity:0;transform:translateY(10px) scale(.995)}100%{opacity:1;transform:translateY(0) scale(1)}}
#scr-beranda.active .br-title{animation:titleDrop .6s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes titleDrop{0%{opacity:0;transform:translateY(-26px) scale(.8)}60%{opacity:1;transform:translateY(4px) scale(1.04)}100%{transform:translateY(0) scale(1)}}
.unlock-banner{display:inline-flex;align-items:center;gap:6px;margin:0 auto 10px;background:linear-gradient(180deg,#c3a6ef,var(--purple-d));color:#fff;font-family:var(--disp);font-weight:800;font-size:14px;padding:7px 18px;border-radius:999px;border:2px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.2);animation:playPulse 1.4s ease-in-out infinite}

/* ═════ HASIL ═════ */
#scr-hasil{background:radial-gradient(120% 90% at 50% 0%,#3a74d8,#16305f);align-items:center;justify-content:center}
.result-card{position:relative;z-index:2;background:var(--cream);border:4px solid #fff;border-radius:28px;
  padding:26px 24px;max-width:400px;width:calc(100% - 36px);text-align:center;
  box-shadow:0 22px 0 rgba(0,0,0,.18),inset 0 4px 0 rgba(255,255,255,.7)}
.result-card h2{font-family:var(--disp);font-weight:800;font-size:clamp(26px,7vw,38px);color:var(--orange-d);margin-bottom:2px}
.res-stars{font-size:clamp(40px,11vw,60px);letter-spacing:2px;margin:4px 0 6px;height:1.1em}
.res-stars span{display:inline-block;opacity:0;transform:scale(.3);animation:starPop .5s cubic-bezier(.34,1.56,.64,1) forwards}
.res-stars span:nth-child(1){animation-delay:.15s}.res-stars span:nth-child(2){animation-delay:.35s}.res-stars span:nth-child(3){animation-delay:.55s}
@keyframes starPop{0%{opacity:0;transform:scale(.3) rotate(-20deg)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
.res-detail{color:var(--ink-soft);font-weight:700;font-size:15px;margin-bottom:10px}
.res-rewards{display:flex;justify-content:center;gap:14px;margin:10px 0 18px}
.res-rewards .rr{display:flex;align-items:center;gap:5px;font-family:var(--disp);font-weight:800;color:var(--ink);font-size:18px}
.res-rewards .rr img{width:30px;height:30px}
.res-actions{display:flex;flex-direction:column;gap:10px}
.res-actions button{padding:13px;font-size:17px}

/* ═════ MODALS ═════ */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(8,18,40,.72);backdrop-filter:blur(4px);padding:16px}
.modal.open{display:flex}
.sheet{background:linear-gradient(180deg,#fff9ec,#ffedcf);border:4px solid #fff;border-radius:26px;
  width:100%;max-width:440px;max-height:86svh;overflow-y:auto;padding:18px;
  box-shadow:0 22px 0 rgba(0,0,0,.2);position:relative}
.sheet h3{font-family:var(--disp);font-weight:800;font-size:24px;color:var(--purple-d);text-align:center;margin-bottom:12px}
.sheet .x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:12px;background:var(--red);
  color:#fff;font-size:20px;font-weight:800;box-shadow:0 4px 0 #a3392c}
.shop-item{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--parch);border-radius:18px;
  padding:10px 12px;margin-bottom:10px}
.shop-item img{width:44px;height:44px}
.shop-item .si-info{flex:1}
.shop-item .si-info b{font-family:var(--disp);font-size:16px;color:var(--ink)}
.shop-item .si-info small{display:block;color:var(--ink-soft);font-weight:700;font-size:12px}
.buy-btn{display:flex;align-items:center;gap:4px;padding:9px 14px;border-radius:14px;font-family:var(--disp);
  font-weight:800;font-size:15px;color:#fff}
.buy-btn img{width:20px;height:20px}
.buy-btn.coin{background:linear-gradient(180deg,#ffe07a,var(--gold-d));color:#5a3d00}
.buy-btn.gem{background:linear-gradient(180deg,#8cc4ff,var(--blue-d))}
.buy-btn:disabled{filter:grayscale(.7);opacity:.7}
.daily-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day-cell{aspect-ratio:.82;border-radius:16px;background:#fff;border:2px solid var(--parch);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--disp);font-weight:800;position:relative}
.day-cell .d-lbl{font-size:11px;color:var(--ink-soft)}
.day-cell img{width:26px;height:26px}
.day-cell .d-amt{font-size:13px;color:var(--ink)}
.day-cell.claimed{background:#d7f0d0;border-color:var(--green)}
.day-cell.claimed::after{content:'✓';position:absolute;top:4px;right:6px;color:var(--green-d);font-size:16px}
.day-cell.today{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,207,63,.4);animation:nodePulse 1.4s infinite}
.rank-row{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--parch);border-radius:14px;
  padding:8px 12px;margin-bottom:7px}
.rank-row.me{background:linear-gradient(180deg,#fff3c9,#ffe89a);border-color:var(--gold-d)}
.rank-row .rk{font-family:var(--disp);font-weight:800;font-size:17px;width:30px;text-align:center;color:var(--purple-d)}
.rank-row .rn{flex:1;font-weight:800;color:var(--ink)}
.rank-row .rs{display:flex;align-items:center;gap:4px;font-family:var(--disp);font-weight:800;color:var(--ink)}
.rank-row .rs img{width:20px;height:20px}
.prof-hero{width:110px;height:110px;margin:0 auto 8px;border-radius:50%;background:radial-gradient(circle,#bfe0ff,#6ba7ee);
  border:4px solid #fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.prof-hero img{width:96%;height:96%;object-fit:contain}
.prof-name{font-family:var(--disp);font-weight:800;font-size:22px;color:var(--ink);text-align:center}
.prof-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.pstat{background:#fff;border:2px solid var(--parch);border-radius:14px;padding:9px;text-align:center}
.pstat b{display:block;font-family:var(--disp);font-size:20px;color:var(--purple-d)}
.pstat small{color:var(--ink-soft);font-weight:700;font-size:11px}
.mute-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;font-weight:800;color:var(--ink)}
.mute-row button{padding:8px 16px;border-radius:12px;font-family:var(--disp);font-weight:800;color:#fff;background:var(--green)}

/* Tournament runner */
.tourn-run{text-align:center}
.tourn-timer{font-family:var(--disp);font-weight:800;font-size:34px;color:var(--red)}
.tourn-score{font-family:var(--disp);font-weight:800;font-size:20px;color:var(--purple-d);margin-bottom:8px}

/* Intro overlay */
.intro-ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  background:radial-gradient(circle,rgba(10,25,60,.8),rgba(8,18,40,.95))}
.intro-txt{font-family:var(--disp);font-weight:800;font-size:clamp(50px,16vw,120px);color:#ffe884;
  -webkit-text-stroke:3px #7a3d00;text-shadow:0 6px 14px rgba(0,0,0,.5);animation:introBurst .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes introBurst{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}

/* toast */
.toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:80;background:rgba(20,30,55,.92);
  color:#fff;font-family:var(--disp);font-weight:700;font-size:15px;padding:10px 20px;border-radius:999px;
  border:2px solid rgba(255,255,255,.4);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}

/* confetti */
.confp{position:fixed;width:9px;height:14px;z-index:70;pointer-events:none;opacity:0}
.confp.go{animation:conf 1.7s ease-out forwards}
@keyframes conf{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(94vh) rotate(720deg)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.05s!important}}
@media (max-width:420px){.br-hero{height:52%}.fighter img.sprite{height:clamp(120px,26vh,220px)}.fighter img.mon-sprite{height:clamp(170px,38vh,300px)}.fighter .slime{font-size:clamp(120px,32vh,220px)}}
/* short landscape (tablet): keep fighters big but leave room for the qpanel */
@media (max-height:560px){.arena{flex:0 0 46%}.fighter img.sprite{height:clamp(140px,40vh,260px)}.fighter img.mon-sprite{height:clamp(190px,58vh,360px)}}
/* P3 — landscape: fit the whole question + ALL answer choices on-screen (owner:
   baris bawah tidak terlihat). Shrink arena + scale fonts to viewport HEIGHT. */
@media (orientation:landscape) and (max-height:620px){
  #scr-game .arena{flex:0 0 30%}
  #scr-game .fighter img.sprite{height:clamp(70px,24vh,140px)}
  #scr-game .fighter img.mon-sprite{height:clamp(90px,34vh,180px)}
  #scr-game .fighter .slime{font-size:clamp(72px,28vh,150px)}
  .qpanel{gap:5px;padding:4px 12px 6px}
  .super-wrap{height:10px;margin-bottom:3px}
  .qcard{padding:5px 14px;font-size:clamp(17px,4vh,30px);box-shadow:0 5px 0 rgba(0,0,0,.16),inset 0 3px 0 rgba(255,255,255,.7)}
  .qcard.word{font-size:clamp(12px,2.8vh,18px)}
  .choices{gap:6px}
  .choice{min-height:0;padding:7px 8px;font-size:clamp(15px,3.6vh,24px)}
  .game-tools{margin-top:0}
}
/* very short landscape (≤400px tall phone) — squeeze arena further */
@media (orientation:landscape) and (max-height:400px){
  #scr-game .arena{flex:0 0 24%}
  .qcard{padding:4px 12px;font-size:clamp(15px,3.4vh,24px)}
  .choice{padding:6px 6px;font-size:clamp(14px,3.2vh,20px)}
}
</style>
</head>
<body>

<!-- ═════ BERANDA ═════ -->
<section id="scr-beranda" class="scr active">
  <img class="bgimg" src="../assets/math/bg-home.webp" alt="">
  <div class="bg-scrim"></div>
  <div class="hud">
    <div class="hud-chip energy"><img src="../assets/math/icons/icon-energy.webp" alt=""><span id="hud-energy">30</span><small>/<span id="hud-energy-max">30</span></small><span class="en-timer" id="hud-en-timer"></span></div>
    <div class="hud-chip"><img src="../assets/math/icons/icon-coin.webp" alt=""><span id="hud-coins">0</span></div>
    <div class="hud-chip"><img src="../assets/math/icons/icon-gem.webp" alt=""><span id="hud-gems">0</span></div>
    <div class="spacer"></div>
    <button class="icon-btn" onclick="MP.goHome()" aria-label="Keluar">⌂</button>
  </div>
  <div class="br-hero-wrap">
    <div class="br-title"><h1>MATEMATIKA</h1><h1>PETUALANGAN</h1><br><span class="sub">Kalahkan Raja Iblis!</span></div>
    <img class="br-hero" src="../assets/math/hero-mathhero.webp" alt="MathHero">
    <button class="br-play clay gold" onclick="MP.openPeta()">▶ MAIN</button>
    <div class="br-menu">
      <button onclick="MP.openModal('shop')"><img src="../assets/icons/main/cart.webp" alt="" onerror="this.src='../assets/math/icons/cat-practice.webp'">Toko</button>
      <button onclick="MP.openModal('daily')"><img src="../assets/icons/item/calendar.webp" alt="" onerror="this.src='../assets/math/icons/cat-daily.webp'">Harian</button>
      <button onclick="MP.openModal('turnamen')"><img src="../assets/icons/item/trophy.webp" alt="" onerror="this.src='../assets/math/icons/cat-tournament.webp'">Turnamen</button>
      <button onclick="MP.openModal('rank')"><img src="../assets/icons/item/medal.webp" alt="" onerror="this.src='../assets/math/icons/cat-adventure.webp'">Peringkat</button>
      <button onclick="MP.openModal('profil')"><img src="../assets/math/hero-mathhero.webp" alt="" style="border-radius:50%;background:rgba(255,255,255,.25)">Profil</button>
    </div>
  </div>
</section>

<!-- ═════ PETA (main map) ═════ -->
<section id="scr-peta" class="scr">
  <div class="map-wrap">
    <img class="map-img" id="peta-bg" src="../assets/math/map-main.webp" alt="">
    <div class="map-scrim"></div>
  </div>
  <div class="map-topbar">
    <button class="icon-btn" onclick="MP.show('beranda')">←</button>
    <div class="map-title">PETA PETUALANGAN</div>
    <div class="hud-chip energy"><img src="../assets/math/icons/icon-energy.webp" alt=""><span class="hud-energy2">30</span></div>
  </div>
  <svg class="map-svg" id="peta-svg" preserveAspectRatio="none"></svg>
  <div id="peta-nodes"></div>
</section>

<!-- ═════ SUB-LEVEL map ═════ -->
<section id="scr-sub" class="scr">
  <div class="map-wrap">
    <img class="map-img" id="sub-bg" src="../assets/math/sub-1.webp" alt="">
    <div class="map-scrim"></div>
  </div>
  <div class="map-topbar">
    <button class="icon-btn" onclick="MP.openPeta()">←</button>
    <div class="map-title" id="sub-title">DUNIA 1</div>
    <div class="hud-chip energy"><img src="../assets/math/icons/icon-energy.webp" alt=""><span class="hud-energy2">30</span></div>
  </div>
  <svg class="map-svg" id="sub-svg" preserveAspectRatio="none"></svg>
  <div id="sub-nodes"></div>
</section>

<!-- ═════ PILIH SKILL ═════ -->
<section id="scr-skill" class="scr">
  <div class="skill-inner">
    <button class="icon-btn" style="position:absolute;top:calc(env(safe-area-inset-top,0) + 10px);left:12px" onclick="MP.backToSub()">←</button>
    <h2>Pilih Skill</h2>
    <div id="skill-mon-wrap"><img class="mon-preview" id="skill-mon" alt="" onerror="this.style.display='none'"></div>
    <span class="lvl-tag" id="skill-lvl">Level 1-1</span>
    <div id="skill-bonus"></div>
    <div class="skill-grid" id="skill-grid"></div>
  </div>
</section>

<!-- ═════ GAMEPLAY ═════ -->
<audio id="math-bgm" src="../assets/audio/math-bgm.mp3?v=59.23" loop preload="none" style="display:none"></audio>
<section id="scr-game" class="scr">
  <img class="bgimg" src="../assets/math/bg-battle.webp" alt="">
  <!-- dynamic parallax layers (perf-safe: transforms driven by ONE rAF loop) -->
  <div class="mp-clouds" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="mp-embers" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="bg-scrim"></div>
  <div class="mp-fg" aria-hidden="true"><i class="mp-bush l"></i><i class="mp-bush r"></i></div>
  <div class="game-top">
    <button class="icon-btn" onclick="MP.quitGame()">←</button>
    <div class="hp-col">
      <div class="hp-name" id="foe-name">👾 Monster</div>
      <div class="hp-bar"><div class="hp-fill foe" id="foe-hp" style="width:100%"></div></div>
    </div>
    <div class="hearts" id="hearts"></div>
  </div>
  <div class="arena">
    <div class="fighter hero-side" id="fh-hero"><img class="sprite" src="../assets/math/hero-mathhero.webp" alt=""></div>
    <div class="fighter" id="fh-foe"><div class="mon-aura"></div><div id="foe-holder"><span class="slime">👾</span></div></div>
  </div>
  <div class="qpanel">
    <div class="qprog"><i id="qprog"></i></div>
    <div class="super-wrap" id="super-wrap"><div class="super-fill" id="super-fill"></div><span class="super-lbl" id="super-lbl">⚡ SUPER</span></div>
    <div class="qcard" id="qcard">…</div>

<script>
(function(){
'use strict';
var GAME_ID='g25', WORLDS=10, SUBS=10, MAX_LEVEL=WORLDS*SUBS;
var A='../assets/math/', IC=A+'icons/', MON=A+'monsters/', MON_COUNT=81;
var PK='../assets/icons/'; // Free Icon Pack v3.1 (@gvesster) — crisp UI/economy icons
function pkIcon(p,sz){ return '<img src="'+PK+p+'.webp" style="width:'+(sz||20)+'px;height:'+(sz||20)+'px;vertical-align:-4px" alt="" onerror="this.style.display=\'none\'">'; }
function monSrc(g){ return MON+'mon-'+(((g-1)%MON_COUNT)+1)+'.webp'; }
function monFallbackEmoji(g){ var e=['👾','👹','🐲','🦊','👻','🧟','🐙','🍄','⭐','🐉']; return e[(g-1)%e.length]; }

/* per-level bonus variety (owner: "bonus berbeda2") — MATH-only modifiers */
function bonusFor(g){
  if(g%10===0) return {id:'boss',label:'👑 Boss! Trofi & Peti',coin:1,chest:true};
  if(g%5===0)  return {id:'coin2',label:'🪙 Bonus Koin ×2',coin:2};
  if(g%7===0)  return {id:'gem',label:'💎 Peluang Permata',coin:1,gem:true};
  if(g%3===0)  return {id:'fever',label:'🔥 Streak Fever',coin:1,fever:true};
  return {id:'none',label:'',coin:1};
}

/* ── economy state ── */
var ENERGY_MAX=30, ENERGY_REGEN_MS=5*60*1000, LEVEL_COST=1, HEARTS_BASE=3;
var econ;
function loadEcon(){
  try{ econ=JSON.parse(localStorage.getItem('mp_econ')||'null'); }catch(e){ econ=null; }
  if(!econ) econ={};
  econ.energy = (econ.energy==null)?ENERGY_MAX:econ.energy;
  econ.energyTs = econ.energyTs||Date.now();
  econ.coins = econ.coins||0; econ.gems = econ.gems==null?5:econ.gems; econ.trophies=econ.trophies||0;
  econ.bombs = econ.bombs==null?2:econ.bombs; econ.extraHearts=econ.extraHearts||0;
  econ.name = econ.name||'Pahlawan';
  econ.daily = econ.daily||{lastClaim:'',streak:0};
  econ.stats = econ.stats||{played:0,correct:0,wrong:0,bestStreak:0,cleared:0};
  regenEnergy();
}
function saveEcon(){ try{ localStorage.setItem('mp_econ',JSON.stringify(econ)); }catch(e){} }
function regenEnergy(){
  if(econ.energy>=ENERGY_MAX){ econ.energyTs=Date.now(); return; }
  var el=Date.now()-econ.energyTs, gain=Math.floor(el/ENERGY_REGEN_MS);
  if(gain>0){ econ.energy=Math.min(ENERGY_MAX,econ.energy+gain); econ.energyTs+=gain*ENERGY_REGEN_MS; if(econ.energy>=ENERGY_MAX) econ.energyTs=Date.now(); }
}
function energyTimerStr(){
  if(econ.energy>=ENERGY_MAX) return '';
  var rem=ENERGY_REGEN_MS-((Date.now()-econ.energyTs)%ENERGY_REGEN_MS);
  var m=Math.floor(rem/60000), s=Math.floor((rem%60000)/1000);
  return m+':'+(s<10?'0':'')+s;
}
function addCoins(n){ econ.coins+=n; saveEcon(); refreshHUD(); }
function addGems(n){ econ.gems+=n; saveEcon(); refreshHUD(); }

/* ── level-star persistence (shared save-engine) ── */
function allStars(){
  try{
    if(typeof window.saveLevelProgress==='function' && typeof window._activeAvatarSlug==='function'){
      var slug=window._activeAvatarSlug();
      var key=slug?'dunia-avatar-'+slug+'-progress':'dunia-0-progress';
      var p=JSON.parse(localStorage.getItem(key)||'{}');
      if(p[GAME_ID]&&p[GAME_ID].stars) return p[GAME_ID].stars;
    }
    var p2=JSON.parse(localStorage.getItem('dunia-0-progress')||'{}');
    if(p2[GAME_ID]&&p2[GAME_ID].stars) return p2[GAME_ID].stars;
  }catch(e){}
  return {};
}
function starsOf(g){ return allStars()[g]||0; }
function totalStars(){ var m=allStars(),s=0; for(var k in m) s+=(m[k]||0); return s; }
function maxUnlocked(){ var m=allStars(); for(var i=1;i<=MAX_LEVEL;i++){ if(!m[i]||m[i]<1) return i; } return MAX_LEVEL; }
function persist(g,stars){
  try{
    if(typeof window.saveLevelProgress==='function'){ window.saveLevelProgress(GAME_ID,g,stars); }
    else{
      var key='dunia-0-progress', p=JSON.parse(localStorage.getItem(key)||'{}');
      if(!p[GAME_ID]) p[GAME_ID]={completed:[],stars:{}};
      if(p[GAME_ID].completed.indexOf(g)<0) p[GAME_ID].completed.push(g);
      if((p[GAME_ID].stars[g]||0)<stars) p[GAME_ID].stars[g]=stars;
      localStorage.setItem(key,JSON.stringify(p));
    }
  }catch(e){}
}

/* ── difficulty ── */
function tierFor(g){ if(g<=34) return 'easy'; if(g<=67) return 'medium'; return 'hard'; }
// P8: owner "level 2 udah angka 20an — harusnya ~80% level masih <20". Gentle ramp
// over the 100 levels (10 worlds × 10 subs): first ~80 stay under 20.
function maxNumFor(g){
  if(g<=20) return 10;   // worlds 1-2
  if(g<=45) return 12;   // worlds 3-4(+)
  if(g<=65) return 15;   // worlds 5-6(+)
  if(g<=80) return 18;   // worlds 7-8 — still <20 (≈80% of levels)
  if(g<=90) return 25;   // world 9
  if(g<=96) return 40;   // world 10 early
  return 60;             // Raja Iblis finale
}
function qCountFor(g){ var t=tierFor(g); return t==='easy'?6:(t==='medium'?8:10); }

/* ── SFX helpers (shared engine, synth fallback built-in) ── */
var S=window.SFXEngine;
function sfx(name){ if(S&&S.cue) try{ S.cue(name); }catch(e){} }
// ── looping backsound (Forest Adventure) — plays during gameplay, honours mute ──
function bgmMuted(){ try{ return !!(S&&S.getMute&&S.getMute()); }catch(e){ return false; } }
function bgmPlay(){ try{ var a=byId('math-bgm'); if(!a||bgmMuted()) return; a.volume=0.42; var p=a.play(); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
function bgmStop(){ try{ var a=byId('math-bgm'); if(a){ a.pause(); a.currentTime=0; } }catch(e){} }

/* ── HUD ── */
function refreshHUD(){
  regenEnergy();
  set('hud-energy',econ.energy); set('hud-energy-max',ENERGY_MAX);
  set('hud-coins',econ.coins); set('hud-gems',econ.gems);
  var t=energyTimerStr(); var el=byId('hud-en-timer'); if(el) el.textContent=t?('+'+t):'';
  Array.prototype.forEach.call(document.querySelectorAll('.hud-energy2'),function(e){ e.textContent=econ.energy; });
  set('bomb-n',econ.bombs);
}
setInterval(function(){ if(byId('scr-beranda').classList.contains('active')||byId('scr-peta').classList.contains('active')) refreshHUD(); },1000);

/* ── util ── */
function byId(id){ return document.getElementById(id); }
function set(id,v){ var e=byId(id); if(e) e.textContent=v; }
function toast(msg){ var t=byId('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('show'); },1600); }
function countUp(id,to,dur){ var el=byId(id); if(!el) return; var t0=null; function step(ts){ if(!t0)t0=ts; var p=Math.min(1,(ts-t0)/(dur||600)); el.textContent=Math.round(to*(p<1?1-Math.pow(1-p,3):1)); if(p<1) requestAnimationFrame(step); } requestAnimationFrame(step); }

/* ── navigation ── */
var curWorld=1, curSub=1, curSkill=null;
function show(which){
  Array.prototype.forEach.call(document.querySelectorAll('.scr'),function(s){ s.classList.remove('active'); });
  byId('scr-'+which).classList.add('active');
  if(which==='beranda'||which==='peta'||which==='sub') refreshHUD();
}

/* ── node position templates (%,%) — my interactive layer over owner art ── */
var PETA_POS=[[52,79],[35,74],[73,73],[60,64],[26,58],[45,52],[19,45],[58,40],[37,34],[68,27]];
var SUB_POS=[[16,74],[33,62],[26,42],[45,32],[52,54],[65,66],[41,82],[62,44],[78,74],[86,42]];

function renderPeta(){
  var host=byId('peta-nodes'); host.innerHTML='';
  var svg=byId('peta-svg'); svg.innerHTML=pathSVG(PETA_POS);
  var mu=maxUnlocked();
  for(var w=1;w<=WORLDS;w++){
    var base=(w-1)*SUBS; // global level of this world's sub-1
    var cleared=true, anyUnlocked=false, wStars=0;
    for(var s=1;s<=SUBS;s++){ var g=base+s; wStars+=starsOf(g); if(g<=mu) anyUnlocked=true; if(!starsOf(g)) cleared=false; }
    var isCurrent=(base+1<=mu)&&!cleared;
    var cls='node'+(cleared?' cleared':(anyUnlocked?(isCurrent?' current':''):' locked'));
    var n=document.createElement('div'); n.className=cls;
    n.style.left=PETA_POS[w-1][0]+'%'; n.style.top=PETA_POS[w-1][1]+'%';
    n.innerHTML='<span class="node-lbl">'+w+'</span>'+(w===WORLDS?'<span class="boss">👹</span>':'')+
      (wStars>0?'<span class="stars">'+starRow(wStars,SUBS*3)+'</span>':'')+
      (isCurrent?'<div class="node-pin"><img src="'+A+'hero-mathhero.webp" alt=""></div>':'');
    (function(world,unlocked){ n.onclick=function(){ sfx('click'); if(!unlocked){ toast('Selesaikan dunia sebelumnya!'); return; } openSub(world); }; })(w,anyUnlocked);
    host.appendChild(n);
  }
}
function starRow(got,max){ var full=Math.round(got/max*3); return '★★★'.slice(0,Math.max(0,Math.min(3,full)))||''; }

function openPeta(){ renderPeta(); show('peta'); }
function openSub(w){
  curWorld=w; byId('sub-bg').src=A+'sub-'+w+'.webp';
  set('sub-title','DUNIA '+w); renderSub(); show('sub');
}
function renderSub(){
  var host=byId('sub-nodes'); host.innerHTML='';
  byId('sub-svg').innerHTML=pathSVG(SUB_POS);
  var mu=maxUnlocked(), base=(curWorld-1)*SUBS;
  for(var s=1;s<=SUBS;s++){
    var g=base+s, st=starsOf(g), unlocked=g<=mu;
    var isCurrent=(g===mu);
    var cls='node'+(st>0?' cleared':(unlocked?(isCurrent?' current':''):' locked'));
    var n=document.createElement('div'); n.className=cls;
    n.style.left=SUB_POS[s-1][0]+'%'; n.style.top=SUB_POS[s-1][1]+'%';
    n.innerHTML='<span class="node-lbl">'+curWorld+'-'+s+'</span>'+(s===SUBS?'<span class="boss">👑</span>':'')+
      (st>0?'<span class="stars">'+'⭐'.repeat(st)+'</span>':'')+
      (isCurrent?'<div class="node-pin"><img src="'+A+'hero-mathhero.webp" alt=""></div>':'');
    (function(sub,unl){ n.onclick=function(){ sfx('click'); if(!unl){ toast('Terkunci 🔒'); return; } openSkill(sub); }; })(s,unlocked);
    host.appendChild(n);
  }
}
function pathSVG(pos){
  var d='M '+pos[0][0]+' '+pos[0][1];
  for(var i=1;i<pos.length;i++){ var a=pos[i-1],b=pos[i],mx=(a[0]+b[0])/2; d+=' Q '+mx+' '+a[1]+' '+b[0]+' '+b[1]; }
  return '<path d="'+d+'" fill="none" stroke="rgba(255,236,170,.85)" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2.4 2.4" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))"/>';
}

/* ── Pilih Skill ── */
var SKILLS=[
  {op:'+',img:IC+'skill-add.webp',cap:'Tambah'},
  {op:'-',img:IC+'skill-sub.webp',cap:'Kurang'},
  {op:'*',img:IC+'skill-mul.webp',cap:'Kali'},
  {op:'÷',img:IC+'skill-div.webp',cap:'Bagi'}
];
var skillSel=[];  // P8 — multi-select: chosen operators for this level
function openSkill(sub){
  curSub=sub; var g=(curWorld-1)*SUBS+sub;
  set('skill-lvl','Level '+curWorld+'-'+sub+'  ·  angka ≤'+maxNumFor(g));
  var mimg=byId('skill-mon'); mimg.style.display=''; mimg.src=monSrc(g);
  var bn=bonusFor(g); byId('skill-bonus').innerHTML=bn.label?('<span class="bonus-banner">'+bn.label+'</span>'):'';
  var grid=byId('skill-grid'); grid.innerHTML=''; skillSel=[];
  var tier=tierFor(g);
  SKILLS.forEach(function(sk){
    // gate ×/÷ by tier unless the player has reached those worlds
    var locked=(sk.op==='*'&&tier==='easy'&&g<15)||(sk.op==='÷'&&tier!=='hard'&&g<35);
    var b=document.createElement('button'); b.className='skill-card clay '+(sk.op==='+'?'green':sk.op==='-'?'blue':sk.op==='*'?'orange':'purple');
    b.innerHTML='<img src="'+sk.img+'" alt=""><span class="cap">'+sk.cap+'</span>';
    if(locked){ b.disabled=true; b.innerHTML+='<span class="cap" style="font-size:10px">🔒 nanti</span>'; }
    else b.onclick=function(){ sfx('click'); toggleSkill(sk.op,b); };
    grid.appendChild(b);
  });
  // P8 — multi-select: pick one or more ops, then Mulai. Campur = all ops.
  var start=document.createElement('button'); start.id='skill-start'; start.className='skill-card clay gold'; start.style.gridColumn='1 / -1'; start.disabled=true; start.style.opacity='.55';
  start.innerHTML='<span class="mix">▶</span><span class="cap">Pilih skill dulu</span>';
  start.onclick=function(){ if(!skillSel.length)return; sfx('click'); startGame(skillSel.slice()); };
  grid.appendChild(start);
  var mix=document.createElement('button'); mix.className='skill-card clay purple'; mix.style.gridColumn='1 / -1';
  mix.innerHTML='<span class="mix">🎲</span><span class="cap">Campur (Semua)</span>';
  mix.onclick=function(){ sfx('click'); startGame(null); };
  grid.appendChild(mix);
  show('skill');
}
function toggleSkill(op,btn){
  var i=skillSel.indexOf(op);
  if(i>=0){ skillSel.splice(i,1); btn.style.outline=''; btn.style.boxShadow=''; }
  else { skillSel.push(op); btn.style.outline='3px solid #fff'; btn.style.boxShadow='0 0 0 5px rgba(255,255,255,.35)'; }
  var s=byId('skill-start'); var cap=s.querySelector('.cap');
  if(skillSel.length){ s.disabled=false; s.style.opacity='1'; cap.textContent='▶ Mulai ('+skillSel.length+' skill)'; }
  else { s.disabled=true; s.style.opacity='.55'; cap.textContent='Pilih skill dulu'; }
}
function backToSub(){ openSub(curWorld); }

/* ── Gameplay ── */
var game=null;
function startGame(ops){  // P8: ops = array of chosen operators, or null = campur (all)
  if(ops&&!(ops instanceof Array)) ops=[ops];  // tolerate a bare op string
  regenEnergy();
  if(econ.energy<LEVEL_COST){ toast('⚡ Energi habis! Tunggu isi ulang atau beli di Toko.'); openModal('shop'); return; }
  econ.energy-=LEVEL_COST; econ.energyTs=(econ.energy===ENERGY_MAX-1)?Date.now():econ.energyTs; saveEcon(); refreshHUD();
  var g=(curWorld-1)*SUBS+curSub, tier=tierFor(g), n=qCountFor(g), mn=maxNumFor(g);
  var specific=!!(ops&&ops.length);
  // P8: when a specific op-set is chosen, drop the inverse shape — its display flips
  // the operator (+ shown as −, × as ÷) which reads as a different operation and
  // leaked "pengurangan" into a "Tambah" drill. Campur keeps all shapes.
  var shapes=specific
    ? ['standard','missingOperator','comparison','word']
    : ['standard','missingOperand','missingOperator','comparison','word'];
  var pool=[];
  for(var i=0;i<n;i++){
    var sh=shapes[i%shapes.length];
    var q=window.makeMathQuestionV2(g,MAX_LEVEL,tier,sh,{maxNum:mn,forceOps:specific?ops:null});
    pool.push(q);
  }
  game={g:g,pool:pool,idx:0,correct:0,wrong:0,streak:0,best:0,hearts:HEARTS_BASE+Math.min(2,econ.extraHearts),foeMax:n,bonus:bonusFor(g),super:0,superReady:false};
  updateSuper();
  curSkill=specific?ops.slice():null;
  // P3b — hero sprite changes per chosen operation (Pahlawan + / Ksatria − × ÷). Primary op = first chosen; campur = Pahlawan.
  try {
    if(window.MATH_HEROES){
      var _hero=window.MATH_HEROES.byOp(specific?ops[0]:'+');
      if(_hero&&_hero.art){
        var _hb=byId('fh-hero'), _hbimg=_hb&&_hb.querySelector('img.sprite'); if(_hbimg) _hbimg.src=_hero.art;
        var _brh=document.querySelector('.br-hero'); if(_brh) _brh.src=_hero.art;
      }
    }
  } catch(_){}
  // P3d — real per-level monster name from the story arc (replaces the "👾 Monster W-S" placeholder)
  var _arc=null;
  try { if(window.MATH_STORIES) _arc=window.MATH_STORIES.get(curWorld,curSub); } catch(_){}
  set('foe-name', (_arc&&_arc.monster) ? ('👾 '+_arc.monster) : ('👾 Monster '+curWorld+'-'+curSub));
  game.arc=_arc||null; game.banterIdx=0;   // P3d story-mode banter cursor
  byId('foe-holder').innerHTML='<img class="mon-sprite" src="'+monSrc(g)+'" alt="" onerror="this.outerHTML=\'<span class=&quot;slime&quot;>'+monFallbackEmoji(g)+'</span>\'">';
  byId('foe-hp').style.width='100%';
  show('game'); bgmPlay();
  playIntro(function(){ mpStoryIntro(); renderQ(); });
}
// P3d — story speech clouds. One cloud per side at a time; anchored over hero / foe.
function mpCloud(who,text,ms){
  try{
    var arena=document.querySelector('#scr-game .arena'); if(!arena||!text) return;
    var side=(who==='hero')?'hero':'foe';
    var old=arena.querySelector('.mp-cloud.'+side); if(old){ try{old.remove();}catch(e){} }
    var c=document.createElement('div'); c.className='mp-cloud '+side; c.textContent=text; arena.appendChild(c);
    setTimeout(function(){ if(!c.parentNode) return; c.classList.add('out'); setTimeout(function(){ try{c.remove();}catch(e){} },260); }, ms||2600);
  }catch(e){}
}
function mpStoryIntro(){ var a=game&&game.arc; if(a&&a.intro) mpCloud('foe',a.intro,3000); }
// advance one banter line per answered question (correct or wrong) — builds the story to the end
function mpStepBanter(){
  var a=game&&game.arc; if(!a||!a.banter||!a.banter.length) return;
  if(game.banterIdx>=a.banter.length) return;
  var line=a.banter[game.banterIdx++]; if(line&&line.text) mpCloud(line.who==='hero'?'hero':'foe',line.text,2400);
}
function mpVictory(){ var a=game&&game.arc; if(a&&a.victory) mpCloud('hero',a.victory,3200); }
function renderHearts(){
  var h=byId('hearts'); h.innerHTML='';
  var total=HEARTS_BASE+Math.min(2,econ.extraHearts);
  for(var i=0;i<total;i++){ var im=document.createElement('img'); im.src=IC+(i<game.hearts?'icon-heart.webp':'icon-heart-empty.webp'); h.appendChild(im); }
}
function playIntro(cb){
  var ov=document.createElement('div'); ov.className='intro-ov';
  var t=document.createElement('div'); t.className='intro-txt'; ov.appendChild(t); document.body.appendChild(ov);
  var seq=['Siap?','3','2','1','Mulai!'],i=0;
  (function step(){
    if(i>=seq.length){ ov.style.opacity='0'; ov.style.transition='opacity .2s'; setTimeout(function(){ try{ov.remove();}catch(e){} cb&&cb(); },200); return; }
    t.textContent=seq[i]; t.style.animation='none'; void t.offsetWidth; t.style.animation='';
    if(seq[i]==='Mulai!') sfx('levelup'); else if(i>0) sfx('click');
    i++; setTimeout(step, i===1?650:450);
  })();
}
function renderQ(){
  renderHearts();
  if(game.idx>=game.pool.length) return finish();
  var q=game.pool[game.idx];
  byId('qprog').style.width=(game.idx/game.pool.length*100)+'%';

function answer(btn,picked,q){

    game.correct++; game.streak++; if(game.streak>game.best) game.best=game.streak;
    heroAttack(); coinBurst(); juiceHit(true,game.streak);
    var mult=(game.bonus&&game.bonus.coin)||1;
    var superBonus=0;

    else { game.super=Math.min(1,game.super+0.25); if(game.super>=1) game.superReady=true; }
    updateSuper();

  }else{
    btn.classList.add('wrongc'); sfx('wrong');
    Array.prototype.forEach.call(byId('choices').children,function(b){ if(String(b.textContent)===String(q.ans)) b.classList.add('right'); });
    game.wrong++; game.streak=0; game.hearts--;
    game.super=0; game.superReady=false; updateSuper();
    foeAttack(); renderHearts(); juiceHit(false,0);
    mpStepBanter();   // cerita tetap berlanjut walau jawaban salah (latihan membaca)
    if(navigator.vibrate) try{ navigator.vibrate([15,40,15]); }catch(e){}

function finish(failed){
  var total=game.pool.length, ratio=game.correct/total;
  var stars=failed?(ratio>=0.3?1:0):(ratio>=0.85?3:(ratio>=0.6?2:(ratio>=0.3?1:0)));
  persist(game.g,stars);
  // economy rewards
  var coinReward=game.correct*3+(stars===3?30:stars===2?15:0);
  var gemReward=(stars===3&&starsOf(game.g)<3?1:0)+(game.g%10===0&&stars>=2?1:0);
  if(game.bonus&&game.bonus.gem&&stars>=2) gemReward+=1;
  if(gemReward>0) econ.gems+=gemReward;
  var showChest=(!failed)&&((game.bonus&&game.bonus.chest&&stars>=1)||stars>=3);
  econ.stats.played++; econ.stats.correct+=game.correct; econ.stats.wrong+=game.wrong;
  if(game.best>econ.stats.bestStreak) econ.stats.bestStreak=game.best;
  econ.stats.cleared=Math.max(econ.stats.cleared,maxUnlocked()-1);
  saveEcon();
  byId('qprog').style.width='100%';
  var win=stars>=1&&!failed;
  set('res-title', failed?'Kalah…':(stars>=3?'Sempurna!':stars>=2?'Hebat!':stars>=1?'Bagus!':'Coba Lagi!'));
  var sr=byId('res-stars'); sr.innerHTML='';
  for(var i=0;i<3;i++){ var sp=document.createElement('span'); sp.textContent=i<stars?'⭐':'☆'; sr.appendChild(sp); if(i<stars) setTimeout(function(){ sfx('star'); },200+i*200); }
  set('res-detail','Benar '+game.correct+' dari '+total+(game.best>=3?'  ·  🔥 streak '+game.best:''));
  var rw=byId('res-rewards'); rw.innerHTML='<div class="rr"><img src="'+IC+'icon-coin.webp">+<span id="rr-coin">0</span></div>'+(gemReward>0?'<div class="rr"><img src="'+IC+'icon-gem.webp">+'+gemReward+'</div>':'');
  econ.coins+=coinReward; saveEcon(); refreshHUD();
  countUp('rr-coin',coinReward,700);
  // R3: "Dunia baru terbuka!" banner when a world boundary (sub-10) is cleared
  var ub=byId('res-unlock');
  if(!failed && stars>=1 && game.g%SUBS===0 && game.g<MAX_LEVEL) ub.innerHTML='<span class="unlock-banner">🌟 Dunia '+(game.g/SUBS+1)+' Terbuka!</span>';
  else ub.innerHTML='';
  var nextBtn=byId('res-next');
  if(failed||game.g>=MAX_LEVEL){ nextBtn.style.display=failed?'none':'none'; } else nextBtn.style.display='';
  show('hasil');
  if(showChest){ setTimeout(chestPop,150); }
  if(win){ setTimeout(function(){ sfx('levelup'); confetti(stars>=3?70:36); },300); }
}

  byId('mute-btn').style.background=(S&&S.getMute&&S.getMute())?'var(--red)':'var(--green)';
}
function stat(l,v){ return '<div class="pstat"><b>'+v+'</b><small>'+l+'</small></div>'; }
function editName(){ var n=prompt('Nama pahlawanmu:',econ.name); if(n&&n.trim()){ econ.name=n.trim().slice(0,16); saveEcon(); renderProfil(); } }
function toggleMute(){ if(S&&S.setMute){ var m=!S.getMute(); S.setMute(m); if(m) bgmStop(); else if(game) bgmPlay(); } renderProfil(); }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function goHome(){ window.location.href='../index.html'; }

/* ── parallax: gentle breathing + pointer/tilt depth (perf-safe, 1 rAF loop) ── */
(function parallax(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  var px=0,py=0,tpx=0,tpy=0,t=0;
  window.addEventListener('pointermove',function(e){ tpx=(e.clientX/window.innerWidth-.5); tpy=(e.clientY/window.innerHeight-.5); },{passive:true});
  window.addEventListener('deviceorientation',function(e){ if(e.gamma!=null){ tpx=Math.max(-.5,Math.min(.5,e.gamma/45)); tpy=Math.max(-.5,Math.min(.5,(e.beta-45)/45)); } },{passive:true});
  function loop(){
    px+=(tpx-px)*.06; py+=(tpy-py)*.06; t+=.006;
    var bx=Math.sin(t)*1.1, by=Math.cos(t*.8)*.9;
    var imgs=document.querySelectorAll('.scr.active .bgimg, .scr.active .map-img');
    for(var i=0;i<imgs.length;i++){ imgs[i].style.transform='scale(1.11) translate('+(bx-px*2.4).toFixed(2)+'%,'+(by-py*1.8).toFixed(2)+'%)'; }
    // A-355c dynamic layered parallax: each depth moves at its own factor
    var g=document.getElementById('scr-game');
    if(g&&g.classList.contains('active')){
      var cx=Math.sin(t*.5)*1.6;                       // slow cloud drift
      var cl=g.querySelector('.mp-clouds'); if(cl) cl.style.transform='translate('+(cx-px*1.2).toFixed(2)+'%,'+(-py*.8).toFixed(2)+'%)';
      var fg=g.querySelector('.mp-fg');     if(fg) fg.style.transform='translate('+(-px*5).toFixed(2)+'%,'+(-py*2.2).toFixed(2)+'%)';   // near = strong
      var em=g.querySelector('.mp-embers'); if(em) em.style.transform='translate('+(-px*3.2).toFixed(2)+'%,0)';
      // arena gets a gentle counter-tilt for depth (the fighters keep their own bob anims)
      var ar=g.querySelector('.arena'); if(ar) ar.style.transform='translate('+(px*1.4).toFixed(2)+'%,'+(py*.9).toFixed(2)+'%)';
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

loadEcon(); refreshHUD();

document.addEventListener('pointerdown',function armed(){ try{ if(S&&S.cue) S.cue('click',{volume:0}); }catch(e){} document.removeEventListener('pointerdown',armed); },{once:true});

  openModal:openModal, closeModal:closeModal, closeTournament:closeTournament, buy:buy,
  editName:editName, toggleMute:toggleMute, maxNumFor:maxNumFor };
})();
